name: JBI Chapter 1 iNaturalist acquisition

on:
  workflow_dispatch:
    inputs:
      confirm_reacquire:
        description: "Leave blank to validate the frozen sample. Type REACQUIRE only for an intentional version-bumped replacement."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  validate-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/jbi-global-colour-boundaries
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate committed acquisition freeze
        run: |
          python -m pytest -q \
            tests/test_inat_photo_acquisition.py \
            tests/test_photo_split.py \
            tests/test_photo_source_recovery.py \
            tests/test_spatial_boundaries.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          from fcp_pipeline.photo_split import validate_frozen_split
          from fcp_pipeline.photo_calibration import validate_calibration_sheet

          source = Path('data/frozen/jbi_ch1_photo_source_manifest.csv')
          split = Path('data/frozen/jbi_ch1_photo_split_v1.csv')
          split_manifest = Path('data/frozen/jbi_ch1_photo_split_v1_manifest.json')
          review = Path('data/calibration/jbi_ch1_calibration_review_v1.csv')
          calibration_manifest = Path('data/calibration/jbi_ch1_calibration_package_manifest_v1.json')
          qc_path = Path('docs/supporting/jbi_ch1_inat_acquisition_qc_v1.json')
          for p in (source, split, split_manifest, review, calibration_manifest, qc_path):
              if not p.exists():
                  raise SystemExit(f'missing frozen artifact: {p}')

          source_df = pd.read_csv(source)
          split_df = pd.read_csv(split)
          review_df = pd.read_csv(review, keep_default_na=False)
          sm = json.loads(split_manifest.read_text())
          cm = json.loads(calibration_manifest.read_text())
          qc = json.loads(qc_path.read_text())

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          assert len(source_df) == 1200
          assert source_df['species'].nunique() == 6
          assert (source_df.groupby('species').size() == 200).all()
          assert source_df['photo_id'].astype(str).is_unique
          assert sha(source) == sm['source_raw_sha256'] == qc['source_manifest_sha256']
          assert sha(split) == sm['output_csv_sha256'] == cm['source_split_sha256']
          assert qc['all_species_gate_pass'] is True
          assert qc['total_selected'] == 1200
          validate_frozen_split(split_df, species_col='species', photo_id_col='photo_id')
          validate_calibration_sheet(review_df, require_complete=False)
          assert (split_df['split'] == 'calibration').sum() == 480
          assert (split_df['split'] == 'evaluation').sum() == 720
          assert len(review_df) == 480
          assert cm['contains_evaluation_rows'] is False
          assert cm['evaluation_opened_for_rule_tuning'] is False
          print('Frozen sample validated without reacquisition.')
          PY

  reacquire:
    if: ${{ inputs.confirm_reacquire == 'REACQUIRE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/jbi-global-colour-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Require explicit version bump before replacement
        run: |
          echo "The current v1 sample is frozen."
          echo "Do not overwrite v1 in place. Create a v2 acquisition config/output set before enabling this job."
          exit 1
