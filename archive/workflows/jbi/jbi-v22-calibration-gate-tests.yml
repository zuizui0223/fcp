name: JBI v2.2 calibration gate boundary tests

on:
  push:
    branches: [audit/upstream-spatial-reaudit]
    paths:
      - '.github/workflows/jbi-v22-calibration-gate-tests.yml'
      - 'scripts/literature/evaluate_v22_calibration_gate.py'
      - 'tests/test_v22_calibration_gate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jbi-v22-calibration-gate-tests
  cancel-in-progress: true

jobs:
  test-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run prespecified gate boundary tests
        run: python -m pytest -q tests/test_v22_calibration_gate.py
