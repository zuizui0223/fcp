name: JBI cross-source mechanism trait coverage

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: jbi-cross-source-trait-coverage-pr17
  cancel-in-progress: true

env:
  EXPANDED_RUN_ID: '32930987729'
  EXPANDED_ARTIFACT: 'jbi-v22-full-fcp-universe'
  RECORD_SCREEN_RUN_ID: '32835034885'
  RECORD_SCREEN_ARTIFACT: 'jbi-v22-canonical-record-screening'
  OUTDIR: 'analysis_outputs/jbi_cross_source_trait_coverage_v1'

jobs:
  coverage:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number == 17 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install taxify and dependencies
        run: |
          Rscript -e 'options(repos=c(taxify="https://gcol33.r-universe.dev", CRAN="https://cloud.r-project.org")); install.packages(c("taxify","jsonlite"))'

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXPANDED_ARTIFACT }}
          path: expanded
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.EXPANDED_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RECORD_SCREEN_ARTIFACT }}
          path: record_screen
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.RECORD_SCREEN_RUN_ID }}

      - name: Derive focal-consistent v6 core
        run: |
          mkdir -p core
          python scripts/literature/derive_v22_core_fcp_universe_v6.py \
            --source-audit expanded/v22_full_fcp_source_audit.csv \
            --record-screen record_screen/v22_record_screening_blind.csv \
            --outdir core
          python - <<'PY'
          import json,pandas as pd
          d=pd.read_csv('core/v22_core_fcp_species_universe.csv')
          s=json.load(open('core/v22_core_fcp_universe_summary.json'))
          assert len(d)==74 and s['core_protocol_version']=='display-core-v6-focal-consistent'
          PY

      - name: Audit harmonized cross-source trait coverage
        run: |
          mkdir -p "$OUTDIR"
          Rscript scripts/data/probe_cross_source_trait_coverage.R \
            --core-species core/v22_core_fcp_species_universe.csv \
            --outdir "$OUTDIR"

      - name: Validate coverage outputs
        run: |
          python - <<'PY'
          import json,os,pandas as pd
          root=os.environ['OUTDIR']
          q=json.load(open(root+'/cross_source_core_trait_coverage_qc.json'))
          s=pd.read_csv(root+'/cross_source_core_trait_coverage_gates.csv')
          d=pd.read_csv(root+'/cross_source_core_trait_coverage.csv')
          assert q['status']=='complete'
          assert len(d)==74 and set(s.trait)=={'dispersal_syndrome','flowering_start','flowering_end'}
          print(s.to_csv(index=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: jbi-cross-source-trait-coverage-v1
          path: |
            core/
            analysis_outputs/jbi_cross_source_trait_coverage_v1/
          if-no-files-found: error
          retention-days: 30
