name: Prepare JBI GBIF DOI bundle

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prepare-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download verified occurrence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p analysis_outputs/jbi_gbif_doi_source
          gh run download 30065308023 \
            --repo zuizui0223/fcp \
            --name jbi-reviewer-sensitivity \
            --dir analysis_outputs/jbi_gbif_doi_source

      - name: Prepare exact subset and citation files
        run: |
          mkdir -p analysis_outputs/jbi_gbif_doi_bundle
          python scripts/submission/prepare_jbi_gbif_doi_bundle.py \
            --artifact analysis_outputs/jbi_gbif_doi_source \
            --taxon-audit docs/supporting/jbi_table_s10_gbif_taxon_resolution_audit.csv \
            --outdir analysis_outputs/jbi_gbif_doi_bundle

      - name: Validate DOI bundle
        run: |
          python scripts/submission/validate_jbi_gbif_doi_bundle.py \
            --bundle-dir analysis_outputs/jbi_gbif_doi_bundle

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jbi-gbif-doi-bundle
          path: analysis_outputs/jbi_gbif_doi_bundle/
          if-no-files-found: error
          retention-days: 30
