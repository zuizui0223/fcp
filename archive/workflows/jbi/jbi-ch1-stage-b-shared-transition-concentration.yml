name: JBI Chapter 1 Stage B shared transition concentration

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/jbi-global-colour-boundaries
    paths:
      - ".github/workflows/jbi-ch1-stage-b-shared-transition-concentration.yml"
      - "fcp_pipeline/continuous_colour_boundaries.py"
      - "fcp_pipeline/spatial_graph.py"
      - "fcp_pipeline/shared_transition_surface.py"
      - "scripts/analysis/run_jbi_ch1_stage_b_shared_transition_concentration.py"
      - "tests/test_continuous_colour_boundaries.py"
      - "tests/test_spatial_graph.py"
      - "tests/test_shared_transition_surface.py"
      - "tests/test_stage_b_shared_transition.py"
      - "docs/supporting/jbi_ch1_stage_b_shared_transition_contract_v1.json"
      - "docs/supporting/jbi_ch1_stage_a_continuous_graph_v1.json"
      - "docs/supporting/jbi_ch1_continuous_colour_representation_v1.json"
      - "data/evaluation/jbi_ch1_florence_evaluation_features_v1.jsonl"
      - "data/frozen/jbi_ch1_photo_split_v1.csv"

permissions:
  contents: write

concurrency:
  group: jbi-ch1-stage-b-shared-transition-concentration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/jbi-global-colour-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Verify frozen Stage B implementation
        run: |
          python -m pytest -q \
            tests/test_continuous_colour_boundaries.py \
            tests/test_spatial_graph.py \
            tests/test_shared_transition_surface.py \
            tests/test_stage_b_shared_transition.py
      - name: Validate frozen Stage B contract before result inspection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('docs/supporting/jbi_ch1_stage_b_shared_transition_contract_v1.json').read_text(encoding='utf-8'))
          assert contract['protocol'] == 'jbi-ch1-stage-b-shared-transition-concentration-v1'
          assert contract['status'] == 'frozen_after_stage_a_before_any_shared_boundary_result'
          assert contract['geometry_only_primary_selection']['selection_must_finish_before_any_observed_colour_edge_score_is_computed'] is True
          assert contract['geometry_only_primary_selection']['candidate_max_edge_km_in_priority_order'] == [500, 1000, 2000]
          assert contract['geometry_only_primary_selection']['minimum_retained_edges_per_species_cell'] == 2
          assert contract['shared_surface']['minimum_detectable_species'] == 2
          assert contract['null']['primary_permutations'] == 9999
          assert contract['null']['sensitivity_permutations'] == 1999
          assert contract['null']['permutation_scope'] == 'strictly within species'
          assert contract['environment_used'] is False
          assert contract['geographic_reference_library_used'] is False
          print('Frozen Stage B contract validated before shared-boundary result computation.')
          PY
      - name: Run frozen Stage B shared transition concentration analysis
        run: |
          python scripts/analysis/run_jbi_ch1_stage_b_shared_transition_concentration.py
      - name: Validate Stage B outputs
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          result_path = Path('docs/supporting/jbi_ch1_stage_b_shared_transition_concentration_v1.json')
          audit_path = Path('docs/supporting/jbi_ch1_stage_b_geometry_audit_v1.json')
          result = json.loads(result_path.read_text(encoding='utf-8'))
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          assert result['protocol'] == 'jbi-ch1-stage-b-shared-transition-concentration-v1'
          assert result['n_evaluation_records'] == 720
          assert result['geometry_selection_used_colour_values'] is False
          assert result['environment_used'] is False
          assert result['geographic_reference_library_used'] is False
          assert audit['status'] == 'geometry_selection_complete_before_observed_colour_scoring'
          assert audit['selection_used_colour_values'] is False
          assert len(audit['candidate_configurations']) == 9

          if result['status'] == 'stage_b_not_estimable_under_frozen_geometry_support':
              assert audit['selected_primary_configuration'] is None
              assert result['primary_result'] is None
              print(json.dumps({'status': result['status'], 'selected': None}, indent=2))
          elif result['status'] == 'stage_b_evaluation_complete':
              assert result['primary_permutations'] == 9999
              selected = result['selected_primary_configuration']
              assert selected['passes_geometry_only_criteria'] is True
              assert selected['configuration'] == audit['selected_primary_configuration']
              primary = result['primary_result']['global_concentration']
              assert 0.0001 <= primary['p_upper_tail'] <= 1.0
              assert isinstance(result['primary_rejects_shared_concentration_null_at_0_05'], bool)

              surface_path = Path('data/evaluation/jbi_ch1_stage_b_shared_transition_surface_v1.csv')
              null_path = Path('data/evaluation/jbi_ch1_stage_b_primary_null_v1.csv')
              with surface_path.open(newline='', encoding='utf-8') as handle:
                  surface = list(csv.reader(handle))
              with null_path.open(newline='', encoding='utf-8') as handle:
                  null = list(csv.reader(handle))
              assert len(surface) == selected['grid']['n_cells'] + 1
              assert surface[0][:6] == [
                  'cell_id', 'latitude', 'longitude', 'opportunity_A',
                  'evaluable_A_ge_minimum', 'shared_transition_intensity'
              ]
              assert len(null) == 10000
              assert null[0] == ['permutation', 'opportunity_weighted_shared_transition_concentration']
              print(json.dumps({
                  'status': result['status'],
                  'configuration': selected['configuration'],
                  'observed_concentration': primary['observed'],
                  'null_mean': primary['null_mean'],
                  'standardized_excess': primary['standardized_concentration_excess'],
                  'p_upper_tail': primary['p_upper_tail'],
                  'rejects_at_0_05': result['primary_rejects_shared_concentration_null_at_0_05'],
                  'sensitivity_configurations': len(result['sensitivity_results']),
              }, indent=2))
          else:
              raise AssertionError(f"unexpected Stage B status: {result['status']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jbi-ch1-stage-b-shared-transition-concentration-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            docs/supporting/jbi_ch1_stage_b_geometry_audit_v1.json
            docs/supporting/jbi_ch1_stage_b_shared_transition_concentration_v1.json
            data/evaluation/jbi_ch1_stage_b_shared_transition_surface_v1.csv
            data/evaluation/jbi_ch1_stage_b_primary_null_v1.csv
      - name: Commit Stage B results with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/supporting/jbi_ch1_stage_b_geometry_audit_v1.json \
            docs/supporting/jbi_ch1_stage_b_shared_transition_concentration_v1.json
          [[ -f data/evaluation/jbi_ch1_stage_b_shared_transition_surface_v1.csv ]] && \
            git add data/evaluation/jbi_ch1_stage_b_shared_transition_surface_v1.csv
          [[ -f data/evaluation/jbi_ch1_stage_b_primary_null_v1.csv ]] && \
            git add data/evaluation/jbi_ch1_stage_b_primary_null_v1.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run frozen Stage B shared transition concentration analysis"
          for attempt in 1 2 3 4; do
            git fetch origin analysis/jbi-global-colour-boundaries
            git rebase origin/analysis/jbi-global-colour-boundaries
            if git push origin HEAD:analysis/jbi-global-colour-boundaries; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
