[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcp-pipeline"
version = "0.1.0"
description = "Reproducible evidence and comparative-analysis helpers for the frozen 34-species flower-colour paper"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "Pillow>=10.0",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
include = ["fcp_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
