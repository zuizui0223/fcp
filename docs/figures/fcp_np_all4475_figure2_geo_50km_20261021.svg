harray="5,5"/><text x="738.0" y="183.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start" font-weight="bold">≥1 pair</text><text x="738.0" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7a8491" text-anchor="start">3,600 species</text><line x1="1074.3" y1="190.0" x2="1152.6" y2="190.0" stroke="#226376" stroke-width="4"/><circle cx="1152.6" cy="190.0" r="9" fill="#226376"/><text x="1260.0" y="196.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start" font-weight="bold">+0.0161</text><text x="738.0" y="276.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start" font-weight="bold">≥5 pairs</text><text x="738.0" y="298.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7a8491" text-anchor="start">3,178 species</text><line x1="1074.3" y1="283.0" x2="1159.8" y2="283.0" stroke="#226376" stroke-width="4"/><circle cx="1159.8" cy="283.0" r="9" fill="#226376"/><text x="1260.0" y="289.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start" font-weight="bold">+0.0176</text><text x="738.0" y="369.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start" font-weight="bold">≥30 pairs</text><text x="738.0" y="391.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7a8491" text-anchor="start">2,084 species</text><line x1="1074.3" y1="376.0" x2="1158.9" y2="376.0" stroke="#226376" stroke-width="4"/><circle cx="1158.9" cy="376.0" r="9" fill="#226376"/><text x="1260.0" y="382.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start" font-weight="bold">+0.0174</text><text x="738.0" y="462.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start" font-weight="bold">≥100 pairs</text><text x="738.0" y="484.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7a8491" text-anchor="start">1,117 species</text><line x1="1074.3" y1="469.0" x2="1141.1" y2="469.0" stroke="#226376" stroke-width="4"/><circle cx="1141.1" cy="469.0" r="9" fill="#226376"/><text x="1260.0" y="475.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start" font-weight="bold">+0.0137</text><text x="55.0" y="576.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start">Source-conditional mismatch depletion (range-wide minus local; species-equal).</text><text x="55.0" y="604.0" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7a8491" text-anchor="start">199 same-species composition-and-coordinate-preserving null worlds; pooled P = 0.005.</text><text x="55.0" y="629.0" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7a8491" text-anchor="start">875 taxa have no local photo-pair opportunity and stay NA, not zero.</text><text x="55.0" y="654.0" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7a8491" text-anchor="start">Neither local inherited morph coexistence nor historical demography is inferred.</text></svg>
