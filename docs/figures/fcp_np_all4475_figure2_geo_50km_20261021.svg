<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1400" height="715" viewBox="0 0 1400 715"><rect x="0.0" y="0.0" width="1400.0" height="715.0" fill="#ffffff" rx="0"/><text x="55.0" y="51.0" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#233548" text-anchor="start" font-weight="bold">Geographic colour allocation is recurrent, not universal</text><text x="55.0" y="84.0" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#7a8491" text-anchor="start">4,475 taxa retained; 3,600 have at least one same-species ≤50-km photo pair</text><line x1="700.0" y1="114.0" x2="700.0" y2="595.0" stroke="#d6e1e9" stroke-width="2"/><text x="56.0" y="130.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#233548" text-anchor="start" font-weight="bold">A  Five independent species cohorts</text><text x="740.0" y="130.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#233548" text-anchor="start" font-weight="bold">B  Photo-pair opportunity thresholds</text><line x1="359.0" y1="160.0" x2="359.0" y2="515.0" stroke="#9fabb2" stroke-width="2" stroke-dasharray="5,5"/><text x="56.0" y="189.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#233548" text-anchor="start">Discovery</text><line x1="359.0" y1="185.0" x2="502.2" y2="185.0" stroke="#226376" stroke-width="4"/><circle cx="502.2" cy="185.0" r="9" fill="#226376"/><text x="618.0" y="189.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="end" font-weight="bold">+0.0243</text><text x="56.0" y="211.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7a8491" text-anchor="start">324 eligible taxa</text><text x="56.0" y="259.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#233548" text-anchor="start">Validation</text><line x1="359.0" y1="255.0" x2="428.6" y2="255.0" stroke="#226376" stroke-width="4"/><circle cx="428.6" cy="255.0" r="9" fill="#226376"/><text x="618.0" y="259.0" font-family="Arial,Helvetica,