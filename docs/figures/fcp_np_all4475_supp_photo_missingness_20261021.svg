<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1450" height="710" viewBox="0 0 1450 710"><rect x="0.0" y="0.0" width="1450.0" height="710.0" fill="#ffffff" rx="0"/><text x="55.0" y="52.0" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#233548" text-anchor="start" font-weight="bold">All 4,475 taxa retained: observational support is not biological prevalence</text><text x="55.0" y="85.0" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#7a8491" text-anchor="start">447,500 original photos • 227,107 classifiable labels • 220,393 unresolved labels</text><text x="55.0" y="144.0" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#233548" text-anchor="start" font-weight="bold">A  Distinct empirically estimable measures</text><text x="750.0" y="144.0" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#233548" text-anchor="start" font-weight="bold">B  The effect of unclassified photographs on D</text><line x1="715.0" y1="157.0" x2="715.0" y2="560.0" stroke="#d6e1e9" stroke-width="2"/><text x="55.0" y="185.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#233548" text-anchor="start">H1: colour-axis geometry</text><rect x="55.0" y="202.0" width="525.0" height="22.0" fill="#e1e9ed" rx="3"/><rect x="55.0" y="202.0" width="525.0" height="22.0" fill="#226376" rx="3"/><text x="605.0" y="222.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#226376" text-anchor="start" font-weight="bold">4,475/4,475</text><text x="55.0" y="298.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#233548" text-anchor="start">H2: local ≤50-km colour pairs</text><rect x="55.0" y="315.0" width="525.0" height="22.0" fill="#e1e9ed" rx="3"/><rect x="55.0" y="315.0" width="422.3" height="22.0" fill="#226376" rx="3"/><text x="605.0" y="335.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#226376" text-anchor="start" font-weight="bold">3,600/4,475</text><text x="55.0" y="411.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#233548" text-anchor="start">H3: same-species white/BIO5</text><rect x="55.0" y="428.0" width="525.0" height="22.0" fill="#e1e9ed" rx="3"/><rect x="55.0" y="428.0" width="482.4" height="22.0" fill="#226376" rx="3"/><text x="605.0" y="448.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#226376" text-anchor="start" font-weight="bold">4,112/4,475</text><text x="55.0" y="556.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#a3603f" text-anchor="start">H4/H5: 0 individuals with linked inherited-morph</text><text x="55.0" y="576.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#a3603f" text-anchor="start">and tissue-genotype-fitness evidence; NOT zero morphs.</text><rect x="872.0" y="263.0" width="362.5" height="66.0" fill="#e1e9ed" rx="4"/><line x1="969.3" y1="252.0" x2="969.3" y2="342.0" stroke="#226376" stroke-width="4"/><circle cx="969.3" cy="295.0" r="11" fill="#226376"/><text x="872.0" y="230.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#7a8491" text-anchor="middle" font-weight="bold">0.153</text><text x="969.3" y="395.0" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#226376" text-anchor="middle" font-weight="bold">0.292</text><text x="1234.4" y="230.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#7a8491" text-anchor="middle" font-weight="bold">0.671</text><text x="763.0" y="430.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#7a8491" text-anchor="start">Grey: sharp bounds on hypothetical four-colour assignment</text><text x="763.0" y="458.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#226376" text-anchor="start">Blue: conditional D from the classified photo subset</text><text x="763.0" y="502.0" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#a3603f" text-anchor="start">They are NOT statistical CIs or bounds on genetic morph diversity.</text><text x="55.0" y="631.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#7a8491" text-anchor="start">Every taxon has an original 100-photo row; NA means a contrast cannot be estimated.</text><text x="55.0" y="658.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#7a8491" text-anchor="start">Unclassified images may not contain an identifiable flower organ, so all-100 bounds are hypothetical.</text></svg>
