<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1450" height="800" viewBox="0 0 1450 800"><rect x="0.0" y="0.0" width="1450.0" height="800.0" fill="#ffffff" rx="0"/><text x="55.0" y="52.0" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#233548" text-anchor="start" font-weight="bold">A common phenotype direction, three separable evolutionary stages</text><text x="55.0" y="86.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#7a8491" text-anchor="start">H1–H5 distinguish accessibility, geographic allocation, and inherited persistence</text><rect x="55.0" y="155.0" width="415.0" height="278.0" fill="#ecf3f6" rx="12"/><rect x="55.0" y="155.0" width="8.0" height="278.0" fill="#226376" rx="2"/><text x="82.0" y="202.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#233548" text-anchor="start" font-weight="bold">Stage 1 · Phenotypic accessibility</text><text x="82.0" y="258.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start">H1: recurrent colour direction</text><text x="82.0" y="302.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start">W = 0.4789 vs null 0.4320</text><text x="82.0" y="350.0" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7a8491" text-anchor="start">4,475 photographed source taxa</text><text x="82.0" y="399.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#226376" text-anchor="start">Positive source-conditioned evidence</text><rect x="518.0" y="155.0" width="415.0" height="278.0" fill="#f3f6f7" rx="12"/><rect x="518.0" y="155.0" width="8.0" height="278.0" fill="#7a8491" rx="2"/><text x="545.0" y="202.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#233548" text-anchor="start" font-weight="bold">Stage 2 · Geographic allocation</text><text x="545.0" y="258.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start">H2: historical isolation (unknown)</text><text x="545.0" y="302.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start">H3: environmental response (limited)</text><text x="545.0" y="350.0" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7a8491" text-anchor="start">3,600/4,112 estimable photo taxa</text><text x="545.0" y="399.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#a3603f" text-anchor="start">Source correlations ≠ causal history</text><rect x="981.0" y="155.0" width="415.0" height="278.0" fill="#f3f6f7" rx="12"/><rect x="981.0" y="155.0" width="8.0" height="278.0" fill="#7a8491" rx="2"/><text x="1008.0" y="202.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#233548" text-anchor="start" font-weight="bold">Stage 3 · Inherited maintenance</text><text x="1008.0" y="258.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start">H4: local genetic coexistence (unknown)</text><text x="1008.0" y="302.0" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#233548" text-anchor="start">H5: tissue pigment costs (unknown)</text><text x="1008.0" y="350.0" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7a8491" text-anchor="start">No matched genotype/fitness data</text><text x="1008.0" y="399.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#a3603f" text-anchor="start">Published PAL/WAL evidence is external</text><line x1="475.0" y1="294.0" x2="511.0" y2="294.0" stroke="#7a8491" stroke-width="2" stroke-dasharray="6,6"/><line x1="938.0" y1="294.0" x2="974.0" y2="294.0" stroke="#7a8491" stroke-width="2" stroke-dasharray="6,6"/><text x="55.0" y="492.0" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#233548" text-anchor="start" font-weight="bold">Distinguishing predictions for independent future tests</text><rect x="55.0" y="510.0" width="1332.0" height="52.0" fill="#f4f7f9" rx="4"/><text x="76.0" y="541.0" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#226376" text-anchor="start" font-weight="bold">H2 | HISTORY</text><text x="322.0" y="541.0" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#233548" text-anchor="start">Same present environment, different neutral ancestry → different colour frequencies?</text><rect x="55.0" y="576.0" width="1332.0" height="52.0" fill="#f4f7f9" rx="4"/><text x="76.0" y="607.0" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#226376" text-anchor="start" font-weight="bold">H3 | SELECTION</text><text x="322.0" y="607.0" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#233548" text-anchor="start">Same neutral ancestry, contrasting environment → genotype × treatment fitness difference?</text><rect x="55.0" y="642.0" width="1332.0" height="52.0" fill="#f4f7f9" rx="4"/><text x="76.0" y="673.0" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#226376" text-anchor="start" font-weight="bold">H4–H5 | MAINTENANCE</text><text x="322.0" y="673.0" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#233548" text-anchor="start">Same population, multi-year true morphs → frequency-dependent fitness and petal/leaf pleiotropy?</text><text x="55.0" y="765.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#7a8491" text-anchor="start">Dashed links are hypotheses, not fitted evolutionary causal arrows; 447,500 photo images contain no neutral SNP or seed-fitness assays.</text></svg>
