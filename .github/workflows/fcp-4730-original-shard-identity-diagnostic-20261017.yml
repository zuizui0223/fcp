name: FCP 4730 diagnose authentic cross-shard photo IDs
on:
  push:
    branches: [analysis/fcp-4730-overlap-diagnostic-20261017]
permissions:
  contents: read
  actions: read
jobs:
  diagnose-original-H9:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "38993836606"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Verify four authentic completed source shards and retrieve original metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp4730check/{shards,inventory,out}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > /tmp/fcp4730check/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > /tmp/fcp4730check/jobs.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/fcp4730check/run.json'))
          j=json.load(open('/tmp/fcp4730check/jobs.json'))['jobs']
          c={x['name']:x['conclusion'] for x in j}
          assert r['id']==38993836606 and r['head_sha']=='9c1298956941769fdfd62aeaa7d61febf1154c3e'
          assert c['inventory-all-4730']=='success'
          assert all(c['bulk-remaining-2733 ('+str(i)+')']=='success' for i in range(4))
          assert c['all-4730-terminal-ledger']=='failure'
          PY
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name fcp-all4730-original-identity-inventory --dir /tmp/fcp4730check/inventory
          for i in 0 1 2 3; do
            mkdir -p "/tmp/fcp4730check/shards/shard_$i"
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "shard_$i" --dir "/tmp/fcp4730check/shards/shard_$i"
          done
      - name: Diagnose exact taxon/photo/observation overlap without source modification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/fcp4730check')
          original=json.loads((root/'inventory/inventory_result.json').read_text())
          assert original['new_unmeasured_species']==2733
          frames=[];shard_report={}
          for i in range(4):
              folder=root/f'shards/shard_{i}'
              receipt=json.loads((folder/'shard_result.json').read_text())
              assert receipt['shard']==i and receipt['shards']==4
              for name,fp in receipt['outputs_sha256'].items():
                  assert hashlib.sha256((folder/name).read_bytes()).hexdigest()==fp
              table=pd.read_csv(folder/'authorized_metadata.csv.gz',low_memory=False)
              assert len(table)==receipt['authorized_original_photo_IDs']
              table['diagnostic_shard']=i
              frames.append(table)
              shard_report[str(i)]={'selected':receipt['selected_species'],
                  'complete_100_taxa':receipt['complete_100_photo_species'],
                  'photo_rows':len(table),'request_errors':receipt['request_errors']}
          allx=pd.concat(frames,ignore_index=True)
          assert len(allx)==248200
          rows=[];affected=set()
          for name in ('photo_id','observation_id'):
              duplicated=allx.loc[allx[name].duplicated(keep=False)]
              grouped=duplicated.groupby(name)
              collisions={int(x):sorted(set(g.inat_taxon_id.astype(int))) for x,g in grouped}
              crossings={key:values for key,values in collisions.items() if len(values)>1}
              affected.update({taxon for taxa in crossings.values() for taxon in taxa})
              row={'field':name,'reused_distinct_ids':len(collisions),
                   'cross_species_reused_ids':len(crossings),
                   'affected_species':len({taxon for taxa in crossings.values() for taxon in taxa}),
                   'sample_crossing_ids':sorted(crossings)[:20]}
              rows.append(row)
              print('FCP_REAL_SOURCE_COLLISION_DIAG',json.dumps(row,sort_keys=True),flush=True)
          d={'schema':'fcp_u100_4730_actual_shard_collision_diagnostic_v1',
             'source_run_id':38993836606,'original_149900_unchanged':True,
             'all_original_U100_species':4730,'new_U100_species_attempted':2733,
             'new_U100_100photo_candidates':int(allx.inat_taxon_id.nunique()),
             'new_U100_candidate_photo_rows':len(allx),
             'unique_photo_ids':int(allx.photo_id.nunique()),
             'unique_observation_ids':int(allx.observation_id.nunique()),
             'affected_taxa':sorted(affected),'affected_taxa_count':len(affected),
             'collision_rows':rows,'shards':shard_report,
             'no_image_pixels_opened':True}
          (root/'out/real_source_shard_ID_collisions.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print('FCP_REAL_SHARD_CONFLICT_COUNTS',json.dumps({
              'candidate_photo_rows':len(allx),
              'unique_photo_ids':allx.photo_id.nunique(),
              'unique_observation_ids':allx.observation_id.nunique(),
              'affected_taxa':len(affected)
          }),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-all4730-cross-shard-ID-collision-audit
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp4730check/out/
