name: FCP BIO5 colour sorting robustness
# Frozen robustness rerun after provenance-based background availability correction.

on:
  pull_request:
    branches: [main]
    paths:
      - docs/POLYMORPHISM_BIO5_COLOUR_SORTING_ROBUSTNESS_PROTOCOL_20261007.md
      - scripts/analysis/run_polymorphism_BIO5_colour_sorting_robustness_20261007.py
      - .github/workflows/polymorphism-BIO5-colour-sorting-robustness-20261007.yml
  workflow_dispatch:

concurrency:
  group: fcp-bio5-sorting-robustness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LEGACY_SHA: "5142f7951af0dde5364bb047a566d67e8c479e51"
  THIRD_SHA: "7e538e5c51c05a7cc47b2fcf53eea92634c8a863"
  DISC_SHA256: "ee854126eed2cfe23e333abe2c28d14df24895a5c52cbc389c060a5a4d6f91f4"
  VAL_SHA256: "0e2ed349122739eecfc725fb2d5e313d284cf30752da91f9a0429cff0eeaa5e6"
  THIRD_SHA256: "57630fc9f281bce94a0c40a70aaf7bce879dde93d6154175adcd021e8f5c1186"

jobs:
  robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install frozen runtime
        run: |
          python -m pip install -r requirements-np-bio5-replay-20260928.txt
          python -m py_compile scripts/analysis/run_polymorphism_BIO5_colour_sorting_robustness_20261007.py

      - name: Recover immutable measured tables
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$LEGACY_SHA" "$THIRD_SHA"
          git show "$LEGACY_SHA:data/derived/global_monte_carlo_measured_photos_v1.csv" > /tmp/discovery.csv
          git show "$LEGACY_SHA:data/derived/rgfca_reserve_replication_measured_photos_v1.csv" > /tmp/validation.csv
          git show "$THIRD_SHA:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv" > /tmp/third.csv
          echo "$DISC_SHA256  /tmp/discovery.csv" | sha256sum -c -
          echo "$VAL_SHA256  /tmp/validation.csv" | sha256sum -c -
          echo "$THIRD_SHA256  /tmp/third.csv" | sha256sum -c -

      - name: Recover checksum-pinned BIO5
        run: |
          set -euo pipefail
          mkdir -p /tmp/worldclim
          curl -L --fail --retry 5 --retry-delay 3 \
            https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip \
            -o /tmp/worldclim/bio.zip
          echo '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf  /tmp/worldclim/bio.zip' | sha256sum -c -
          unzip -q /tmp/worldclim/bio.zip -d /tmp/worldclim
          echo '32e02d85868734c32547da70cf9c620f4739a3cf5dbc4f2b751e16ebb2338ae1  /tmp/worldclim/wc2.1_10m_bio_5.tif' | sha256sum -c -

      - name: Run frozen robustness audit
        run: |
          rm -rf /tmp/fcp_bio5_robustness
          python scripts/analysis/run_polymorphism_BIO5_colour_sorting_robustness_20261007.py \
            --discovery /tmp/discovery.csv \
            --validation /tmp/validation.csv \
            --third /tmp/third.csv \
            --bio5 /tmp/worldclim/wc2.1_10m_bio_5.tif \
            --outdir /tmp/fcp_bio5_robustness

      - name: Validate robustness boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/fcp_bio5_robustness/result.json").read_text())
          assert r["schema"]=="fcp_BIO5_colour_sorting_robustness_v1"
          assert r["status"]=="complete_posthoc_technical_robustness_audit"
          assert r["confirmatory_decisions_changed"] is False
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fcp-BIO5-colour-sorting-robustness-20261007
          if-no-files-found: error
          retention-days: 30
          path: /tmp/fcp_bio5_robustness/
