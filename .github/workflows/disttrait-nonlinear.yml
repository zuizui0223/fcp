name: disttrait nonlinear benchmark

on:
  push:
    paths:
      - "packages/disttrait/benchmarks/nonlinear_curvature_surface.py"
      - ".github/workflows/disttrait-nonlinear.yml"
  pull_request:
    paths:
      - "packages/disttrait/benchmarks/nonlinear_curvature_surface.py"
      - ".github/workflows/disttrait-nonlinear.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install disttrait
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/disttrait

      - name: Run nonlinear benchmark
        run: |
          python packages/disttrait/benchmarks/nonlinear_curvature_surface.py \
            > disttrait_nonlinear_result.json

      - name: Upload exploratory result
        uses: actions/upload-artifact@v4
        with:
          name: disttrait-nonlinear-exploratory
          path: disttrait_nonlinear_result.json
