name: RGFCA 42,111 discovery fill Step 8C

on:
  push:
    branches:
      - analysis/rgfca-42111-tiered-measurement-step8c
    paths:
      - 'docs/RGFCA_42111_DISCOVERY_METADATA_REUSE_AMENDMENT_STEP8C_20260911.md'
      - 'scripts/analysis/audit_rgfca_42111_discovery_fill_step8c_20260911.py'
      - '.github/workflows/rgfca-42111-discovery-fill-step8c.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rgfca-42111-discovery-fill-step8c
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Run frozen discovery fill audit
        run: python scripts/analysis/audit_rgfca_42111_discovery_fill_step8c_20260911.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('results/rgfca_42111_discovery_fill_step8c_20260911')
          x=json.loads((root/'result.json').read_text())
          assert x['status']=='complete_metadata_only_discovery_fill_audit'
          assert x['species_universe']==42111
          assert x['pixels_opened'] is False and x['flower_colour_used'] is False
          assert x['target_records_total']==371246
          assert (root/'species_fill_audit.csv.gz').stat().st_size>1000
          assert (root/'selected_discovery_candidates_descriptive.csv.gz').stat().st_size>1000
          print((root/'RESULT.md').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rgfca-42111-discovery-fill-step8c
          path: results/rgfca_42111_discovery_fill_step8c_20260911/
          if-no-files-found: error
          retention-days: 90
      - name: Commit fill audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/rgfca_42111_discovery_fill_step8c_20260911/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze 42,111-species discovery fill result'
          for attempt in 1 2 3 4; do
            git fetch origin analysis/rgfca-42111-tiered-measurement-step8c
            git rebase origin/analysis/rgfca-42111-tiered-measurement-step8c
            if git push origin HEAD:analysis/rgfca-42111-tiered-measurement-step8c; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
