name: Random photo-first boundary persistence ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/random-photo-first-boundary-persistence
    paths:
      - ".github/workflows/random-photo-first-boundary-persistence-arm.yml"

concurrency:
  group: random-photo-first-boundary-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-h1-core-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate frozen pre-pixel contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          h1 = json.loads(Path('docs/supporting/random_photo_first_boundary_persistence_contract_v1.json').read_text())
          pool = json.loads(Path('docs/supporting/random_photo_first_candidate_pool_contract_v1.json').read_text())
          measurement = json.loads(Path('docs/supporting/random_photo_first_measurement_contract_v1.json').read_text())

          assert h1['protocol'] == 'random-photo-first-boundary-persistence-v1'
          assert h1['primary_sampling']['photos_per_replicate'] == 10000
          assert h1['primary_sampling']['replicates'] == 200
          assert h1['primary_sampling']['species_cap_per_cell_per_replicate'] == 2
          assert h1['primary_sampling']['minimum_classifiable_photos_per_cell'] == 5
          assert h1['primary_null']['permutations'] == 999
          assert h1['primary_null']['mixed_uncertain_positions_are_fixed'] is True
          assert h1['legacy_firewall']['pr21_terminal_60000_photo_records_are_input'] is False

          assert pool['status'] == 'frozen_before_any_fresh_candidate_api_query_or_image_pixel'
          assert pool['geographic_sampling']['grid']['cells'] == 162
          assert pool['geographic_sampling']['per_cell_random_candidate_cap'] == 200
          assert pool['species_policy']['fixed_or_targeted_species_list'] is False
          assert pool['metadata_freeze']['candidate_image_pixels_opened'] is False
          assert pool['legacy_firewall']['pr21_terminal_60000_photo_records_used'] is False

          assert measurement['status'] == 'frozen_before_any_fresh_candidate_image_pixel'
          assert measurement['pixel_opening_gate']['required_gate_field'] == 'premeasurement_h1_gate.pixels_may_open'
          assert measurement['pixel_opening_gate']['required_gate_value'] is True
          assert measurement['pixel_opening_gate']['pr21_terminal_records_are_input'] is False
          assert all(value is False for value in measurement['outcome_firewall'].values())
          print('ARM64 pre-pixel contracts validated')
          PY
      - name: Run focused H1 and candidate-pool tests
        run: |
          python -m pytest -q \
            tests/test_photo_first_atlas.py \
            tests/test_photo_first_measurement.py \
            tests/test_random_photo_pool.py
      - name: Run planted-boundary synthetic validation
        run: python scripts/analysis/run_random_photo_first_synthetic_validation.py

  freeze-fresh-metadata-arm:
    needs: validate-h1-core-arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Refuse a second random draw after durable freeze
        id: existing
        shell: bash
        run: |
          if [[ -f docs/supporting/random_photo_first_candidate_pool_manifest_v1.json || -f data/frozen/random_photo_first_candidate_pool_v1.csv || -f data/frozen/random_photo_first_candidate_pool_cell_audit_v1.csv ]]; then
            echo "already_frozen=true" >> "$GITHUB_OUTPUT"
            echo "Durable candidate-pool output already exists; no API query will be issued."
          else
            echo "already_frozen=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze fresh species-unfixed metadata pool exactly once
        if: steps.existing.outputs.already_frozen == 'false'
        run: python scripts/acquisition/freeze_random_photo_first_candidate_pool.py
      - name: Validate metadata freeze and capacity gate
        if: steps.existing.outputs.already_frozen == 'false'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          manifest = json.loads(Path('docs/supporting/random_photo_first_candidate_pool_manifest_v1.json').read_text())
          candidate = pd.read_csv('data/frozen/random_photo_first_candidate_pool_v1.csv')
          audit = pd.read_csv('data/frozen/random_photo_first_candidate_pool_cell_audit_v1.csv')
          gate = manifest['premeasurement_h1_gate']

          assert manifest['status'] == 'metadata_pool_frozen_before_candidate_image_pixels'
          assert manifest['outcome_firewall']['candidate_image_pixels_opened'] is False
          assert manifest['outcome_firewall']['morph_used_for_selection'] is False
          assert manifest['outcome_firewall']['legacy_pr21_terminal_records_used'] is False
          assert manifest['counts']['observations'] == len(candidate)
          assert manifest['counts']['unique_observation_ids'] == candidate['observation_id'].nunique()
          assert manifest['counts']['unique_photo_ids'] == candidate['photo_id'].nunique()
          assert len(audit) == 162
          assert gate['fixed_photos_per_replicate'] == 10000
          assert gate['species_cap_per_cell_per_replicate'] == 2
          assert gate['pixels_may_open'] == gate['candidate_pool_can_reach_fixed_replicate_size']
          print(json.dumps({
              'candidate_observations': len(candidate),
              'species': manifest['counts']['species'],
              'occupied_cells': manifest['counts']['occupied_cells'],
              'species_capped_capacity': gate['candidate_species_capped_capacity'],
              'pixels_may_open': gate['pixels_may_open'],
              'reason_if_false': gate['reason_if_false'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.already_frozen == 'false'
        with:
          name: random-photo-first-candidate-pool-v1-arm64
          if-no-files-found: error
          retention-days: 90
          path: |
            data/frozen/random_photo_first_candidate_pool_v1.csv
            data/frozen/random_photo_first_candidate_pool_cell_audit_v1.csv
            docs/supporting/random_photo_first_candidate_pool_manifest_v1.json
      - name: Commit immutable metadata freeze to the scientific branch
        if: steps.existing.outputs.already_frozen == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/frozen/random_photo_first_candidate_pool_v1.csv \
            data/frozen/random_photo_first_candidate_pool_cell_audit_v1.csv \
            docs/supporting/random_photo_first_candidate_pool_manifest_v1.json
          git commit -m "Freeze fresh random photo-first candidate metadata pool"
          for attempt in 1 2 3 4; do
            git fetch origin analysis/random-photo-first-boundary-persistence
            git rebase origin/analysis/random-photo-first-boundary-persistence
            if git push origin HEAD:analysis/random-photo-first-boundary-persistence; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
