name: FCP 4475 continuous nine-hue seven-climate composition decomposition
on:
  pull_request:
    paths:
      - scripts/analysis/fcp4475_nine_colour_seven_climate_covariance_20261024.py
      - .github/workflows/fcp-4475-nine-hue-seven-climate-covariance-20261024.yml
      - docs/FCP_CONTINUOUS_COLOUR_SEVEN_CLIMATE_DECOMPOSITION_20261024.md
      - results/fcp4475_nine_hue_climate_decomposition_verified_20261024.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Verify exact sample covariance and matched seasonal null fixture
        run: |
          python -m py_compile scripts/analysis/fcp4475_nine_colour_seven_climate_covariance_20261024.py
          OPENBLAS_NUM_THREADS=1 python scripts/analysis/fcp4475_nine_colour_seven_climate_covariance_20261024.py --self-test
  original-source-all-seven:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      PHOTO_SHA: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      CLIMATE_TAG: fcp-worldclim-2.1-10m-20260925
      BIO_SHA: 00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf
      SRAD_SHA: c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Fetch immutable 447500 photographs and both WorldClim archives by SHA
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp4475climate/{archive,measured,climate,results}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_FILE" --dir /tmp/fcp4475climate/archive
          echo "$SOURCE_SHA  /tmp/fcp4475climate/archive/$SOURCE_FILE" | sha256sum -c -
          tar -xzf /tmp/fcp4475climate/archive/$SOURCE_FILE -C /tmp/fcp4475climate \
            measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$PHOTO_SHA  /tmp/fcp4475climate/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
          gh release download "$CLIMATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern wc2.1_10m_bio.zip --pattern wc2.1_10m_srad.zip \
            --dir /tmp/fcp4475climate/climate
          echo "$BIO_SHA  /tmp/fcp4475climate/climate/wc2.1_10m_bio.zip" | sha256sum -c -
          echo "$SRAD_SHA  /tmp/fcp4475climate/climate/wc2.1_10m_srad.zip" | sha256sum -c -
      - name: Run seven-abiotic original-photo composition covariance, 199 matched worlds and genus uncertainty
        run: |
          set -euo pipefail
          python scripts/analysis/fcp4475_nine_colour_seven_climate_covariance_20261024.py \
            --photos /tmp/fcp4475climate/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --worldclim-bio /tmp/fcp4475climate/climate/wc2.1_10m_bio.zip \
            --worldclim-srad /tmp/fcp4475climate/climate/wc2.1_10m_srad.zip \
            --out /tmp/fcp4475climate/results
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path('/tmp/fcp4475climate/results')
          z=json.loads((root/'summary.json').read_text())
          assert z['source_original_photos']==447500
          assert z['source_classifiable_photos']==227107
          assert z['source_original_species']==4475
          assert len(z['axes'])==7
          for condition in ('original','observer_thinned'):
              block=z['results'][condition]
              assert block['total_species_in_source']==4475
              t=pd.read_csv(root/f'all4475_{condition}_photo9_climate7_per_taxon.csv',low_memory=False)
              assert len(t)==4475 and t.inat_taxon_id.is_unique
              assert int(t.n_classified_all_original.sum())==227107
              for reg in ('raw','geo_month_residual'):
                  assert len(block['per_axis_results'][reg])==7
                  for axis,cell in block['per_axis_results'][reg].items():
                      assert 0<=cell['n_species']<=4475
                      if cell['n_species']>0:
                          for outcome in cell['components'].values():
                              for key in ('hue_norm_permutation_upper_p_199_holm7',
                                          'signed_white_two_sided_p_199_holm7'):
                                  assert 0<=outcome[key]<=1
          print('FCP4475_PHOTO9_SEVEN_CLIMATE_SHA_LOCKED_AUDIT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp4475-nine-hue-seven-climate-within-vs-between-20261024
          path: /tmp/fcp4475climate/results/
          retention-days: 90
