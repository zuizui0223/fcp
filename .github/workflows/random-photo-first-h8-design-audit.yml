name: Random photo-first H8 design audit

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/random-photo-first-h8-balanced-itv-replication
    paths:
      - "docs/supporting/random_photo_first_h8_design_audit_contract_v1.json"
      - "scripts/analysis/audit_random_photo_first_h8_design.py"
      - ".github/workflows/random-photo-first-h8-design-audit.yml"

permissions:
  contents: write

concurrency:
  group: random-photo-first-h8-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate H7 terminal precondition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/supporting/random_photo_first_h8_design_audit_contract_v1.json').read_text())
          h7 = json.loads(Path('docs/supporting/random_photo_first_h7_fresh_metadata_manifest_v1.json').read_text())
          assert c['status'] == 'metadata_only_h8_design_audit_frozen_after_h7_ne_before_any_h8_query_or_pixel'
          assert h7['premeasurement_gate']['pass'] is False
          assert h7['premeasurement_gate']['decision'] == 'not_evaluable_h7_fresh_metadata_support_before_pixels'
          assert h7['candidate_image_pixels_opened'] is False
          print('h8_design_precondition=pass')
          PY

      - name: Run metadata-only H8 design audit
        run: python scripts/analysis/audit_random_photo_first_h8_design.py

      - name: Validate H8 outcome firewall
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          r = json.loads(Path('docs/supporting/random_photo_first_h8_design_audit_result_v1.json').read_text())
          assert r['status'] == 'complete_h8_metadata_only_design_audit'
          assert r['h7_terminal_decision_preserved'] == 'not_evaluable_h7_fresh_metadata_support_before_pixels'
          assert r['h7_pixels_opened'] is False
          assert all(v is False for v in r['outcome_firewall'].values())
          if r['automatic_selection']['h8_metadata_design_feasible']:
              s = pd.read_csv('data/frozen/random_photo_first_h8_design_species_v1.csv')
              t = pd.read_csv('data/frozen/random_photo_first_h8_design_species_cells_v1.csv')
              assert len(s) >= 35
              assert len(t) == 5 * len(s)
              assert (t.groupby('inat_taxon_id')['cell_id'].nunique() == 5).all()
          print(json.dumps(r, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: random-photo-first-h8-design-audit-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            docs/supporting/random_photo_first_h8_design_audit_result_v1.json
            data/frozen/random_photo_first_h8_design_species_v1.csv
            data/frozen/random_photo_first_h8_design_species_cells_v1.csv

      - name: Commit H8 design audit outputs if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporting/random_photo_first_h8_design_audit_result_v1.json \
                  data/frozen/random_photo_first_h8_design_species_v1.csv \
                  data/frozen/random_photo_first_h8_design_species_cells_v1.csv
          if git diff --cached --quiet; then
            echo "h8_design_outputs_already_identical=true"
            exit 0
          fi
          git commit -m "Freeze H8 metadata-feasible design"
          git fetch origin analysis/random-photo-first-h8-balanced-itv-replication
          git rebase origin/analysis/random-photo-first-h8-balanced-itv-replication
          git push origin HEAD:analysis/random-photo-first-h8-balanced-itv-replication
