name: FCP PR200 first real photo after complete source

on:
  workflow_run:
    workflows:
      - Polymorphism manuscript claim guard
      - FCP PR200 fallback indexed full source
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: fcp-pr200-first-original-photo-production
  cancel-in-progress: false

jobs:
  first-real-full-study-photo-unit:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'zuizui0223/fcp' &&
        (
          (github.event.workflow_run.id == 38699975166 &&
           github.event.workflow_run.head_sha == 'a6012411ca8d48fb6f9d65fd3e2839b2880194f1' &&
           github.event.workflow_run.head_branch == 'analysis/fcp-fresh-uncapped-zero-20261015') ||
          (github.event.workflow_run.name == 'FCP PR200 fallback indexed full source' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.event == 'workflow_run')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
      FCP_BASE: /tmp/fcp_pr200_full_source_first_photo
    steps:
      - name: Checkout reviewed and frozen PR200 runtime
        uses: actions/checkout@v4
        with:
          ref: 7bc6330fb06494c1464be0095551f2922e6d4969
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reclaim unused preinstalled SDKs for large immutable source handoff
        shell: bash
        run: |
          set -euo pipefail
          echo "FCP_FIRST_REAL_PHOTO_DISK_BEFORE"; df -h "$RUNNER_TEMP"
          # Same previously validated cleanup as recovery Actions #38699975166.
          # Never remove Python, Git, OS packages or frozen scientific inputs.
          for p in /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /usr/share/swift; do
            if test -d "$p"; then
              sudo rm -rf -- "$p"
            fi
          done
          echo "FCP_FIRST_REAL_PHOTO_DISK_AFTER"; df -h "$RUNNER_TEMP"

      - name: Reuse source census artifacts, NEVER re-download provider 36GB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FCP_BASE/status" "$FCP_BASE/archive" "$FCP_BASE/source"
          python - <<'PY'
          import json,os,subprocess
          run=os.environ["SOURCE_RUN"]
          d=json.loads(subprocess.check_output(
              ["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}"],text=True))
          if (d.get("status")!="completed" or d.get("conclusion")!="success"
              or d.get("head_repository",{}).get("full_name")!="zuizui0223/fcp"):
              raise SystemExit("Source run never produced authorized successful complete source")
          if run=="38699975166":
              if (d.get("head_sha")!="a6012411ca8d48fb6f9d65fd3e2839b2880194f1"
                  or d.get("head_branch")!="analysis/fcp-fresh-uncapped-zero-20261015"):
                  raise SystemExit("Original recovery source identity mismatch")
          elif (d.get("name")!="FCP PR200 fallback indexed full source"
                or d.get("head_branch")!="main" or d.get("event")!="workflow_run"):
              raise SystemExit("Unrecognized indexed fallback source run")
          print("FCP_SOURCE_RUN_CONFIRMED_SUCCESS",run,d.get("name"),flush=True)
          PY
          if [[ "$SOURCE_RUN" == "38699975166" ]]; then
            STATUS_ARTIFACT=fcp-42111-recovery-20260927-status-and-original-hashes
            SOURCE_ARTIFACT=fcp-42111-recovery-20260927-complete-source-and-blind-photo-firewall
          else
            STATUS_ARTIFACT=fcp-42111-indexed-recovery-20260927-status-and-original-hashes
            SOURCE_ARTIFACT=fcp-42111-indexed-recovery-20260927-complete-source-and-blind-photo-firewall
          fi
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$STATUS_ARTIFACT" \
            --dir "$FCP_BASE/status"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir "$FCP_BASE/archive"
          mapfile -t archives < <(find "$FCP_BASE/archive" -type f -name '*.tar.gz')
          test "${#archives[@]}" -eq 1
          python - "${archives[0]}" "$FCP_BASE" <<'PY'
          import sys,shutil
          from pathlib import Path
          file=Path(sys.argv[1])
          free=shutil.disk_usage(sys.argv[2]).free
          print("FCP_SOURCE_HANDOFF_DISK_BYTES",{"free":free,"archive":file.stat().st_size},flush=True)
          if free < max(10_000_000_000,2*file.stat().st_size+3_000_000_000):
              raise SystemExit("Need a persistent larger runner for complete source admission")
          PY
          tar -xzf "${archives[0]}" -C "$FCP_BASE/source"

      - name: Admit 42,111 species and EVERY original photo ID without pixel opening
        shell: bash
        run: |
          set -euo pipefail
          status="$(find "$FCP_BASE/status" -name full_source_execution_receipt.json -print -quit)"
          pin="$(find "$FCP_BASE/status" -name fcp_source_archive_pin.json -print -quit)"
          counts="$(find "$FCP_BASE/status" -name all_42111_species_source_photo_counts.csv -print -quit)"
          test -s "$status" && test -s "$pin" && test -s "$counts"
          python -m pip install "numpy<3" "pandas<3" scipy Pillow
          python scripts/acquisition/admit_fcp_complete_photo_source.py \
            --source-package-root "$FCP_BASE/source" \
            --source-status-receipt "$status" --original-pin "$pin" \
            --source-counts "$counts" --out "$FCP_BASE/admission" --batch-size 64
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['FCP_BASE'])/'admission/source_admission_receipt.json').read_text())
          assert d["status"]=="FULL_SOURCE_PHOTO_WORK_PLAN_READY_NO_PIXELS_YET"
          assert d["source_species"]==42111 and d["worker_partitions"]==128
          assert d["pending_work_units"]==d["work_units"]
          print("FCP_TOTAL_REAL_PHOTO_IDS_ADMITTED",d["source_photo_ids"],flush=True)
          PY

      - name: Restore exact historical ROI-v4 + EfficientSAM models
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh \
            --full --sam-dir "$FCP_BASE/original_sam"
          python -m pip install -r requirements-atlas-roi-v4.txt

      - name: Execute ONE genuine full-census photo unit, source-bound and resumable
        shell: bash
        env:
          FCP_PROVIDER_GLOBAL_RATE_FILE: ${{ runner.temp }}/fcp_pr200_original_s3_rate.lock
        run: |
          set -euo pipefail
          python scripts/acquisition/execute_fcp_full_photo_work_queue.py \
            --firewall "$FCP_BASE/source/frozen_location_blind_all_photo_firewall" \
            --output "$FCP_BASE/real_partition_000" \
            --partition 0 --batch-size 64 --max-work-units 1 \
            --original-measure-script scripts/analysis/measure_random_photo_first_blind_partition.py \
            --original-detector data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt \
            --original-efficient-sam "$FCP_BASE/original_sam"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['FCP_BASE'])/'real_partition_000/original_photo_work_queue_progress.json').read_text())
          assert d["n_processed_in_this_invocation"]==1
          assert d["full_study_original_photo_measurement_complete"] is False
          print("FCP_NEW_PRODUCTION_ORIGINAL_PHOTO_BATCH",d["last_complete_unit"],flush=True)
          PY

      - name: Audit exact sealed first-photo CSV and source ID coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import itertools
          import json
          import os
          from pathlib import Path
          import pandas as pd
          from fcp_pipeline.fcp_allphotos import sha256_file
          from fcp_pipeline.fcp_fresh_study import WORKER, validate_method_attestation

          root=Path(os.environ["FCP_BASE"])
          admitted=json.loads((root/"admission/source_admission_receipt.json").read_text())
          progress=json.loads((root/"real_partition_000/original_photo_work_queue_progress.json").read_text())
          sealed=root/"real_partition_000/sealed_terminal_batches"
          csvs=sorted(sealed.glob("terminal_*.csv"))
          jsons=sorted(sealed.glob("terminal_*.json"))
          if len(csvs)!=1 or len(jsons)!=1 or csvs[0].stem!=jsons[0].stem:
              raise ValueError("Expected exactly one genuine sealed CSV+JSON work-unit pair")
          receipt=json.loads(jsons[0].read_text())
          method=validate_method_attestation(sealed/"frozen_method_attestation.json")
          if receipt.get("method")!=method or progress.get("frozen_original_method")!=method:
              raise ValueError("ROI-v4 source/model fingerprint changed or is absent")
          if (admitted.get("status")!="FULL_SOURCE_PHOTO_WORK_PLAN_READY_NO_PIXELS_YET"
              or admitted.get("source_species")!=42111
              or admitted.get("worker_partitions")!=128
              or admitted.get("source_photo_ids")!=progress.get("all_frozen_source_photo_ids")
              or admitted.get("source_firewall_sha256")!=progress.get("source_firewall_sha256")):
              raise ValueError("Sealed batch does not belong to complete admitted original source")
          if (progress.get("n_processed_in_this_invocation")!=1
              or progress.get("invocation_partition")!=0
              or progress.get("full_study_original_photo_measurement_complete") is not False
              or progress.get("completion_audit_scope")!="one_partition"
              or progress.get("selected_partition_source_photo_ids",0)<1
              or progress.get("n_pending_work_units",-1)<0
              or receipt.get("partition")!=0 or receipt.get("batch")!=0
              or receipt.get("status")!="COMPLETE_WORK_UNIT"
              or receipt.get("full_study_complete") is not False
              or receipt.get("reused_historical_measurement_csv") is not False
              or receipt.get("image_bytes_persisted") is not False):
              raise ValueError("Attempted to count a partial, historical, or non-first original work unit")
          with (root/"source/frozen_location_blind_all_photo_firewall/worker_partition_000.csv").open(newline="") as f:
              source=list(itertools.islice(csv.DictReader(f),64))
          first_ids=[r["measurement_id"] for r in source]
          if not first_ids or len(set(first_ids))!=len(first_ids):
              raise ValueError("First original source work unit is empty or duplicated")
          expected_worker_hash=hashlib.sha256(
              pd.DataFrame(source,columns=list(WORKER)).to_csv(index=False).encode()
          ).hexdigest()
          with csvs[0].open(newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          terminal_ids=[r["measurement_id"] for r in rows]
          classes=sum(r.get("measurement_status")=="classified_four_state_morph" for r in rows)
          failed=sum(r.get("measurement_status")=="image_acquisition_failed" for r in rows)
          n=len(rows)
          if (n!=len(source) or len(set(terminal_ids))!=n
              or set(terminal_ids)!=set(first_ids)
              or receipt.get("n_source_photo_ids")!=n
              or receipt.get("n_terminal_photo_ids")!=n
              or receipt.get("n_classifiable")!=classes
              or receipt.get("n_acquisition_failed")!=failed
              or classes+failed>n
              or receipt.get("selected_source_worker_sha256")!=expected_worker_hash
              or receipt.get("terminal_csv_sha256")!=sha256_file(csvs[0])
              or progress.get("last_complete_unit",{}).get("terminal_csv_sha256")!=sha256_file(csvs[0])):
              raise ValueError("New measured original photo IDs, outcomes, or sealed checksums disagree")
          audit={
              "schema":"fcp_first_genuine_original_photo_unit_verification_v1",
              "status":"VALIDATED_ONE_REAL_PHOTO_WORK_UNIT_NOT_FULL_CENSUS",
              "original_source_photo_ids":admitted["source_photo_ids"],
              "n_terminal_photo_ids":n,
              "n_classifiable":classes,
              "n_acquisition_failed":failed,
              "n_roi_uncertain":n-classes-failed,
              "n_pending_work_units":progress["n_pending_work_units"],
              "source_firewall_sha256":admitted["source_firewall_sha256"],
              "archive_sha256":admitted["original_archive_sha256"],
              "four_original_table_sha256":admitted["four_original_table_sha256"],
              "method":method,
              "terminal_csv_sha256":sha256_file(csvs[0]),
              "terminal_json_sha256":sha256_file(jsons[0]),
              "full_photo_census_complete":False,
              "h2_null_or_environment_inference_complete":False
          }
          report=root/"real_partition_000/first_genuine_photo_unit_verified.json"
          report.write_text(json.dumps(audit,indent=2,sort_keys=True)+"\n")
          print("FCP_FIRST_REAL_SOURCE_PHOTO_UNIT_AUDITED",json.dumps({
              k:audit[k] for k in ("original_source_photo_ids","n_terminal_photo_ids",
                                   "n_classifiable","n_acquisition_failed","n_roi_uncertain",
                                   "n_pending_work_units")
          },sort_keys=True),flush=True)
          PY

      - name: Retain real source-bound photo terminals and counts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: fcp-pr200-first-genuine-full-source-original-photo-unit
          if-no-files-found: error
          retention-days: 90
          path: |
            /tmp/fcp_pr200_full_source_first_photo/admission/source_admission_receipt.json
            /tmp/fcp_pr200_full_source_first_photo/real_partition_000/original_photo_work_queue_progress.json
            /tmp/fcp_pr200_full_source_first_photo/real_partition_000/first_genuine_photo_unit_verified.json
            /tmp/fcp_pr200_full_source_first_photo/real_partition_000/sealed_terminal_batches/

      - name: Retain failures as diagnostics only
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: fcp-pr200-full-photo-handoff-failure-NOT-SCIENTIFIC
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/fcp_pr200_full_source_first_photo/admission/source_admission_receipt.json
            /tmp/fcp_pr200_full_source_first_photo/real_partition_000/original_photo_work_queue_progress.json
