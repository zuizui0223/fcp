name: FCP climate landscape macroecology
on:
  pull_request:
    paths:
      - scripts/analysis/fcp4475_climate_landscape_organization_20261127.py
      - .github/workflows/fcp-4475-climate-landscape-20261127.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macroecology:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      PHOTO_SHA: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      CLIMATE_TAG: fcp-worldclim-2.1-10m-20260925
      BIO_SHA: 00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Check ecological estimands on toy spatial landscape
        run: python scripts/analysis/fcp4475_climate_landscape_organization_20261127.py --self-test
      - name: Authenticate source archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-landscape/{release,measured,climate,out}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_FILE" --dir /tmp/fcp-landscape/release
          echo "$SOURCE_ARCHIVE_SHA  /tmp/fcp-landscape/release/$SOURCE_FILE" | sha256sum -c -
          tar -xzf /tmp/fcp-landscape/release/$SOURCE_FILE -C /tmp/fcp-landscape measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$PHOTO_SHA  /tmp/fcp-landscape/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
          gh release download "$CLIMATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern wc2.1_10m_bio.zip --dir /tmp/fcp-landscape/climate
          echo "$BIO_SHA  /tmp/fcp-landscape/climate/wc2.1_10m_bio.zip" | sha256sum -c -
      - name: Full-source climatic landscape and colour geography
        run: |
          python scripts/analysis/fcp4475_climate_landscape_organization_20261127.py \
            --photos /tmp/fcp-landscape/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --worldclim-bio /tmp/fcp-landscape/climate/wc2.1_10m_bio.zip \
            --out /tmp/fcp-landscape/out
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('/tmp/fcp-landscape/out')
          d=pd.read_csv(p/'species_climate_colour_landscape.csv.gz')
          j=json.loads((p/'results.json').read_text())
          assert len(d)==4475 and d.inat_taxon_id.nunique()==4475
          assert d.source_n.sum()==447500 and d.classifiable_n.sum()==227107
          assert d.source_n.eq(100).all()
          assert j['diversity']['status']=='estimable'
          for r in ('50','250'):
              for k in ('categorical','continuous','matched_scales'):
                  assert j['spatial_partition'][r][k]['status']=='estimable', (r,k,j['spatial_partition'][r][k])
          assert j['spatial_partition']['50']['matched_scales']['n']==j['spatial_partition']['250']['matched_scales']['n']==j['matched_scale_n']
          assert not {'latitude','longitude','photo_id','observer_id'}.intersection(d.columns)
          print('FCP_CLIMATE_LANDSCAPE_LEDGER_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp4475-climate-landscape-20261127
          path: /tmp/fcp-landscape/out/
          retention-days: 90
