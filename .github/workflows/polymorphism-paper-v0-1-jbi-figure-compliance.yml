name: Polymorphism paper v0.1 JBI figure compliance

on:
  push:
    branches:
      - feat/polymorphism-paper-v0-1-post-step9
    paths:
      - scripts/analysis/apply_polymorphism_jbi_figure_compliance_20260911.py
      - .github/workflows/polymorphism-paper-v0-1-jbi-figure-compliance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comply-render-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: feat/polymorphism-paper-v0-1-post-step9

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: python -m pip install --quiet pandas numpy matplotlib pillow

      - name: Apply fail-closed JBI figure compliance patch
        run: python scripts/analysis/apply_polymorphism_jbi_figure_compliance_20260911.py

      - name: Render from frozen figure data
        run: python scripts/analysis/render_polymorphism_paper_v0_1_figures_20260910.py

      - name: Verify JBI typography and panel convention
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          renderer = Path('scripts/analysis/render_polymorphism_paper_v0_1_figures_20260910.py').read_text()
          captions = Path('paper/polymorphism_v0_1/FIGURE_CAPTIONS.md').read_text()
          vals = [float(v) for v in re.findall(r'fontsize=(\d+(?:\.\d+)?)', renderer)]
          assert vals and min(vals) >= 9.5, min(vals)
          for token in ['"font.size": 9.5', '"axes.labelsize": 9.5', '"xtick.labelsize": 9.5', '"ytick.labelsize": 9.5', '"legend.fontsize": 9.5']:
              assert token in renderer, token
          assert 'f"({letter.lower()})"' in renderer
          for token in ['(a)', '(b)', '(c)', '(d)', '(a–b)']:
              assert token in captions, token
          for token in ['(A)', '(B)', '(C)', '(D)', '(A–B)']:
              assert token not in captions, token
          print({'min_explicit_font_pt': min(vals), 'panel_style': '(a)', 'caption_style': 'lowercase-parenthesized'})
          PY

      - name: Build 168-mm 300-dpi previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path('paper/polymorphism_v0_1/figures')
          out = Path('visual_qc_168mm_300dpi')
          out.mkdir(exist_ok=True)
          names = [
              'figure1_polymorphism_estimand.png',
              'figure2_polymorphism_spatial_replication.png',
              'figure3_measurement_and_ambiguity_robustness.png',
              'figure4_genus_taxonomic_structure.png',
          ]
          target_w = round(168 / 25.4 * 300)
          assert target_w == 1984
          for name in names:
              im = Image.open(src / name).convert('RGB')
              target_h = round(im.height * target_w / im.width)
              preview = im.resize((target_w, target_h), Image.Resampling.LANCZOS)
              preview.save(out / name, dpi=(300, 300), quality=95)
              print(f'{name}: source={im.width}x{im.height}; preview={target_w}x{target_h}')
          PY

      - name: Revalidate science bundle with new figure hashes
        run: |
          python scripts/analysis/check_polymorphism_paper_v0_1_bundle_20260910.py
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('paper/polymorphism_v0_1/BUNDLE_READINESS.json').read_text())
          assert r['status'] == 'PASS'
          assert r['science_bundle_ready'] is True
          assert r['main_text_word_count'] == 4452
          assert r['source_receipts_checked'] == 10
          assert r['acquisition_provenance_checked'] is True
          assert len(r['main_figures_checked']) == 4
          print(json.dumps(r, indent=2))
          PY

      - name: Upload 168-mm visual QC previews
        uses: actions/upload-artifact@v4
        with:
          name: polymorphism-v0-1-jbi-168mm-300dpi
          path: visual_qc_168mm_300dpi/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit JBI-compliant renderer and regenerated paper bundle
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/analysis/render_polymorphism_paper_v0_1_figures_20260910.py \
                  paper/polymorphism_v0_1/figures/ \
                  paper/polymorphism_v0_1/FIGURE_CAPTIONS.md \
                  paper/polymorphism_v0_1/figure_data/figure4_shared_genus_means.csv \
                  paper/polymorphism_v0_1/BUNDLE_READINESS.json
          test -n "$(git status --porcelain)"
          git commit -m "Make FCP figures JBI-compliant at 168 mm"
          git push origin HEAD:feat/polymorphism-paper-v0-1-post-step9
