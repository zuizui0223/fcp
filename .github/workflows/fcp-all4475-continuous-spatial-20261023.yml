name: FCP 4475 taxa nine-hue continuous geography
on:
  pull_request:
    paths:
      - scripts/analysis/fcp_all4475_continuous_spatial_20261023.py
      - .github/workflows/fcp-all4475-continuous-spatial-20261023.yml
      - docs/FCP_NINE_HUE_CONTINUOUS_SPATIAL_ANALYSIS_20261023.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required numerical packages
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow
      - name: Verify no false spatial inference from month-only separation
        run: |
          python -m py_compile scripts/analysis/fcp_all4475_continuous_spatial_20261023.py
          python scripts/analysis/fcp_all4475_continuous_spatial_20261023.py --self-test
  authentic-data:
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_ASSET: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA256: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      PHOTO_SHA256: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow
      - name: Retrieve permanent 447500-photo source and verify immutable hashes
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-nine-hue/{archive,measured,results}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ASSET" --dir /tmp/fcp-nine-hue/archive
          echo "$SOURCE_ARCHIVE_SHA256  /tmp/fcp-nine-hue/archive/$SOURCE_ASSET" | sha256sum -c -
          tar -xzf "/tmp/fcp-nine-hue/archive/$SOURCE_ASSET" \
            -C /tmp/fcp-nine-hue \
            measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$PHOTO_SHA256  /tmp/fcp-nine-hue/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
      - name: Run multiscale palette-space spatial tests, matched month null, observer thinning
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_all4475_continuous_spatial_20261023.py \
            --photos /tmp/fcp-nine-hue/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --out /tmp/fcp-nine-hue/results
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/fcp-nine-hue/results/summary.json')
          d=json.loads(p.read_text())
          assert d['source_original_photos']==447500
          assert d['source_four_state_classifiable']==227107
          assert d['results']['original']['n_species_50km']==1761
          assert len(d['results']['original']['tests']['month'])==5
          for mode in ('original','one_per_observer'):
              for null in ('month','unrestricted'):
                  for r in d['results'][mode]['tests'][null]:
                      assert 0 <= r['p_upper'] <= 1
                      assert 0 <= r['holm_p_five_radii'] <= 1
                      assert r['n_species'] <= 4475
          print('FCP_NINE_HUE_SOURCE_LOCKED_COMPLETE')
          print(json.dumps(d, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-4475-nine-hue-geography-real-original-20261023
          path: /tmp/fcp-nine-hue/results/
          retention-days: 90
