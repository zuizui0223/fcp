name: H2 posthoc background-white proxy audit

on:
  push:
    branches:
      - analysis/h2-white-validity-audit-20260922
    paths:
      - ".github/workflows/polymorphism-h2-background-proxy-audit.yml"

permissions:
  contents: read

jobs:
  inspect-and-recompute:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install pandas scipy
      - name: Materialize frozen reserve row table from its source commit
        shell: bash
        run: |
          set -euo pipefail
          SRC=f14186590c11ac24c95e1985077908b732132e96
          git fetch --depth=1 origin "$SRC"
          git show "$SRC:data/derived/rgfca_reserve_replication_measured_photos_v1.csv" > /tmp/reserve.csv
          wc -l /tmp/reserve.csv
      - name: Inspect background columns and recompute proxy when possible
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          p='/tmp/reserve.csv'
          df=pd.read_csv(p)
          cols=df.columns.tolist()
          print('columns=' + repr(cols))
          print('background_candidates=' + repr([c for c in cols if 'background' in c.lower()]))
          print('white_candidates=' + repr([c for c in cols if 'white' in c.lower()]))
          print('morph_counts=' + repr(df.get('morph', pd.Series(dtype=str)).value_counts(dropna=False).to_dict()))
          PY
