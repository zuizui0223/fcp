name: Merged spatial-scale extraction over the systematic corpus

on:
  push:
    branches: [claude/merged-spatial-extraction]
    paths:
      - "build_merged_spatial_classification.py"
      - "build_audited_spatial_classification.py"
      - "resolve_provisional_taxa_gbif.py"
      - ".github/workflows/merged-spatial-classification.yml"
  pull_request:
    paths:
      - "build_merged_spatial_classification.py"
      - "build_audited_spatial_classification.py"
      - "resolve_provisional_taxa_gbif.py"
      - ".github/workflows/merged-spatial-classification.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed systematic-search workflow run ID
        required: true
        default: "30753748463"
      source_artifact:
        description: Merged systematic-search artifact name
        required: true
        default: "systematic-itv-fcp-literature-search-full"

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_RUN_ID: ${{ inputs.source_run_id || '30753748463' }}
  SOURCE_ARTIFACT: ${{ inputs.source_artifact || 'systematic-itv-fcp-literature-search-full' }}
  OUTDIR: analysis_outputs/merged_spatial_classification

jobs:
  merged-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse extraction scripts
        run: |
          python -m py_compile build_merged_spatial_classification.py
          python -m py_compile build_audited_spatial_classification.py
          python -m py_compile resolve_provisional_taxa_gbif.py

      - name: Download systematic retrieval
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: systematic_input
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Locate and describe the screening queue
        run: |
          set -euo pipefail
          find systematic_input -maxdepth 3 -name 'itv_fcp_human_screening_queue.csv' | sort
          QUEUE=$(find systematic_input -maxdepth 3 -name 'itv_fcp_human_screening_queue.csv' | head -1)
          test -s "$QUEUE"
          export QUEUE
          echo "QUEUE=$QUEUE" >> "$GITHUB_ENV"
          python - <<'PY'
          import csv, os
          from collections import Counter
          path = os.environ["QUEUE"]
          with open(path, newline="", encoding="utf-8-sig") as handle:
              reader = csv.DictReader(handle)
              fields = list(reader.fieldnames or [])
              print("columns:", sorted(fields))
              rows = 0
              priority = Counter()
              roles = Counter()
              work_types = Counter()
              with_abstract = 0
              for record in reader:
                  rows += 1
                  priority[record.get("screen_priority", "")] += 1
                  roles[record.get("source_role", "")] += 1
                  work_types[record.get("work_type", "")] += 1
                  if (record.get("abstract") or "").strip():
                      with_abstract += 1
          print({"rows": rows, "with_abstract": with_abstract, "has_source_role": "source_role" in fields})
          print("priority:", dict(priority.most_common()))
          print("source_role:", dict(roles.most_common()))
          print("work_type:", dict(work_types.most_common()))
          PY

      - name: Self-test the generalised proximity rule
        run: |
          python build_merged_spatial_classification.py \
            --corpus "$QUEUE" --corpus-format screening_queue \
            --outdir "$OUTDIR/selftest" --self-test

      - name: Run PR12 merged extraction with dilution-cap sweep
        run: |
          set -euo pipefail
          for K in 2 3 5 99; do
            python build_merged_spatial_classification.py \
              --corpus "$QUEUE" --corpus-format screening_queue \
              --dilution-cap "$K" \
              --outdir "$OUTDIR/pr12_k$K"
          done

      # Intake and vocabulary are the two levers on yield. P1-only intake reads 543 of the
      # corpus's 79,242 records, and the baseline vocabulary leaves the verified systems in
      # `unclear`. Sweep both so the recall/precision cost of each is visible.
      - name: Sweep intake breadth and vocabulary supplement
        run: |
          set -euo pipefail
          for P in p1 p1p2; do
            for S in plain supp; do
              FLAG=""
              if [ "$S" = "supp" ]; then FLAG="--supplement-vocabulary"; fi
              python build_merged_spatial_classification.py \
                --corpus "$QUEUE" --corpus-format screening_queue \
                --priorities "$P" --dilution-cap 3 $FLAG \
                --outdir "$OUTDIR/yield_${P}_${S}" > /dev/null
            done
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["OUTDIR"])
          print(f"{'intake':>7} {'vocab':>6} {'records':>8} {'species':>8} {'eligible':>9} "
                f"{'within':>7} {'among':>6} {'within%':>8} {'unclear':>8}")
          for p in ("p1", "p1p2"):
              for s in ("plain", "supp"):
                  qc = json.loads((root / f"yield_{p}_{s}" / "merged_classification_qc.json").read_text())
                  n, w, a = qc["model_eligible_species"], qc["model_eligible_within"], qc["model_eligible_among"]
                  print(f"{p:>7} {s:>6} {qc['record_diagnostics']['records_read']:>8} "
                        f"{qc['species_total']:>8} {n:>9} {w:>7} {a:>6} "
                        f"{(f'{w/n:.0%}' if n else 'n/a'):>8} "
                        f"{qc['spatial_scale_all'].get('unclear', 0):>8}")
          PY

      # Only a GBIF-validated count is comparable with the 34- and 107-species baselines;
      # everything upstream still contains title fragments that match the binomial pattern.
      - name: Resolve the widest yield configuration against GBIF backbone
        run: |
          set -euo pipefail
          for CONF in p1_plain p1p2_supp; do
            mkdir -p "$OUTDIR/yield_$CONF/taxonomy"
            python - "$OUTDIR/yield_$CONF" <<'PY'
          import csv, sys
          from pathlib import Path
          src = Path(sys.argv[1]) / "merged_spatial_classification.csv"
          dst = Path(sys.argv[1]) / "taxonomy" / "binary_candidates.csv"
          rows = [
              r for r in csv.DictReader(src.open(encoding="utf-8"))
              if r["review_priority"] in {"P0", "P1", "P2"}
              and r["evidence_class"] == "natural_polymorphism"
              and r["spatial_scale"] in {"within_population", "among_population"}
          ]
          with dst.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=["canonical_name", "family", "spatial_scale"])
              writer.writeheader()
              for r in rows:
                  writer.writerow({k: r.get(k, "") for k in ("canonical_name", "family", "spatial_scale")})
          print(f"{sys.argv[1]}: {len(rows)} binary candidates submitted to GBIF")
          PY
            python resolve_provisional_taxa_gbif.py \
              --input "$OUTDIR/yield_$CONF/taxonomy/binary_candidates.csv" \
              --out "$OUTDIR/yield_$CONF/taxonomy/gbif_validated.csv" \
              --audit "$OUTDIR/yield_$CONF/taxonomy/gbif_audit.csv" \
              --timeout 45 --retries 4 || echo "GBIF validation failed for $CONF"
          done

      - name: Report GBIF-validated species counts against both baselines
        run: |
          python - <<'PY'
          import csv, os
          from collections import Counter
          from pathlib import Path
          root = Path(os.environ["OUTDIR"])
          print(f"{'configuration':>16} {'submitted':>10} {'validated':>10} {'within':>7} {'among':>6} {'families':>9}")
          for conf in ("p1_plain", "p1p2_supp"):
              tax = root / f"yield_{conf}" / "taxonomy"
              submitted = sum(1 for _ in csv.DictReader((tax / "binary_candidates.csv").open(encoding="utf-8")))
              path = tax / "gbif_validated.csv"
              if not path.exists():
                  print(f"{conf:>16} {submitted:>10} {'failed':>10}")
                  continue
              rows = list(csv.DictReader(path.open(encoding="utf-8")))
              counts = Counter(r["spatial_scale"] for r in rows)
              families = len({r.get("family", "") for r in rows if r.get("family")})
              print(f"{conf:>16} {submitted:>10} {len(rows):>10} "
                    f"{counts.get('within_population', 0):>7} {counts.get('among_population', 0):>6} {families:>9}")
          print("\nbaselines: A = 34 species (20 within / 14 among, 25 families); "
                "B = 107 species (26 within / 81 among)")
          PY

      - name: Run adjudication-ready audited extraction
        run: |
          set -euo pipefail
          for K in 2 3 5; do
            python build_audited_spatial_classification.py \
              --corpus "$QUEUE" \
              --dilution-cap "$K" \
              --proximity-window 180 \
              --outdir "$OUTDIR/audited_k$K"
          done

      - name: Validate audited outputs and freeze guard
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path

          root = Path(os.environ["OUTDIR"])
          print(f"{'K':>3} {'species':>8} {'within':>7} {'among':>7} {'mixed':>7} {'unclear':>8} {'disc-only':>10}")
          for k in (2, 3, 5):
              d = root / f"audited_k{k}"
              required = [
                  "audited_spatial_classification_unreviewed.csv",
                  "record_species_evidence_ledger.csv",
                  "double_review_adjudication_template.csv",
                  "correction_log_template.csv",
                  "prefreeze_manifest.json",
              ]
              for name in required:
                  p = d / name
                  if not p.exists() or p.stat().st_size == 0:
                      raise SystemExit(f"missing audited output: {p}")
              manifest = json.loads((d / "prefreeze_manifest.json").read_text())
              if manifest["eligible_for_freeze"] is not False or manifest["status"] != "prefreeze_only":
                  raise SystemExit("unreviewed extraction was incorrectly marked freeze-eligible")
              rows = list(csv.DictReader(open(d / "audited_spatial_classification_unreviewed.csv")))
              if any(r["review_status"] != "unreviewed" or r["eligible_for_freeze"] != "false" for r in rows):
                  raise SystemExit("review-state guard failed")
              scales = manifest["counts"]["spatial_scale"]
              source_roles = manifest["counts"]["source_role"]
              print(f"{k:>3} {len(rows):>8} {scales.get('within_population',0):>7} "
                    f"{scales.get('among_population',0):>7} {scales.get('mixed',0):>7} "
                    f"{scales.get('unclear',0):>8} {source_roles.get('discovery_only',0):>10}")

              ledger = list(csv.DictReader(open(d / "record_species_evidence_ledger.csv")))
              bad = [r for r in ledger if r["source_role"] == "discovery_only" and
                     (r["within_vote"] == "1" or r["among_vote"] == "1")]
              if bad:
                  raise SystemExit(f"discovery-only records emitted directional votes: {len(bad)}")
          PY

      - name: Resolve K=3 candidates against GBIF backbone
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR/audited_k3/taxonomy"
          python resolve_provisional_taxa_gbif.py \
            --input "$OUTDIR/audited_k3/audited_spatial_classification_unreviewed.csv" \
            --out "$OUTDIR/audited_k3/taxonomy/gbif_validated_binary_candidates.csv" \
            --audit "$OUTDIR/audited_k3/taxonomy/gbif_taxon_resolution_audit.csv" \
            --timeout 45 --retries 4

      - name: Summarise taxonomic validation and create review queues
        run: |
          python - <<'PY'
          import csv, json, os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["OUTDIR"]) / "audited_k3" / "taxonomy"
          audit_path = root / "gbif_taxon_resolution_audit.csv"
          validated_path = root / "gbif_validated_binary_candidates.csv"
          audit = list(csv.DictReader(audit_path.open(encoding="utf-8")))
          validated = list(csv.DictReader(validated_path.open(encoding="utf-8")))
          status = Counter(r.get("post_resolution_status", "") for r in audit)
          match_type = Counter(r.get("match_type", "") for r in audit)
          print({
              "input_names": len(audit),
              "accepted_binary_species": len(validated),
              "within": sum(r.get("spatial_scale") == "within_population" for r in validated),
              "among": sum(r.get("spatial_scale") == "among_population" for r in validated),
              "status": dict(status),
              "match_type": dict(match_type),
          })

          rejected = [r for r in audit if r.get("post_resolution_status") in {"rejected_taxon", "resolution_error"}]
          unresolved_path = root / "taxon_resolution_manual_review_queue.csv"
          fields = sorted({k for r in rejected for k in r} | {"reviewer_decision", "accepted_name_override", "reason"})
          with unresolved_path.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for row in rejected:
                  row = dict(row)
                  row.update({"reviewer_decision": "", "accepted_name_override": "", "reason": ""})
                  writer.writerow(row)

          suspicious = [r for r in audit if r.get("accepted") != "True"]
          if not rejected:
              print("No unresolved or rejected taxon names")
          else:
              print("Rejected/unresolved examples:")
              for row in rejected[:40]:
                  print(row.get("input_name"), row.get("match_type"), row.get("rank"), row.get("kingdom"))

          summary = {
              "input_names": len(audit),
              "strict_binary_species_after_synonym_reaggregation": len(validated),
              "within": sum(r.get("spatial_scale") == "within_population" for r in validated),
              "among": sum(r.get("spatial_scale") == "among_population" for r in validated),
              "post_resolution_status": dict(status),
              "manual_taxon_review_required": len(rejected),
              "eligible_for_freeze": False,
              "reason": "Taxonomy validation completed, but evidence labels remain unreviewed and require dual adjudication.",
          }
          (root / "gbif_taxonomy_validation_summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          if len(validated) < 20 or len({r.get("spatial_scale") for r in validated}) < 2:
              raise SystemExit("GBIF validation left insufficient binary candidates")
          PY

      - name: Compare PR12 and audited K=3 classifications
        run: |
          python - <<'PY'
          import csv, os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["OUTDIR"])
          base = {r["canonical_name"]: r for r in csv.DictReader(open(root / "pr12_k3" / "merged_spatial_classification.csv"))}
          audit = {r["canonical_name"]: r for r in csv.DictReader(open(root / "audited_k3" / "audited_spatial_classification_unreviewed.csv"))}
          shared = sorted(set(base) & set(audit))
          changed = [n for n in shared if base[n]["spatial_scale"] != audit[n]["spatial_scale"]]
          print({
              "pr12_species": len(base),
              "audited_species": len(audit),
              "shared": len(shared),
              "class_changes": len(changed),
              "audited_balance": dict(Counter(r["spatial_scale"] for r in audit.values())),
          })
          for name in changed[:50]:
              print(name, base[name]["spatial_scale"], "->", audit[name]["spatial_scale"])
          PY

      # Everything above interleaves with verbose per-run manifests. Re-read the QC files
      # at the end so the yield numbers land in one block, and in the job summary.
      - name: Consolidated yield report
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv, json, os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["OUTDIR"])
          out = ["```", "INTAKE x VOCABULARY (dilution cap 3)",
                 f"{'intake':>7} {'vocab':>6} {'records':>8} {'species':>8} {'eligible':>9} "
                 f"{'within':>7} {'among':>6} {'within%':>8} {'unclear':>8}"]
          for p in ("p1", "p1p2"):
              for s in ("plain", "supp"):
                  f = root / f"yield_{p}_{s}" / "merged_classification_qc.json"
                  if not f.exists():
                      out.append(f"{p:>7} {s:>6}   (missing)")
                      continue
                  qc = json.loads(f.read_text())
                  n, w, a = (qc["model_eligible_species"], qc["model_eligible_within"],
                             qc["model_eligible_among"])
                  out.append(f"{p:>7} {s:>6} {qc['record_diagnostics']['records_read']:>8} "
                             f"{qc['species_total']:>8} {n:>9} {w:>7} {a:>6} "
                             f"{(f'{w/n:.0%}' if n else 'n/a'):>8} "
                             f"{qc['spatial_scale_all'].get('unclear', 0):>8}")

          out += ["", "GBIF-VALIDATED YIELD",
                  f"{'configuration':>16} {'submitted':>10} {'validated':>10} "
                  f"{'within':>7} {'among':>6} {'families':>9}"]
          for conf in ("p1_plain", "p1p2_supp"):
              tax = root / f"yield_{conf}" / "taxonomy"
              sub = tax / "binary_candidates.csv"
              val = tax / "gbif_validated.csv"
              n_sub = sum(1 for _ in csv.DictReader(sub.open(encoding="utf-8"))) if sub.exists() else 0
              if not val.exists():
                  out.append(f"{conf:>16} {n_sub:>10} {'failed':>10}")
                  continue
              rows = list(csv.DictReader(val.open(encoding="utf-8")))
              c = Counter(r["spatial_scale"] for r in rows)
              fam = len({r.get("family", "") for r in rows if r.get("family")})
              out.append(f"{conf:>16} {n_sub:>10} {len(rows):>10} "
                         f"{c.get('within_population', 0):>7} {c.get('among_population', 0):>6} {fam:>9}")

          audited = root / "audited_k3" / "taxonomy" / "gbif_taxonomy_validation_summary.json"
          if audited.exists():
              a = json.loads(audited.read_text())
              out += ["", f"audited K=3 GBIF-validated: {a['strict_binary_species_after_synonym_reaggregation']} "
                          f"({a['within']} within / {a['among']} among)"]
          out += ["", "baselines: A = 34 (20 within / 14 among, 25 families); B = 107 (26 within / 81 among)", "```"]
          print("\n".join(out))
          PY

      - name: Upload merged classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-spatial-classification-adjudication-ready
          path: analysis_outputs/merged_spatial_classification/
          if-no-files-found: warn
          retention-days: 30
