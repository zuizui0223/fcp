name: Polymorphism publication figure tests

on:
  push:
    branches:
      - main
      - analysis/h2-third-cohort-preopening-20260916
      - promotion/polymorphism-paper-20260918
    paths:
      - scripts/analysis/make_polymorphism_manuscript_figures.py
      - tests/test_make_polymorphism_manuscript_figures.py
      - results/polymorphism_publication_figure_source_20260918/**
      - results/polymorphism_h1_observer_disjoint_reliability_20260913/result.json
      - results/polymorphism_h1_observer_disjoint_D_reliability_20260913/result.json
      - results/polymorphism_white_axis_targeted_test_20260912/result.json
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/**
      - results/polymorphism_h3a_phylogenetic_signal_20260912/frozen_result_manifest.json
      - .github/workflows/polymorphism-publication-figure-tests.yml
  pull_request:
    paths:
      - scripts/analysis/make_polymorphism_manuscript_figures.py
      - tests/test_make_polymorphism_manuscript_figures.py
      - results/polymorphism_publication_figure_source_20260918/**
      - results/polymorphism_h1_observer_disjoint_reliability_20260913/result.json
      - results/polymorphism_h1_observer_disjoint_D_reliability_20260913/result.json
      - results/polymorphism_white_axis_targeted_test_20260912/result.json
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/**
      - results/polymorphism_h3a_phylogenetic_signal_20260912/frozen_result_manifest.json
      - docs/POLYMORPHISM_H3B_RESERVE_SPAN_RESULT_FREEZE_20260912.md
      - .github/workflows/polymorphism-publication-figure-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install figure dependencies
        run: python -m pip install --upgrade pytest pandas numpy matplotlib
      - name: Run publication figure tests
        run: python -m pytest tests/test_make_polymorphism_manuscript_figures.py -q

      - name: Refresh canonical Figure 5 on promotion branch
        if: github.actor != 'github-actions[bot]' && ((github.event_name == 'push' && github.ref == 'refs/heads/promotion/polymorphism-paper-20260918') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'promotion/polymorphism-paper-20260918'))
        run: |
          git fetch origin promotion/polymorphism-paper-20260918
          git checkout -B promotion/polymorphism-paper-20260918 origin/promotion/polymorphism-paper-20260918
          python scripts/analysis/make_polymorphism_manuscript_figures.py --figure5-only
          if git diff --quiet -- \
            docs/figures/polymorphism_20260918/polymorphism_figure5_explanatory_boundaries.png \
            docs/figures/polymorphism_20260918/polymorphism_figure5_explanatory_boundaries.pdf \
            docs/figures/polymorphism_20260918/polymorphism_figure_manifest_20260918.json; then
            echo "Canonical Figure 5 already matches the current reporting generator."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/figures/polymorphism_20260918/polymorphism_figure5_explanatory_boundaries.png \
            docs/figures/polymorphism_20260918/polymorphism_figure5_explanatory_boundaries.pdf \
            docs/figures/polymorphism_20260918/polymorphism_figure_manifest_20260918.json
          git commit -m "Regenerate Figure 5 alternative-explanation framing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
