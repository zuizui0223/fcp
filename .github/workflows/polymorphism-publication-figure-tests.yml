name: Polymorphism publication figure tests

on:
  push:
    branches:
      - main
      - analysis/h2-third-cohort-preopening-20260916
      - promotion/polymorphism-paper-20260918
    paths:
      - scripts/analysis/make_polymorphism_manuscript_figures.py
      - tests/test_make_polymorphism_manuscript_figures.py
      - results/polymorphism_publication_figure_source_20260918/**
      - results/polymorphism_h1_observer_disjoint_reliability_20260913/result.json
      - results/polymorphism_h1_observer_disjoint_D_reliability_20260913/result.json
      - results/polymorphism_white_axis_targeted_test_20260912/result.json
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/**
      - results/polymorphism_h3a_phylogenetic_signal_20260912/frozen_result_manifest.json
      - results/polymorphism_distributed_polymorphism_posthoc_20261007/result.json
      - results/polymorphism_distributed_polymorphism_robustness_20261007/result.json
      - results/polymorphism_phenotypic_IBD_IBE_posthoc_20261007/result.json
      - .github/workflows/polymorphism-publication-figure-tests.yml
  pull_request:
    paths:
      - scripts/analysis/make_polymorphism_manuscript_figures.py
      - tests/test_make_polymorphism_manuscript_figures.py
      - results/polymorphism_publication_figure_source_20260918/**
      - results/polymorphism_h1_observer_disjoint_reliability_20260913/result.json
      - results/polymorphism_h1_observer_disjoint_D_reliability_20260913/result.json
      - results/polymorphism_white_axis_targeted_test_20260912/result.json
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/**
      - results/polymorphism_h3a_phylogenetic_signal_20260912/frozen_result_manifest.json
      - docs/POLYMORPHISM_H3B_RESERVE_SPAN_RESULT_FREEZE_20260912.md
      - .github/workflows/polymorphism-publication-figure-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install figure dependencies
        run: python -m pip install --upgrade pytest pandas numpy matplotlib
      - name: Run publication figure tests
        run: python -m pytest tests/test_make_polymorphism_manuscript_figures.py -q
      - name: Generate direct audit image of FCP commonality Figure 6
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.analysis.make_polymorphism_manuscript_figures import figure6, configure_matplotlib
          configure_matplotlib()
          output=Path('/tmp/fcp-figure6')
          files,meta=figure6(Path.cwd(),output)
          assert meta['actual_measured_photos']==447500
          assert meta['spatially_eligible_species']==1761
          assert (output/'polymorphism_figure6_fcp_commonality.png').stat().st_size>10_000
          assert (output/'polymorphism_figure6_fcp_commonality.pdf').stat().st_size>5_000
          print('FCP_FIGURE6_COMMONALITY_IMAGE_QA_PASS',files)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-original-447500-polymorphism-commonality-figure6-qa
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/fcp-figure6/polymorphism_figure6_fcp_commonality.png
            /tmp/fcp-figure6/polymorphism_figure6_fcp_commonality.pdf

