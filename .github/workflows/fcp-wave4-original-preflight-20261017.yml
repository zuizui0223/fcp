name: FCP wave4 exact historical machine and synthetic transport preflight
on:
  push:
    branches: [analysis/fcp-wave4-unchanged-pixel-replay-20261017]
    paths:
      - scripts/analysis/run_fcp_wave4_original_roi_and_statistics_20261017.py
      - scripts/analysis/materialize_fcp_wave4_original_machine_20261017.sh
      - tests/test_fcp_wave4_original_roi_and_statistics_20261017.py
      - .github/workflows/fcp-wave4-original-preflight-20261017.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-unchanged-historical-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover byte-frozen original flower ROI-v4 and high-depth statistics
        run: bash scripts/analysis/materialize_fcp_wave4_original_machine_20261017.sh
      - name: Synthetic source-ID integrity and completely blind worker tests
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 pytest==8.4.2
          python -m pytest -q tests/test_fcp_wave4_original_roi_and_statistics_20261017.py
          python -m py_compile scripts/analysis/run_fcp_wave4_original_roi_and_statistics_20261017.py
