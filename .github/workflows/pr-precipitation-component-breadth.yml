name: PR precipitation component breadth

on:
  push:
    branches:
      - analysis/precipitation-components
    paths:
      - "analysis_precipitation_component_breadth.py"
      - "analysis_precipitation_component_phylogeny.R"
      - ".github/workflows/pr-precipitation-component-breadth.yml"
  pull_request:
    paths:
      - "analysis_precipitation_component_breadth.py"
      - "analysis_precipitation_component_phylogeny.R"
      - ".github/workflows/pr-precipitation-component-breadth.yml"
      - "compute_climatic_niche_metrics.py"
      - "docs/supporting/jbi_table_s8_baseline_model_dataset.csv"
      - "docs/supporting/jbi_table_s9_paginated_quality_filtered_model_dataset.csv"
      - "docs/supporting/jbi_gbif_doi_bundle/jbi_gbif_exact_occurrence_subset.csv.gz"
      - "docs/supporting/jbi_opentree_induced_topology.tre"
      - "docs/supporting/jbi_dated_phylogeny_s*.tre"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  component-breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn rasterio statsmodels

      - name: Download frozen primary-analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p analysis_outputs/precipitation_components/primary_artifact
          gh run download 29972327794 \
            --repo "${{ github.repository }}" \
            --name climatic-niche-breadth-analysis \
            --dir analysis_outputs/precipitation_components/primary_artifact
          test -s analysis_outputs/precipitation_components/primary_artifact/species_climatic_niche_metrics.csv

      - name: Download WorldClim 2.1 bioclimatic rasters
        run: |
          mkdir -p analysis_outputs/precipitation_components/worldclim
          curl -L --retry 4 --fail \
            -o /tmp/wc2.1_10m_bio.zip \
            https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip
          unzip -q /tmp/wc2.1_10m_bio.zip -d analysis_outputs/precipitation_components/worldclim

      - name: Recompute paginated component breadths
        run: |
          python compute_climatic_niche_metrics.py \
            --occurrences docs/supporting/jbi_gbif_doi_bundle/jbi_gbif_exact_occurrence_subset.csv.gz \
            --worldclim-dir analysis_outputs/precipitation_components/worldclim \
            --out analysis_outputs/precipitation_components/paginated_species_climatic_niche_metrics.csv \
            --cell-out analysis_outputs/precipitation_components/paginated_occurrence_climate_cells.csv \
            --qc-out analysis_outputs/precipitation_components/paginated_species_climatic_niche_metrics_qc.json \
            --min-cells 10

      - name: Fit separate BIO12, BIO14, BIO15 and BIO17 models
        run: |
          python analysis_precipitation_component_breadth.py \
            --primary-model docs/supporting/jbi_table_s8_baseline_model_dataset.csv \
            --primary-metrics analysis_outputs/precipitation_components/primary_artifact/species_climatic_niche_metrics.csv \
            --paginated-model docs/supporting/jbi_table_s9_paginated_quality_filtered_model_dataset.csv \
            --paginated-metrics analysis_outputs/precipitation_components/paginated_species_climatic_niche_metrics.csv \
            --outdir analysis_outputs/precipitation_components \
            --permutations 9999 \
            --seed 20260801

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ape
            any::jsonlite
            any::phylolm

      - name: Fit component-wise phylogenetic sensitivity models
        run: |
          Rscript analysis_precipitation_component_phylogeny.R \
            --primary analysis_outputs/precipitation_components/precipitation_component_model_dataset_primary.csv \
            --paginated analysis_outputs/precipitation_components/precipitation_component_model_dataset_paginated_quality_filtered.csv \
            --opentree docs/supporting/jbi_opentree_induced_topology.tre \
            --dated_s1 docs/supporting/jbi_dated_phylogeny_s1.tre \
            --dated_s2 docs/supporting/jbi_dated_phylogeny_s2.tre \
            --dated_s3 docs/supporting/jbi_dated_phylogeny_s3.tre \
            --outdir analysis_outputs/precipitation_components \
            --replicates 100 \
            --seed 20260801

      - name: Validate component results
        run: |
          set -euo pipefail
          test -s analysis_outputs/precipitation_components/precipitation_component_breadth_models.csv
          test -s analysis_outputs/precipitation_components/precipitation_component_breadth_correlations.csv
          test -s analysis_outputs/precipitation_components/precipitation_component_breadth_leave_one_family_out.csv
          test -s analysis_outputs/precipitation_components/precipitation_component_breadth_manifest.json
          test -s analysis_outputs/precipitation_components/precipitation_component_phylogenetic_fits.csv
          test -s analysis_outputs/precipitation_components/precipitation_component_phylogenetic_summary.csv
          test -s analysis_outputs/precipitation_components/precipitation_component_phylogenetic_manifest.json
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path('analysis_outputs/precipitation_components')
          models=pd.read_csv(root/'precipitation_component_breadth_models.csv')
          cor=pd.read_csv(root/'precipitation_component_breadth_correlations.csv')
          phy=pd.read_csv(root/'precipitation_component_phylogenetic_summary.csv')
          assert len(models)==10
          assert set(models.metric)=={'bio12_q95q05','bio14_q95q05','bio15_q95q05','bio17_q95q05','moisture_breadth'}
          assert set(models.occurrence_dataset)=={'primary','paginated_quality_filtered'}
          assert (models.permutations_valid==9999).all()
          primary=models[(models.occurrence_dataset=='primary')&(models.metric=='bio12_q95q05')].iloc[0]
          assert 0.32 < primary.odds_ratio < 0.33, primary.to_dict()
          r=cor[(cor.occurrence_dataset=='primary')&(cor.metric_1=='bio12_q95q05')&(cor.metric_2=='moisture_breadth')].iloc[0].pearson_r
          assert r > 0.98, r
          assert len(phy)==16
          assert set(phy.model_type)=={'OpenTree_Grafen','dated_megaphylogeny'}
          assert (phy.negative_fraction.between(0,1)).all()
          manifest=json.loads((root/'precipitation_component_breadth_manifest.json').read_text())
          assert manifest['status']=='complete'
          assert 'coefficient of variation' in manifest['legacy_metric_warning']
          print(models.to_string(index=False))
          print(phy.to_string(index=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precipitation-component-breadth-analysis
          path: analysis_outputs/precipitation_components/
          if-no-files-found: error
          retention-days: 30
