name: FCP colour-specific 50km month/observer robustness
on:
  pull_request:
    paths:
      - scripts/analysis/fcp_colour_specific_50km_month_null_20261023.py
      - .github/workflows/fcp-colour-specific-50km-month-control-20261023.yml
      - results/fcp_colour_specific_50km_month_control_20261023.json
      - docs/FCP_COLOUR_SPECIFIC_50KM_CLUSTER_AND_MONTH_CORRECTION_20261023.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Compile code and test observer-independent cluster null and season confounding
        run: |
          python -m py_compile scripts/analysis/fcp_colour_specific_50km_month_null_20261023.py
          python scripts/analysis/fcp_colour_specific_50km_month_null_20261023.py --self-test
  real-447500-photos:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_ASSET: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA256: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      PHOTO_SHA256: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Retrieve exact original 447500-photo source under permanent release hashes
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-colour50/{release,source,results}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ASSET" --dir /tmp/fcp-colour50/release
          echo "$SOURCE_ARCHIVE_SHA256  /tmp/fcp-colour50/release/$SOURCE_ASSET" | sha256sum -c -
          tar -xzf "/tmp/fcp-colour50/release/$SOURCE_ASSET" -C /tmp/fcp-colour50/source \
            measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$PHOTO_SHA256  /tmp/fcp-colour50/source/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
      - name: Test colour-specific source-conditioned spatial and calendar-month nulls
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_colour_specific_50km_month_null_20261023.py \
            --photos /tmp/fcp-colour50/source/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --out /tmp/fcp-colour50/results
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/fcp-colour50/results/fcp_colour_specific_50km_month_control_results_20261023.json")
          d=json.loads(p.read_text())
          assert d["n_source_original_photos"]==447500
          assert d["n_classified_source_photos"]==227107
          assert d["original"]["n_original_strict_species_reproduced"]==1761
          assert abs(d["original"]["original_strict_mean_reproduced"] - .0176149021685411)<1e-10
          for mode in ("original","one_per_observer"):
              for family in ("global_composition","calendar_month_composition"):
                  rows=d[mode]["colour_specific_null_families"][family]
                  assert len(rows)==4
                  for item in rows:
                      assert 0<=item["holm_p_four_colours"]<=1
                      if item["n_species"]:
                          assert item["n_species_with_nontrivial_month_colour_swaps"]<=item["n_species"]
              print("FCP_COLOUR_CLUSTER_50KM_AUDIT",mode,json.dumps(
                d[mode]["colour_specific_null_families"]))
          archived=json.loads(Path("results/fcp_colour_specific_50km_month_control_20261023.json").read_text())
          assert archived["original_source_photo_sha256"]==d["original_source_photo_sha256"]
          assert archived["verified_github_actions_workflow_run_id"]==39887641626
          for mode in ("original","one_per_observer"):
              for family in ("global_composition","calendar_month_composition"):
                  observed=d[mode]["colour_specific_null_families"][family]
                  frozen=archived["results"][mode][family]
                  for x,y in zip(observed,frozen):
                      assert x["colour"]==y["colour"]
                      assert x["n_species"]==y["n_species"]
                      for attr in ("mean_excess","p_upper_199","holm_p_four_colours",
                                   "mean_observed_same_pair_fraction","mean_matched_null_fraction"):
                          assert abs(x[attr]-y[attr])<1e-12, (mode,family,x["colour"],attr)
          print("FCP_COLOUR_CLUSTER_SOURCE_FROZEN_RESULT_MATCH")
          print("FCP_COLOUR_CLUSTER_ORIGINAL_SOURCE_AUTHENTICATED_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-colour-specific-50km-month-adjusted-cluster-audit-20261023
          path: /tmp/fcp-colour50/results/
          retention-days: 90
