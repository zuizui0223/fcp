name: polymorphism-42111-h1-h2-validation

on:
  push:
    branches:
      - analysis/polymorphism-42111-h1-h2-gates-20260912
    paths:
      - "scripts/analysis/run_polymorphism_delta_geometry_validation_20260912.py"
      - "scripts/analysis/run_polymorphism_delta_geometry_structured_null_20260912.py"
      - "scripts/analysis/run_polymorphism_delta_geometry_white_axis_audit_20260912.py"
      - "docs/POLYMORPHISM_42111_H1_H2_ELIGIBILITY_PROTOCOL_20260912.md"
      - ".github/workflows/polymorphism-42111-h1-h2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-label-free-delta-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy

      - name: Syntax check
        run: |
          python -m py_compile scripts/analysis/run_polymorphism_delta_geometry_validation_20260912.py
          python -m py_compile scripts/analysis/run_polymorphism_delta_geometry_structured_null_20260912.py
          python -m py_compile scripts/analysis/run_polymorphism_delta_geometry_white_axis_audit_20260912.py

      - name: Run label-free H2 discovery/reserve validation
        run: python scripts/analysis/run_polymorphism_delta_geometry_validation_20260912.py

      - name: Run coarse-state-preserving structured null
        run: python scripts/analysis/run_polymorphism_delta_geometry_structured_null_20260912.py

      - name: Run white-axis and nonwhite-subset audit
        run: python scripts/analysis/run_polymorphism_delta_geometry_white_axis_audit_20260912.py

      - name: Show frozen results
        if: always()
        run: |
          test -f results/polymorphism_delta_geometry_validation_20260912/result.json && cat results/polymorphism_delta_geometry_validation_20260912/result.json || true
          test -f results/polymorphism_delta_geometry_structured_null_20260912/result.json && cat results/polymorphism_delta_geometry_structured_null_20260912/result.json || true
          test -f results/polymorphism_delta_geometry_white_axis_audit_20260912/result.json && cat results/polymorphism_delta_geometry_white_axis_audit_20260912/result.json || true

      - name: Upload H2 validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymorphism-delta-geometry-validation-20260912
          path: |
            results/polymorphism_delta_geometry_validation_20260912
            results/polymorphism_delta_geometry_structured_null_20260912
            results/polymorphism_delta_geometry_white_axis_audit_20260912
          if-no-files-found: warn
