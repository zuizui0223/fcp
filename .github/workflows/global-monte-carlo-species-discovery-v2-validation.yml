name: Validate cache-resistant global species discovery V2

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "docs/supporting/global_monte_carlo_species_discovery_v2_contract.json"
      - "scripts/acquisition/freeze_global_monte_carlo_species_discovery_v2.py"
      - ".github/workflows/global-monte-carlo-species-discovery-v2-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile V2 discovery
        run: python -m py_compile scripts/acquisition/freeze_global_monte_carlo_species_discovery_v2.py
      - name: Validate frozen V2 page schedule without network
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('v2', 'scripts/acquisition/freeze_global_monte_carlo_species_discovery_v2.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          c = json.loads(Path('docs/supporting/global_monte_carlo_species_discovery_v2_contract.json').read_text())
          assert c['status'] == 'frozen_after_v1_cache_diagnostic_before_any_v2_request_and_before_any_global_colour_pixel'
          assert c['fresh_discovery']['stable_order_by'] == 'id'
          assert c['fresh_discovery']['page_schedule_seed'] == 20260911
          assert c['outcome_firewall']['flower_colour_used'] is False
          assert c['outcome_firewall']['candidate_image_pixels_opened'] is False
          for cell in (0, 17, 81, 161):
              order = m.page_order(cell, 50, 20260911)
              assert len(order) == 49
              assert len(set(order)) == 49
              assert 1 not in order
              assert min(order) == 2 and max(order) == 50
              assert order == m.page_order(cell, 50, 20260911)
          assert m.page_order(0, 1, 20260911) == [1]
          print('cache_resistant_page_schedule=pass')
          PY
