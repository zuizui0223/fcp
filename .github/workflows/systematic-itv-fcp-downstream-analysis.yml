name: Systematic ITV/FCP downstream evidence analysis

on:
  push:
    branches:
      - literature/systematic-itv-fcp-search
    paths:
      - "adapt_systematic_search_to_species.py"
      - "analysis_evidence_baseline.py"
      - "build_evidence_review_queue.py"
      - "build_primary_evidence_ledger.py"
      - "prefill_primary_evidence_from_abstracts.py"
      - "build_control_candidate_pool.py"
      - ".github/workflows/systematic-itv-fcp-downstream-analysis.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed systematic-search workflow run ID
        required: true
        default: "30753748463"
      source_artifact_name:
        description: Complete merged systematic-search artifact name
        required: true
        default: "systematic-itv-fcp-literature-search-full"

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_RUN_ID: ${{ inputs.source_run_id || '30753748463' }}
  SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name || 'systematic-itv-fcp-literature-search-full' }}

jobs:
  downstream-evidence-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download complete systematic retrieval
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: systematic_search_input
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validate complete retrieval manifest
        run: |
          set -euo pipefail
          test -s systematic_search_input/itv_fcp_search_manifest.json
          test -s systematic_search_input/itv_fcp_human_screening_queue.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('systematic_search_input/itv_fcp_search_manifest.json')
          m=json.loads(p.read_text())
          assert m['status']=='complete', m
          assert m['query_count']==15, m
          assert m['seed_review_count']==7, m
          assert m['successful_shards']==52, m
          assert m['failed_or_incomplete_shards']==0, m
          assert m['deduplicated_records']==79242, m
          print(json.dumps(m, indent=2))
          PY

      - name: Adapt publication queue to legacy species-evidence width
        run: |
          python adapt_systematic_search_to_species.py \
            --queue systematic_search_input/itv_fcp_human_screening_queue.csv \
            --census data/angiosperm_census.csv \
            --outdir analysis_outputs/systematic_species

      - name: Build review and deferred queues
        run: |
          python build_evidence_review_queue.py \
            --species analysis_outputs/systematic_species/global_flower_colour_species_ranked_systematic.csv \
            --out analysis_outputs/systematic_species/global_flower_colour_review_queue_systematic.csv \
            --deferred-out analysis_outputs/systematic_species/global_flower_colour_deferred_systematic.csv \
            --qc-out analysis_outputs/systematic_species/global_flower_colour_review_queue_systematic_qc.json \
            --max-review 1000

      - name: Build and prefill primary evidence ledger
        run: |
          python build_primary_evidence_ledger.py \
            --queue analysis_outputs/systematic_species/global_flower_colour_review_queue_systematic.csv \
            --out analysis_outputs/systematic_species/primary_evidence_ledger_systematic.csv \
            --qc-out analysis_outputs/systematic_species/primary_evidence_ledger_systematic_qc.json
          python prefill_primary_evidence_from_abstracts.py \
            --ledger analysis_outputs/systematic_species/primary_evidence_ledger_systematic.csv \
            --out analysis_outputs/systematic_species/primary_evidence_ledger_systematic_prefilled.csv \
            --qc-out analysis_outputs/systematic_species/primary_evidence_ledger_systematic_prefill_qc.json

      - name: Run evidence diagnostics at the same species/family widths
        run: |
          python analysis_evidence_baseline.py \
            --species analysis_outputs/systematic_species/global_flower_colour_species_ranked_systematic.csv \
            --outdir analysis_outputs/systematic_evidence

      - name: Build screening-control candidate pool
        run: |
          python build_control_candidate_pool.py \
            --census data/angiosperm_census.csv \
            --focals analysis_outputs/systematic_species/global_flower_colour_review_queue_systematic.csv \
            --deferred analysis_outputs/systematic_species/global_flower_colour_deferred_systematic.csv \
            --out analysis_outputs/systematic_species/control_candidate_pool_systematic.csv \
            --qc-out analysis_outputs/systematic_species/control_candidate_pool_systematic_qc.json \
            --per-focal 5

      - name: Validate downstream outputs and interpretation boundary
        run: |
          set -euo pipefail
          root=analysis_outputs/systematic_species
          test -s "$root/systematic_species_adapter_qc.json"
          test -s "$root/global_flower_colour_species_ranked_systematic.csv"
          test -s "$root/global_flower_colour_review_queue_systematic.csv"
          test -s "$root/global_flower_colour_deferred_systematic.csv"
          test -s "$root/primary_evidence_ledger_systematic_prefilled.csv"
          test -s "$root/control_candidate_pool_systematic.csv"
          test -s analysis_outputs/systematic_evidence/baseline_qc.json
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('analysis_outputs/systematic_species')
          qc=json.loads((root/'systematic_species_adapter_qc.json').read_text())
          review_qc=json.loads((root/'global_flower_colour_review_queue_systematic_qc.json').read_text())
          assert qc['status']=='complete'
          assert qc['species_candidates']>0
          assert qc['species_with_p1_evidence']>0
          assert qc['semantic_guard']=='candidate_species_and_screening_priorities_are_not_adjudicated_natural_itv_or_strict_fcp'
          review_rows=sum(1 for _ in csv.DictReader((root/'global_flower_colour_review_queue_systematic.csv').open(encoding='utf-8')))
          assert review_rows>0
          print(json.dumps({'adapter':qc,'review_queue':review_qc,'review_rows':review_rows},indent=2))
          PY

      - name: Upload downstream candidate analysis
        uses: actions/upload-artifact@v4
        with:
          name: systematic-itv-fcp-downstream-candidate-analysis
          path: analysis_outputs/
          if-no-files-found: error
          retention-days: 30
