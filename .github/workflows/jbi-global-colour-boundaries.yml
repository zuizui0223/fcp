name: JBI global colour boundaries

on:
  pull_request:
    paths:
      - "fcp_pipeline/spatial_boundaries.py"
      - "tests/test_spatial_boundaries.py"
      - "docs/JBI_CHAPTER1_SPATIAL_STATE_DISTRIBUTION_PROTOCOL.md"
      - "docs/JBI_INATURALIST_PHOTO_FEASIBILITY.md"
      - ".github/workflows/jbi-global-colour-boundaries.yml"
  push:
    branches:
      - analysis/jbi-global-colour-boundaries
    paths:
      - "fcp_pipeline/spatial_boundaries.py"
      - "tests/test_spatial_boundaries.py"
      - "docs/JBI_CHAPTER1_SPATIAL_STATE_DISTRIBUTION_PROTOCOL.md"
      - "docs/JBI_INATURALIST_PHOTO_FEASIBILITY.md"
      - ".github/workflows/jbi-global-colour-boundaries.yml"

jobs:
  boundary-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run shared-boundary core tests
        run: python -m pytest -q tests/test_spatial_boundaries.py
