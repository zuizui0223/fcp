name: FCP matched species colour-axis spatial replacement
on:
  push:
    branches: [analysis/fcp-macro-colour-community-context-20261126]
    paths:
      - scripts/analysis/fcp_white_chromatic_spatial_partition_20261127.py
      - .github/workflows/fcp-spatial-axis-replacement-20261127.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-photo-spatial-partition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      TAG: fcp-all4730-original-method-actual-colour-results-20261017
      ASSET: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      PHOTO_SHA: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Verify and restore original measured photos
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-spatial/{release,source,out}
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir /tmp/fcp-spatial/release
          echo "$ARCHIVE_SHA  /tmp/fcp-spatial/release/$ASSET" | sha256sum -c -
          tar -xzf /tmp/fcp-spatial/release/$ASSET -C /tmp/fcp-spatial/source measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$PHOTO_SHA  /tmp/fcp-spatial/source/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
      - name: Compare colour axes on matched geographic distance bands
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_white_chromatic_spatial_partition_20261127.py \
            --source /tmp/fcp-spatial/source/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --out /tmp/fcp-spatial/out
          test -s /tmp/fcp-spatial/out/fcp_spatial_axis_result.json
          test -s /tmp/fcp-spatial/out/fcp_spatial_axis_species_ledger.csv
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-original-photo-spatial-axis-replacement-20261127
          path: /tmp/fcp-spatial/out/
          retention-days: 90
          if-no-files-found: error
