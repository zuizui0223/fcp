name: FCP New Phytologist persist complete 4475 species hypothesis matrix
on:
  push:
    branches: [analysis/fcp-np-all4475-unified-20261021]
    paths:
      - scripts/analysis/fcp_all4475_merge_actual_artifacts_20261021.py
      - .github/workflows/fcp-all4475-freeze-unified-species-ledger-20261021.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fcp-4475-unified-ledger-freeze-20261021
  cancel-in-progress: false
jobs:
  source-verified-4475-species-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAIN_RUN: "39453625081"
      SOURCE_OBSERVER_RUN: "39455363831"
      SOURCE_SEVEN_RUN: "39456497702"
      SOURCE_MISSING_RUN: "39518450603"
      GIT_AUTHOR_NAME: "github-actions[bot]"
      GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
      GIT_COMMITTER_NAME: "github-actions[bot]"
      GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible source-merge-only dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Verify source-identity join implementation
        run: |
          python -m py_compile scripts/analysis/fcp_all4475_merge_actual_artifacts_20261021.py
          python scripts/analysis/fcp_all4475_merge_actual_artifacts_20261021.py --self-test
      - name: Verify exactly four successful authenticated source runs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,os
          req={
           "SOURCE_MAIN_RUN":"5f59936cc8bb0cbe43caebc85fd265630e7830c7",
           "SOURCE_OBSERVER_RUN":"e204b80ef72c352103684a59fb749320202a94e5",
           "SOURCE_SEVEN_RUN":"82b8c542624ba11fd6b5bea079bdb7c4f16ed9d7",
           "SOURCE_MISSING_RUN":"90474f6c9396b7efc8cf083fab74e37b694794df",
          }
          for k,head in req.items():
              raw=subprocess.check_output(["gh","api","repos/"+os.environ["GITHUB_REPOSITORY"]+
                  "/actions/runs/"+os.environ[k]],text=True)
              data=json.loads(raw)
              assert data["id"]==int(os.environ[k])
              assert data["head_sha"]==head
              assert data["status"]=="completed" and data["conclusion"]=="success"
              assert data["run_attempt"]==1
              assert data["head_branch"]=="analysis/fcp-np-all4475-unified-20261021"
              print("FCP_VERIFIED_SOURCE_ARTIFACT_RUN",k,data["id"],head)
          PY
      - name: Retrieve exact four actual-source original species matrices, not their inference summaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp4475-merged/{master,observer,seven,missing,out}
          gh run download "$SOURCE_MAIN_RUN" --repo "$GITHUB_REPOSITORY" --name fcp-actual-all4475-H1-H5-observation-census-20261021 --dir /tmp/fcp4475-merged/master
          gh run download "$SOURCE_OBSERVER_RUN" --repo "$GITHUB_REPOSITORY" --name fcp-original4475-observer-BIO5-Firth-complete-source-20261021 --dir /tmp/fcp4475-merged/observer
          gh run download "$SOURCE_SEVEN_RUN" --repo "$GITHUB_REPOSITORY" --name fcp-entire4475-actual-source-BIO-climate-solar-seven-axes-20261021 --dir /tmp/fcp4475-merged/seven
          gh run download "$SOURCE_MISSING_RUN" --repo "$GITHUB_REPOSITORY" --name fcp-all4475-adversarial-photo-colour-missingness-bounds-20261021 --dir /tmp/fcp4475-merged/missing
      - name: Join source-invariant 4475 taxon identities and verify no invented missing genotype/fitness values
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_all4475_merge_actual_artifacts_20261021.py \
            --master /tmp/fcp4475-merged/master/all_4475_species_H1_H5_photo_climate_molecular_scope.csv \
            --observer /tmp/fcp4475-merged/observer/all4475_species_observer_BIO5_Firth_NO_COORDINATES.csv \
            --seven /tmp/fcp4475-merged/seven/all4475_species_seven_environment_axes_NO_COORDINATES.csv \
            --missing /tmp/fcp4475-merged/missing/all4475_source_label_missingness_sharp_bounds_no_coordinates.csv \
            --out /tmp/fcp4475-merged/out
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/fcp4475-merged/out/fcp_np_all4475_unified_species_ledger_receipt_20261021.json")
          d=json.loads(p.read_text())
          assert d["n_total_taxa"]==4475 and d["n_original_classifiable"]==227107
          assert d["n_species_H1_geometry"]==4475
          assert d["n_species_H2_local50_pair"]==3600
          assert d["n_species_H3_BIO5"]==4112
          assert d["n_species_H3_BIO4"]==4112
          assert d["n_species_H4_inherited_morph_verified"]==0
          assert d["n_species_H5_same_photo_individual_molecular_validated"]==0
          print("FCP_COMPLETE_SOURCE_H1H5_TAXON_IDENTITY_MERGE_VERIFIED")
          PY
      - name: Publish permanent species matrix on analysis branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "analysis/fcp-np-all4475-unified-20261021"
          mkdir -p results
          cp /tmp/fcp4475-merged/out/fcp_np_all4475_unified_species_ledger_20261021.csv results/
          cp /tmp/fcp4475-merged/out/fcp_np_all4475_unified_species_ledger_receipt_20261021.json results/
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add results/fcp_np_all4475_unified_species_ledger_20261021.csv \
                  results/fcp_np_all4475_unified_species_ledger_receipt_20261021.json
          if git diff --cached --quiet; then
            echo "FCP_4475_COMPLETE_TAXON_LEDGER_ALREADY_FROZEN"
          else
            git commit -m "Freeze complete actual-source 4475-taxon H1-H5 result matrix with missingness"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:refs/heads/analysis/fcp-np-all4475-unified-20261021
            echo "FCP_COMPLETE_4475_SPECIES_LEDGER_GIT_PUSH_SUCCESS"
          fi
      - name: Upload independently accessible persistent ledger audit files
        uses: actions/upload-artifact@v4
        with:
          name: fcp-source-four-analysis-all4475-joined-ledger-20261021
          path: /tmp/fcp4475-merged/out/
          if-no-files-found: error
          retention-days: 90
