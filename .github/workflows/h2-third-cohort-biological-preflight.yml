name: H2 third-cohort biological preflight

on:
  push:
    branches:
      - analysis/h2-third-cohort-preopening-20260916
    paths:
      - '.github/workflows/h2-third-cohort-biological-preflight.yml'
      - '.github/workflows/h2-third-cohort-prospective-measurement.yml'
      - 'tests/test_third_cohort_prospective_execution_gate.py'
      - 'tests/test_third_cohort_production_wiring.py'
      - 'fcp_pipeline/third_cohort_prospective_execution_gate.py'
      - 'docs/POLYMORPHISM_H2_THIRD_COHORT_PROSPECTIVE_MEASUREMENT_PROTOCOL_20260917.md'
      - 'scripts/analysis/build_polymorphism_h2_third_cohort_measurement_firewall_20260917.py'
      - 'scripts/analysis/reassemble_polymorphism_h2_third_cohort_measurement_20260917.py'
      - 'scripts/analysis/run_polymorphism_h2_third_cohort_prospective_white_axis_20260917.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run third-cohort prospective contract and production-wiring tests
        run: |
          python -m pytest -q \
            tests/test_third_cohort_prospective_execution_gate.py \
            tests/test_third_cohort_production_wiring.py
      - name: Compile production scripts
        run: |
          python -m py_compile \
            scripts/analysis/build_polymorphism_h2_third_cohort_measurement_firewall_20260917.py \
            scripts/analysis/reassemble_polymorphism_h2_third_cohort_measurement_20260917.py \
            scripts/analysis/run_polymorphism_h2_third_cohort_prospective_white_axis_20260917.py
