name: disttrait release metadata tooling

on:
  push:
    paths:
      - "packages/disttrait/release_metadata.example.toml"
      - "scripts/release/finalize_disttrait_release_metadata.py"
      - "scripts/release/check_disttrait_public_release.py"
      - ".github/workflows/disttrait-release-metadata-tooling.yml"
  pull_request:
    paths:
      - "packages/disttrait/release_metadata.example.toml"
      - "scripts/release/finalize_disttrait_release_metadata.py"
      - "scripts/release/check_disttrait_public_release.py"
      - ".github/workflows/disttrait-release-metadata-tooling.yml"

permissions:
  contents: read

jobs:
  validate-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare isolated package fixture
        run: |
          cp -a packages/disttrait /tmp/disttrait-release-fixture
          cp packages/disttrait/release_metadata.example.toml /tmp/release_metadata.toml
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/release_metadata.toml")
          text = p.read_text(encoding="utf-8")
          text = text.replace("https://github.com/OWNER/disttrait", "https://github.com/example/disttrait")
          text = text.replace("CHOOSE-SPDX-ID", "LicenseRef-TestOnly")
          text = text.replace('given_names = "FIRST"', 'given_names = "Test"')
          text = text.replace('family_names = "LAST"', 'family_names = "Author"')
          text = text.replace("release_ready = false", "release_ready = true")
          p.write_text(text, encoding="utf-8")
          Path("/tmp/disttrait-release-fixture/LICENSE").write_text(
              "Test-only licence fixture for CI. Not a public software licence.\n",
              encoding="utf-8",
          )
          PY

      - name: Finalize metadata in fixture
        run: |
          python scripts/release/finalize_disttrait_release_metadata.py             --metadata /tmp/release_metadata.toml             --package-dir /tmp/disttrait-release-fixture

      - name: Run public-release hard gate on fixture
        run: |
          python scripts/release/check_disttrait_public_release.py             --metadata /tmp/release_metadata.toml             --package-dir /tmp/disttrait-release-fixture

      - name: Build finalized fixture
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build /tmp/disttrait-release-fixture --outdir /tmp/dist
          python -m twine check /tmp/dist/*
