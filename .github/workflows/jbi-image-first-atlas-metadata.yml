name: JBI image-first atlas metadata freeze

on:
  pull_request:
    paths:
      - "README.md"
      - "fcp_pipeline/image_first_atlas.py"
      - "scripts/data/build_jbi_image_first_atlas_metadata.py"
      - "scripts/data/validate_jbi_image_first_atlas_freeze.py"
      - "tests/test_image_first_atlas.py"
      - "docs/JBI_IMAGE_FIRST_ATLAS_PROTOCOL.md"
      - "docs/JBI_IMAGE_FIRST_ATLAS_STATUS.md"
      - "docs/JBI_CHAPTER1_SCALEUP_PROTOCOL.md"
      - "docs/supporting/jbi_image_first_atlas_contract_v1.json"
      - "docs/supporting/jbi_image_first_atlas_metadata_feasibility_v1.json"
      - "docs/supporting/jbi_image_first_atlas_geometry_freeze_v1.json"
      - "docs/supporting/jbi_image_first_atlas_freeze_manifest_v1.json"
      - "data/atlas/jbi_image_first_atlas_cohort_v1.csv"
      - "data/atlas/jbi_image_first_atlas_observation_manifest_v1.csv"
      - ".github/workflows/jbi-image-first-atlas-metadata.yml"
  push:
    branches:
      - analysis/jbi-global-colour-boundaries-scaleup
    paths:
      - "README.md"
      - "fcp_pipeline/image_first_atlas.py"
      - "scripts/data/build_jbi_image_first_atlas_metadata.py"
      - "scripts/data/validate_jbi_image_first_atlas_freeze.py"
      - "tests/test_image_first_atlas.py"
      - "docs/JBI_IMAGE_FIRST_ATLAS_PROTOCOL.md"
      - "docs/JBI_IMAGE_FIRST_ATLAS_STATUS.md"
      - "docs/JBI_CHAPTER1_SCALEUP_PROTOCOL.md"
      - "docs/supporting/jbi_image_first_atlas_contract_v1.json"
      - "docs/supporting/jbi_image_first_atlas_metadata_feasibility_v1.json"
      - "docs/supporting/jbi_image_first_atlas_geometry_freeze_v1.json"
      - "docs/supporting/jbi_image_first_atlas_freeze_manifest_v1.json"
      - "data/atlas/jbi_image_first_atlas_cohort_v1.csv"
      - "data/atlas/jbi_image_first_atlas_observation_manifest_v1.csv"
      - ".github/workflows/jbi-image-first-atlas-metadata.yml"
  workflow_dispatch:
    inputs:
      persist_freeze:
        description: Commit the passing metadata and geometry freeze to the selected branch
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: jbi-image-first-atlas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate the pre-image contract
        run: python scripts/data/validate_jbi_image_first_atlas_freeze.py --contract-only
      - name: Test metadata admission, geometry selection and species-free display
        run: |
          python -m pytest -q \
            tests/test_image_first_atlas.py \
            tests/test_jbi_ch1_scaleup_inat_feasibility.py \
            tests/test_jbi_ch1_scaleup_photo_split.py \
            tests/test_jbi_ch1_scaleup_selection.py
      - name: Validate a committed full freeze when present
        shell: bash
        run: |
          set -euo pipefail
          files=(
            data/atlas/jbi_image_first_atlas_cohort_v1.csv
            data/atlas/jbi_image_first_atlas_observation_manifest_v1.csv
            docs/supporting/jbi_image_first_atlas_metadata_feasibility_v1.json
            docs/supporting/jbi_image_first_atlas_geometry_freeze_v1.json
            docs/supporting/jbi_image_first_atlas_freeze_manifest_v1.json
          )
          present=0
          for file in "${files[@]}"; do
            [[ -f "$file" ]] && present=$((present + 1))
          done
          if [[ "$present" -eq 0 ]]; then
            echo "Live metadata freeze has not run yet; contract and code are valid."
            exit 0
          fi
          if [[ "$present" -ne "${#files[@]}" ]]; then
            echo "Partial atlas freeze detected." >&2
            exit 1
          fi
          python scripts/data/validate_jbi_image_first_atlas_freeze.py

  live-metadata-feasibility:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run metadata-only 50-species feasibility and geometry freeze
        run: python scripts/data/build_jbi_image_first_atlas_metadata.py
      - name: Validate the complete pre-image freeze
        run: python scripts/data/validate_jbi_image_first_atlas_freeze.py
      - name: Upload immutable candidate freeze for review
        uses: actions/upload-artifact@v4
        with:
          name: jbi-image-first-atlas-metadata-freeze
          path: |
            data/atlas/jbi_image_first_atlas_cohort_v1.csv
            data/atlas/jbi_image_first_atlas_observation_manifest_v1.csv
            docs/supporting/jbi_image_first_atlas_metadata_feasibility_v1.json
            docs/supporting/jbi_image_first_atlas_geometry_freeze_v1.json
            docs/supporting/jbi_image_first_atlas_freeze_manifest_v1.json
          if-no-files-found: error
      - name: Persist passing freeze on the selected branch
        if: inputs.persist_freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/atlas/jbi_image_first_atlas_cohort_v1.csv \
            data/atlas/jbi_image_first_atlas_observation_manifest_v1.csv \
            docs/supporting/jbi_image_first_atlas_metadata_feasibility_v1.json \
            docs/supporting/jbi_image_first_atlas_geometry_freeze_v1.json \
            docs/supporting/jbi_image_first_atlas_freeze_manifest_v1.json
          if git diff --cached --quiet; then
            echo "Committed freeze already matches this metadata query."
            exit 0
          fi
          git commit -m "Freeze image-first atlas metadata cohort and geometry"
          git push origin "HEAD:${GITHUB_REF_NAME}"
