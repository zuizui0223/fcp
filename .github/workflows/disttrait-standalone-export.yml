name: disttrait standalone export dry-run

on:
  push:
    paths:
      - "packages/disttrait/**"
      - "scripts/release/export_disttrait_standalone.py"
      - ".github/workflows/disttrait-standalone-export.yml"
  pull_request:
    paths:
      - "packages/disttrait/**"
      - "scripts/release/export_disttrait_standalone.py"
      - ".github/workflows/disttrait-standalone-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest

      - name: Export standalone candidate
        run: |
          python scripts/release/export_disttrait_standalone.py             --out /tmp/disttrait-standalone             --source-sha "$GITHUB_SHA"

      - name: Run self-contained standalone tests
        run: |
          python -m pip install -e /tmp/disttrait-standalone
          python -m pytest /tmp/disttrait-standalone/tests -q

      - name: Build standalone sdist and wheel
        run: |
          mkdir -p /tmp/disttrait-standalone-dist
          python -m build /tmp/disttrait-standalone             --outdir /tmp/disttrait-standalone-dist
          python -m twine check /tmp/disttrait-standalone-dist/*

      - name: Fresh-environment wheel install
        run: |
          python -m venv /tmp/disttrait-standalone-venv
          /tmp/disttrait-standalone-venv/bin/python -m pip install --upgrade pip
          WHEEL="$(ls /tmp/disttrait-standalone-dist/*.whl)"
          /tmp/disttrait-standalone-venv/bin/python -m pip install "$WHEEL"
          cd /tmp
          /tmp/disttrait-standalone-venv/bin/python - <<'PY'
          import importlib.metadata as md
          import disttrait
          assert md.version("disttrait") == "0.12.0"
          assert disttrait.gini_simpson([1, 1]) == 0.5
          print("standalone wheel import: PASS")
          PY

      - name: Archive candidate
        run: |
          cd /tmp
          tar -czf disttrait-standalone-0.12.0-candidate.tar.gz disttrait-standalone
          sha256sum disttrait-standalone-0.12.0-candidate.tar.gz             > disttrait-standalone-0.12.0-candidate.sha256

      - name: Upload standalone candidate
        uses: actions/upload-artifact@v4
        with:
          name: disttrait-standalone-0.12.0-candidate
          path: |
            /tmp/disttrait-standalone-0.12.0-candidate.tar.gz
            /tmp/disttrait-standalone-0.12.0-candidate.sha256
            /tmp/disttrait-standalone-dist/*
