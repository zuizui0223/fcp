name: White bee mechanism v1

on:
  pull_request:
    branches:
      - analysis/white-bee-coverage-result-20260925
    paths:
      - docs/POLYMORPHISM_WHITE_BEE_MECHANISM_PROTOCOL_20260925.md
      - scripts/analysis/run_white_bee_mechanism_20260925.py
      - .github/workflows/white-bee-mechanism-20260925.yml

permissions:
  contents: read
  actions: read

env:
  BIOLOGICAL_RUN_ID: "35177668182"
  BIOLOGICAL_ARTIFACT: h2-third-cohort-prospective-result-20260917
  TECHNICAL_RUN_ID: "35687421896"
  TECHNICAL_ARTIFACT: third-cohort-highlight-technical-seal-v1

jobs:
  bee-mechanism:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy statsmodels
          python -m py_compile scripts/analysis/run_white_bee_mechanism_20260925.py
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.BIOLOGICAL_RUN_ID }}
          github-token: ${{ github.token }}
          name: ${{ env.BIOLOGICAL_ARTIFACT }}
          path: /tmp/biological
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.TECHNICAL_RUN_ID }}
          github-token: ${{ github.token }}
          name: ${{ env.TECHNICAL_ARTIFACT }}
          path: /tmp/technical
      - name: Download independent curated bee-plant table
        run: |
          curl -L --fail --retry 5 --retry-delay 3             'https://zenodo.org/records/18303036/files/GloBI_Curated.csv?download=1'             -o /tmp/GloBI_Curated.csv
          test -s /tmp/GloBI_Curated.csv
      - name: Run frozen bee mechanism test
        run: |
          MEASURED="$(find /tmp/biological -type f -name 'polymorphism_h2_third_cohort_measured_photos_v1.csv' -print -quit)"
          test -n "$MEASURED"
          rm -rf results/polymorphism_white_bee_mechanism_20260925
          python scripts/analysis/run_white_bee_mechanism_20260925.py             --measured "$MEASURED"             --technical-table /tmp/technical/technical_table.csv.gz             --join-key /tmp/technical/sealed_join_key.csv             --high-clip-ids /tmp/technical/high_clip_ids.csv             --bee-curated /tmp/GloBI_Curated.csv             --outdir results/polymorphism_white_bee_mechanism_20260925             --permutations 9999             --seed 20260925
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/polymorphism_white_bee_mechanism_20260925/result.json').read_text())
          assert x['schema']=='fcp_white_bee_mechanism_v1'
          assert x['status'] in {'complete','not_estimable'}
          if x['status']=='complete':
              assert x['eligible_species']>=100
              assert x['verdict'] in {'BEE_BREADTH_SUPPORTED','BEE_BREADTH_NOT_SUPPORTED_UNDER_THIS_TEST'}
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: white-bee-mechanism-v1
          if-no-files-found: error
          retention-days: 90
          path: results/polymorphism_white_bee_mechanism_20260925
