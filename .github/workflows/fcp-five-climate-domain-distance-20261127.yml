name: FCP five climate distance domains in original photos
on:
  push:
    branches: [analysis/fcp-macro-colour-community-context-20261126]
    paths:
      - scripts/analysis/fcp_five_climate_domain_distance_20261127.py
      - .github/workflows/fcp-five-climate-domain-distance-20261127.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-photo-five-domains:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      PHOTO_SHA: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      CLIMATE_TAG: fcp-worldclim-2.1-10m-20260925
      BIO_SHA: 00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf
      SRAD_SHA: c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Restore exact own-photo archive and existing climate rasters
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-domain-distance/{release,measured,climate,out}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_FILE" --dir /tmp/fcp-domain-distance/release
          echo "$SOURCE_ARCHIVE_SHA  /tmp/fcp-domain-distance/release/$SOURCE_FILE" | sha256sum -c -
          tar -xzf /tmp/fcp-domain-distance/release/$SOURCE_FILE -C /tmp/fcp-domain-distance measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$PHOTO_SHA  /tmp/fcp-domain-distance/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
          gh release download "$CLIMATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern wc2.1_10m_bio.zip --pattern wc2.1_10m_srad.zip --dir /tmp/fcp-domain-distance/climate
          echo "$BIO_SHA  /tmp/fcp-domain-distance/climate/wc2.1_10m_bio.zip" | sha256sum -c -
          echo "$SRAD_SHA  /tmp/fcp-domain-distance/climate/wc2.1_10m_srad.zip" | sha256sum -c -
      - name: Separate the five climate distances on identical within-species photo pairs
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_five_climate_domain_distance_20261127.py \
            --photos /tmp/fcp-domain-distance/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --bio /tmp/fcp-domain-distance/climate/wc2.1_10m_bio.zip \
            --srad /tmp/fcp-domain-distance/climate/wc2.1_10m_srad.zip \
            --out /tmp/fcp-domain-distance/out
          test -s /tmp/fcp-domain-distance/out/fcp_five_domain_distance_result.json
          test -s /tmp/fcp-domain-distance/out/fcp_five_domain_distance_species_ledger.csv
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-original-photo-five-climate-domain-distance-20261127
          path: /tmp/fcp-domain-distance/out/
          retention-days: 90
          if-no-files-found: error
