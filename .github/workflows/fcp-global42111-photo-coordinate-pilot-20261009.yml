name: FCP original 42111 photos public-coordinate pilot (1000 fixed IDs)

on:
  pull_request:
    branches:
      - main
      - analysis/fcp-global42111-phenotype-geography-synthesis-20261008
    paths:
      - scripts/acquisition/audit_fcp_global42111_original_photo_coordinate_pilot_20261009.py
      - tests/test_fcp_global42111_original_photo_coordinate_pilot_20261009.py
      - docs/FCP_GLOBAL42111_ABIOTIC_ATLAS_PROTOCOL_20261009.md
      - .github/workflows/fcp-global42111-photo-coordinate-pilot-20261009.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: fcp-original-photo-coordinate-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-photo-public-coordinate-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install only metadata and public-point audit dependencies
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m py_compile scripts/acquisition/audit_fcp_global42111_original_photo_coordinate_pilot_20261009.py
          python -m pytest tests/test_fcp_global42111_original_photo_coordinate_pilot_20261009.py -q
      - name: One-shot original photo-ID metadata gate
        run: |
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test ! -e results/fcp_global42111_public_coords_pilot_20261009/result.json
      - name: Recover source-index-verified original photo identity artefacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 37855050150 --repo "$GITHUB_REPOSITORY" \
            --name fcp-42111-global-abiotic-join-preflight \
            --dir /tmp/fcp42111_photo_source
          test -f /tmp/fcp42111_photo_source/fcp42111_original_photo_locations/breadth_source_matched_photo_positions.csv.gz
          test -f /tmp/fcp42111_photo_source/fcp42111_original_photo_locations/taxon_cell_source_matched_photo_positions.csv.gz
      - name: Bounded 1000 original observation IDs, no image pixels opened
        run: |
          python scripts/acquisition/audit_fcp_global42111_original_photo_coordinate_pilot_20261009.py \
            --breadth /tmp/fcp42111_photo_source/fcp42111_original_photo_locations/breadth_source_matched_photo_positions.csv.gz \
            --taxon-cell /tmp/fcp42111_photo_source/fcp42111_original_photo_locations/taxon_cell_source_matched_photo_positions.csv.gz \
            --outdir /tmp/fcp_global42111_coords_pilot
      - name: Validate original denominators, no colour outcome and honest missingness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          d=json.loads(Path("/tmp/fcp_global42111_coords_pilot/result.json").read_text())
          t=pd.read_csv("/tmp/fcp_global42111_coords_pilot/photo_coordinate_pilot_public_metadata.csv")
          original=pd.read_csv("/tmp/fcp_global42111_coords_pilot/original_photo_ID_pilot_prequery_manifest.csv")
          assert d["schema"]=="fcp_global42111_photo_ID_public_coordinates_pilot_v1"
          assert d["n_original_measured_source_species"]==42111
          assert d["n_original_measured_taxon_cell"]==85337
          assert d["n_photo_metadata_targets"]==1000
          assert len(t)==len(original)==1000
          assert d["n_requests"]==10
          assert t.observation_id.is_unique and original.observation_id.is_unique
          assert d["no_photo_pixels_opened"] is True
          assert d["no_new_species_or_photo_identity_selection"] is True
          assert d["no_climate_or_soil_effect_estimated"] is True
          assert d["outcome_labels_not_used_for_selection"] is True
          assert d["confirmatory_decisions_changed"] is False
          assert sum(d["by_photo_metadata_status"].values())==1000
          print("PUBLIC_COORDINATES_PILOT_CORRECT_DENOMINATORS_AND_UNCLASSIFIED_QUERIES")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-42111-public-coordinate-original-ID-pilot
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp_global42111_coords_pilot/
      - name: Commit only generated public-coordinate metadata receipt, no pixels
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = "analysis/fcp-global42111-abiotic-atlas-20261009"
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          dest="results/fcp_global42111_public_coords_pilot_20261009"
          mkdir -p "$dest"
          cp /tmp/fcp_global42111_coords_pilot/* "$dest/"
          git add "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Seal original 1000 FCP photo-ID public geographic coordinate metadata pilot'
          git push origin "HEAD:refs/heads/$HEAD_REF"
