name: FCP New Phytologist 4475 complete seven climate axes
on:
  push:
    branches: [analysis/fcp-np-all4475-unified-20261021]
    paths:
      - scripts/analysis/fcp_all4475_seven_abiotic_axes_20261021.py
      - .github/workflows/fcp-full4475-seven-climate-axes-20261021.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  all4475-seven-abiotic-axes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      CLIMATE_TAG: fcp-worldclim-2.1-10m-20260925
      BIO_SHA: 00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf
      SRAD_SHA: c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original method numeric and raster libraries
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 Pillow==11.0.0 scipy==1.15.2
      - name: Confirm signed white/chromatic seven-axis fixture
        run: |
          python -m py_compile scripts/analysis/fcp_all4475_seven_abiotic_axes_20261021.py
          python scripts/analysis/fcp_all4475_seven_abiotic_axes_20261021.py --self-test
      - name: Verify genuine measurement and BIO and monthly radiation archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp4475seven/{archive,measured,climate,results}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_FILE" --dir /tmp/fcp4475seven/archive
          echo "$SOURCE_ARCHIVE_SHA  /tmp/fcp4475seven/archive/$SOURCE_FILE" | sha256sum -c -
          tar -xzf "/tmp/fcp4475seven/archive/$SOURCE_FILE" -C /tmp/fcp4475seven/measured
          gh release download "$CLIMATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "wc2.1_10m_bio.zip" --pattern "wc2.1_10m_srad.zip" --dir /tmp/fcp4475seven/climate
          echo "$BIO_SHA  /tmp/fcp4475seven/climate/wc2.1_10m_bio.zip" | sha256sum -c -
          echo "$SRAD_SHA  /tmp/fcp4475seven/climate/wc2.1_10m_srad.zip" | sha256sum -c -
      - name: Source-locked all-taxon seven-axis photo-climate contrasts and 1999 genus familywise bootstrap
        shell: bash
        run: |
          set -euo pipefail
          export OPENBLAS_NUM_THREADS=1
          python scripts/analysis/fcp_all4475_seven_abiotic_axes_20261021.py \
            --photos /tmp/fcp4475seven/measured/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --worldclim-bio /tmp/fcp4475seven/climate/wc2.1_10m_bio.zip \
            --worldclim-srad /tmp/fcp4475seven/climate/wc2.1_10m_srad.zip \
            --out /tmp/fcp4475seven/results
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path('/tmp/fcp4475seven/results')
          j=json.loads((root/'all4475_seven_climate_axes_result.json').read_text())
          t=pd.read_csv(root/'all4475_species_seven_environment_axes_NO_COORDINATES.csv')
          assert len(t)==4475 and t.inat_taxon_id.nunique()==4475
          assert t.n_classifiable_photo.sum()==227107
          assert len(j['axes'])==7 and j['complete_source_4475_species']
          assert j['n_genera_bootstrap_draws']==1999
          print('FCP_ALL4475_SEVEN_AXES_COMPLETE_SOURCE_QA_PASS')
          print('FCP_ALL4475_SEVEN_ENVIRONMENT_FINAL_JSON',json.dumps(j,sort_keys=True,separators=(',',':'),allow_nan=False))
          PY
      - name: Archive complete seven-axis species matrix without original coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcp-entire4475-actual-source-BIO-climate-solar-seven-axes-20261021
          path: /tmp/fcp4475seven/results/
          if-no-files-found: warn
          retention-days: 90
