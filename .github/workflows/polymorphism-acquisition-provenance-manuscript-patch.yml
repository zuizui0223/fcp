name: Apply polymorphism acquisition provenance to manuscript

on:
  push:
    branches:
      - feat/polymorphism-paper-v0-1-post-step9
    paths:
      - scripts/analysis/apply_polymorphism_acquisition_provenance_to_manuscript_20260911.py
      - .github/workflows/polymorphism-acquisition-provenance-manuscript-patch.yml

permissions:
  contents: write

jobs:
  patch-manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/polymorphism-paper-v0-1-post-step9
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fail-closed manuscript patch
        run: python scripts/analysis/apply_polymorphism_acquisition_provenance_to_manuscript_20260911.py
      - name: Normalize touched version line
        run: sed -i 's/^\(\*\*Version:\*\* v0\.1-post-Step-9+acquisition-provenance, 2026-09-11\)  $/\1/' paper/polymorphism_v0_1/MANUSCRIPT.md
      - name: Verify frozen provenance still reconstructs
        run: python scripts/analysis/audit_polymorphism_acquisition_provenance_20260911.py --check
      - name: Validate patch and commit
        run: |
          git diff --check
          test -n "$(git status --porcelain paper/polymorphism_v0_1/MANUSCRIPT.md)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/polymorphism_v0_1/MANUSCRIPT.md
          git commit -m "Document frozen acquisition provenance in polymorphism paper"
          git push origin HEAD:feat/polymorphism-paper-v0-1-post-step9
