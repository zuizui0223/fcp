name: polymorphism H1 observer-disjoint D

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/polymorphism-42111-h1-h2-gates-20260912
    paths:
      - scripts/analysis/run_polymorphism_h1_observer_disjoint_d_20260913.py
      - .github/workflows/polymorphism-h1-observer-disjoint-d.yml

permissions:
  contents: read

jobs:
  h1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy
      - name: Run frozen H1 observer-disjoint D test
        run: python scripts/analysis/run_polymorphism_h1_observer_disjoint_d_20260913.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: polymorphism-h1-observer-disjoint-d-20260913
          path: results/polymorphism_h1_observer_disjoint_d_20260913/
          if-no-files-found: error
