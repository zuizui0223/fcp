name: Build New Phytologist provenance snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - CURRENT_PAPER_REPRODUCIBILITY.md
      - docs/POLYMORPHISM_MANUSCRIPT*.md
      - docs/POLYMORPHISM_SUPPORTING_INFORMATION_20260918.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_DATA_LINEAGE_MAP_20260925.md
      - docs/POLYMORPHISM_PAPER_ARCHITECTURE_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - docs/POLYMORPHISM_42111_FRAME_PROVENANCE_20260918.md
      - docs/POLYMORPHISM_H1*.md
      - docs/POLYMORPHISM_H2*.md
      - docs/POLYMORPHISM_H3*.md
      - docs/POLYMORPHISM_WHITE_ENVIRONMENT*.md
      - docs/POLYMORPHISM_LEGACY_WHITE_BIO5*.md
      - docs/figures/polymorphism_20260918/**
      - results/polymorphism_*/**
      - scripts/analysis/*polymorphism*
      - scripts/analysis/run_white_environment*
      - scripts/analysis/run_legacy_white_bio5*
      - scripts/analysis/run_silene_decoupling*
      - scripts/analysis/run_crossspecies_pal_wal*
      - tests/test_polymorphism*
      - tests/test_make_polymorphism_manuscript_figures.py
      - .github/workflows/*polymorphism*
      - .github/workflows/white-environment*
      - .github/workflows/legacy-white-bio5*
      - .github/workflows/*worldclim*
      - .github/workflows/freeze-fcp-expiring-artifacts-20260925.yml
      - .github/workflows/build-np-provenance-snapshot-20260926.yml
  push:
    branches: [main]
    paths:
      - README.md
      - CURRENT_PAPER_REPRODUCIBILITY.md
      - docs/POLYMORPHISM_MANUSCRIPT*.md
      - docs/POLYMORPHISM_SUPPORTING_INFORMATION_20260918.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_DATA_LINEAGE_MAP_20260925.md
      - docs/POLYMORPHISM_PAPER_ARCHITECTURE_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - docs/POLYMORPHISM_42111_FRAME_PROVENANCE_20260918.md
      - docs/POLYMORPHISM_H1*.md
      - docs/POLYMORPHISM_H2*.md
      - docs/POLYMORPHISM_H3*.md
      - docs/POLYMORPHISM_WHITE_ENVIRONMENT*.md
      - docs/POLYMORPHISM_LEGACY_WHITE_BIO5*.md
      - docs/figures/polymorphism_20260918/**
      - results/polymorphism_*/**
      - scripts/analysis/*polymorphism*
      - scripts/analysis/run_white_environment*
      - scripts/analysis/run_legacy_white_bio5*
      - scripts/analysis/run_silene_decoupling*
      - scripts/analysis/run_crossspecies_pal_wal*
      - tests/test_polymorphism*
      - tests/test_make_polymorphism_manuscript_figures.py
      - .github/workflows/*polymorphism*
      - .github/workflows/white-environment*
      - .github/workflows/legacy-white-bio5*
      - .github/workflows/*worldclim*
      - .github/workflows/freeze-fcp-expiring-artifacts-20260925.yml
      - .github/workflows/build-np-provenance-snapshot-20260926.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: fcp-np-provenance-20260926
  LEGACY_SHA: "5142f7951af0dde5364bb047a566d67e8c479e51"
  THIRD_SHA: "7e538e5c51c05a7cc47b2fcf53eea92634c8a863"
  SPATIAL_SHA: "f14186590c11ac24c95e1985077908b732132e96"
  FRESH_D_SHA: "b14fb7635fa4ef72887fad25524eb4941ec6e149"
  WORLDCLIM_TAG: fcp-worldclim-2.1-10m-20260925

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record source identity
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Stage repository evidence
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"
          rm -rf "$stage"
          mkdir -p "$stage/repository"

          copy_path() {
            local p="$1"
            if [ -e "$p" ]; then
              cp -a --parents "$p" "$stage/repository/"
            fi
          }

          for p in             README.md             CURRENT_PAPER_REPRODUCIBILITY.md             docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST.md             docs/POLYMORPHISM_MANUSCRIPT.md             docs/POLYMORPHISM_SUPPORTING_INFORMATION_20260918.md             docs/POLYMORPHISM_NEW_PHYTOLOGIST_COVER_LETTER.md             docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md             docs/POLYMORPHISM_DATA_LINEAGE_MAP_20260925.md             docs/POLYMORPHISM_PAPER_ARCHITECTURE_20260918.md             docs/POLYMORPHISM_FIGURE_PLAN_20260918.md             docs/POLYMORPHISM_LITERATURE_AUDIT_20260918.md             docs/POLYMORPHISM_42111_FRAME_PROVENANCE_20260918.md             docs/POLYMORPHISM_METHODS_CLASSIFICATION_20260918.md             docs/POLYMORPHISM_NEW_PHYTOLOGIST_SUBMISSION_READINESS_20260918.md             docs/POLYMORPHISM_PROVENANCE_RELEASE_MANIFEST_20260926.md             docs/POLYMORPHISM_SILENE_DECOUPLING_EVIDENCE_SYNTHESIS_20260925.md             docs/POLYMORPHISM_CROSSSPECIES_PAL_WAL_ANALYSIS_20260925.md             docs/RGFCA_TO_POLYMORPHISM_INTERPRETATION_20260918.md             docs/P500_PROSPECTIVE_TERMINAL_POSTMORTEM_20260916.md             docs/figures/polymorphism_20260918             archive/fcp_submission_20260925; do
            copy_path "$p"
          done

          # The receipt is generated only after the package is uploaded.
          # Excluding the previous receipt avoids a stale self-reference inside
          # the package that the new receipt is meant to identify.
          rm -f "$stage/repository/archive/fcp_submission_20260925/NP_PROVENANCE_RELEASE_RECEIPT.md"

          while IFS= read -r -d '' p; do copy_path "$p"; done < <(
            find docs -maxdepth 1 -type f \(               -name 'POLYMORPHISM_H1*' -o               -name 'POLYMORPHISM_H2*' -o               -name 'POLYMORPHISM_H3*' -o               -name 'POLYMORPHISM_WHITE_ENVIRONMENT*' -o               -name 'POLYMORPHISM_LEGACY_WHITE_BIO5*'             \) -print0
          )

          for p in             results/polymorphism_h1_observer_disjoint_reliability_20260913             results/polymorphism_h1_observer_disjoint_D_reliability_20260913             results/polymorphism_white_axis_targeted_test_20260912             results/polymorphism_h2_third_cohort_selection_20260916             results/polymorphism_h2_third_cohort_prospective_measurement_20260917             results/polymorphism_h2_third_cohort_prospective_white_axis_20260917             results/polymorphism_h2_posthoc_validity_diagnostics_20260922             results/polymorphism_h2_third_cohort_highlight_validity_20260922             results/polymorphism_white_environment_mechanism_20260925             results/polymorphism_legacy_white_bio5_replication_20260925             results/polymorphism_spatial_organization_clue_20260918             results/polymorphism_h3a_phylogenetic_signal_20260912             results/polymorphism_h3b_reserve_span_20260912             results/polymorphism_fresh_D_transport_20260925             results/polymorphism_silene_decoupling_persistence_20260925             results/polymorphism_crossspecies_pal_wal_frequency_20260925             results/polymorphism_data_lineage_audit_20260925             results/polymorphism_publication_figure_source_20260918; do
            copy_path "$p"
          done

          while IFS= read -r -d '' p; do copy_path "$p"; done < <(
            find scripts/analysis -maxdepth 1 -type f \(               -name '*polymorphism*' -o               -name 'run_white_environment*' -o               -name 'run_legacy_white_bio5*' -o               -name 'run_silene_decoupling*' -o               -name 'run_crossspecies_pal_wal*'             \) -print0
          )
          copy_path scripts/update_manuscript_figure_calls.py

          while IFS= read -r -d '' p; do copy_path "$p"; done < <(
            find tests -maxdepth 1 -type f \(               -name 'test_polymorphism*' -o               -name 'test_make_polymorphism_manuscript_figures.py'             \) -print0
          )

          while IFS= read -r -d '' p; do copy_path "$p"; done < <(
            find .github/workflows -maxdepth 1 -type f \(               -name '*polymorphism*' -o               -name 'white-environment*' -o               -name 'legacy-white-bio5*' -o               -name '*worldclim*' -o               -name 'freeze-fcp-expiring-artifacts-20260925.yml'             \) -print0
          )

      - name: Recover immutable measured tables and historical spatial receipts
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"
          mkdir -p "$stage/raw_inputs/legacy" "$stage/raw_inputs/third_cohort" "$stage/historical/spatial"

          git fetch --no-tags --depth=1 origin "$LEGACY_SHA"
          git show "$LEGACY_SHA:data/derived/global_monte_carlo_measured_photos_v1.csv" > "$stage/raw_inputs/legacy/global_monte_carlo_measured_photos_v1.csv"
          git show "$LEGACY_SHA:data/derived/rgfca_reserve_replication_measured_photos_v1.csv" > "$stage/raw_inputs/legacy/rgfca_reserve_replication_measured_photos_v1.csv"
          echo 'ee854126eed2cfe23e333abe2c28d14df24895a5c52cbc389c060a5a4d6f91f4  '"$stage"'/raw_inputs/legacy/global_monte_carlo_measured_photos_v1.csv' | sha256sum -c -
          echo '0e2ed349122739eecfc725fb2d5e313d284cf30752da91f9a0429cff0eeaa5e6  '"$stage"'/raw_inputs/legacy/rgfca_reserve_replication_measured_photos_v1.csv' | sha256sum -c -

          git fetch --no-tags --depth=1 origin "$THIRD_SHA"
          git show "$THIRD_SHA:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv" > "$stage/raw_inputs/third_cohort/polymorphism_h2_third_cohort_measured_photos_v1.csv"
          git show "$THIRD_SHA:data/derived/polymorphism_h2_third_cohort_measurement_species_support_v1.csv" > "$stage/raw_inputs/third_cohort/polymorphism_h2_third_cohort_measurement_species_support_v1.csv"
          echo '57630fc9f281bce94a0c40a70aaf7bce879dde93d6154175adcd021e8f5c1186  '"$stage"'/raw_inputs/third_cohort/polymorphism_h2_third_cohort_measured_photos_v1.csv' | sha256sum -c -

          git fetch --no-tags --depth=1 origin "$SPATIAL_SHA"
          git show "$SPATIAL_SHA:results/polymorphism_measurement_missingness_step8_analysis_20260910/result.json" > "$stage/historical/spatial/polymorphism_measurement_missingness_step8_result.json"
          git show "$SPATIAL_SHA:results/polymorphism_ambiguity_bounds_step9_20260910/result.json" > "$stage/historical/spatial/polymorphism_ambiguity_bounds_step9_result.json"
          git show "$SPATIAL_SHA:paper/polymorphism_v0_1/paper_numbers.json" > "$stage/historical/spatial/paper_numbers.json"
          test "$(git hash-object "$stage/historical/spatial/polymorphism_measurement_missingness_step8_result.json")" = "d9e8f741a3db1621463b857710b1e91e2af52c99"
          test "$(git hash-object "$stage/historical/spatial/polymorphism_ambiguity_bounds_step9_result.json")" = "3e92d8798f17a60900ac3bba8deb76b062a609f1"
          test "$(git hash-object "$stage/historical/spatial/paper_numbers.json")" = "b5fec72fb1f8299fb430b8bcdbaf106ee38d8672"

      - name: Recover fresh-D transport source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"
          mkdir -p "$stage/external/fresh_D_transport"
          gh run download 35941316633 --repo "${{ github.repository }}"             --name fcp-v2-biological-and-validity-result-v1             --dir "$stage/external/fresh_D_transport"
          git fetch --no-tags --depth=1 origin "$FRESH_D_SHA"
          mkdir -p "$stage/historical/fresh_D_transport"
          git show "$FRESH_D_SHA:results/fcp_v2_measurement_validity_20260923/result.json" > "$stage/historical/fresh_D_transport/source_result.json"

      - name: Add exact WorldClim release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"
          mkdir -p "$stage/external/worldclim"
          gh release download "$WORLDCLIM_TAG" --repo "${{ github.repository }}"             --pattern 'wc2.1_10m_bio.zip'             --pattern 'wc2.1_10m_srad.zip'             --dir "$stage/external/worldclim"
          echo '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf  '"$stage"'/external/worldclim/wc2.1_10m_bio.zip' | sha256sum -c -
          echo 'c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026  '"$stage"'/external/worldclim/wc2.1_10m_srad.zip' | sha256sum -c -

      - name: Build deterministic provenance package
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"
          out="$RUNNER_TEMP/fcp_np_release"
          mkdir -p "$out"

          cat > "$stage/PROVENANCE_SOURCE.txt" <<EOF
          schema=fcp_np_provenance_snapshot_v1
          date_jst=2026-09-26
          source_commit=$SOURCE_SHA
          release_tag=$RELEASE_TAG
          legacy_source_commit=$LEGACY_SHA
          third_cohort_source_commit=$THIRD_SHA
          spatial_source_commit=$SPATIAL_SHA
          fresh_D_source_commit=$FRESH_D_SHA
          worldclim_release_tag=$WORLDCLIM_TAG
          EOF

          (
            cd "$stage"
            find . -type f ! -name FILE_SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > FILE_SHA256SUMS.txt
          )

          file_count="$(find "$stage" -type f | wc -l)"
          echo "$file_count" > "$stage/FILE_COUNT.txt"

          package="$out/fcp-np-provenance-20260926.tar.gz"
          tar --sort=name --mtime='UTC 2026-09-26 00:00:00' --owner=0 --group=0 --numeric-owner             -C "$stage" -cf - . | gzip -n -9 > "$package"
          sha256sum "$package" > "$out/fcp-np-provenance-20260926.tar.gz.sha256"
          cp "$stage/FILE_SHA256SUMS.txt" "$out/FILE_SHA256SUMS.txt"

          tar -tzf "$package" > "$out/package_contents.txt"
          grep -Fxq './repository/docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST.md' "$out/package_contents.txt"
          grep -Fxq './raw_inputs/legacy/global_monte_carlo_measured_photos_v1.csv' "$out/package_contents.txt"
          grep -Fxq './raw_inputs/third_cohort/polymorphism_h2_third_cohort_measured_photos_v1.csv' "$out/package_contents.txt"
          grep -Fxq './external/worldclim/wc2.1_10m_bio.zip' "$out/package_contents.txt"
          grep -Fxq './repository/archive/fcp_submission_20260925/h3b/h3b_span_permutation_nulls.csv' "$out/package_contents.txt"
          grep -Fxq './repository/results/polymorphism_silene_decoupling_persistence_20260925/result.json' "$out/package_contents.txt"
          grep -Fxq './repository/results/polymorphism_crossspecies_pal_wal_frequency_20260925/result.json' "$out/package_contents.txt"

          stat -c '%n %s bytes' "$package"
          cat "$out/fcp-np-provenance-20260926.tar.gz.sha256"
          echo "files=$file_count"

      - uses: actions/upload-artifact@v4
        with:
          name: fcp-np-provenance-dryrun-${{ github.sha }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/fcp_np_release/fcp-np-provenance-20260926.tar.gz
            ${{ runner.temp }}/fcp_np_release/fcp-np-provenance-20260926.tar.gz.sha256
            ${{ runner.temp }}/fcp_np_release/FILE_SHA256SUMS.txt

      - name: Create permanent provenance release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fcp_np_release"
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG"               --repo "${{ github.repository }}"               --target "$SOURCE_SHA"               --title "FCP New Phytologist provenance snapshot (2026-09-26)"               --notes "Self-contained provenance snapshot for the active FCP flower-colour polymorphism manuscript. Includes the current manuscript/SI/figures, frozen protocols and results, exact legacy and prospective-H2 measured tables recovered from immutable commits, permanent highlight/H3 archives, and checksum-pinned WorldClim 2.1 input archives. This is a reproducibility snapshot, not a statement of final submission status."
          fi
          gh release upload "$RELEASE_TAG"             "$out/fcp-np-provenance-20260926.tar.gz"             "$out/fcp-np-provenance-20260926.tar.gz.sha256"             "$out/FILE_SHA256SUMS.txt"             --repo "${{ github.repository }}" --clobber

      - name: Commit release receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fcp_np_release"
          release_url="$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json url --jq .url)"
          package="$out/fcp-np-provenance-20260926.tar.gz"
          package_sha="$(sha256sum "$package" | awk '{print $1}')"
          package_bytes="$(stat -c '%s' "$package")"
          file_count="$(tar -tzf "$package" | grep -v '/$' | wc -l)"

          mkdir -p archive/fcp_submission_20260925
          cat > archive/fcp_submission_20260925/NP_PROVENANCE_RELEASE_RECEIPT.md <<EOF
          # New Phytologist provenance release receipt — 2026-09-26

          Release tag: $RELEASE_TAG

          Release URL: $release_url

          Source commit: $SOURCE_SHA

          Asset: fcp-np-provenance-20260926.tar.gz

          Asset bytes: $package_bytes

          Asset SHA256: $package_sha

          Packaged files: $file_count

          The package contains the current manuscript evidence tree plus exact legacy and prospective-H2 measured inputs and the checksum-pinned WorldClim archives. Machine-readable frozen results remain authoritative over prose.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/fcp_submission_20260925/NP_PROVENANCE_RELEASE_RECEIPT.md
          if git diff --cached --quiet; then
            echo "Receipt already current"
            exit 0
          fi
          git commit -m "Record New Phytologist provenance release"
          git push origin HEAD:main
