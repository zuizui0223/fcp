          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/fcp_np_release/fcp-np-provenance-20260926.tar.gz
            ${{ runner.temp }}/fcp_np_release/fcp-np-provenance-20260926.tar.gz.sha256
            ${{ runner.temp }}/fcp_np_release/FILE_SHA256SUMS.txt

      - name: Create permanent provenance release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fcp_np_release"
          git fetch --no-tags origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Superseded provenance run: source=$SOURCE_SHA current=$remote_sha; refusing to publish a stale permanent release."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG"               --repo "${{ github.repository }}"               --target "$SOURCE_SHA"               --title "FCP New Phytologist provenance snapshot (2026-09-26)"               --notes "Self-contained provenance snapshot for the active FCP flower-colour polymorphism manuscript. Includes the current manuscript/SI/figures, frozen protocols and results, exact discovery/validation and prospective-confirmation measured tables recovered from immutable commits, permanent validity/H3 archives, and checksum-pinned WorldClim 2.1 input archives. This is a reproducibility snapshot, not a statement of final submission status."
          fi
          gh release upload "$RELEASE_TAG"             "$out/fcp-np-provenance-20260926.tar.gz"             "$out/fcp-np-provenance-20260926.tar.gz.sha256"             "$out/FILE_SHA256SUMS.txt"             --repo "${{ github.repository }}" --clobber

      - name: Commit release receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fcp_np_release"
          release_url="$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json url --jq .url)"
          package="$out/fcp-np-provenance-20260926.tar.gz"
          package_sha="$(sha256sum "$package" | awk '{print $1}')"
          package_bytes="$(stat -c '%s' "$package")"
          file_count="$(tar -tzf "$package" | grep -v '/$' | wc -l)"

          git fetch --no-tags origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Superseded provenance run: source=$SOURCE_SHA current=$remote_sha; refusing to report stale provenance as successful."
            exit 1
          fi

          mkdir -p archive/fcp_submission_20260925
          cat > archive/fcp_submission_20260925/NP_PROVENANCE_RELEASE_RECEIPT.md <<EOF
          # New Phytologist provenance release receipt — 2026-09-26

          Release tag: $RELEASE_TAG

          Release URL: $release_url

          Source commit: $SOURCE_SHA

          Asset: fcp-np-provenance-20260926.tar.gz

          Asset bytes: $package_bytes

          Asset SHA256: $package_sha

          Packaged files: $file_count

          The package contains the current manuscript evidence tree, exact discovery/validation and prospective-confirmation measured inputs, the frozen 42,111-species opportunity frame, the prior high-depth exclusion inputs needed to reconstruct the 3,230-species prospective candidate frame, prospective-confirmation selection inputs, frozen H1/H2/spatial execution code, permanent discovery/validation spatial-null arrays, frozen secondary climate/H3 artifacts and replay environments, frozen source-photo metadata, ROI-v4 and EfficientSAM model bytes, and checksum-pinned WorldClim archives. Raw source image pixels were intentionally not persisted; machine-readable frozen results remain authoritative over prose.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/fcp_submission_20260925/NP_PROVENANCE_RELEASE_RECEIPT.md
          if git diff --cached --quiet; then
            echo "Receipt already current"
            exit 0
          fi
          git commit -m "Record New Phytologist provenance release"
          if ! git push origin HEAD:main; then
            echo "::error::A newer main commit arrived while writing the receipt; failing closed so no submission candidate can be built from stale provenance."
            exit 1
          fi
