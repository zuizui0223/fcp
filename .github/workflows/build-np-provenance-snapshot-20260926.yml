            scripts/analysis/run_polymorphism_measurement_missingness_step8_analysis_20260910.py \
            scripts/analysis/run_polymorphism_ambiguity_bounds_step9_20260910.py \
            results/polymorphism_spatial_subset_step5_20260909 \
            results/polymorphism_spatial_reserve_step5b_20260909 \
            results/polymorphism_spatial_span_adjusted_step6_20260910 \
            results/polymorphism_spatial_span_adjusted_null_step6b_20260910 \
            results/polymorphism_measurement_missingness_step8_analysis_20260910 \
            results/polymorphism_ambiguity_bounds_step9_20260910 \
            | tar -x -C "$stage/historical_code/spatial_full"

          cat > "$stage/RAW_IMAGE_REPRODUCIBILITY_LIMIT.md" <<EOF
          # Raw-image reproducibility boundary

          Exact source image pixels and flower masks were intentionally not persisted by the
          prospective measurement protocol.

          This package preserves the frozen photo IDs/source URLs, per-row image SHA256 values,
          exact acquisition/measurement code, the ROI-v4 detector byte, and the exact EfficientSAM
          ONNX weights.

          If the original provider still serves the frozen bytes, future reacquisition can be
          validated against image_sha256. If those provider bytes disappear or change, exact
          historical pixel-to-measurement reconstruction is not possible from this archive alone.
          EOF

