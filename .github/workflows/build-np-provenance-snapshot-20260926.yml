              ./raw_inputs/third_cohort/parent_u100_selection \
              ./raw_inputs/third_cohort/candidate_frame
            cp -a "$prev/extracted/raw_inputs/third_cohort/parent_u100_selection/." "$parent/"
            cp -a "$prev/extracted/raw_inputs/third_cohort/candidate_frame/." "$candidate/"
            echo "parent_selection_source=permanent_provenance_release"
          fi

          echo '1473aad680fe2fa84903c5e11ee104fd0eceef828957f16c2ef1a35f9dd6993c  '"$parent"'/p100_outcome_blind_pool.csv' | sha256sum -c -
          echo 'f54d07fb2338a20a3f92808b58f0ebc948ab0d5af3cb01fb26702f861184b7a4  '"$parent"'/p500_frozen_selection.csv' | sha256sum -c -

          if [ ! -f "$candidate/candidate_pool.csv" ]; then
            python "$stage/historical_code/prospective_h2/scripts/analysis/build_polymorphism_h2_third_cohort_frame_20260916.py" \
              --p100 "$parent/p100_outcome_blind_pool.csv" \
              --p500 "$parent/p500_frozen_selection.csv" \
              --out-dir "$candidate"
          fi

          echo '7fc0337074b55a91c0b50773a8d5c3ef82e877074c8b3cacc21f9af58e0ba77e  '"$candidate"'/candidate_pool.csv' | sha256sum -c -
          test "$(($(wc -l < "$candidate/candidate_pool.csv") - 1))" -eq 3230

      - name: Complete image-measurement and spatial reproducibility bytes
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"

          mkdir -p \
            "$stage/raw_inputs/third_cohort/source_metadata" \
            "$stage/external/measurement_runtime/efficient_sam" \
            "$stage/historical_code/spatial_full"

          # Validate the detector byte that was copied from the frozen measurement source.
          echo 'f1aaeec4664fe2c178e5cf2bc1f508977bef3e4aa7b40613026cb8ae3de789d5  '"$stage"'/historical_code/measurement_machine/data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt' | sha256sum -c -

          # Preserve the exact one-shot source-photo denominator used by prospective H2.
          git show "$THIRD_SHA:data/frozen/polymorphism_h2_third_cohort_authorized_metadata_v1.csv.gz" \
            > "$stage/raw_inputs/third_cohort/source_metadata/polymorphism_h2_third_cohort_authorized_metadata_v1.csv.gz"
          git show "$THIRD_SHA:results/polymorphism_h2_third_cohort_candidate_metadata_20260916/authorized_species.csv" \
