name: Build New Phytologist provenance snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - CURRENT_PAPER_REPRODUCIBILITY.md
      - docs/POLYMORPHISM_MANUSCRIPT*.md
      - docs/POLYMORPHISM_SUPPORTING_INFORMATION_20260918.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_NEW_PHYTOLOGIST_COVER_LETTER.md
      - docs/POLYMORPHISM_NEW_PHYTOLOGIST_SUBMISSION_READINESS_20260918.md
      - docs/POLYMORPHISM_PROVENANCE_RELEASE_MANIFEST_20260926.md
      - docs/POLYMORPHISM_SILENE_DECOUPLING_EVIDENCE_SYNTHESIS_20260925.md
      - docs/POLYMORPHISM_CROSSSPECIES_PAL_WAL_ANALYSIS_20260925.md
      - docs/POLYMORPHISM_SECONDARY_MECHANISM_EVIDENCE_LEDGER_20260928.md
      - docs/POLYMORPHISM_DATA_LINEAGE_MAP_20260925.md
      - docs/POLYMORPHISM_REPRODUCIBILITY_AUDIT_20260927.md
      - docs/POLYMORPHISM_PAPER_ARCHITECTURE_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - docs/POLYMORPHISM_42111_FRAME_PROVENANCE_20260918.md
      - docs/POLYMORPHISM_H1*.md
      - docs/POLYMORPHISM_H2*.md
      - docs/POLYMORPHISM_H3*.md
      - docs/POLYMORPHISM_WHITE_ENVIRONMENT*.md
      - docs/POLYMORPHISM_LEGACY_WHITE_BIO5*.md
      - docs/figures/polymorphism_20260918/**
      - results/polymorphism_*/**
      - scripts/analysis/*polymorphism*
      - scripts/analysis/run_white_environment*
      - scripts/analysis/run_legacy_white_bio5*
      - scripts/analysis/run_silene_decoupling*
      - scripts/analysis/run_crossspecies_pal_wal*
      - tests/test_polymorphism*
      - tests/test_make_polymorphism_manuscript_figures.py
      - .github/workflows/*polymorphism*
      - .github/workflows/white-environment*
      - .github/workflows/legacy-white-bio5*
      - .github/workflows/*worldclim*
      - .github/workflows/freeze-fcp-expiring-artifacts-20260925.yml
      - .github/workflows/build-np-provenance-snapshot-20260926.yml
      - requirements-np-replay-20260928.txt
      - requirements-np-bio5-replay-20260928.txt
      - docs/POLYMORPHISM_SECONDARY_REPLAY_ENVIRONMENT_20260928.md
      - .github/workflows/polymorphism-secondary-reproducibility-replay.yml
  push:
    branches: [main]
    paths:
      - README.md
      - CURRENT_PAPER_REPRODUCIBILITY.md
      - docs/POLYMORPHISM_MANUSCRIPT*.md
      - docs/POLYMORPHISM_SUPPORTING_INFORMATION_20260918.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_NEW_PHYTOLOGIST_COVER_LETTER.md
      - docs/POLYMORPHISM_NEW_PHYTOLOGIST_SUBMISSION_READINESS_20260918.md
      - docs/POLYMORPHISM_PROVENANCE_RELEASE_MANIFEST_20260926.md
      - docs/POLYMORPHISM_SILENE_DECOUPLING_EVIDENCE_SYNTHESIS_20260925.md
      - docs/POLYMORPHISM_CROSSSPECIES_PAL_WAL_ANALYSIS_20260925.md
      - docs/POLYMORPHISM_SECONDARY_MECHANISM_EVIDENCE_LEDGER_20260928.md
      - docs/POLYMORPHISM_DATA_LINEAGE_MAP_20260925.md
      - docs/POLYMORPHISM_REPRODUCIBILITY_AUDIT_20260927.md
      - docs/POLYMORPHISM_PAPER_ARCHITECTURE_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - docs/POLYMORPHISM_42111_FRAME_PROVENANCE_20260918.md
      - docs/POLYMORPHISM_H1*.md
      - docs/POLYMORPHISM_H2*.md
      - docs/POLYMORPHISM_H3*.md
      - docs/POLYMORPHISM_WHITE_ENVIRONMENT*.md
      - docs/POLYMORPHISM_LEGACY_WHITE_BIO5*.md
      - docs/figures/polymorphism_20260918/**
      - results/polymorphism_*/**
      - scripts/analysis/*polymorphism*
      - scripts/analysis/run_white_environment*
      - scripts/analysis/run_legacy_white_bio5*
      - scripts/analysis/run_silene_decoupling*
      - scripts/analysis/run_crossspecies_pal_wal*
      - tests/test_polymorphism*
      - tests/test_make_polymorphism_manuscript_figures.py
      - .github/workflows/*polymorphism*
      - .github/workflows/white-environment*
      - .github/workflows/legacy-white-bio5*
      - .github/workflows/*worldclim*
      - .github/workflows/freeze-fcp-expiring-artifacts-20260925.yml
      - .github/workflows/build-np-provenance-snapshot-20260926.yml
      - requirements-np-replay-20260928.txt
      - requirements-np-bio5-replay-20260928.txt
      - docs/POLYMORPHISM_SECONDARY_REPLAY_ENVIRONMENT_20260928.md
      - .github/workflows/polymorphism-secondary-reproducibility-replay.yml
  workflow_dispatch:

concurrency:
  group: np-provenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: fcp-np-provenance-20260926
  LEGACY_SHA: "5142f7951af0dde5364bb047a566d67e8c479e51"
  THIRD_SHA: "7e538e5c51c05a7cc47b2fcf53eea92634c8a863"
  SPATIAL_SHA: "f14186590c11ac24c95e1985077908b732132e96"
  FRESH_D_SHA: "b14fb7635fa4ef72887fad25524eb4941ec6e149"
  FRESH_D_MANIFEST_SHA256: "de6f5558f83e2667fe90198aa46ecf320f6e8e5f6d28480adf0687e95f5754e6"
  MEASUREMENT_SHA: "9fae6ccdf684a46026f72ba12e98de2c5c54bf2a"
  AUTHORIZED_METADATA_SHA256: "13b25d72f20ed2b09ebcf3f80e0058aede08474a7e9051f7fb6ce1e521a16290"
  AUTHORIZED_SPECIES_SHA256: "36a866b040b835e20539d318b0533bcb905cbe760d23df29e7da6587a054e593"
  EFFICIENTSAM_REVISION: "d525f622e6f640acf5a0fc37c7ca1f243da5bde0"
  EFFICIENTSAM_ENCODER_SHA256: "84ed466ffcc5c1f8d08409bc34a23bb364ab2c15e402cb12d4335a42be0e0951"
  EFFICIENTSAM_DECODER_SHA256: "a62f8fa5ea080447c0689418d69e58f1e83e0b7adf9c142e2bd9bcc8045c0b11"
  DISC_SPATIAL_RUN_ID: "34088925008"
  RES_SPATIAL_RUN_ID: "34178957447"
  PARENT_SELECTION_RUN_ID: "34708044962"
  PARENT_SELECTION_ARTIFACT: "polymorphism-h2-prospective-u100-selection-20260913"
  H3A_SHA: "db2514f622468747a7d5896c2696fcbf13729ef6"
  H3B_SHA: "ff1eac2ec1378465d5027184d507cb597c67be27"
  WHITE_ENV_RUN_ID: "36128744659"
  WHITE_ENV_ARTIFACT: "white-environment-mechanism-v1"
  LEGACY_BIO5_RUN_ID: "36128744674"
  LEGACY_BIO5_ARTIFACT: "legacy-white-bio5-replication-v1"
  WORLDCLIM_TAG: fcp-worldclim-2.1-10m-20260925

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record source identity
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Stage repository evidence
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"
          rm -rf "$stage"
          mkdir -p "$stage/repository"

          copy_path() {
            local p="$1"
            if [ -e "$p" ]; then
              cp -a --parents "$p" "$stage/repository/"
            fi
          }

          for p in             README.md             requirements-np-replay-20260928.txt             requirements-np-bio5-replay-20260928.txt             CURRENT_PAPER_REPRODUCIBILITY.md             docs/POLYMORPHISM_SECONDARY_REPLAY_ENVIRONMENT_20260928.md             docs/POLYMORPHISM_REPRODUCIBILITY_AUDIT_20260927.md             docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST.md             docs/POLYMORPHISM_MANUSCRIPT.md             docs/POLYMORPHISM_SUPPORTING_INFORMATION_20260918.md             docs/POLYMORPHISM_NEW_PHYTOLOGIST_COVER_LETTER.md             docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md             docs/POLYMORPHISM_SECONDARY_MECHANISM_EVIDENCE_LEDGER_20260928.md             docs/POLYMORPHISM_DATA_LINEAGE_MAP_20260925.md             docs/POLYMORPHISM_PAPER_ARCHITECTURE_20260918.md             docs/POLYMORPHISM_FIGURE_PLAN_20260918.md             docs/POLYMORPHISM_LITERATURE_AUDIT_20260918.md             docs/POLYMORPHISM_42111_FRAME_PROVENANCE_20260918.md             docs/POLYMORPHISM_METHODS_CLASSIFICATION_20260918.md             docs/POLYMORPHISM_NEW_PHYTOLOGIST_SUBMISSION_READINESS_20260918.md             docs/POLYMORPHISM_PROVENANCE_RELEASE_MANIFEST_20260926.md             docs/POLYMORPHISM_SILENE_DECOUPLING_EVIDENCE_SYNTHESIS_20260925.md             docs/POLYMORPHISM_CROSSSPECIES_PAL_WAL_ANALYSIS_20260925.md             docs/RGFCA_TO_POLYMORPHISM_INTERPRETATION_20260918.md             docs/P500_PROSPECTIVE_TERMINAL_POSTMORTEM_20260916.md             docs/figures/polymorphism_20260918             archive/fcp_submission_20260925; do
            copy_path "$p"
          done

          # The receipt is generated only after the package is uploaded.
          # Excluding the previous receipt avoids a stale self-reference inside
          # the package that the new receipt is meant to identify.
          rm -f "$stage/repository/archive/fcp_submission_20260925/NP_PROVENANCE_RELEASE_RECEIPT.md"

          while IFS= read -r -d '' p; do copy_path "$p"; done < <(
            find docs -maxdepth 1 -type f \(               -name 'POLYMORPHISM_H1*' -o               -name 'POLYMORPHISM_H2*' -o               -name 'POLYMORPHISM_H3*' -o               -name 'POLYMORPHISM_WHITE_ENVIRONMENT*' -o               -name 'POLYMORPHISM_LEGACY_WHITE_BIO5*'             \) -print0
          )

          for p in             results/polymorphism_h1_observer_disjoint_reliability_20260913             results/polymorphism_h1_observer_disjoint_D_reliability_20260913             results/polymorphism_white_axis_targeted_test_20260912             results/polymorphism_h2_third_cohort_selection_20260916             results/polymorphism_h2_third_cohort_prospective_measurement_20260917             results/polymorphism_h2_third_cohort_prospective_white_axis_20260917             results/polymorphism_h2_posthoc_validity_diagnostics_20260922             results/polymorphism_h2_third_cohort_highlight_validity_20260922             results/polymorphism_white_environment_mechanism_20260925             results/polymorphism_white_environment_observer_sensitivity_20260925             results/polymorphism_legacy_white_bio5_replication_20260925             results/polymorphism_spatial_organization_clue_20260918             results/polymorphism_h3a_phylogenetic_signal_20260912             results/polymorphism_h3b_reserve_span_20260912             results/polymorphism_D_finite_sample_sensitivity_20260928             results/polymorphism_fresh_D_transport_20260925             results/polymorphism_silene_decoupling_persistence_20260925             results/polymorphism_crossspecies_pal_wal_frequency_20260925             results/polymorphism_data_lineage_audit_20260925             results/polymorphism_publication_figure_source_20260918; do
            copy_path "$p"
          done

          while IFS= read -r -d '' p; do copy_path "$p"; done < <(
            find scripts/analysis -maxdepth 1 -type f \(               -name '*polymorphism*' -o               -name 'run_white_environment*' -o               -name 'run_legacy_white_bio5*' -o               -name 'run_silene_decoupling*' -o               -name 'run_crossspecies_pal_wal*'             \) -print0
          )
          copy_path scripts/update_manuscript_figure_calls.py

          while IFS= read -r -d '' p; do copy_path "$p"; done < <(
            find tests -maxdepth 1 -type f \(               -name 'test_polymorphism*' -o               -name 'test_make_polymorphism_manuscript_figures.py'             \) -print0
          )

          while IFS= read -r -d '' p; do copy_path "$p"; done < <(
            find .github/workflows -maxdepth 1 -type f \(               -name '*polymorphism*' -o               -name 'white-environment*' -o               -name 'legacy-white-bio5*' -o               -name '*worldclim*' -o               -name 'freeze-fcp-expiring-artifacts-20260925.yml'             \) -print0
          )

      - name: Recover immutable measured tables and frozen spatial receipts
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"
          mkdir -p "$stage/raw_inputs/legacy" "$stage/raw_inputs/third_cohort" "$stage/historical/spatial"

          git fetch --no-tags --depth=1 origin "$LEGACY_SHA"
          git show "$LEGACY_SHA:data/derived/global_monte_carlo_measured_photos_v1.csv" > "$stage/raw_inputs/legacy/global_monte_carlo_measured_photos_v1.csv"
          git show "$LEGACY_SHA:data/derived/rgfca_reserve_replication_measured_photos_v1.csv" > "$stage/raw_inputs/legacy/rgfca_reserve_replication_measured_photos_v1.csv"
          echo 'ee854126eed2cfe23e333abe2c28d14df24895a5c52cbc389c060a5a4d6f91f4  '"$stage"'/raw_inputs/legacy/global_monte_carlo_measured_photos_v1.csv' | sha256sum -c -
          echo '0e2ed349122739eecfc725fb2d5e313d284cf30752da91f9a0429cff0eeaa5e6  '"$stage"'/raw_inputs/legacy/rgfca_reserve_replication_measured_photos_v1.csv' | sha256sum -c -

          git fetch --no-tags --depth=1 origin "$THIRD_SHA"
          git show "$THIRD_SHA:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv" > "$stage/raw_inputs/third_cohort/polymorphism_h2_third_cohort_measured_photos_v1.csv"
          git show "$THIRD_SHA:data/derived/polymorphism_h2_third_cohort_measurement_species_support_v1.csv" > "$stage/raw_inputs/third_cohort/polymorphism_h2_third_cohort_measurement_species_support_v1.csv"
          echo '57630fc9f281bce94a0c40a70aaf7bce879dde93d6154175adcd021e8f5c1186  '"$stage"'/raw_inputs/third_cohort/polymorphism_h2_third_cohort_measured_photos_v1.csv' | sha256sum -c -

          git fetch --no-tags --depth=1 origin "$SPATIAL_SHA"
          git show "$SPATIAL_SHA:results/polymorphism_measurement_missingness_step8_analysis_20260910/result.json" > "$stage/historical/spatial/polymorphism_measurement_missingness_step8_result.json"
          git show "$SPATIAL_SHA:results/polymorphism_ambiguity_bounds_step9_20260910/result.json" > "$stage/historical/spatial/polymorphism_ambiguity_bounds_step9_result.json"
          git show "$SPATIAL_SHA:paper/polymorphism_v0_1/paper_numbers.json" > "$stage/historical/spatial/paper_numbers.json"
          test "$(git hash-object "$stage/historical/spatial/polymorphism_measurement_missingness_step8_result.json")" = "d9e8f741a3db1621463b857710b1e91e2af52c99"
          test "$(git hash-object "$stage/historical/spatial/polymorphism_ambiguity_bounds_step9_result.json")" = "3e92d8798f17a60900ac3bba8deb76b062a609f1"
          test "$(git hash-object "$stage/historical/spatial/paper_numbers.json")" = "b5fec72fb1f8299fb430b8bcdbaf106ee38d8672"

      - name: Recover opportunity frame and prospective-confirmation exclusion inputs
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"
          mkdir -p \
            "$stage/raw_inputs/opportunity_frame" \
            "$stage/raw_inputs/third_cohort/exclusion" \
            "$stage/raw_inputs/third_cohort/selection"

          git fetch --no-tags --depth=1 origin "$THIRD_SHA"

          git show "$THIRD_SHA:data/frozen/global_monte_carlo_species_discovery_combined_v2_species_v1.csv" \
            > "$stage/raw_inputs/opportunity_frame/global_monte_carlo_species_discovery_combined_v2_species_v1.csv"
          echo '5d871bd1f1190c68fd513bb527e6c93de1606dc35ff8cfff5f6187850dc382cc  '"$stage"'/raw_inputs/opportunity_frame/global_monte_carlo_species_discovery_combined_v2_species_v1.csv' | sha256sum -c -

          git show "$THIRD_SHA:data/frozen/random_photo_first_h9_exclusion_ledger_v1.csv" \
            > "$stage/raw_inputs/third_cohort/exclusion/random_photo_first_h9_exclusion_ledger_v1.csv"
          echo 'f9a6894740e9974399c055f92cba237be8ada41707d84e1807ba61b902c91b99  '"$stage"'/raw_inputs/third_cohort/exclusion/random_photo_first_h9_exclusion_ledger_v1.csv' | sha256sum -c -

          git show "$THIRD_SHA:data/frozen/random_photo_first_h9_fresh_metadata_v1.csv" \
            > "$stage/raw_inputs/third_cohort/exclusion/random_photo_first_h9_fresh_metadata_v1.csv"
          echo '111d0f964618c0c3df749a6e4bd29f834214cda5d7a2d9bda7d43cdc9dbf4c6f  '"$stage"'/raw_inputs/third_cohort/exclusion/random_photo_first_h9_fresh_metadata_v1.csv' | sha256sum -c -

          git show "$THIRD_SHA:results/rgfca_42111_breadth_measurement_step8f_20260911/rgfca_42111_species_breadth_measured.csv.gz" \
            > "$stage/raw_inputs/third_cohort/exclusion/rgfca_42111_species_breadth_measured.csv.gz"
          echo '38aa42123b4e9b05753020ff1a3b050f4d14dbd3de3194557ead90b75c0cc605  '"$stage"'/raw_inputs/third_cohort/exclusion/rgfca_42111_species_breadth_measured.csv.gz' | sha256sum -c -

          git show "$THIRD_SHA:data/frozen/polymorphism_h2_p500_candidate_metadata_v1.csv.gz" \
            > "$stage/raw_inputs/third_cohort/exclusion/polymorphism_h2_p500_candidate_metadata_v1.csv.gz"
          echo 'a2339a3eba7bec8c29e726edc8c71a64a1a98b5cad4367764f7466c436e9f595  '"$stage"'/raw_inputs/third_cohort/exclusion/polymorphism_h2_p500_candidate_metadata_v1.csv.gz' | sha256sum -c -

          git show "$THIRD_SHA:results/polymorphism_h2_third_cohort_selection_20260916/selected_species_manifest.tsv" \
            > "$stage/raw_inputs/third_cohort/selection/selected_species_manifest.tsv"
          echo '16db6a2fc265f0ab20e7dae4e6f9058b907f5c19af3ddab5b6077797dd1def59  '"$stage"'/raw_inputs/third_cohort/selection/selected_species_manifest.tsv' | sha256sum -c -

          git show "$THIRD_SHA:data/frozen/polymorphism_h2_third_cohort_candidate_metadata_v1.csv.gz" \
            > "$stage/raw_inputs/third_cohort/selection/polymorphism_h2_third_cohort_candidate_metadata_v1.csv.gz"
          echo 'adec40e29e347b035872f2add95b67011906cb74e28510e6260ed1edbd075711  '"$stage"'/raw_inputs/third_cohort/selection/polymorphism_h2_third_cohort_candidate_metadata_v1.csv.gz' | sha256sum -c -

          git show "$THIRD_SHA:results/polymorphism_h2_third_cohort_candidate_metadata_20260916/result.json" \
            > "$stage/raw_inputs/third_cohort/selection/candidate_metadata_result.json"
          git show "$THIRD_SHA:results/polymorphism_h2_third_cohort_candidate_metadata_20260916/species_audit.csv" \
            > "$stage/raw_inputs/third_cohort/selection/species_audit.csv"
          echo 'c6ab0634adc0c4fa9f726322af24994f880ca19ddc2c6d79be740f2ddf0ab339  '"$stage"'/raw_inputs/third_cohort/selection/species_audit.csv' | sha256sum -c -

      - name: Recover exact frozen execution code
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"
          root="$stage/historical_code"
          mkdir -p "$root"

          copy_from_git() {
            local sha="$1"
            local rel="$2"
            local group="$3"
            local dest="$root/$group/$rel"
            mkdir -p "$(dirname "$dest")"
            git show "$sha:$rel" > "$dest"
          }

          git fetch --no-tags --depth=1 origin "$LEGACY_SHA"
          for rel in \
            scripts/analysis/run_polymorphism_h1_observer_disjoint_reliability_20260913.py \
            scripts/analysis/run_polymorphism_delta_geometry_validation_20260912.py \
            scripts/analysis/run_polymorphism_delta_geometry_structured_null_20260912.py \
            scripts/analysis/run_polymorphism_white_axis_targeted_test_20260912.py \
            .github/workflows/polymorphism-h1-observer-disjoint-reliability.yml \
            .github/workflows/polymorphism-h2-white-axis-targeted.yml; do
            copy_from_git "$LEGACY_SHA" "$rel" legacy
          done

          git fetch --no-tags --depth=1 origin "$THIRD_SHA"
          for rel in \
            scripts/analysis/run_polymorphism_h1_observer_disjoint_D_reliability_20260913.py \
            scripts/analysis/run_polymorphism_h2_third_cohort_prospective_white_axis_20260917.py \
            scripts/analysis/build_polymorphism_h2_third_cohort_frame_20260916.py \
            scripts/acquisition/run_polymorphism_h2_third_cohort_candidate_metadata_20260916.py \
            scripts/analysis/materialize_random_photo_first_h9_measurement_infrastructure.sh \
            fcp_pipeline/third_cohort_prospective_execution_gate.py \
            .github/workflows/h2-third-cohort-prospective-measurement.yml; do
            copy_from_git "$THIRD_SHA" "$rel" prospective_h2
          done

          git fetch --no-tags --depth=1 origin "$MEASUREMENT_SHA"
          for rel in \
            fcp_pipeline/flower_roi_v4.py \
            fcp_pipeline/flower_roi_v4_runtime.py \
            fcp_pipeline/photo_first_measurement.py \
            fcp_pipeline/photo_first_measurement_execution.py \
            scripts/acquisition/acquire_random_photo_first_measurement_partition.py \
            scripts/analysis/measure_random_photo_first_blind_partition.py \
            scripts/analysis/seal_random_photo_first_measurement_partition.py \
            docs/supporting/random_photo_first_measurement_contract_v1.json \
            docs/supporting/random_photo_first_measurement_execution_v1.json \
            docs/supporting/jbi_atlas_roi_estimator_contract_v4.json \
            data/atlas/qualification/roi_v4_locked_test/jrc_roi_v4_locked_test_result.json \
            data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt \
            requirements-atlas-roi-v4.txt; do
            copy_from_git "$MEASUREMENT_SHA" "$rel" measurement_machine
          done

          git fetch --no-tags --depth=1 origin "$SPATIAL_SHA"
          for rel in \
            scripts/analysis/run_polymorphism_measurement_missingness_step8_analysis_20260910.py \
            scripts/analysis/run_polymorphism_ambiguity_bounds_step9_20260910.py \
            scripts/analysis/run_polymorphism_spatial_span_adjusted_null_step6b_20260910.py; do
            copy_from_git "$SPATIAL_SHA" "$rel" spatial
          done

          git fetch --no-tags --depth=1 origin "$H3A_SHA"
          copy_from_git "$H3A_SHA" scripts/analysis/run_polymorphism_h3a_phylogenetic_signal_20260912.R h3a

          git fetch --no-tags --depth=1 origin "$H3B_SHA"
          copy_from_git "$H3B_SHA" scripts/analysis/run_polymorphism_h3b_reserve_span_20260912.R h3b

          cat > "$root/README.md" <<EOF
          # Historical execution-code snapshot

          These files are copied byte-for-byte from the immutable commits that generated or defined
          the paper's headline H1/H2/spatial/H3 analyses.

          legacy_source_commit=$LEGACY_SHA
          prospective_h2_source_commit=$THIRD_SHA
          measurement_machine_source_commit=$MEASUREMENT_SHA
          spatial_source_commit=$SPATIAL_SHA
          h3a_source_commit=$H3A_SHA
          h3b_source_commit=$H3B_SHA

          The image-measurement code, contracts and trained ROI-v4 detector are preserved here.
          The exact EfficientSAM ONNX files are mirrored separately under external/measurement_runtime
          and checksum-verified. Frozen source-photo metadata are preserved under
          raw_inputs/third_cohort/source_metadata. The paper's numerical analyses are reproducible
          from the frozen measured tables without reacquiring image pixels.
          EOF

      - name: Recover prior high-depth exclusion inputs and reconstruct 3,230-species frame
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fcp_np_provenance"
          parent="$stage/raw_inputs/third_cohort/parent_u100_selection"
          candidate="$stage/raw_inputs/third_cohort/candidate_frame"
