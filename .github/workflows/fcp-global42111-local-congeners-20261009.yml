name: FCP 42111 local-congener climate/moisture after genus-cell composition control

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-withingenus-abiotic-20261009
    paths:
      - scripts/analysis/audit_fcp_global42111_local_congeners_20261009.py
      - tests/test_fcp_global42111_local_congeners_20261009.py
      - docs/FCP_GLOBAL42111_LOCAL_CONGENERS_20261009.md
      - .github/workflows/fcp-global42111-local-congeners-20261009.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fcp42111-local-congeners-photo-source-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN: '37861582446'
  SOURCE_ARTIFACT: 'fcp-global42111-original-photo-real-site-climate-soil-20261009'

jobs:
  local-congeneric-ecological-scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Test source-photo genotype-independent and group-correct geometric model
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m py_compile scripts/analysis/audit_fcp_global42111_local_congeners_20261009.py
          python -m pytest tests/test_fcp_global42111_local_congeners_20261009.py -q
      - name: Recover original source-hashed 42111 photo ecology, not images or rasters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" --dir /tmp/fcp_local_genus_photo_source
          f="$(find /tmp/fcp_local_genus_photo_source -name breadth_flower_colour_climate_soil.csv.gz -print -quit)"
          test -s "$f"
          cp "$f" /tmp/fcp_local_42111_original_breadth.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          receipts=[]
          for p in Path('/tmp/fcp_local_genus_photo_source').rglob('result.json'):
              x=json.loads(p.read_text())
              if x.get('schema')=='fcp_global42111_original_photo_climate_soil_attachment_v1':
                  receipts.append(x)
          assert len(receipts)==1
          x=receipts[0]
          assert x['original_species_count']==42111
          assert x['original_taxon_cell_count']==85337
          assert x['n_unique_original_photo_IDs']==100543
          assert x['breadth_classifiable_by_covariate']['environment_climate_complete']==18413
          assert x['breadth_classifiable_by_covariate']['environment_all_complete']==14136
          assert x['new_colour_label_or_photo_pixel_opened'] is False
          assert x['geographic_cell_centroid_imputation'] is False
          PY
      - name: Quantify and analyze original different species from SAME genus AND SAME source geo-cell
        run: |
          python scripts/analysis/audit_fcp_global42111_local_congeners_20261009.py \
            --original-breadth-abiotic /tmp/fcp_local_42111_original_breadth.csv.gz \
            --outdir /tmp/fcp_original_local_congeners
      - name: Protect old original population, do not rescue sparse local congeners
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/fcp_original_local_congeners/result.json').read_text())
          assert d['schema']=='fcp_global42111_local_congeneric_photo_colour_environment_v1'
          assert d['original_42111_denominator']==42111
          assert d['original_photo_source_coverage']['source_classified_photo_taxa']==18457
          assert d['original_photo_source_coverage']['climate_eligible_classified_source_taxa']==18413
          assert d['original_photo_source_coverage']['soil_eligible_classified_source_taxa']==14136
          assert d['old_highdepth_and_prospective_taxa_unmodified'] is True
          assert d['no_new_original_photo_colour_or_raster_read'] is True
          for key,original_n in [('climate_only_local_congeners',18413),('soil_complete_local_congeners',14136)]:
              r=d[key]
              assert r['original_photo_support']['n_original_complete_photo_species']==original_n
              assert r['within_same_genus_and_same_source_162_cell_only'] is True
              assert r['photo_colour_never_used_for_group_selection'] is True
              assert r['one_photo_per_source_species'] is True
              assert r['geographic_cell_holdout_not_feasible_for_identical_local_group'] is True
              if r['status']=='SOURCE_LOCAL_GENUS_CELL_HELDOUT_PHOTO_SPECIES_ANALYSIS':
                  assert r['n_original_photo_species_evaluated']>=300
                  assert r['n_original_taxonomic_genera_evaluated']>=1
                  assert {int(v['source_test_photo_species']) for v in r['heldout_4class_photo_brier'].values()}=={r['n_original_photo_species_evaluated']}
                  assert all(len(v['original_cell_cluster_bootstrap_95CI'])==2 and
                             len(v['genus_cluster_bootstrap_95CI'])==2 and
                             len(v['local_genus_cell_cluster_bootstrap_95CI'])==2
                             for v in r['incremental_source_photo_prediction'].values())
              else:
                  assert r['status'].startswith('HOLD_INSUFFICIENT')
          print('LOCAL_CONGENERIC_ORIGINAL_42111_PHOTO_PRECISE_ENVIRONMENT_NO_CENTROID_SOURCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-42111-local-congeners-original-climate-20261009
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp_original_local_congeners/
      - name: Preserve original local-genus-cell source numerical result only
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = "analysis/fcp-global42111-local-congeners-20261009"
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          out=results/fcp_global42111_local_congeners_20261009
          mkdir -p "$out"
          cp /tmp/fcp_original_local_congeners/* "$out/"
          git add "$out"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Seal local genus-cell photographic rainfall gradient test on historical global FCP species'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
