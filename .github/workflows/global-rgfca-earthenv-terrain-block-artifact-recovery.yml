name: Global RGFCA terrain block artifact recovery

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "docs/supporting/global_rgfca_earthenv_terrain_block_artifact_recovery_authorization_v1.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: global-rgfca-terrain-block-artifact-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce artifact-only recovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/supporting/global_rgfca_earthenv_terrain_block_artifact_recovery_contract_v1.json').read_text())
          a=json.loads(Path('docs/supporting/global_rgfca_earthenv_terrain_block_artifact_recovery_authorization_v1.json').read_text())
          if c.get('status')!='artifact_only_recovery_frozen_after_completed_terrain_analysis_before_repo_result_commit': raise SystemExit('contract drift')
          if c.get('source_run_id')!=34017934825 or c.get('source_artifact_id')!=9984688398: raise SystemExit('artifact identity drift')
          if c.get('analysis_may_be_reexecuted') is not False or c.get('recovery_is_byte_copy_only') is not True: raise SystemExit('recovery policy drift')
          if a.get('status')!='authorize_exactly_one_artifact_only_recovery' or a.get('workflow_attempts_allowed')!=1: raise SystemExit('recovery authorization drift')
          PY
      - name: Download immutable completed artifact
        uses: actions/download-artifact@v4
        with:
          name: global-rgfca-earthenv-terrain-block-v1
          path: /tmp/terrain-recovery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/fcp
          run-id: 34017934825
      - name: Verify exact completed terrain bytes
        run: |
          set -euo pipefail
          echo "1b4b6877a60f7e8c0f395cf4a4ae967d2e02d04648753e17d28f57a476549849  /tmp/terrain-recovery/global_rgfca_earthenv_terrain_block_result_v1.json" | sha256sum -c -
          echo "3320ffb72f68b9c2a9d0e95505143c332a2e6bd32b7580ffba98277abc4b124e  /tmp/terrain-recovery/global_rgfca_earthenv_terrain_block_species_v1.csv" | sha256sum -c -
          echo "41cdb2c062c72edc1b770a407c245e9b5463efb6be9ba30c68fb04d1faf742a0  /tmp/terrain-recovery/global_rgfca_earthenv_terrain_block_null_v1.csv" | sha256sum -c -
      - name: Commit exact artifact bytes on latest branch
        env:
          TARGET_BRANCH: analysis/global-monte-carlo-barrier-atlas
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test ! -e docs/supporting/global_rgfca_earthenv_terrain_block_result_v1.json
          cp /tmp/terrain-recovery/global_rgfca_earthenv_terrain_block_result_v1.json docs/supporting/
          cp /tmp/terrain-recovery/global_rgfca_earthenv_terrain_block_species_v1.csv data/derived/
          cp /tmp/terrain-recovery/global_rgfca_earthenv_terrain_block_null_v1.csv data/derived/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporting/global_rgfca_earthenv_terrain_block_result_v1.json data/derived/global_rgfca_earthenv_terrain_block_species_v1.csv data/derived/global_rgfca_earthenv_terrain_block_null_v1.csv
          git commit -m "Recover exact EarthEnv terrain block artifact"
          git push origin HEAD:"$TARGET_BRANCH"
