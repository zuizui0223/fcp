name: Hypervolume real-climate identifiability diagnosis

on:
  push:
    branches: [analysis/hypervolume-geo-environment-identifiability]
    paths:
      - '.github/workflows/hypervolume-real-climate-identifiability-diagnostic.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: hypervolume-real-climate-identifiability-diagnostic-v1
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Recover checksum-verified geometry
        uses: actions/download-artifact@v4
        with:
          name: hypervolume-geometry-only-v1
          path: inputs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34041094467
      - name: Recover checksum-verified colour-blind real climate
        uses: actions/download-artifact@v4
        with:
          name: hypervolume-real-climate-only-v1
          path: climate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34081512316
      - name: Recover immutable parent qualification outputs
        uses: actions/download-artifact@v4
        with:
          name: hypervolume-real-climate-synthetic-qualification-full-v1
          path: parent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34082752756
      - name: Run frozen post-failure diagnostic tests
        run: python -m unittest discover -s tests -p test_hypervolume_real_climate_identifiability_diagnostic.py -v

  shards:
    needs: tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        block: [thermal_regime, water_balance, atmospheric_energy_dryness]
        start: [0, 25, 50, 75, 100, 125, 150, 175, 200, 225]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Recover checksum-verified geometry
        uses: actions/download-artifact@v4
        with:
          name: hypervolume-geometry-only-v1
          path: /tmp/geometry
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34041094467
      - name: Recover checksum-verified colour-blind real climate
        uses: actions/download-artifact@v4
        with:
          name: hypervolume-real-climate-only-v1
          path: /tmp/climate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34081512316
      - name: Recover immutable parent qualification outputs
        uses: actions/download-artifact@v4
        with:
          name: hypervolume-real-climate-synthetic-qualification-full-v1
          path: /tmp/parent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34082752756
      - name: Execute frozen diagnostic shard
        env:
          BLOCK: ${{ matrix.block }}
          START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          STOP=$((START + 25))
          python scripts/analysis/run_hypervolume_real_climate_identifiability_diagnostic.py \
            --geometry /tmp/geometry/geometry_only.csv \
            --climate /tmp/climate/real_climate_only.csv \
            --parent-scores /tmp/parent/scores.csv \
            --block "$BLOCK" --rep-start "$START" --rep-stop "$STOP" \
            --output "/tmp/out/${BLOCK}-${START}"
      - uses: actions/upload-artifact@v4
        with:
          name: hypervolume-real-climate-ident-diag-${{ matrix.block }}-${{ matrix.start }}
          path: /tmp/out/${{ matrix.block }}-${{ matrix.start }}/
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Download all thirty immutable diagnostic shards
        uses: actions/download-artifact@v4
        with:
          pattern: hypervolume-real-climate-ident-diag-*
          path: /tmp/shards
          merge-multiple: false
      - name: Recover immutable parent qualification outputs
        uses: actions/download-artifact@v4
        with:
          name: hypervolume-real-climate-synthetic-qualification-full-v1
          path: /tmp/parent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34082752756
      - name: Finalize and independently census diagnostic rows
        run: |
          python scripts/analysis/finalize_hypervolume_real_climate_identifiability_diagnostic.py \
            --shards /tmp/shards --parent-rates /tmp/parent/decision_rates.csv --output /tmp/final
      - name: Add CI guard and reader report
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          import pandas as pd
          p=Path('/tmp/final/result.json')
          r=json.loads(p.read_text())
          r['status']='complete_verified_post_failure_real_climate_identifiability_diagnostic'
          r['verification']['github_run_id']=int(os.environ['RUN_ID'])
          r['verification']['new_unit_tests_passed']=8
          p.write_text(json.dumps(r,indent=2)+'\n')
          s=pd.read_csv('/tmp/final/diagnostic_summary.csv')
          focus=s[(s.world=='climate_shared_shifted')&(s.threshold_sd==0.5)&(s.shared_fraction==1.0)]
          lines=[
            '# Why real-climate synthetic qualification failed', '',
            'Date: 2026-09-07 (Japan). **Post-failure synthetic diagnosis only; Stage 6 remains FAIL and observed flower colours remain closed.**', '',
            '## Answer first', '',
            'The diagnostic separates fixed-axis approximation from actual environmental leverage. The simulator true shared axis is privileged information and is never used for inference.', '',
            '| Block / amplitude | parent detect | vector coverage median | projection corr median | train threshold exposure | eval threshold exposure | train colour-variable | eval colour-variable | true-axis augmentation Δscore median | true-axis posterior mass median |',
            '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for _,row in focus.sort_values(['block','amplitude']).iterrows():
            lines.append(
              f"| {row['block']} / {row['amplitude']:g} | {100*row['parent_detection_rate']:.1f}% | "
              f"{row['true_axis_vector_coverage_median']:.3f} | {row['true_axis_projection_corr_mean_median']:.3f} | "
              f"{100*row['train_transition_exposure_median']:.1f}% | {100*row['evaluation_transition_exposure_median']:.1f}% | "
              f"{100*row['train_colour_variability_median']:.1f}% | {100*row['evaluation_colour_variability_median']:.1f}% | "
              f"{row['augmented_minus_parent_score_median']:.5f} | {row['privileged_true_axis_posterior_mass_median']:.3f} |"
            )
          lines += ['', '## Guardrails', '',
                    '- Parent Stage 6 remains failed; no diagnostic value can reclassify it.',
                    '- Every parent synthetic label and fold score is reconstructed from the frozen seed/schedule before a diagnostic row is accepted.',
                    '- The true-axis augmentation has no inferential threshold and is not a proposed empirical axis search.',
                    '- No observed flower-colour value is read and empirical climate inference remains closed.', '',
                    f"Workflow `{os.environ['RUN_ID']}` verified all 30 diagnostic shards and 3,000 parent-linked worlds."]
          Path('/tmp/final/HYPERVOLUME_REAL_CLIMATE_IDENTIFIABILITY_DIAGNOSTIC.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Stage compact diagnostic outputs
        run: |
          mkdir -p docs/supporting data/derived
          cp /tmp/final/result.json docs/supporting/hypervolume_real_climate_identifiability_diagnostic_result_v1.json
          cp /tmp/final/diagnostic_summary.csv data/derived/hypervolume_real_climate_identifiability_diagnostic_summary_v1.csv
          cp /tmp/final/diagnostic_associations.csv data/derived/hypervolume_real_climate_identifiability_diagnostic_associations_v1.csv
          cp /tmp/final/HYPERVOLUME_REAL_CLIMATE_IDENTIFIABILITY_DIAGNOSTIC.md docs/HYPERVOLUME_REAL_CLIMATE_IDENTIFIABILITY_DIAGNOSTIC.md
      - name: Commit verified diagnostic outputs only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/HYPERVOLUME_REAL_CLIMATE_IDENTIFIABILITY_DIAGNOSTIC.md \
            docs/supporting/hypervolume_real_climate_identifiability_diagnostic_result_v1.json \
            data/derived/hypervolume_real_climate_identifiability_diagnostic_summary_v1.csv \
            data/derived/hypervolume_real_climate_identifiability_diagnostic_associations_v1.csv
          git commit -m 'Record verified post-failure real-climate identifiability diagnosis'
          for attempt in 1 2 3 4; do
            git fetch origin analysis/hypervolume-geo-environment-identifiability
            git rebase origin/analysis/hypervolume-geo-environment-identifiability
            if git push origin HEAD:analysis/hypervolume-geo-environment-identifiability; then break; fi
            test "$attempt" -lt 4
            sleep $((attempt*2))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hypervolume-real-climate-identifiability-diagnostic-full-v1
          path: /tmp/final/
          if-no-files-found: error
          retention-days: 90
