name: Mangal node taxonomy support v0.1

on:
  pull_request:
    paths:
      - 'data/mangal_node_taxonomy_support_design_v0_1.json'
      - 'results/mangal_spatiotemporal_metadata_preflight_v0_1/result.json'
      - 'scripts/analysis/audit_mangal_node_taxonomy_support_v0_1.py'
      - '.github/workflows/mangal-node-taxonomy-support-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run node taxonomy support audit
        run: |
          mkdir -p build/mangal_node_taxonomy_support_v0_1
          python scripts/analysis/audit_mangal_node_taxonomy_support_v0_1.py \
            --out build/mangal_node_taxonomy_support_v0_1/result.json
      - name: Validate edge firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/mangal_node_taxonomy_support_v0_1/result.json'))
          assert x['allowed_endpoints_used']==['network','node']
          assert x['forbidden_endpoints_used']==[]
          assert x['taxon_identities_opened'] is True
          assert x['taxon_names_persisted'] is False
          assert x['interaction_edges_opened'] is False
          assert x['trait_values_opened'] is False
          assert x['environment_values_opened'] is False
          assert x['full_interaction_spatial_admission_authorized'] is False
          assert len(x['dataset_results'])==5
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mangal-node-taxonomy-support-v0-1
          path: build/mangal_node_taxonomy_support_v0_1/
