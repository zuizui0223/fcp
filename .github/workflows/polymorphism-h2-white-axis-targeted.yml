name: polymorphism-h2-white-axis-targeted

on:
  push:
    branches:
      - analysis/polymorphism-42111-h1-h2-gates-20260912
    paths:
      - "scripts/analysis/run_polymorphism_white_axis_targeted_test_20260912.py"
      - "docs/POLYMORPHISM_H2_WHITE_AXIS_TARGET_FREEZE_20260912.md"
      - ".github/workflows/polymorphism-h2-white-axis-targeted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-white-axis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy

      - name: Syntax check
        run: |
          python -m py_compile scripts/analysis/run_polymorphism_delta_geometry_validation_20260912.py
          python -m py_compile scripts/analysis/run_polymorphism_delta_geometry_structured_null_20260912.py
          python -m py_compile scripts/analysis/run_polymorphism_white_axis_targeted_test_20260912.py

      - name: Reconstruct frozen label-free H2 vectors
        run: python scripts/analysis/run_polymorphism_delta_geometry_validation_20260912.py

      - name: Test fixed achromatic/chromatic target
        run: python scripts/analysis/run_polymorphism_white_axis_targeted_test_20260912.py

      - name: Show result
        if: always()
        run: |
          test -f results/polymorphism_white_axis_targeted_test_20260912/result.json && cat results/polymorphism_white_axis_targeted_test_20260912/result.json || true

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymorphism-white-axis-targeted-20260912
          path: results/polymorphism_white_axis_targeted_test_20260912
          if-no-files-found: warn
