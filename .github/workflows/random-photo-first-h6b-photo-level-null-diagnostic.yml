name: Random photo-first H6b photo-level null diagnostic
# Registration-only retrigger; H6b contract, statistic, null, seed, and decision rule are unchanged.

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/random-photo-first-inference-execution
    paths:
      - "docs/supporting/random_photo_first_h6b_photo_level_null_diagnostic_contract_v1.json"
      - "scripts/analysis/run_random_photo_first_h6b_photo_level_null_diagnostic.py"
      - ".github/workflows/random-photo-first-h6b-photo-level-null-diagnostic.yml"

permissions:
  contents: write

concurrency:
  group: random-photo-first-h6b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h6b:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analysis runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate frozen diagnostic contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/supporting/random_photo_first_h6b_photo_level_null_diagnostic_contract_v1.json').read_text())
          h6 = json.loads(Path('docs/supporting/random_photo_first_h6_species_specific_spatial_structure_result_v1.json').read_text())
          assert c['status'] == 'diagnostic_frozen_after_h6_before_any_photo_level_null_retest'
          assert c['target']['expected_species'] == 188
          assert c['stricter_null']['permutations'] == 999
          assert c['stricter_null']['seed'] == 20260908
          assert c['stricter_null']['tail'] == 'upper'
          assert h6['decision'] == 'no_support_general_species_specific_spatial_structuring'
          target = next(x for x in h6['sensitivities'] if x['name'] == 'n5_cells3_morphs2')
          assert target['evaluable_species'] == 188
          assert target['p_upper'] == 0.001
          print('h6b_pretest_contract=pass')
          PY

      - name: Run photo-count-preserving H6b null diagnostic
        run: python scripts/analysis/run_random_photo_first_h6b_photo_level_null_diagnostic.py

      - name: Validate diagnostic claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('docs/supporting/random_photo_first_h6b_photo_level_null_diagnostic_result_v1.json').read_text())
          h6 = json.loads(Path('docs/supporting/random_photo_first_h6_species_specific_spatial_structure_result_v1.json').read_text())
          assert r['status'] == 'complete_h6b_diagnostic_evaluable'
          assert r['target_sparse_frame']['evaluable_species'] == 188
          assert 0.0 <= r['target_sparse_frame']['photo_level_null_p_upper'] <= 1.0
          assert all(x['can_rescue'] is False for x in r['diagnostic_sensitivities'])
          assert r['h6_primary_decision_unchanged'] == h6['decision']
          assert 'cannot convert that sensitivity' in r['claim_ceiling']
          print(json.dumps(r, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: random-photo-first-h6b-photo-level-null-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            docs/supporting/random_photo_first_h6b_photo_level_null_diagnostic_result_v1.json
            data/derived/random_photo_first_h6b_target_species_v1.csv
            data/derived/random_photo_first_h6b_photo_level_null_v1.csv

      - name: Commit H6b diagnostic outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporting/random_photo_first_h6b_photo_level_null_diagnostic_result_v1.json \
                  data/derived/random_photo_first_h6b_target_species_v1.csv \
                  data/derived/random_photo_first_h6b_photo_level_null_v1.csv
          if git diff --cached --quiet; then
            echo "h6b_outputs_already_committed=true"
            exit 0
          fi
          git commit -m "Run random photo-first H6b null diagnostic"
          git fetch origin analysis/random-photo-first-inference-execution
          git rebase origin/analysis/random-photo-first-inference-execution
          git push origin HEAD:analysis/random-photo-first-inference-execution
