name: FCP 4475 selection transport and gate decomposition audit
on:
  push:
    branches: [analysis/fcp-estimand-eligibility-unified-story-20261119]
    paths:
      - scripts/analysis/fcp4475_selection_transport_diagnostic_20261119.py
      - .github/workflows/fcp4475-selection-transport-diagnostic-20261119.yml
  pull_request:
    paths:
      - scripts/analysis/fcp4475_selection_transport_diagnostic_20261119.py
      - .github/workflows/fcp4475-selection-transport-diagnostic-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selection-gate-transport-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'scikit-learn==1.6.1'
      - name: Run and audit selection-gate decomposition, genus bootstrap and genus-heldout propensity
        run: |
          set -euo pipefail
          python -m py_compile scripts/analysis/fcp4475_selection_transport_diagnostic_20261119.py
          python scripts/analysis/fcp4475_selection_transport_diagnostic_20261119.py \
            --out-dir /tmp/fcp4475-selection-transport | tee /tmp/fcp4475-selection-transport-run.log
          test -s /tmp/fcp4475-selection-transport/fcp4475_selection_transport_diagnostic_20261119.json
          test -s /tmp/fcp4475-selection-transport/fcp4475_selection_transport_species_20261119.csv
      - name: Upload per-species and quantitative audit
        uses: actions/upload-artifact@v4
        with:
          name: fcp4475-gate-selection-transport-20261119
          path: |
            /tmp/fcp4475-selection-transport/
            /tmp/fcp4475-selection-transport-run.log
          retention-days: 90
          if-no-files-found: error
