name: JBI automated-colour locked pilot

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/JBI_INATURALIST_AUTOMATED_COLOUR_STATE_PROTOCOL.md"
      - "docs/JBI_INATURALIST_AUTOMATED_COLOUR_PILOT_*.md"
      - "docs/JBI_IMAGE_FIRST_ATLAS_*.md"
      - "docs/supporting/jbi_inaturalist_automated_colour_*"
      - "docs/supporting/jbi_inaturalist_automated_colour_spatial_v2/**"
      - "docs/figures/jbi_inaturalist_automated_colour_pilot_*"
      - "scripts/data/*inaturalist*colour*"
      - "scripts/analysis/make_jbi_inaturalist_automated_colour_pilot_figures.py"
      - "tests/test_inaturalist_*colour*"
      - "requirements-inaturalist-auto-colour-analysis.txt"
      - ".github/workflows/jbi-inaturalist-automated-colour-pilot.yml"
  pull_request:
    paths:
      - "docs/JBI_INATURALIST_AUTOMATED_COLOUR_STATE_PROTOCOL.md"
      - "docs/JBI_INATURALIST_AUTOMATED_COLOUR_PILOT_*.md"
      - "docs/JBI_IMAGE_FIRST_ATLAS_*.md"
      - "docs/supporting/jbi_inaturalist_automated_colour_*"
      - "docs/supporting/jbi_inaturalist_automated_colour_spatial_v2/**"
      - "docs/figures/jbi_inaturalist_automated_colour_pilot_*"
      - "scripts/data/*inaturalist*colour*"
      - "scripts/analysis/make_jbi_inaturalist_automated_colour_pilot_figures.py"
      - "tests/test_inaturalist_*colour*"
      - "requirements-inaturalist-auto-colour-analysis.txt"
      - ".github/workflows/jbi-inaturalist-automated-colour-pilot.yml"

concurrency:
  group: jbi-automated-colour-locked-pilot-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-inaturalist-auto-colour-analysis.txt
      - name: Run automated-colour contract tests
        run: >-
          python -m pytest -q
          tests/test_inaturalist_automated_colour_states.py
          tests/test_inaturalist_automated_colour_cache_audit.py
          tests/test_inaturalist_automated_colour_development_gate.py
          tests/test_inaturalist_locked_image_packet.py
          tests/test_inaturalist_locked_colour_finalizer.py
          tests/test_inaturalist_locked_analysis_export.py
          tests/test_inaturalist_automated_colour_spatial_marks.py
          tests/test_inaturalist_spatial_variogram_comparison.py
          tests/test_inaturalist_automated_colour_pilot_figures.py
          tests/test_inaturalist_automated_colour_plan_manifest.py
          tests/test_inaturalist_photo_development_sample.py
          tests/test_inaturalist_development_review_packet.py
          tests/test_inaturalist_development_review_packet_validator.py
      - name: Validate committed publishable bundle
        run: python scripts/data/validate_inaturalist_automated_colour_pilot_bundle.py
      - name: Recompute locked 9,999-permutation analysis
        run: |
          mkdir -p /tmp/fcp-locked-rerun
          python scripts/data/run_inaturalist_automated_colour_spatial_marks.py \
            --development-gate docs/supporting/jbi_inaturalist_automated_colour_development_gate_v2.json \
            --locked-table docs/supporting/jbi_inaturalist_automated_colour_locked_analysis_input_v2.csv \
            --output-dir /tmp/fcp-locked-rerun \
            --public-manifest /tmp/fcp-locked-rerun/manifest.json
          cmp docs/supporting/jbi_inaturalist_automated_colour_spatial_v2/species_spatial_mark_results.csv /tmp/fcp-locked-rerun/species_spatial_mark_results.csv
          python scripts/data/compare_inaturalist_spatial_variograms.py \
            docs/supporting/jbi_inaturalist_automated_colour_spatial_v2/descriptive_equal_pair_variogram.csv \
            /tmp/fcp-locked-rerun/descriptive_equal_pair_variogram.csv \
            --absolute-tolerance 1e-10
      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: jbi-automated-colour-locked-pilot-rerun
          path: /tmp/fcp-locked-rerun
