name: FCP original direct LCVP tip selection and climate-colour representativeness

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-phylogeny-coverage-20261010
    paths:
      - scripts/analysis/audit_fcp_global42111_LCVP_direct_tip_selection_bias_20261010.py
      - tests/test_fcp_global42111_LCVP_direct_tip_selection_bias_20261010.py
      - docs/FCP_GLOBAL42111_DIRECT_LCVP_TIP_SELECTION_BIAS_20261010.md
      - .github/workflows/fcp-global42111-LCVP-tip-selection-bias-20261010.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: fcp42111-original-source-LCVP-tip-representativeness-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN: '37861582446'
  SOURCE_ARTIFACT: 'fcp-global42111-original-photo-real-site-climate-soil-20261009'
  ORIGINAL_TREE: 'results/fcp_global42111_original_local_LCVP_backbone_20261010'

jobs:
  direct-dated-tree-original-taxonomy-sampling-bias:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Test exact source species and direct-tip sampling imbalance metrics
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m py_compile scripts/analysis/audit_fcp_global42111_LCVP_direct_tip_selection_bias_20261010.py
          python -m pytest tests/test_fcp_global42111_LCVP_direct_tip_selection_bias_20261010.py -q
          python scripts/analysis/audit_fcp_global42111_LCVP_direct_tip_selection_bias_20261010.py --help > /dev/null
      - name: Recover exact original phylogeny original-source inclusion flags
        run: |
          test -s "$ORIGINAL_TREE/result.json"
          test -s "$ORIGINAL_TREE/original_local_1761_LCVP_direct_tip_ledger.csv"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/fcp_global42111_original_local_LCVP_backbone_20261010/result.json').read_text())
          assert r['schema']=='fcp_global42111_local_congener_LCVP_direct_backbone_coverage_v1'
          assert r['cohorts']['km250']['n_exact_direct_lcvp_tip_species']==342
          assert r['cohorts']['km500']['n_exact_direct_lcvp_tip_species']==649
          assert r['decision']=='HOLD_DIRECT_LCVP_SUBGENUS_COVERAGE_FOR_FULL_250_500'
          assert r['source_taxon_colour_labels_read'] is False
          PY
      - name: Retrieve original single photographed flower-colour and six photo-location climate covariates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" --dir /tmp/fcp_tip_selection_original
          src="$(find /tmp/fcp_tip_selection_original -name breadth_flower_colour_climate_soil.csv.gz -print -quit)"
          test -s "$src"
          cp "$src" /tmp/fcp_tip_selection_orig42111.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          reports=[]
          for p in Path('/tmp/fcp_tip_selection_original').rglob('result.json'):
              d=json.loads(p.read_text())
              if d.get('schema')=='fcp_global42111_original_photo_climate_soil_attachment_v1':reports.append(d)
          assert len(reports)==1
          d=reports[0]
          assert d['original_species_count']==42111
          assert d['breadth_classifiable_by_covariate']['environment_climate_complete']==18413
          assert d['new_colour_label_or_photo_pixel_opened'] is False
          PY
      - name: Audit original source direct-tree versus missing-tree taxon photo colour and site climate selection
        run: |
          python scripts/analysis/audit_fcp_global42111_LCVP_direct_tip_selection_bias_20261010.py \
            --original-breadth-abiotic /tmp/fcp_tip_selection_orig42111.csv.gz \
            --original-LCVP-tip-ledger "$ORIGINAL_TREE/original_local_1761_LCVP_direct_tip_ledger.csv" \
            --outdir /tmp/fcp_tip_selection_receipt
      - name: Enforce original 42111 source denom, 872 and 1761 nested cohorts, truthful selection status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/fcp_tip_selection_receipt/result.json').read_text())
          assert x['schema']=='fcp_global42111_original_LCVP_tip_selection_covariate_bias_v1'
          assert x['source_global_original_photo_species']==42111
          assert x['source_global_original_classified_photo_species']==18457
          assert x['source_full_original_250_and_500_cohort_phylo_control_HOLD'] is True
          assert x['no_new_flower_photo_pixels_classifications_or_environment_lookups'] is True
          assert x['original_tree_graft_species_not_treated_as_direct_tip'] is True
          for cap,source,direct in [('250',872,342),('500',1761,649)]:
              a=x['cohorts'][cap]
              assert a['n_original_source_photo_species']==source
              assert a['n_direct_original_LCVP_tip_species']==direct
              assert a['n_not_direct_original_LCVP_tip_species']==source-direct
              assert a['direct_backbone_tip_selection_did_not_use_original_photo_colour_results']
              assert set(a['original_photo_site_environment_standardized_difference_direct_minus_untipped'])=={
                  'abs_latitude','wc_elevation_m','wc_bio1','wc_bio5','wc_bio12','wc_bio15'}
              assert sum(a['direct_tip_strata']['DIRECT_LCVP']['source_photo_four_colour_counts'].values())==direct
              assert sum(a['direct_tip_strata']['NOT_DIRECT_LCVP']['source_photo_four_colour_counts'].values())==source-direct
          print('ORIGINAL_DATED_LCVP_DIRECT_TIP_SOURCE_CLIMATE_COLOUR_REPRESENTATIVENESS_CHECKED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-global42111-original-direct-LCVP-tip-selection-bias-20261010
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp_tip_selection_receipt/
      - name: Commit exact source bias receipt without original H1/H2 modifications
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = 'analysis/fcp-global42111-phylo-photo-env-20261010'
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          p=results/fcp_global42111_LCVP_direct_tip_selection_bias_20261010
          mkdir -p "$p"
          cp /tmp/fcp_tip_selection_receipt/* "$p/"
          git add "$p"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Seal direct LCVP backbone missing-tip source photo colour and climatic selection bias'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
