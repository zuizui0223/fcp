name: FCP 4475 original-photo shared thermal and moisture hue directions
on:
  pull_request:
    paths:
      - scripts/analysis/fcp4475_shared_thermal_moisture_photo_hues_20261024.py
      - .github/workflows/fcp-4475-shared-thermal-moisture-photo-hues-20261024.yml
      - docs/FCP_SHARED_THERMAL_MOISTURE_PHOTO_HUES_20261024.md
      - docs/FCP_SHARED_THERMAL_MOISTURE_RESULTS_20261024.md
      - results/fcp4475_shared_thermal_moisture_photo_hues_verified_20261024.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  synthetic-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Verify 7 to 5 climate-group transformation and independent conditional thermal signal
        run: |
          python -m py_compile scripts/analysis/fcp4475_shared_thermal_moisture_photo_hues_20261024.py
          OPENBLAS_NUM_THREADS=1 python scripts/analysis/fcp4475_shared_thermal_moisture_photo_hues_20261024.py --self-test
  authentic-source-five-climate-domains:
    needs: synthetic-geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      PHOTO_SHA: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      CLIMATE_TAG: fcp-worldclim-2.1-10m-20260925
      BIO_SHA: 00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf
      SRAD_SHA: c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Authenticate original 447500 image-colour rows and worldclim original BIO/solar release bytes
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-shared/{release,measured,climate,out}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_FILE" --dir /tmp/fcp-shared/release
          echo "$SOURCE_ARCHIVE_SHA  /tmp/fcp-shared/release/$SOURCE_FILE" | sha256sum -c -
          tar -xzf /tmp/fcp-shared/release/$SOURCE_FILE -C /tmp/fcp-shared \
            measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$PHOTO_SHA  /tmp/fcp-shared/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
          gh release download "$CLIMATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern wc2.1_10m_bio.zip --pattern wc2.1_10m_srad.zip \
            --dir /tmp/fcp-shared/climate
          echo "$BIO_SHA  /tmp/fcp-shared/climate/wc2.1_10m_bio.zip" | sha256sum -c -
          echo "$SRAD_SHA  /tmp/fcp-shared/climate/wc2.1_10m_srad.zip" | sha256sum -c -
      - name: Refit the 447500-photo shared thermal/moisture environment directions for 4475 original taxa
        run: |
          set -euo pipefail
          python scripts/analysis/fcp4475_shared_thermal_moisture_photo_hues_20261024.py \
            --photos /tmp/fcp-shared/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --worldclim-bio /tmp/fcp-shared/climate/wc2.1_10m_bio.zip \
            --worldclim-srad /tmp/fcp-shared/climate/wc2.1_10m_srad.zip \
            --out /tmp/fcp-shared/out
          python - <<'PY'
          import json,numpy as np,pandas as pd
          from pathlib import Path
          p=Path('/tmp/fcp-shared/out')
          data=json.loads((p/'shared_thermal_moisture_nine_hue_source_result.json').read_text())
          assert (data['original_photos'],data['original_species'],
                  data['source_classifiable_photos'])==(447500,4475,227107)
          assert len(data['fixed_five_climate_domains'])==5
          assert set(data['results'])=={'original','observer_thinned'}
          for panel,block in data['results'].items():
              assert block['n_original_taxa_in_source']==4475
              assert len(block['five_source_photo_cohorts'])==5
              assert set(block['components'])=={
                  'total','between_original_photo_labels','within_original_photo_labels'}
              df=pd.read_csv(p/f'fcp4475_{panel}_thermal_moisture_support.csv')
              assert len(df)==4475 and df.inat_taxon_id.is_unique
              assert df.n_original_classifiable.sum()==227107
              with np.load(p/f'fcp4475_{panel}_thermal_moisture_nine_hue_coefficients.npz') as v:
                  assert v['conditional_slope'].shape==(4475,5,3,9)
                  assert v['signed_photo_climate_covariance'].shape==(4475,5,3,9)
                  assert np.array_equal(v['inat_taxon_id'],df.inat_taxon_id)
              for dom in ('thermal_level','precip_amount'):
                  out=block['components']['total']['per_domain'][dom]
                  assert 0<=out['n_species']<=4475
                  if out['n_species']:
                      hues=[c['mean'] for c in out['full_nine_source_photo_palette'].values()]
                      assert abs(sum(hues))<1e-8
          print('FCP4475_SHARED_THERMAL_MOISTURE_SOURCE_VERIFIED_PASS')
          print('FCP4475_SHARED_THERMAL_MOISTURE_RECEIPT_FULL_JSON',json.dumps(data,sort_keys=True,separators=(',',':'),allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp4475-shared-thermal-moisture-source-photo-hues-20261024
          path: /tmp/fcp-shared/out/
          retention-days: 90
