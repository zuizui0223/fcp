name: Moricandia temperature dose preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/analysis/preflight_moricandia_temperature_dose_20260925.py
      - .github/workflows/moricandia-temperature-dose-20260925.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl
      - name: Download published Source Data
        run: |
          mkdir -p /tmp/moricandia
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-020-17875-1/MediaObjects/41467_2020_17875_MOESM11_ESM.xlsx' \
            -o /tmp/moricandia/source_data.xlsx
          test -s /tmp/moricandia/source_data.xlsx
      - name: Inspect Figure 3F-J source-data schema
        run: |
          rm -rf results/polymorphism_moricandia_temperature_dose_preflight_20260925
          python scripts/analysis/preflight_moricandia_temperature_dose_20260925.py \
            --source-data /tmp/moricandia/source_data.xlsx \
            --outdir results/polymorphism_moricandia_temperature_dose_preflight_20260925
      - uses: actions/upload-artifact@v4
        with:
          name: moricandia-temperature-dose-preflight-v1
          if-no-files-found: error
          retention-days: 90
          path: results/polymorphism_moricandia_temperature_dose_preflight_20260925
