name: FCP New Phytologist 4475 species observer reliability and BIO5 Firth
on:
  push:
    branches: [analysis/fcp-np-all4475-unified-20261021]
    paths:
      - scripts/analysis/fcp_all4475_observer_D_and_BIO5_Firth_20261021.py
      - .github/workflows/fcp-full4475-observer-BIO5-firth-20261021.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  all4475-observer-Firth:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      CLIMATE_TAG: fcp-worldclim-2.1-10m-20260925
      CLIMATE_FILE: wc2.1_10m_bio.zip
      CLIMATE_SHA: 00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-compatible Firth dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 Pillow==11.0.0 scipy==1.15.2
      - name: Fit original Firth synthetic fixture before opening biology
        run: |
          python -m py_compile scripts/analysis/fcp_all4475_observer_D_and_BIO5_Firth_20261021.py
          python scripts/analysis/fcp_all4475_observer_D_and_BIO5_Firth_20261021.py --self-test
      - name: Authenticate original photographs and source WorldClim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-all4475-BIO5/{archive,measured,climate,results}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_FILE" --dir /tmp/fcp-all4475-BIO5/archive
          echo "$SOURCE_ARCHIVE_SHA  /tmp/fcp-all4475-BIO5/archive/$SOURCE_FILE" | sha256sum -c -
          tar -xzf "/tmp/fcp-all4475-BIO5/archive/$SOURCE_FILE" -C /tmp/fcp-all4475-BIO5/measured
          gh release download "$CLIMATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$CLIMATE_FILE" --dir /tmp/fcp-all4475-BIO5/climate
          echo "$CLIMATE_SHA  /tmp/fcp-all4475-BIO5/climate/$CLIMATE_FILE" | sha256sum -c -
      - name: Refit all 4475 species with explicit Firth and observer split missingness
        shell: bash
        run: |
          set -euo pipefail
          export OPENBLAS_NUM_THREADS=1
          python scripts/analysis/fcp_all4475_observer_D_and_BIO5_Firth_20261021.py \
            --photos /tmp/fcp-all4475-BIO5/measured/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --worldclim-zip /tmp/fcp-all4475-BIO5/climate/wc2.1_10m_bio.zip \
            --out /tmp/fcp-all4475-BIO5/results
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path('/tmp/fcp-all4475-BIO5/results')
          r=json.loads((root/'all4475_observer_D_and_Firth_BIO5_result.json').read_text())
          df=pd.read_csv(root/'all4475_species_observer_BIO5_Firth_NO_COORDINATES.csv')
          assert len(df)==4475 and df.inat_taxon_id.nunique()==4475
          assert df.n_classified_photo.sum()==227107
          assert r['complete_source_447500_photos']
          assert r['no_colour_morph_genetic_alleles_measured']
          print('FCP_ALL4475_FIRTH_OBSERVER_INFERENCE_BOUNDARIES_PASS')
          print('FCP_ALL4475_FIRTH_OBSERVER_FINAL_JSON',json.dumps(r,sort_keys=True,separators=(',',':'),allow_nan=False))
          PY
      - name: Upload original 4475-species Firth and observer audit without coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcp-original4475-observer-BIO5-Firth-complete-source-20261021
          path: /tmp/fcp-all4475-BIO5/results/
          if-no-files-found: warn
          retention-days: 90
