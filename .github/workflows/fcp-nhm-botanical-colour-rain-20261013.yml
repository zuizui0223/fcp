name: FCP independently described botanical flower colour x rainfall

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/analysis/audit_independent_nhm_colour_rain_20261013.py
      - tests/test_independent_nhm_20261013.py
      - docs/FCP_NHM_INDEPENDENT_BOTANICAL_COLOUR_PROTOCOL_20261013.md
      - .github/workflows/fcp-nhm-botanical-colour-rain-20261013.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: fcp-independent-nhm-colour-${{ github.ref }}
  cancel-in-progress: true

env:
  ORIGINAL_SOURCE_ARTIFACT_ID: "11587115220"
  ORIGINAL_SOURCE_SHA256: "2d6097ba1b0434632e13bbe79dd78180608a287ff5dabebc770b5c0a2cfb52a0"
  NHM_SOURCE_GIT_BLOB_SHA1: "e1cfd2d5c518c2061ec91d1a9e8b64fc7ca69389"
  NHM_SOURCE_BYTES: "17279412"
  NHM_SOURCE_URL: "https://raw.githubusercontent.com/NaturalHistoryMuseum/plant-traits/4843c22bb2fc91018d9828dcddebf067c83b1097/output/raw/ocr-traits/combined.csv"
  OPENBLAS_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  read-independent-botanical-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Pin statistical runtime
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 pytest==8.4.2
      - name: Run six outcome-blind simulation and botanical-missingness guards
        run: python -m pytest -q tests/test_independent_nhm_20261013.py
      - name: Retrieve exact frozen NHM independent botanical description data
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 --retry-delay 3 \
            -o /tmp/nhm_original_botanical_combined.csv "$NHM_SOURCE_URL"
          test "$(wc -c < /tmp/nhm_original_botanical_combined.csv)" = "$NHM_SOURCE_BYTES"
          test "$(git hash-object /tmp/nhm_original_botanical_combined.csv)" = "$NHM_SOURCE_GIT_BLOB_SHA1"
          python - <<'PY'
          import pandas as pd
          p='/tmp/nhm_original_botanical_combined.csv'
          f=pd.read_csv(p,nrows=1)
          needed={'taxon','flower colour','petal colour','corolla colour'}
          assert needed.issubset(f.columns), sorted(needed-set(f.columns))
          print('PASS independent original NHM botanical CSV provenance, header, byte length and git blob')
          PY
      - name: Retrieve unchanged source photo-site climate opportunities, including photo-unclassifiable records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ORIGINAL_SOURCE_ARTIFACT_ID/zip" > /tmp/fcp_all_original_photo_sites.zip
          echo "$ORIGINAL_SOURCE_SHA256  /tmp/fcp_all_original_photo_sites.zip" | sha256sum -c -
      - name: Execute full exact-name crosswalk and 4-sector bootstrap OR explicitly report HOLD
        run: |
          python scripts/analysis/audit_independent_nhm_colour_rain_20261013.py \
            --nhm-csv /tmp/nhm_original_botanical_combined.csv \
            --fcp-original-source /tmp/fcp_all_original_photo_sites.zip \
            --bootstrap 999 \
            --outdir /tmp/fcp_nhm_independent_botanical
      - name: Scientific support gates, source integrity, no favourable-result-only reporting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/fcp_nhm_independent_botanical/result.json').read_text())
          assert z['schema']=='FCP_NHM_INDEPENDENT_BOTANICAL_DESCRIPTION_COLOUR_REPLICATION_V1'
          assert z['original_fcp_photo_SHA256']=='2d6097ba1b0434632e13bbe79dd78180608a287ff5dabebc770b5c0a2cfb52a0'
          assert z['NHM_source_git_blob_sha1']=='e1cfd2d5c518c2061ec91d1a9e8b64fc7ca69389'
          assert z['original_photo_opportunity']['source_photo_ids']==100543
          assert z['original_photo_opportunity']['source_taxa']==42111
          assert len(z['spatial_strata'])==4
          for k,v in z['spatial_strata'].items():
              assert set(v)=={'equal_species','equal_genera'}
              for w,q in v.items():
                  assert len(q['sectors'])==4
                  for sector in q['sectors']:
                      assert sector['status'] in {'OK','HOLD_INDEPENDENT_BOTANICAL_COLOUR_SUPPORT','HOLD_DESIGN_RANK','HOLD_SINGULAR_BOOTSTRAP'}
                  if q['status']=='OK_4SECTOR_FAMILY':
                      assert all(s['status']=='OK' for s in q['sectors'])
                      assert all(len(s['estimate']['maxT_4sector_CI95'])==2 for s in q['sectors'])
                  else: assert q['status']=='HOLD_COMPLETE_4SECTOR_FAMILY'
          print('PASS original source contract; full 4-sector decisions with strict HOLD gates; no FCP image colour labels used')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-independent-nhm-flower-colour-rain-20261013
          path: /tmp/fcp_nhm_independent_botanical/
          retention-days: 60
          if-no-files-found: error
