name: RGFCA local cooccurrence segregation Step 7A

on:
  push:
    branches:
      - analysis/rgfca-local-cooccurrence-segregation-step7a
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Run frozen Step 7A
        run: python scripts/analysis/run_rgfca_local_cooccurrence_segregation_step7a_20260910.py
      - name: Print result
        run: cat results/rgfca_local_cooccurrence_segregation_step7a_20260910/RESULT.md
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/rgfca_local_cooccurrence_segregation_step7a_20260910
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze Step 7A local co-occurrence segregation results"
          git push
