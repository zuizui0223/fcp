name: JBI image-first atlas 200-species metadata feasibility

on:
  pull_request:
    paths:
      - "fcp_pipeline/atlas_expansion.py"
      - "fcp_pipeline/atlas_scaleout.py"
      - "scripts/data/build_jbi_atlas_scaleout_metadata_feasibility.py"
      - "tests/test_atlas_expansion.py"
      - "tests/test_atlas_scaleout.py"
      - "docs/supporting/jbi_image_first_atlas_expansion_contract_v2.json"
      - ".github/workflows/jbi-image-first-atlas-scaleout-feasibility.yml"
  push:
    branches:
      - analysis/jbi-global-colour-boundaries-scaleup
    paths:
      - "fcp_pipeline/atlas_expansion.py"
      - "fcp_pipeline/atlas_scaleout.py"
      - "scripts/data/build_jbi_atlas_scaleout_metadata_feasibility.py"
      - "tests/test_atlas_expansion.py"
      - "tests/test_atlas_scaleout.py"
      - "docs/supporting/jbi_image_first_atlas_expansion_contract_v2.json"
      - ".github/workflows/jbi-image-first-atlas-scaleout-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jbi-atlas-scaleout-feasibility-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  contract-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate deterministic metadata-only scale-out
        run: >-
          python -m pytest -q
          tests/test_atlas_expansion.py
          tests/test_atlas_scaleout.py

  live-feasibility:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Audit the complete 500-species metadata candidate pool
        run: >-
          python scripts/data/build_jbi_atlas_scaleout_metadata_feasibility.py
          --candidate-species 500
          --maximum-candidates-per-species 1000
          --output-dir /tmp/fcp-atlas-scaleout
      - name: Upload pass, shortfall and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbi-atlas-200-species-metadata-feasibility
          path: /tmp/fcp-atlas-scaleout
          if-no-files-found: error
