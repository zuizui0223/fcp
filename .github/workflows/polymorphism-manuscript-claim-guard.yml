permissions:
  contents: read

jobs:
  claim-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Verify manuscript claims against frozen results
        run: python -m pytest tests/test_polymorphism_manuscript_claims.py -q

  fresh-from-zero-regression:
    # No historical measured photo CSV is ever read by this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FCP fresh-only source/geo and test dependencies
        run: python -m pip install --upgrade pytest numpy pandas scipy Pillow scikit-image rasterio
      - name: Check fresh source acquisition / zero-legacy / null-guard contracts
        run: python -m pytest tests/test_collect_fcp_uncapped_metadata.py tests/test_fcp_allphotos.py tests/test_fcp_axis_replay.py tests/test_fcp_direct_environment.py tests/test_fcp_environment_profiles.py tests/test_fcp_shared_structure.py tests/test_fcp_uncapped_firewall.py tests/test_fcp_fresh_study.py tests/test_fcp_fresh_image_partition.py tests/test_run_fcp_uncapped_shard.py tests/test_fcp_open_data_bulk_import.py tests/test_pin_inat_open_data_snapshot.py tests/test_fcp_real_photo_pilot_repair.py tests/test_execute_fcp_42111_census.py tests/test_plan_fcp_full_measurements.py tests/test_execute_fcp_full_photo_work_queue.py tests/test_collect_fcp_partition_measurements.py tests/test_admit_fcp_complete_photo_source.py -q
      - name: Verify original method bootstrap script syntax
        run: bash -n scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - name: Restore and fingerprint original ROI-v4 code without ANY old photo colours
        run: |
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --code-only
          python - <<'PY'
          from pathlib import Path
          from fcp_pipeline.photo_first_measurement import REFERENCE_RGB
          from fcp_pipeline.photo_first_atlas_v2 import coarse_morph_from_palette
          from fcp_pipeline.flower_roi_v4 import validate_roi_v4_contract
          assert len(REFERENCE_RGB)==12
          assert Path("scripts/analysis/measure_random_photo_first_blind_partition.py").is_file()
          print("FCP_FRESH_ORIGINAL_ROI_CODE_PREFLIGHT_PASS")
          PY


  fcp-42111-recovery-source-census-disk-aware:
    # One-shot real dated archive recovery after source run 38676167958
    # exhausted the 91.5GB scratch while writing species manifests.
    # Remove this job from the PR workflow AFTER its run is registered.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'analysis/fcp-fresh-uncapped-zero-20261015' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      SOURCE_FRAME_COMMIT: 7e538e5c51c05a7cc47b2fcf53eea92634c8a863
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reclaim unused image-runner SDKs (never remove Python, git or OS packages)
        shell: bash
        run: |
          set -euo pipefail
          echo "FCP_RESCUE_INITIAL_DISK"
          df -h "$RUNNER_TEMP"
          for p in /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /usr/share/swift; do
            if test -d "$p"; then
              sudo du -sh "$p" || true
              sudo rm -rf -- "$p"
            fi
          done
          echo "FCP_RESCUE_AFTER_UNUSED_SDK_CLEANUP"
          df -h "$RUNNER_TEMP"
      - name: Install memory-bounded and disk-backed snapshot importer
        run: python -m pip install --upgrade "numpy<3" "pandas<3"
      - name: Restore exact immutable 42,111 taxon identity frame
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fcp_recovery_frame"
          git fetch --no-tags --depth=1 origin "$SOURCE_FRAME_COMMIT"
          git show "$SOURCE_FRAME_COMMIT:data/frozen/global_monte_carlo_species_discovery_combined_v2_species_v1.csv" \
            > "$RUNNER_TEMP/fcp_recovery_frame/42111_species.csv"
          echo '5d871bd1f1190c68fd513bb527e6c93de1606dc35ff8cfff5f6187850dc382cc  '"$RUNNER_TEMP"'/fcp_recovery_frame/42111_species.csv' | sha256sum -c -
      - name: Run real 2026-09-27 dated 42,111-taxon source census with verified-disk release
        shell: bash
        run: |
          set -euo pipefail
          echo "FCP_RESCUE_SOURCE_COMPUTE_STARTED"; date -u
          python scripts/acquisition/execute_fcp_42111_census.py \
            --frame "$RUNNER_TEMP/fcp_recovery_frame/42111_species.csv" \
            --work "$RUNNER_TEMP/fcp_rescued_real_source_20260927" \
            --expected-species 42111 --shards 128 --worker-partitions 128 \
            --minimum-free-disk-gb 80 \
            --release-verified-temporary-tables
          echo "FCP_RESCUE_FULL_SOURCE_CENSUS_SUCCESS"; date -u
      - name: Save exact source receipt even on failure, no claim of measured flower colours
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fcp-42111-recovery-20260927-status-and-original-hashes
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/fcp_rescued_real_source_20260927/full_source_execution_receipt.json
            ${{ runner.temp }}/fcp_rescued_real_source_20260927/source_archive_sha256_before_source_data.txt
            ${{ runner.temp }}/fcp_rescued_real_source_20260927/frozen_4_metadata_tables/fcp_source_archive_pin.json
            ${{ runner.temp }}/fcp_rescued_real_source_20260927/complete_42111_metadata_source/bulk_source_receipt.json
            ${{ runner.temp }}/fcp_rescued_real_source_20260927/frozen_location_blind_all_photo_firewall/fresh_study_freeze.json
            ${{ runner.temp }}/fcp_rescued_real_source_20260927/all_42111_species_source_photo_counts.csv
      - name: Archive original metadata photo universe and all 128 worker partitions only on complete success
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: fcp-42111-recovery-20260927-complete-source-and-blind-photo-firewall
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          path: ${{ runner.temp }}/fcp_rescued_real_source_20260927/fcp_complete_42111_source_and_blind_firewall.tar.gz
