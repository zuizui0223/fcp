  push:
    branches:
      - main
      - analysis/h2-third-cohort-preopening-20260916
      - promotion/polymorphism-paper-20260918
    paths:
      - README.md
      - docs/POLYMORPHISM_MANUSCRIPT.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json
      - results/polymorphism_h2_third_cohort_prospective_measurement_20260917/result.json
      - tests/test_polymorphism_manuscript_claims.py
      - fcp_pipeline/fcp_allphotos.py
      - fcp_pipeline/fcp_fresh_study.py
      - fcp_pipeline/fcp_axis_replay.py
      - fcp_pipeline/fcp_shared_structure.py
      - fcp_pipeline/fcp_direct_environment.py
      - fcp_pipeline/fcp_environment_profiles.py
      - scripts/acquisition/collect_fcp_uncapped_metadata.py
      - scripts/acquisition/build_fcp_uncapped_blind_batches.py
      - scripts/acquisition/run_fcp_uncapped_shard.py
      - scripts/acquisition/run_fcp_fresh_image_partition.py
      - scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - docs/FCP_ALL_PHOTOS_SHARED_WITHINSPECIES_PROTOCOL_20261014.md
      - docs/FCP_FRESH_EXECUTION_STATUS_20261015.md
      - tests/test_collect_fcp_uncapped_metadata.py
      - tests/test_fcp_allphotos.py
      - tests/test_fcp_axis_replay.py
      - tests/test_fcp_direct_environment.py
      - tests/test_fcp_environment_profiles.py
      - tests/test_fcp_shared_structure.py
      - tests/test_fcp_uncapped_firewall.py
      - tests/test_fcp_fresh_study.py
      - tests/test_fcp_fresh_image_partition.py
      - tests/test_run_fcp_uncapped_shard.py
      - scripts/acquisition/import_inat_open_data_snapshot.py
      - scripts/acquisition/preflight_inat_open_data_provider.py
      - scripts/acquisition/audit_inat_open_data_taxonomy.py
      - tests/test_fcp_open_data_bulk_import.py
      - scripts/acquisition/pin_inat_open_data_snapshot.py
      - tests/test_pin_inat_open_data_snapshot.py
      - .github/workflows/polymorphism-manuscript-claim-guard.yml
  pull_request:
    paths:
      - README.md
      - docs/POLYMORPHISM_MANUSCRIPT.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json
      - results/polymorphism_h2_third_cohort_prospective_measurement_20260917/result.json
      - tests/test_polymorphism_manuscript_claims.py
      - fcp_pipeline/fcp_allphotos.py
      - fcp_pipeline/fcp_fresh_study.py
      - fcp_pipeline/fcp_axis_replay.py
      - fcp_pipeline/fcp_shared_structure.py
      - fcp_pipeline/fcp_direct_environment.py
      - fcp_pipeline/fcp_environment_profiles.py
      - scripts/acquisition/collect_fcp_uncapped_metadata.py
      - scripts/acquisition/build_fcp_uncapped_blind_batches.py
      - scripts/acquisition/run_fcp_uncapped_shard.py
      - scripts/acquisition/run_fcp_fresh_image_partition.py
      - scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - docs/FCP_ALL_PHOTOS_SHARED_WITHINSPECIES_PROTOCOL_20261014.md
      - docs/FCP_FRESH_EXECUTION_STATUS_20261015.md
      - tests/test_collect_fcp_uncapped_metadata.py
      - tests/test_fcp_allphotos.py
      - tests/test_fcp_axis_replay.py
      - tests/test_fcp_direct_environment.py
      - tests/test_fcp_environment_profiles.py
      - tests/test_fcp_shared_structure.py
      - tests/test_fcp_uncapped_firewall.py
      - tests/test_fcp_fresh_study.py
      - tests/test_fcp_fresh_image_partition.py
      - tests/test_run_fcp_uncapped_shard.py
      - scripts/acquisition/import_inat_open_data_snapshot.py
      - scripts/acquisition/preflight_inat_open_data_provider.py
      - scripts/acquisition/audit_inat_open_data_taxonomy.py
      - tests/test_fcp_open_data_bulk_import.py
      - scripts/acquisition/pin_inat_open_data_snapshot.py
      - tests/test_pin_inat_open_data_snapshot.py
      - .github/workflows/polymorphism-manuscript-claim-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Verify manuscript claims against frozen results
        run: python -m pytest tests/test_polymorphism_manuscript_claims.py -q

  fresh-from-zero-regression:
    # No historical measured photo CSV is ever read by this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FCP fresh-only source/geo and test dependencies
        run: python -m pip install --upgrade pytest numpy pandas scipy Pillow scikit-image rasterio
      - name: Check fresh source acquisition / zero-legacy / null-guard contracts
        run: python -m pytest tests/test_collect_fcp_uncapped_metadata.py tests/test_fcp_allphotos.py tests/test_fcp_axis_replay.py tests/test_fcp_direct_environment.py tests/test_fcp_environment_profiles.py tests/test_fcp_shared_structure.py tests/test_fcp_uncapped_firewall.py tests/test_fcp_fresh_study.py tests/test_fcp_fresh_image_partition.py tests/test_run_fcp_uncapped_shard.py tests/test_fcp_open_data_bulk_import.py tests/test_pin_inat_open_data_snapshot.py -q
      - name: Verify original method bootstrap script syntax
        run: bash -n scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - name: Restore and fingerprint original ROI-v4 code without ANY old photo colours
        run: |
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --code-only
          python - <<'PY'
          from pathlib import Path
          from fcp_pipeline.photo_first_measurement import REFERENCE_RGB
          from fcp_pipeline.photo_first_atlas_v2 import coarse_morph_from_palette
          from fcp_pipeline.flower_roi_v4 import validate_roi_v4_contract
          assert len(REFERENCE_RGB)==12
          assert Path("scripts/analysis/measure_random_photo_first_blind_partition.py").is_file()
          print("FCP_FRESH_ORIGINAL_ROI_CODE_PREFLIGHT_PASS")
          PY

  fresh-original-ROI-real-inference-smoke:
    # One-time integration of actual frozen YOLO+EfficientSAM on generated
    # synthetic pixels. NO provider image downloads or claimed biological colours.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore and byte-verify historical ROI method and runtime weights
        run: |
          set -euo pipefail
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full
      - name: Install original frozen CPU inference dependencies
        run: |
          python -m pip install -r requirements-atlas-roi-v4.txt
          python -m pip install 'pandas<3' pillow
      - name: Run historical unmodified pixel evaluator on ONE synthetic drawing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fcp_synthetic/images"
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import os,csv
          root=Path(os.environ['RUNNER_TEMP'])/'fcp_synthetic'
          image=Image.new('RGB',(384,384),(50,90,55))
          draw=ImageDraw.Draw(image)
          draw.ellipse([70,70,310,320],fill=(180,60,155))
          draw.ellipse([116,104,265,280],fill=(235,135,180))
          image.save(root/'images'/'FCPR-SYNTHETIC-ONLY.jpg',quality=94)
          with (root/'worker.csv').open('w',newline='') as h:
              writer=csv.writer(h)
              writer.writerow(('measurement_id','image_filename','photo_license'))
              writer.writerow(('FCPR-SYNTHETIC-ONLY','FCPR-SYNTHETIC-ONLY.jpg','cc0'))
          PY
          PYTHONPATH=. python scripts/analysis/measure_random_photo_first_blind_partition.py \
            --worker-manifest "$RUNNER_TEMP/fcp_synthetic/worker.csv" \
            --images-dir "$RUNNER_TEMP/fcp_synthetic/images" \
            --detector-weight data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt \
            --efficient-sam-dir "$RUNNER_TEMP/fcp-fresh-original-efficient-sam" \
            --output-csv "$RUNNER_TEMP/fcp_synthetic/terminal.csv"
          PYTHONPATH=. python - <<'PY'
          import pandas as pd,os,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'fcp_synthetic'
          frame=pd.read_csv(root/'terminal.csv')
          assert len(frame)==1
          assert frame['measurement_id'].tolist()==['FCPR-SYNTHETIC-ONLY']
          assert frame['measurement_status'].iloc[0] in {
              'classified_four_state_morph','not_evaluable_roi_or_flip_gate',
              'not_evaluable_insufficient_flower_pixels','not_evaluable_no_biological_palette_mass',
              'not_evaluable_ambiguous_palette_composition'
          },frame['measurement_status'].iloc[0]
          assert not {'species','latitude','longitude','observer_id','photo_url_large'} & set(frame)
          assert len([c for c in frame if c.startswith('flower_fraction_')])==9
          report={'schema':'fcp_original_pixel_runtime_synthetic_only_v1',
                  'status':'ORIGINAL_FULL_RUNTIME_ONE_SYNTHETIC_IMAGE_EXECUTED',
                  'n_synthetic_images':1,'n_provider_images':0,
                  'synthetic_morph':str(frame['morph'].iloc[0]),
                  'synthetic_status':str(frame['measurement_status'].iloc[0]),
                  'original_roi_runtime_executed':True,'fresh_biological_findings':False}
          (root/'runtime_receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-original-roi-v4-real-runtime-synthetic-smoke
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/fcp_synthetic/runtime_receipt.json
