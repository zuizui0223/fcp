name: Polymorphism manuscript claim guard

on:
  push:
    branches:
      - main
      - analysis/h2-third-cohort-preopening-20260916
      - promotion/polymorphism-paper-20260918
    paths:
      - README.md
      - docs/POLYMORPHISM_MANUSCRIPT.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json
      - results/polymorphism_h2_third_cohort_prospective_measurement_20260917/result.json
      - tests/test_polymorphism_manuscript_claims.py
      - fcp_pipeline/fcp_allphotos.py
      - fcp_pipeline/fcp_fresh_study.py
      - fcp_pipeline/fcp_axis_replay.py
      - fcp_pipeline/fcp_shared_structure.py
      - fcp_pipeline/fcp_direct_environment.py
      - fcp_pipeline/fcp_environment_profiles.py
      - scripts/acquisition/collect_fcp_uncapped_metadata.py
      - scripts/acquisition/build_fcp_uncapped_blind_batches.py
      - scripts/acquisition/run_fcp_uncapped_shard.py
      - scripts/acquisition/run_fcp_fresh_image_partition.py
      - scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - docs/FCP_ALL_PHOTOS_SHARED_WITHINSPECIES_PROTOCOL_20261014.md
      - docs/FCP_FRESH_EXECUTION_STATUS_20261015.md
      - tests/test_collect_fcp_uncapped_metadata.py
      - tests/test_fcp_allphotos.py
      - tests/test_fcp_axis_replay.py
      - tests/test_fcp_direct_environment.py
      - tests/test_fcp_environment_profiles.py
      - tests/test_fcp_shared_structure.py
      - tests/test_fcp_uncapped_firewall.py
      - tests/test_fcp_fresh_study.py
      - tests/test_fcp_fresh_image_partition.py
      - tests/test_run_fcp_uncapped_shard.py
      - scripts/acquisition/import_inat_open_data_snapshot.py
      - scripts/acquisition/preflight_inat_open_data_provider.py
      - scripts/acquisition/audit_inat_open_data_taxonomy.py
      - tests/test_fcp_open_data_bulk_import.py
      - .github/workflows/polymorphism-manuscript-claim-guard.yml
  pull_request:
    paths:
      - README.md
      - docs/POLYMORPHISM_MANUSCRIPT.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json
      - results/polymorphism_h2_third_cohort_prospective_measurement_20260917/result.json
      - tests/test_polymorphism_manuscript_claims.py
      - fcp_pipeline/fcp_allphotos.py
      - fcp_pipeline/fcp_fresh_study.py
      - fcp_pipeline/fcp_axis_replay.py
      - fcp_pipeline/fcp_shared_structure.py
      - fcp_pipeline/fcp_direct_environment.py
      - fcp_pipeline/fcp_environment_profiles.py
      - scripts/acquisition/collect_fcp_uncapped_metadata.py
      - scripts/acquisition/build_fcp_uncapped_blind_batches.py
      - scripts/acquisition/run_fcp_uncapped_shard.py
      - scripts/acquisition/run_fcp_fresh_image_partition.py
      - scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - docs/FCP_ALL_PHOTOS_SHARED_WITHINSPECIES_PROTOCOL_20261014.md
      - docs/FCP_FRESH_EXECUTION_STATUS_20261015.md
      - tests/test_collect_fcp_uncapped_metadata.py
      - tests/test_fcp_allphotos.py
      - tests/test_fcp_axis_replay.py
      - tests/test_fcp_direct_environment.py
      - tests/test_fcp_environment_profiles.py
      - tests/test_fcp_shared_structure.py
      - tests/test_fcp_uncapped_firewall.py
      - tests/test_fcp_fresh_study.py
      - tests/test_fcp_fresh_image_partition.py
      - tests/test_run_fcp_uncapped_shard.py
      - scripts/acquisition/import_inat_open_data_snapshot.py
      - scripts/acquisition/preflight_inat_open_data_provider.py
      - scripts/acquisition/audit_inat_open_data_taxonomy.py
      - tests/test_fcp_open_data_bulk_import.py
      - .github/workflows/polymorphism-manuscript-claim-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Verify manuscript claims against frozen results
        run: python -m pytest tests/test_polymorphism_manuscript_claims.py -q

  fresh-from-zero-regression:
    # No historical measured photo CSV is ever read by this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FCP fresh-only source/geo and test dependencies
        run: python -m pip install --upgrade pytest numpy pandas scipy Pillow scikit-image rasterio
      - name: Check fresh source acquisition / zero-legacy / null-guard contracts
        run: python -m pytest tests/test_collect_fcp_uncapped_metadata.py tests/test_fcp_allphotos.py tests/test_fcp_axis_replay.py tests/test_fcp_direct_environment.py tests/test_fcp_environment_profiles.py tests/test_fcp_shared_structure.py tests/test_fcp_uncapped_firewall.py tests/test_fcp_fresh_study.py tests/test_fcp_fresh_image_partition.py tests/test_run_fcp_uncapped_shard.py tests/test_fcp_open_data_bulk_import.py -q
      - name: Verify original method bootstrap script syntax
        run: bash -n scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - name: Restore and fingerprint original ROI-v4 code without ANY old photo colours
        run: |
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --code-only
          python - <<'PY'
          from pathlib import Path
          from fcp_pipeline.photo_first_measurement import REFERENCE_RGB
          from fcp_pipeline.photo_first_atlas_v2 import coarse_morph_from_palette
          from fcp_pipeline.flower_roi_v4 import validate_roi_v4_contract
          assert len(REFERENCE_RGB)==12
          assert Path("scripts/analysis/measure_random_photo_first_blind_partition.py").is_file()
          print("FCP_FRESH_ORIGINAL_ROI_CODE_PREFLIGHT_PASS")
          PY

  fresh-real-provider-schema-probe:
    # Small schema probe only: THREE S3 HEADs + at most 128KiB per mutable metadata file.
    # No original photo downloads, no labelled flower responses, no bulk crawl.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check actual provider headers against fresh photo importer
        run: |
          set -euo pipefail
          python scripts/acquisition/preflight_inat_open_data_provider.py \
            --out "$RUNNER_TEMP/fcp_real_provider_schema_receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-open-data-real-provider-schema-20261015
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/fcp_real_provider_schema_receipt.json

  fresh-real-taxonomy-42111-audit:
    # Real mutable Open Data taxonomy, small enough to inspect; not a source-frozen biological sample.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SOURCE_SHA: 7e538e5c51c05a7cc47b2fcf53eea92634c8a863
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install taxonomy-read dependencies
        run: python -m pip install numpy pandas
      - name: Fetch original 42111 identities and one real root taxonomy table
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fcp_real_taxonomy"
          mkdir -p "$work/source" "$work/out"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git show "$SOURCE_SHA:data/frozen/global_monte_carlo_species_discovery_combined_v2_species_v1.csv" > "$work/source/fcp_42111_taxa.csv"
          echo '5d871bd1f1190c68fd513bb527e6c93de1606dc35ff8cfff5f6187850dc382cc  '"$work"'/source/fcp_42111_taxa.csv' | sha256sum -c -
          curl --fail --location --retry 3 --retry-delay 5 --max-time 300             --max-filesize 100000000             'https://inaturalist-open-data.s3.amazonaws.com/taxa.csv.gz'             -o "$work/source/taxa.csv.gz"
          gzip -t "$work/source/taxa.csv.gz"
          sha256sum "$work/source/taxa.csv.gz"
      - name: Audit the full original species frame against actual source taxonomy
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fcp_real_taxonomy"
          python scripts/acquisition/audit_inat_open_data_taxonomy.py             --frame "$work/source/fcp_42111_taxa.csv"             --taxa "$work/source/taxa.csv.gz"             --outdir "$work/out"
          python - <<'PY'
          import os,json
          from pathlib import Path
          work=Path(os.environ['RUNNER_TEMP'])/'fcp_real_taxonomy'
          receipt=json.loads((work/'out/taxonomy_source_audit.json').read_text())
          assert receipt['frame_species']==42111 and receipt['provider_taxon_rows']>100000
          assert receipt['old_flower_colour_measurements_read'] is False
          assert receipt['photo_pixels_opened'] is False
          assert receipt['ready_for_full_photo_pixel_measurement'] is False
          print('FCP_REAL_TAXONOMY_AUDIT_ONLY',json.dumps({
              'fcp_taxa':42111,'source_taxon_ids_present':receipt['source_taxon_ids_present'],
              'missing':receipt['source_taxon_ids_missing'],
              'name_mismatches':receipt['source_name_mismatches'],
              'rank_mismatches':receipt['source_rank_mismatches'],
              'provider_taxa_sha256':receipt['current_provider_taxa_sha256'],
              'source_photo_measured':0
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-42111-real-taxonomy-crosswalk-audit-20261015
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/fcp_real_taxonomy/out/taxonomy_source_audit.json
            ${{ runner.temp }}/fcp_real_taxonomy/out/fcp_taxa_crosswalk_42111.csv
