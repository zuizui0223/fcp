  push:
    branches:
      - main
      - analysis/h2-third-cohort-preopening-20260916
      - promotion/polymorphism-paper-20260918
    paths:
      - README.md
      - docs/POLYMORPHISM_MANUSCRIPT.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json
      - results/polymorphism_h2_third_cohort_prospective_measurement_20260917/result.json
      - tests/test_polymorphism_manuscript_claims.py
      - fcp_pipeline/fcp_allphotos.py
      - fcp_pipeline/fcp_fresh_study.py
      - fcp_pipeline/fcp_axis_replay.py
      - fcp_pipeline/fcp_shared_structure.py
      - fcp_pipeline/fcp_direct_environment.py
      - fcp_pipeline/fcp_environment_profiles.py
      - scripts/acquisition/collect_fcp_uncapped_metadata.py
      - scripts/acquisition/build_fcp_uncapped_blind_batches.py
      - scripts/acquisition/run_fcp_uncapped_shard.py
      - scripts/acquisition/run_fcp_fresh_image_partition.py
      - scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - docs/FCP_ALL_PHOTOS_SHARED_WITHINSPECIES_PROTOCOL_20261014.md
      - docs/FCP_FRESH_EXECUTION_STATUS_20261015.md
      - tests/test_collect_fcp_uncapped_metadata.py
      - tests/test_fcp_allphotos.py
      - tests/test_fcp_axis_replay.py
      - tests/test_fcp_direct_environment.py
      - tests/test_fcp_environment_profiles.py
      - tests/test_fcp_shared_structure.py
      - tests/test_fcp_uncapped_firewall.py
      - tests/test_fcp_fresh_study.py
      - tests/test_fcp_fresh_image_partition.py
      - tests/test_run_fcp_uncapped_shard.py
      - scripts/acquisition/import_inat_open_data_snapshot.py
      - scripts/acquisition/preflight_inat_open_data_provider.py
      - scripts/acquisition/audit_inat_open_data_taxonomy.py
      - tests/test_fcp_open_data_bulk_import.py
      - scripts/acquisition/pin_inat_open_data_snapshot.py
      - tests/test_pin_inat_open_data_snapshot.py
      - scripts/acquisition/run_real_source_roi_pilot.py
      - scripts/acquisition/repair_real_source_roi_pilot.py
      - tests/test_fcp_real_photo_pilot_repair.py
      - .github/workflows/polymorphism-manuscript-claim-guard.yml
  pull_request:
    paths:
      - README.md
      - docs/POLYMORPHISM_MANUSCRIPT.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json
      - results/polymorphism_h2_third_cohort_prospective_measurement_20260917/result.json
      - tests/test_polymorphism_manuscript_claims.py
      - fcp_pipeline/fcp_allphotos.py
      - fcp_pipeline/fcp_fresh_study.py
      - fcp_pipeline/fcp_axis_replay.py
      - fcp_pipeline/fcp_shared_structure.py
      - fcp_pipeline/fcp_direct_environment.py
      - fcp_pipeline/fcp_environment_profiles.py
      - scripts/acquisition/collect_fcp_uncapped_metadata.py
      - scripts/acquisition/build_fcp_uncapped_blind_batches.py
      - scripts/acquisition/run_fcp_uncapped_shard.py
      - scripts/acquisition/run_fcp_fresh_image_partition.py
      - scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - docs/FCP_ALL_PHOTOS_SHARED_WITHINSPECIES_PROTOCOL_20261014.md
      - docs/FCP_FRESH_EXECUTION_STATUS_20261015.md
      - tests/test_collect_fcp_uncapped_metadata.py
      - tests/test_fcp_allphotos.py
      - tests/test_fcp_axis_replay.py
      - tests/test_fcp_direct_environment.py
      - tests/test_fcp_environment_profiles.py
      - tests/test_fcp_shared_structure.py
      - tests/test_fcp_uncapped_firewall.py
      - tests/test_fcp_fresh_study.py
      - tests/test_fcp_fresh_image_partition.py
      - tests/test_run_fcp_uncapped_shard.py
      - scripts/acquisition/import_inat_open_data_snapshot.py
      - scripts/acquisition/preflight_inat_open_data_provider.py
      - scripts/acquisition/audit_inat_open_data_taxonomy.py
      - tests/test_fcp_open_data_bulk_import.py
      - scripts/acquisition/pin_inat_open_data_snapshot.py
      - tests/test_pin_inat_open_data_snapshot.py
      - scripts/acquisition/run_real_source_roi_pilot.py
      - scripts/acquisition/repair_real_source_roi_pilot.py
      - tests/test_fcp_real_photo_pilot_repair.py
      - .github/workflows/polymorphism-manuscript-claim-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Verify manuscript claims against frozen results
        run: python -m pytest tests/test_polymorphism_manuscript_claims.py -q

  fresh-from-zero-regression:
    # No historical measured photo CSV is ever read by this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FCP fresh-only source/geo and test dependencies
        run: python -m pip install --upgrade pytest numpy pandas scipy Pillow scikit-image rasterio
      - name: Check fresh source acquisition / zero-legacy / null-guard contracts
        run: python -m pytest tests/test_collect_fcp_uncapped_metadata.py tests/test_fcp_allphotos.py tests/test_fcp_axis_replay.py tests/test_fcp_direct_environment.py tests/test_fcp_environment_profiles.py tests/test_fcp_shared_structure.py tests/test_fcp_uncapped_firewall.py tests/test_fcp_fresh_study.py tests/test_fcp_fresh_image_partition.py tests/test_run_fcp_uncapped_shard.py tests/test_fcp_open_data_bulk_import.py tests/test_pin_inat_open_data_snapshot.py tests/test_fcp_real_photo_pilot_repair.py -q
      - name: Verify original method bootstrap script syntax
        run: bash -n scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - name: Restore and fingerprint original ROI-v4 code without ANY old photo colours
        run: |
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --code-only
          python - <<'PY'
          from pathlib import Path
          from fcp_pipeline.photo_first_measurement import REFERENCE_RGB
          from fcp_pipeline.photo_first_atlas_v2 import coarse_morph_from_palette
          from fcp_pipeline.flower_roi_v4 import validate_roi_v4_contract
          assert len(REFERENCE_RGB)==12
          assert Path("scripts/analysis/measure_random_photo_first_blind_partition.py").is_file()
          print("FCP_FRESH_ORIGINAL_ROI_CODE_PREFLIGHT_PASS")
          PY

  fresh-case-sensitive-source-photo-repair:
    # One-shot 2-photo correction, preserving immutable first 94 real ROI-v4 outputs.
    # Provider request count <=2; quarantine main biological study unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover immutable source + original 96-real-photo pilot artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fcp_original_source" "$RUNNER_TEMP/fcp_prior_real_images"
          gh run download 38639092021 --repo "$GITHUB_REPOSITORY" \
            --name fcp-fresh-next8-species-source-20261015 \
            --dir "$RUNNER_TEMP/fcp_original_source"
          gh run download 38671341143 --repo "$GITHUB_REPOSITORY" \
            --name fcp-real-original-photos-roi-v4-pilot-20261015 \
            --dir "$RUNNER_TEMP/fcp_prior_real_images"
          echo '78c7e533c19a9099dd1f2de96dc7864ee65253abfe17dbfa2c536252a1665403  '"$RUNNER_TEMP"'/fcp_original_source/species/47129/photo_manifest.ndjson' | sha256sum -c -
          echo '772dda9c51cf24fa4fdabf6408d16b2ba96fc965b532af82533c150cf0144c09  '"$RUNNER_TEMP"'/fcp_prior_real_images/real_original_roi_v4_new_photo_pilot.csv' | sha256sum -c -
      - name: Restore original ROI-v4 method and byte-frozen model assets
        run: bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full
      - name: Install original CPU model dependencies
        run: |
          python -m pip install -r requirements-atlas-roi-v4.txt
          python -m pip install 'pandas<3' pillow
      - name: Repair ONLY two historical uppercase JPEG-extension failures using REAL images
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/acquisition/repair_real_source_roi_pilot.py \
            --original-pilot-csv "$RUNNER_TEMP/fcp_prior_real_images/real_original_roi_v4_new_photo_pilot.csv" \
            --original-pilot-receipt "$RUNNER_TEMP/fcp_prior_real_images/real_original_roi_v4_new_photo_pilot_receipt.json" \
            --source-metadata-root "$RUNNER_TEMP/fcp_original_source" \
            --original-measure-script scripts/analysis/measure_random_photo_first_blind_partition.py \
            --original-detector data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt \
            --original-efficient-sam "$RUNNER_TEMP/fcp-fresh-original-efficient-sam" \
            --delay-seconds 1.1 \
            --output-root "$RUNNER_TEMP/fcp_real_pixel_extension_repair"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcp-real-original-photo-96-case-extension-repair-20261015
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/fcp_real_pixel_extension_repair/real_original_roi_v4_new_photo_pilot_repaired.csv
            ${{ runner.temp }}/fcp_real_pixel_extension_repair/real_original_roi_v4_new_photo_pilot_repaired_receipt.json
