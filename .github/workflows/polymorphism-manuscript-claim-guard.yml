  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Verify manuscript claims against frozen results
        run: python -m pytest tests/test_polymorphism_manuscript_claims.py -q

  fresh-from-zero-regression:
    # No historical measured photo CSV is ever read by this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FCP fresh-only source/geo and test dependencies
        run: python -m pip install --upgrade pytest numpy pandas scipy Pillow scikit-image rasterio
      - name: Check fresh source acquisition / zero-legacy / null-guard contracts
        run: python -m pytest tests/test_collect_fcp_uncapped_metadata.py tests/test_fcp_allphotos.py tests/test_fcp_axis_replay.py tests/test_fcp_direct_environment.py tests/test_fcp_environment_profiles.py tests/test_fcp_shared_structure.py tests/test_fcp_uncapped_firewall.py tests/test_fcp_fresh_study.py tests/test_fcp_fresh_image_partition.py tests/test_fcp_fresh_partition_index.py tests/test_run_fcp_uncapped_shard.py tests/test_fcp_open_data_bulk_import.py tests/test_emit_fcp_staged_source_shards.py tests/test_finalize_fcp_staged_source.py tests/test_pin_inat_open_data_snapshot.py tests/test_fcp_real_photo_pilot_repair.py tests/test_execute_fcp_42111_census.py tests/test_plan_fcp_full_measurements.py tests/test_execute_fcp_full_photo_work_queue.py tests/test_collect_fcp_partition_measurements.py tests/test_admit_fcp_complete_photo_source.py tests/test_summarize_fcp_real_photo_opportunities.py tests/test_plan_fcp_real_42111_partition_capacity.py tests/test_verify_fcp_complete_photo_ids_vs_original_counts.py tests/test_run_fcp_durable_source_phases.py tests/test_photo_polymorphism_screen.py tests/test_plan_fcp_photo_first_screen.py tests/test_freeze_fcp_photo_first_blind_workers.py tests/test_run_fcp_photo_first_roi_work_unit.py tests/test_reassemble_fcp_photo_first_screen.py tests/test_freeze_fcp_rgfca_photo_repetition.py tests/test_rgfca_photo_repeatability.py tests/test_run_rgfca_real_1000_enrolled_six_photo_pilot.py -q
      - name: Verify original method bootstrap script syntax
        run: bash -n scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - name: Restore and fingerprint original ROI-v4 code without ANY old photo colours
        run: |
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --code-only
          python - <<'PY'
          from pathlib import Path
          from fcp_pipeline.photo_first_measurement import REFERENCE_RGB
          from fcp_pipeline.photo_first_atlas_v2 import coarse_morph_from_palette
          from fcp_pipeline.flower_roi_v4 import validate_roi_v4_contract
          assert len(REFERENCE_RGB)==12
          assert Path("scripts/analysis/measure_random_photo_first_blind_partition.py").is_file()
          print("FCP_FRESH_ORIGINAL_ROI_CODE_PREFLIGHT_PASS")
          PY
