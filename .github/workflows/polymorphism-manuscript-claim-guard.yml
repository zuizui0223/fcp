name: Polymorphism manuscript claim guard

on:
  push:
    branches:
      - main
      - analysis/h2-third-cohort-preopening-20260916
      - promotion/polymorphism-paper-20260918
    paths:
      - README.md
      - docs/POLYMORPHISM_MANUSCRIPT.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json
      - results/polymorphism_h2_third_cohort_prospective_measurement_20260917/result.json
      - tests/test_polymorphism_manuscript_claims.py
      - fcp_pipeline/fcp_allphotos.py
      - fcp_pipeline/fcp_fresh_study.py
      - fcp_pipeline/fcp_axis_replay.py
      - fcp_pipeline/fcp_shared_structure.py
      - fcp_pipeline/fcp_direct_environment.py
      - fcp_pipeline/fcp_environment_profiles.py
      - scripts/acquisition/collect_fcp_uncapped_metadata.py
      - scripts/acquisition/build_fcp_uncapped_blind_batches.py
      - scripts/acquisition/run_fcp_uncapped_shard.py
      - scripts/acquisition/run_fcp_fresh_image_partition.py
      - scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - docs/FCP_ALL_PHOTOS_SHARED_WITHINSPECIES_PROTOCOL_20261014.md
      - docs/FCP_FRESH_EXECUTION_STATUS_20261015.md
      - tests/test_collect_fcp_uncapped_metadata.py
      - tests/test_fcp_allphotos.py
      - tests/test_fcp_axis_replay.py
      - tests/test_fcp_direct_environment.py
      - tests/test_fcp_environment_profiles.py
      - tests/test_fcp_shared_structure.py
      - tests/test_fcp_uncapped_firewall.py
      - tests/test_fcp_fresh_study.py
      - tests/test_fcp_fresh_image_partition.py
      - tests/test_run_fcp_uncapped_shard.py
      - .github/workflows/polymorphism-manuscript-claim-guard.yml
  pull_request:
    paths:
      - README.md
      - docs/POLYMORPHISM_MANUSCRIPT.md
      - docs/POLYMORPHISM_CURRENT_CLAIM_LEDGER_20260918.md
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json
      - results/polymorphism_h2_third_cohort_prospective_measurement_20260917/result.json
      - tests/test_polymorphism_manuscript_claims.py
      - fcp_pipeline/fcp_allphotos.py
      - fcp_pipeline/fcp_fresh_study.py
      - fcp_pipeline/fcp_axis_replay.py
      - fcp_pipeline/fcp_shared_structure.py
      - fcp_pipeline/fcp_direct_environment.py
      - fcp_pipeline/fcp_environment_profiles.py
      - scripts/acquisition/collect_fcp_uncapped_metadata.py
      - scripts/acquisition/build_fcp_uncapped_blind_batches.py
      - scripts/acquisition/run_fcp_uncapped_shard.py
      - scripts/acquisition/run_fcp_fresh_image_partition.py
      - scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - docs/FCP_ALL_PHOTOS_SHARED_WITHINSPECIES_PROTOCOL_20261014.md
      - docs/FCP_FRESH_EXECUTION_STATUS_20261015.md
      - tests/test_collect_fcp_uncapped_metadata.py
      - tests/test_fcp_allphotos.py
      - tests/test_fcp_axis_replay.py
      - tests/test_fcp_direct_environment.py
      - tests/test_fcp_environment_profiles.py
      - tests/test_fcp_shared_structure.py
      - tests/test_fcp_uncapped_firewall.py
      - tests/test_fcp_fresh_study.py
      - tests/test_fcp_fresh_image_partition.py
      - tests/test_run_fcp_uncapped_shard.py
      - .github/workflows/polymorphism-manuscript-claim-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Verify manuscript claims against frozen results
        run: python -m pytest tests/test_polymorphism_manuscript_claims.py -q

  fresh-from-zero-regression:
    # No historical measured photo CSV is ever read by this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FCP fresh-only source/geo and test dependencies
        run: python -m pip install --upgrade pytest numpy pandas scipy Pillow scikit-image rasterio
      - name: Check fresh source acquisition / zero-legacy / null-guard contracts
        run: python -m pytest tests/test_collect_fcp_uncapped_metadata.py tests/test_fcp_allphotos.py tests/test_fcp_axis_replay.py tests/test_fcp_direct_environment.py tests/test_fcp_environment_profiles.py tests/test_fcp_shared_structure.py tests/test_fcp_uncapped_firewall.py tests/test_fcp_fresh_study.py tests/test_fcp_fresh_image_partition.py tests/test_run_fcp_uncapped_shard.py -q
      - name: Verify original method bootstrap script syntax
        run: bash -n scripts/acquisition/bootstrap_fcp_original_roi_v4.sh
      - name: Restore and fingerprint original ROI-v4 code without ANY old photo colours
        run: |
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --code-only
          python - <<'PY'
          from pathlib import Path
          from fcp_pipeline.photo_first_measurement import REFERENCE_RGB
          from fcp_pipeline.photo_first_atlas_v2 import coarse_morph_from_palette
          from fcp_pipeline.flower_roi_v4 import validate_roi_v4_contract
          assert len(REFERENCE_RGB)==12
          assert Path("scripts/analysis/measure_random_photo_first_blind_partition.py").is_file()
          print("FCP_FRESH_ORIGINAL_ROI_CODE_PREFLIGHT_PASS")
          PY

  fresh-one-species-cursor-continuation:
    # Bounded real metadata source progress. NEVER opens pixels or reads historical flower colours.
    # The base checkpoint is an actual past observation-page crawl with 3,303 photo rows.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: 7e538e5c51c05a7cc47b2fcf53eea92634c8a863
      SOURCE_DATE: "2026-10-14"
      SOURCE_BASE_RUN: "38589322067"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fresh acquisition metadata-only dependencies
        run: python -m pip install pandas numpy
      - name: Restore original 42,111-taxon frame and exact one-species checkpoint
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fcp_resume"
          mkdir -p "$work/frame" "$work/metadata/shard_000_of_001"
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git show "$SOURCE_COMMIT:data/frozen/global_monte_carlo_species_discovery_combined_v2_species_v1.csv" > "$work/frame/taxa.csv"
          echo '5d871bd1f1190c68fd513bb527e6c93de1606dc35ff8cfff5f6187850dc382cc  '"$work"'/frame/taxa.csv' | sha256sum -c -
          gh run download "$SOURCE_BASE_RUN" --repo "$GITHUB_REPOSITORY"             --name fcp-fresh-one-species-real-metadata-batch             --dir "$work/metadata/shard_000_of_001"
          echo 'e3c5482c489081c4ea593f278f52166173049eec1e6c06d892a75983e0fb9c2b  '"$work"'/metadata/shard_000_of_001/species/47129/photo_manifest.ndjson' | sha256sum -c -
          python - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"fcp_resume/metadata/shard_000_of_001"
          p=json.loads((root/"species/47129/checkpoint.json").read_text())
          assert p["taxon_id"]==47129 and p["cursor"]==201872254 and p["batches"]==10
          assert p["created_d2"]=="2026-10-14" and p["status"]=="in_progress"
          assert p["colour_pixels_opened"] is False and p["photo_cap"] is None
          print("FCP_FRESH_SOURCE_RESUME_BASE_VERIFIED",{"photo_metadata_rows":3303,"cursor":p["cursor"]})
          PY
      - name: Resume ONE REAL species using provider ID cursor (bounded 40 pages, no biological photo count cap)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fcp_resume"
          PYTHONPATH=. python scripts/acquisition/run_fcp_uncapped_shard.py             --frame "$work/frame/taxa.csv"             --output-root "$work/metadata"             --shards 1 --shard 0 --created-before "$SOURCE_DATE"             --pages-per-species-per-run 40 --species-per-run 1
      - name: Verify new checkpoint remains a provenance-only, globally incomplete sample
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"fcp_resume/metadata/shard_000_of_001"
          s=json.loads((root/"shard_progress.json").read_text())
          c=json.loads((root/"species/47129/checkpoint.json").read_text())
          assert c["cursor"]>=201872254 and c["batches"]>10
          assert s["expected_source_species"]==42111
          assert s["new_species_worked_this_invocation"]==1
          assert s["completed_species"]+s["partial_species"]==1
          assert s["not_started_species"]==42110
          assert s["pixels_opened"] is False and s["FCP_outcomes_measured"] is False
          assert s["all_available_photo_ids_confirmed"] is False
          out={"taxon_id":47129,"source_photo_metadata_rows":s["photo_manifest_rows_including_retry_duplicates"],
               "source_species_complete":s["completed_species"],"cursor":c["cursor"],
               "page_count":c["batches"],"new_colours_measured":0,"full_census_done":False}
          (root/"real_fresh_continuation_receipt.json").write_text(json.dumps(out,indent=2)+"\n")
          print("FCP_FRESH_REAL_METADATA_CONTINUED",json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-fresh-47129-cursor-continuation-20261015
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/fcp_resume/metadata/shard_000_of_001/
