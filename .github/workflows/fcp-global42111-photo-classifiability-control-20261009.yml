name: FCP 42111 flower-photo classifiability moisture selection control

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-abiotic-join-execution-20261009
    paths:
      - scripts/analysis/audit_fcp_global42111_photo_classifiability_negative_control_20261009.py
      - tests/test_fcp_global42111_photo_classifiability_negative_control_20261009.py
      - docs/FCP_GLOBAL42111_CLASSIFIABILITY_NEGATIVE_CONTROL_20261009.md
      - .github/workflows/fcp-global42111-photo-classifiability-control-20261009.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fcp-global42111-photo-roi-classifiability-control-${{ github.ref }}
  cancel-in-progress: true

env:
  REAL_SITE_RUN: '37861582446'
  REAL_SITE_ARTIFACT: 'fcp-global42111-original-photo-real-site-climate-soil-20261009'

jobs:
  photo-classification-selection-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Test failure-mode source photo classifiability and spatial/group independence
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pytest==8.4.2
          python -m py_compile scripts/analysis/audit_fcp_global42111_photo_classifiability_negative_control_20261009.py
          python -m pytest tests/test_fcp_global42111_photo_classifiability_negative_control_20261009.py -q
      - name: Reopen original 42111 photographs' already verified metadata, never images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$REAL_SITE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$REAL_SITE_ARTIFACT" --dir /tmp/fcp_photo_ascertainment_source
          source="$(find /tmp/fcp_photo_ascertainment_source -name breadth_flower_colour_climate_soil.csv.gz -print -quit)"
          test -s "$source"
          cp "$source" /tmp/fcp_original42111_source.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          r=[]
          for p in Path('/tmp/fcp_photo_ascertainment_source').rglob('result.json'):
              q=json.loads(p.read_text())
              if q.get('schema')=='fcp_global42111_original_photo_climate_soil_attachment_v1':
                  r.append(q)
          assert len(r)==1
          assert r[0]['original_species_count']==42111
          assert r[0]['breadth_classifiable_by_covariate']['environment_climate_complete']==18413
          assert r[0]['breadth_classifiable_by_covariate']['environment_all_complete']==14136
          assert r[0]['new_colour_label_or_photo_pixel_opened'] is False
          PY
      - name: Negative-control test for whether rain predicts which source photos are flower-classifiable
        run: |
          python scripts/analysis/audit_fcp_global42111_photo_classifiability_negative_control_20261009.py \
            --original-species-abiotic /tmp/fcp_original42111_source.csv.gz \
            --outdir /tmp/fcp_global_photo_classifiability_control
      - name: Preserve original 42111 and 23654 unclassified source photos in classifiability control
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/fcp_global_photo_classifiability_control/result.json').read_text())
          assert r['schema']=='fcp_global42111_colour_classifiability_moisture_negative_control_v1'
          assert r['original_source']['original_source_taxa']==42111
          assert r['original_source']['n_classifiable_original_photos']==18457
          assert r['original_source']['n_unclassifiable_original_photos']==23654
          assert r['original_source']['n_all_photos_with_original_climate']==42014
          assert r['original_source']['n_all_photos_with_original_climate_soil']==32231
          assert r['source_four_colour_labels_not_remeasured']
          assert r['original_42111_taxa_and_23654_unclassifiable_denominators_preserved']
          assert r['never_treat_unclassifiable_photographs_as_white_or_genetic_monomorphs']
          for name in ('climate_opportunity','soil_opportunity'):
              p=r[name]
              assert p['genus_means_estimated_on_training_photograph_opportunities_only']
              assert p['same_original_source_photos_in_every_compared_model']
              assert p['n_heldout_original_photos_genus_estimable']>100
              assert all('n_heldout_original_photos' in x for x in p['models'].values())
              assert len(p['increments']['unique_moisture_beyond_genus_geography_temperature']['original_geographic_cell_bootstrap_95CI'])==2
          print('FCP_PHOTO_CLASSIFIABILITY_VS_PRECIPITATION_NEGATIVE_CONTROL_AUDITED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-global42111-photographic-colour-classifiability-control-20261009
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp_global_photo_classifiability_control/
      - name: Save checked source photograph selection diagnostic only
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = "analysis/fcp-global42111-withingenus-abiotic-20261009"
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          folder=results/fcp_global42111_photo_classifiability_moisture_control_20261009
          mkdir -p "$folder"
          cp /tmp/fcp_global_photo_classifiability_control/* "$folder/"
          git add "$folder"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Seal global 42111 source-photo flower ROI missingness as precipitation negative control'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
