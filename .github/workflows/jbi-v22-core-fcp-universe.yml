name: JBI v2.2 high-specificity core FCP universe

on:
  push:
    branches: [audit/upstream-spatial-reaudit]
    paths:
      - '.github/workflows/jbi-v22-core-fcp-universe.yml'
      - 'scripts/literature/derive_v22_core_fcp_universe.py'
      - 'scripts/literature/derive_v22_core_fcp_universe_v3.py'
      - 'scripts/literature/derive_v22_core_fcp_universe_v5.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  EXPANDED_RUN_ID: '32930987729'
  EXPANDED_ARTIFACT: 'jbi-v22-full-fcp-universe'
  RECORD_SCREEN_RUN_ID: '32835034885'
  RECORD_SCREEN_ARTIFACT: 'jbi-v22-canonical-record-screening'
  OUTDIR: 'analysis_outputs/jbi_v22_core_fcp_universe'

jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXPANDED_ARTIFACT }}
          path: expanded
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.EXPANDED_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RECORD_SCREEN_ARTIFACT }}
          path: record_screen
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.RECORD_SCREEN_RUN_ID }}
      - name: Derive core universe independently of C/S outcomes
        run: |
          mkdir -p "$OUTDIR"
          python scripts/literature/derive_v22_core_fcp_universe_v5.py \
            --source-audit expanded/v22_full_fcp_source_audit.csv \
            --record-screen record_screen/v22_record_screening_blind.csv \
            --outdir "$OUTDIR"
      - name: Validate corrected primary display core
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('analysis_outputs/jbi_v22_core_fcp_universe')
          s=json.loads((root/'v22_core_fcp_universe_summary.json').read_text())
          with (root/'v22_core_fcp_species_universe.csv').open(newline='',encoding='utf-8') as h: core=list(csv.DictReader(h))
          with Path('expanded/v22_full_fcp_species_universe.csv').open(newline='',encoding='utf-8') as h: exp=list(csv.DictReader(h))
          core_names={r['canonical_name'] for r in core}; exp_names={r['canonical_name'] for r in exp}
          assert len(exp)==78
          assert len(core)==75, (len(core),s)
          assert core_names<=exp_names
          assert any(r['organization_state']=='organization_unresolved' for r in core)
          assert s['core_FCP_species_universe']==75
          assert s['core_protocol_version']=='display-core-v5-final', s
          # Focal sexual-organ studies and review-only Salvia remain outside primary core.
          assert {'Acer pictum','Butomus umbellatus','Salvia hispanica'}.isdisjoint(core_names)
          # These are direct natural floral-display colour studies and must be retained.
          assert {'Aquilegia coerulea','Cosmos bipinnatus','Eruca sativa'}<=core_names
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jbi-v22-core-fcp-universe
          path: analysis_outputs/jbi_v22_core_fcp_universe/
          if-no-files-found: error
          retention-days: 30
