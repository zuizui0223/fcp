name: disttrait release package check

on:
  push:
    paths:
      - "packages/disttrait/**"
      - ".github/workflows/disttrait-release-check.yml"
  pull_request:
    paths:
      - "packages/disttrait/**"
      - ".github/workflows/disttrait-release-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: |
          rm -rf disttrait-dist
          python -m build packages/disttrait --outdir disttrait-dist
          ls -lh disttrait-dist

      - name: Validate distribution metadata
        run: python -m twine check disttrait-dist/*

      - name: Install wheel into a fresh virtual environment
        run: |
          python -m venv /tmp/disttrait-release-venv
          /tmp/disttrait-release-venv/bin/python -m pip install --upgrade pip
          WHEEL="$(ls disttrait-dist/*.whl)"
          /tmp/disttrait-release-venv/bin/python -m pip install "$WHEEL"

      - name: Smoke-test installed distribution outside repository
        run: |
          cd /tmp
          /tmp/disttrait-release-venv/bin/python - <<'PY'
          import importlib.metadata as md
          import numpy as np
          import disttrait

          assert md.version("disttrait") == "0.12.0"
          assert disttrait.gini_simpson([1, 1]) == 0.5
          q = disttrait.one_vs_rest_contrast(3)
          assert q.shape == (3,)
          d = disttrait.euclidean_pairwise(
              np.array([[0.0, 0.0], [3.0, 4.0], [3.0, 0.0]])
          )
          assert np.allclose(d, [5.0, 3.0, 4.0])
          print("disttrait release smoke test: PASS")
          PY

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: disttrait-0.12.0-distributions
          path: disttrait-dist/*
