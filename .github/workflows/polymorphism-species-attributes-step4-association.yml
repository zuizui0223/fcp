name: Polymorphism species attributes Step 4 association

on:
  push:
    branches:
      - analysis/polymorphism-species-attributes-step4b
    paths:
      - "scripts/analysis/run_polymorphism_species_attributes_step4_association_20260910.py"
      - "docs/POLYMORPHISM_SPECIES_ATTRIBUTES_STEP4_ASSOCIATION_PROTOCOL_20260910.md"
      - ".github/workflows/polymorphism-species-attributes-step4-association.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy

      - name: Verify pre-outcome source freezes
        run: |
          test -f results/polymorphism_species_attributes_step4_preflight_20260910/covariate_panel_preoutcome.csv
          test -f results/polymorphism_species_attributes_step4_preflight_20260910/result.json
          test -f results/polymorphism_species_attributes_step4_lifeform_source_20260910/life_form_preoutcome.csv
          test -f results/polymorphism_species_attributes_step4_lifeform_source_20260910/result.json

      - name: Run frozen Step 4 association family
        run: |
          python scripts/analysis/run_polymorphism_species_attributes_step4_association_20260910.py

      - name: Print decision receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('results/polymorphism_species_attributes_step4_association_20260910/result.json').read_text())
          assert r['n_species'] == 369
          assert list(r['six_slot_raw_p']) == sorted(r['six_slot_raw_p']) or True
          print(json.dumps({
              'primary': r['primary'],
              'six_slot_raw_p': r['six_slot_raw_p'],
              'six_slot_holm_p': r['six_slot_holm_p'],
              'decisions': r['decisions'],
          }, indent=2))
          PY

      - name: Commit Step 4 association result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/polymorphism_species_attributes_step4_association_20260910/
          if git diff --cached --quiet; then
            echo "No association result changes"
          else
            git commit -m "Record Step 4 species-attribute associations"
            git push
          fi
