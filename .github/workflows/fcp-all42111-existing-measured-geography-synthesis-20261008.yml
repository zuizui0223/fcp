name: Reconcile existing 42111 measured FCP colour and geographic evidence

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/synthesize_fcp_all42111_measured_geography_20261008.py
      - scripts/analysis/audit_fcp_global_white_balance_20261008.py
      - scripts/analysis/audit_fcp_global_white_balance_genus_20261008.py
      - scripts/analysis/audit_fcp_global_white_between_within_species_20261008.py scripts/analysis/audit_fcp_global_white_fixed_photo_depth_20261008.py
      - scripts/analysis/audit_fcp_global_white_fixed_photo_depth_20261008.py
      - tests/test_fcp_all42111_measured_geography_20261008.py
      - tests/test_fcp_global_white_balance_20261008.py
      - tests/test_fcp_global_white_balance_genus_20261008.py
      - tests/test_fcp_global_white_between_within_species_20261008.py
      - tests/test_fcp_global_white_fixed_photo_depth_20261008.py
      - docs/FCP_ALL42111_ALREADY_MEASURED_GEOGRAPHY_SYNTHESIS_PROTOCOL_20261008.md
      - .github/workflows/fcp-all42111-existing-measured-geography-synthesis-20261008.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcp-all42111-measured-synthesis-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: '2b5390ea74f8d196012499d2d35dd477f9795938'
  BREADTH_SHA: '38aa42123b4e9b05753020ff1a3b050f4d14dbd3de3194557ead90b75c0cc605'
  GEO_SHA: '7fddcf3449fbcdbaba63d857e4028636e30d2b330a6b39c01c67d42b0470140e'
  PAIR_SHA: '26755316b2cbd07e1e2241eb4ddc1cddc85219fd7e96424df8c14df32575a4d2'

jobs:
  three-scale-world-colour:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install pinned source-backed statistical and synthetic validation
        run: |
          python -m pip install -r requirements-np-bio5-replay-20260928.txt
          python -m pip install pytest==8.4.2
          python -m py_compile scripts/analysis/synthesize_fcp_all42111_measured_geography_20261008.py scripts/analysis/audit_fcp_global_white_balance_20261008.py
          python -m py_compile scripts/analysis/audit_fcp_global_white_balance_genus_20261008.py scripts/analysis/audit_fcp_global_white_between_within_species_20261008.py
          python -m pytest tests/test_fcp_all42111_measured_geography_20261008.py tests/test_fcp_global_white_balance_20261008.py tests/test_fcp_global_white_balance_genus_20261008.py tests/test_fcp_global_white_between_within_species_20261008.py tests/test_fcp_global_white_fixed_photo_depth_20261008.py -q
      - name: Reopen completed actual photo measurements, not original images
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp_premeasured_source
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git show "$SOURCE_COMMIT:results/rgfca_42111_breadth_measurement_step8f_20260911/rgfca_42111_species_breadth_measured.csv.gz" > /tmp/fcp_premeasured_source/breadth.csv.gz
          git show "$SOURCE_COMMIT:results/rgfca_42111_taxon_cell_measurement_step8g_20260911/taxon_cell_measured_85337.csv.gz" > /tmp/fcp_premeasured_source/taxon_cell.csv.gz
          git show "$SOURCE_COMMIT:results/rgfca_42111_crosscell_discordance_step8g_20260911/crosscell_discordance_pairs_13416.csv.gz" > /tmp/fcp_premeasured_source/crosscell_pairs.csv.gz
          echo "$BREADTH_SHA  /tmp/fcp_premeasured_source/breadth.csv.gz" | sha256sum -c -
          echo "$GEO_SHA  /tmp/fcp_premeasured_source/taxon_cell.csv.gz" | sha256sum -c -
          echo "$PAIR_SHA  /tmp/fcp_premeasured_source/crosscell_pairs.csv.gz" | sha256sum -c -
      - name: Complete source-grounded global colour, regions and observer-disjoint crosscell summary
        run: |
          python scripts/analysis/synthesize_fcp_all42111_measured_geography_20261008.py \
            --breadth /tmp/fcp_premeasured_source/breadth.csv.gz \
            --taxon-cell /tmp/fcp_premeasured_source/taxon_cell.csv.gz \
            --crosscell-pairs /tmp/fcp_premeasured_source/crosscell_pairs.csv.gz \
            --outdir /tmp/fcp_42111_measured_synthesis
      - name: Audit white-vs-coloured half-ratio across all photos, species-equal means, and matched species
        run: |
          python scripts/analysis/audit_fcp_global_white_balance_20261008.py \
            --taxon-cell /tmp/fcp_premeasured_source/taxon_cell.csv.gz \
            --outdir /tmp/fcp_42111_white_balance

      - name: "Sensitivity - give every genus equal weight, including paired regional contrasts"
        run: |
          python scripts/analysis/audit_fcp_global_white_balance_genus_20261008.py \
            --breadth /tmp/fcp_premeasured_source/breadth.csv.gz \
            --taxon-cell /tmp/fcp_premeasured_source/taxon_cell.csv.gz \
            --outdir /tmp/fcp_42111_genus_white_balance

      - name: Decompose global white balance between repeated species and within sampled species
        run: |
          python scripts/analysis/audit_fcp_global_white_between_within_species_20261008.py \
            --taxon-cell /tmp/fcp_premeasured_source/taxon_cell.csv.gz \
            --outdir /tmp/fcp_42111_white_species_partition

      - name: Correct finite-photo detection opportunity behind the apparent global 50:50 white balance
        run: |
          python scripts/analysis/audit_fcp_global_white_fixed_photo_depth_20261008.py \
            --original-species-regions /tmp/fcp_42111_white_species_partition/species_region_photo_white_counts.csv.gz \
            --outdir /tmp/fcp_42111_white_fixed_depth

      - name: Audit all three distinct inferential populations and missingness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/fcp_42111_measured_synthesis/result.json').read_text())
          assert j['schema']=='fcp_all42111_existing_measured_phenotype_geography_synthesis_v1'
          assert j['confirmatory_decisions_changed'] is False
          assert j['status']=='EXISTING_REAL_IMAGE_MEASUREMENT_GLOBAL_AND_REGIONAL_AUDITED'
          assert j['original_species_denominator']==42111
          b=j['breadth_single_original_photo_per_species']
          assert b['species_four_colour_classifiable']==18457
          assert b['unclassifiable']==23654
          assert b['colour_counts']=={'white':8597,'yellow_orange':6323,'red_pink':2001,'blue_purple':1536}
          a=j['regional_taxon_cell_measurement']
          assert a['all_taxon_cell_rows']==85337
          assert a['classified_taxon_cell_rows']==39075
          assert a['occupied_cells']==128
          assert len(a['abs_latitude_regions'])==3
          assert sum(r['taxon_cell_opportunities'] for r in a['abs_latitude_regions'])==85337
          p=j['observer_disjoint_crosscell_morph_comparison']
          assert p['n_fixed_pairs']==13416 and p['n_identified_pairs']==3196
          assert p['n_discordant_pairs']==797
          assert len(p['regional_and_global_descriptive'])==4
          assert p['regional_and_global_descriptive'][-1]['region']=='ALL'
          w=json.loads(Path('/tmp/fcp_42111_white_balance/result.json').read_text())
          assert w['schema']=='fcp_global42111_photo_white_balance_versus_species_turnover_audit_v1'
          assert w['status']=='SOURCE_VERIFIED_RETROSPECTIVE_WHITE_BALANCE_DESCRIPTION'
          assert w['observed_taxon_cell_rows']==85337
          assert len(w['region_white_balance'])==3
          assert sum(r['n_taxon_cell_rows'] for r in w['region_white_balance'])==85337
          assert sum(r['n_classifiable_cell'] for r in w['region_white_balance'])==39075
          assert len(w['same_species_paired_region_contrasts'])==6
          assert w['confirmatory_decisions_changed'] is False
          z=json.loads(Path('/tmp/fcp_42111_genus_white_balance/result.json').read_text())
          assert z['schema']=='fcp_global42111_genus_equal_white_geography_sensitivity_v1'
          assert z['historical_species_n']==42111 and z['historical_taxon_cell_n']==85337
          assert len(z['genus_equal_regional_white_balance'])==3
          assert len(z['genus_equal_paired_within_species_latitude_differences'])==6
          assert z['confirmatory_decisions_changed'] is False
          assert all(q['n_genera_classifiable']>0 for q in z['genus_equal_regional_white_balance'])
          d=json.loads(Path('/tmp/fcp_42111_white_species_partition/result.json').read_text())
          assert d['schema']=='fcp_global42111_white_near_half_between_within_species_photo_decomposition_v1'
          assert d['original_measured_taxon_cell_frame']==85337
          assert len(d['breakdown'])==16
          assert d['breakdown'][0]['region']=='ALL_GLOBAL'
          assert all(x['n_species']>=0 for x in d['breakdown'])
          for x in d['breakdown']:
              if x['status']=='OBSERVED_PHOTO_VARIANCE_DECOMPOSED_NOT_POPULATION_MORPH_FREQUENCY':
                  assert (x['n_species_with_white_only_in_sampled_cells']+
                          x['n_species_with_nonwhite_only_in_sampled_cells']+
                          x['n_species_with_both_white_and_nonwhite_in_sampled_cells'])==x['n_species']
                  assert 0<=x['fraction_species_with_both_observed_states']<=1
          assert d['confirmatory_decisions_changed'] is False
          depth=json.loads(Path('/tmp/fcp_42111_white_fixed_depth/result.json').read_text())
          assert depth['schema']=='fcp_all42111_white_50_50_fixed_photo_depth_sensitivity_v1'
          assert depth['status']=='RETROSPECTIVE_EQUAL_FIVE_PHOTO_DETECTION_OPPORTUNITY_DIAGNOSTIC'
          assert depth['standardized_photo_depth']==5
          assert len(depth['results'])==8
          for r in depth['results']:
              if r['n_species']>0:
                  assert 0<=r['expected_fraction_species_showing_both_colours_in_exactly_5_of_their_existing_photos']<=1
                  assert r['expected_fraction_species_showing_both_colours_in_exactly_5_of_their_existing_photos']<=r['observed_fraction_species_with_both_colours_at_all_available_depth']+1e-12
          assert depth['confirmatory_decisions_changed'] is False
          print('GLOBAL_PHOTO_WHITE_HALF_SOURCE_AND_EQUAL_FIVE_PHOTO_DETECTION_AUDITED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-42111-verified-measured-geographic-synthesis
          if-no-files-found: error
          retention-days: 90
          path: |
            /tmp/fcp_42111_measured_synthesis/
            /tmp/fcp_42111_white_balance/
            /tmp/fcp_42111_genus_white_balance/
            /tmp/fcp_42111_white_species_partition/
            /tmp/fcp_42111_white_fixed_depth/
