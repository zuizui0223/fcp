name: Phylogenetic sensitivity for automated FCP ecology

on:
  push:
    branches: [analysis/107-species-phylogenetic-sensitivity]
    paths:
      - ".github/workflows/systematic-107-phylogenetic-sensitivity.yml"
      - "analysis_phylogenetic_logistic_range_adjusted.R"
  pull_request:
    paths:
      - ".github/workflows/systematic-107-phylogenetic-sensitivity.yml"
      - "analysis_phylogenetic_logistic_range_adjusted.R"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "30858993199"
  SOURCE_ARTIFACT: "systematic-candidates-ecological-range-adjusted-v4"
  OUTDIR: "analysis_outputs/systematic_107_phylogenetic_v1"

jobs:
  phylogenetic-logistic-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ape
            any::jsonlite
            any::phylolm
            any::rotl

      - name: Parse phylogenetic analysis script
        run: Rscript -e 'parse(file="analysis_phylogenetic_logistic_range_adjusted.R")'

      - name: Download completed range-adjusted analysis
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: range_input
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Locate frozen model dataset
        run: |
          find range_input -maxdepth 4 -type f | sort
          test -f range_input/range_adjusted_main/range_adjusted_model_dataset.csv

      - name: Fit OpenTree phylogenetic logistic models
        run: |
          mkdir -p "$OUTDIR"
          Rscript analysis_phylogenetic_logistic_range_adjusted.R \
            --dataset range_input/range_adjusted_main/range_adjusted_model_dataset.csv \
            --outdir "$OUTDIR"

      - name: Validate eight phylogenetic component models
        run: |
          Rscript - <<'RS'
          root <- Sys.getenv("OUTDIR")
          x <- read.csv(file.path(root, "phylogenetic_logistic_component_models.csv"))
          stopifnot(nrow(x) == 8)
          stopifnot(all(is.finite(x$estimate)))
          stopifnot(all(x$n_species >= 20))
          cat(sprintf("validated %d phylogenetic models across %d-%d species\n", nrow(x), min(x$n_species), max(x$n_species)))
          RS

      - name: Upload phylogenetic sensitivity analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systematic-107-phylogenetic-sensitivity-v1
          path: analysis_outputs/systematic_107_phylogenetic_v1/
          if-no-files-found: error
          retention-days: 30
