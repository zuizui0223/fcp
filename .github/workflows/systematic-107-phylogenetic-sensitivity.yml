name: Phylogenetic sensitivity for automated FCP ecology

on:
  push:
    branches: [analysis/107-species-phylogenetic-sensitivity]
    paths:
      - ".github/workflows/systematic-107-phylogenetic-sensitivity.yml"
      - "analysis_phylogenetic_logistic_range_adjusted.R"
      - "analysis_multicollinearity_diagnostics.R"
  pull_request:
    paths:
      - ".github/workflows/systematic-107-phylogenetic-sensitivity.yml"
      - "analysis_phylogenetic_logistic_range_adjusted.R"
      - "analysis_multicollinearity_diagnostics.R"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "30858993199"
  SOURCE_ARTIFACT: "systematic-candidates-ecological-range-adjusted-v4"
  OUTDIR: "analysis_outputs/systematic_107_phylogenetic_v2"

jobs:
  phylogenetic-logistic-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install minimal phylogenetic dependencies
        run: |
          Rscript - <<'RS'
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          required <- c("ape", "jsonlite", "phylolm", "rotl")
          missing <- required[!vapply(required, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) install.packages(missing, dependencies = c("Depends", "Imports", "LinkingTo"))
          unavailable <- required[!vapply(required, requireNamespace, logical(1), quietly = TRUE)]
          if (length(unavailable)) {
            stop(sprintf("required R packages unavailable after installation: %s", paste(unavailable, collapse = ", ")))
          }
          print(sessionInfo())
          RS

      - name: Parse analysis scripts
        run: |
          Rscript -e 'parse(file="analysis_multicollinearity_diagnostics.R")'
          Rscript -e 'parse(file="analysis_phylogenetic_logistic_range_adjusted.R")'

      - name: Download frozen range-adjusted analysis
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: range_input
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validate frozen model dataset
        run: |
          find range_input -maxdepth 4 -type f | sort
          test -s range_input/range_adjusted_main/range_adjusted_model_dataset.csv
          python - <<'PY'
          import csv
          from collections import Counter

          p = "range_input/range_adjusted_main/range_adjusted_model_dataset.csv"
          required = {
              "canonical_name", "spatial_scale", "geographic_hull_area_km2",
              "n_occurrence_records", "n_supporting_p1_records",
              "bio1_q95q05", "bio5_q95q05", "bio6_q95q05", "bio7_q95q05",
              "bio12_q95q05", "bio14_q95q05", "bio15_q95q05", "bio17_q95q05",
          }
          counts = Counter()
          rows = 0
          with open(p, newline="", encoding="utf-8-sig") as handle:
              reader = csv.DictReader(handle)
              fields = set(reader.fieldnames or [])
              missing = sorted(required - fields)
              if missing:
                  raise SystemExit(f"missing columns: {missing}")
              for record in reader:
                  scale = record.get("spatial_scale", "")
                  if scale in {"within_population", "among_population"}:
                      rows += 1
                      counts[scale] += 1
          if rows < 20 or len(counts) != 2:
              raise SystemExit(f"insufficient binary dataset: rows={rows}, classes={dict(counts)}")
          print({"rows": rows, "classes": dict(counts)})
          PY

      - name: Diagnose multicollinearity
        run: |
          mkdir -p "$OUTDIR"
          Rscript analysis_multicollinearity_diagnostics.R \
            --dataset range_input/range_adjusted_main/range_adjusted_model_dataset.csv \
            --outdir "$OUTDIR"

      - name: Validate multicollinearity outputs
        run: |
          Rscript - <<'RS'
          root <- Sys.getenv("OUTDIR")
          required <- c(
            "climate_components_pearson_correlations.csv",
            "climate_components_spearman_correlations.csv",
            "all_predictors_pearson_correlations.csv",
            "all_predictors_spearman_correlations.csv",
            "actual_component_models_vif.csv",
            "actual_component_models_condition_numbers.csv",
            "diagnostic_all_eight_components_joint_vif.csv",
            "diagnostic_all_eight_components_joint_condition_number.csv",
            "multicollinearity_diagnostic_summary.csv"
          )
          stopifnot(all(file.exists(file.path(root, required))))
          vif <- read.csv(file.path(root, "actual_component_models_vif.csv"))
          cond <- read.csv(file.path(root, "actual_component_models_condition_numbers.csv"))
          stopifnot(length(unique(vif$model_id)) == 8)
          stopifnot(nrow(cond) == 8)
          stopifnot(all(is.finite(vif$vif)))
          stopifnot(all(is.finite(cond$condition_number)))
          print(read.csv(file.path(root, "multicollinearity_diagnostic_summary.csv")))
          RS

      - name: Fit OpenTree phylogenetic logistic models
        run: |
          Rscript analysis_phylogenetic_logistic_range_adjusted.R \
            --dataset range_input/range_adjusted_main/range_adjusted_model_dataset.csv \
            --outdir "$OUTDIR"

      - name: Validate phylogenetic component audit
        run: |
          Rscript - <<'RS'
          root <- Sys.getenv("OUTDIR")
          required <- c(
            "phylogenetic_model_fit_audit.csv",
            "phylogenetic_logistic_component_models.csv",
            "phylogenetic_logistic_all_coefficients.csv",
            "phylogenetic_vs_nonphylogenetic_same_subset.csv",
            "phylogenetic_analysis_manifest.json",
            "opentree_tnrs_audit.csv",
            "opentree_tip_mapping_audit.csv",
            "opentree_grafen_resolved.newick"
          )
          stopifnot(all(file.exists(file.path(root, required))))
          audit <- read.csv(file.path(root, "phylogenetic_model_fit_audit.csv"), stringsAsFactors = FALSE)
          stopifnot(nrow(audit) == 8)
          stopifnot(setequal(audit$status, intersect(audit$status, c("success", "failed"))))
          n_success <- sum(audit$status == "success")
          n_failed <- sum(audit$status == "failed")
          if (n_success == 0) stop("No phylogenetic component model succeeded")
          x <- read.csv(file.path(root, "phylogenetic_logistic_component_models.csv"))
          stopifnot(nrow(x) == n_success)
          stopifnot(all(is.finite(x$estimate)))
          stopifnot(all(is.finite(x$p_value)))
          stopifnot(all(x$n_species >= 20))
          cat(sprintf("phylogenetic fits: %d succeeded, %d failed\n", n_success, n_failed))
          print(audit[, c("metric", "status", "stage", "n_species", "warning", "error")])
          if (nrow(x)) print(x[, c("metric", "n_species", "odds_ratio", "p_value", "p_holm_eight_components")])
          RS

      - name: Upload phylogenetic sensitivity analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systematic-107-phylogenetic-sensitivity-v2
          path: analysis_outputs/systematic_107_phylogenetic_v2/
          if-no-files-found: warn
          retention-days: 30
