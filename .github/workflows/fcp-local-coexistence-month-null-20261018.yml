name: FCP genuine-site-time polymorphism versus spatial sorting audit
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/fcp_local_coexistence_feasibility_20261018.py
      - tests/test_fcp_local_coexistence_feasibility_20261018.py
      - .github/workflows/fcp-local-coexistence-month-null-20261018.yml
  push:
    branches: [main]
    paths:
      - scripts/analysis/fcp_local_coexistence_feasibility_20261018.py
      - tests/test_fcp_local_coexistence_feasibility_20261018.py
      - .github/workflows/fcp-local-coexistence-month-null-20261018.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fcp-local-month-null-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authentic-source-locality-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test photographic locality graph and phenology-conditioned null
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m pytest -q tests/test_fcp_local_coexistence_feasibility_20261018.py
          python -m py_compile scripts/analysis/fcp_local_coexistence_feasibility_20261018.py
      - name: Load and SHA-authenticate only the full genuinely measured 447500 photograph archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-local/{release,source,results}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_FILE" --dir /tmp/fcp-local/release
          echo "$SOURCE_ARCHIVE_SHA  /tmp/fcp-local/release/$SOURCE_FILE" | sha256sum -c -
          tar -xzf "/tmp/fcp-local/release/$SOURCE_FILE" -C /tmp/fcp-local/source
          test -s /tmp/fcp-local/source/measured/fcp_all4730_original_method_measured_photos.csv.gz
      - name: Quantify same-month nearby contrasting states and test a stronger within-month vertex null
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_local_coexistence_feasibility_20261018.py \
            --photos /tmp/fcp-local/source/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --out /tmp/fcp-local/results
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/fcp-local/results/fcp_local_coexistence_month_matched_null_result.json').read_text())
          assert d['schema']=='fcp_real_fivecohort_local_coexistence_feasibility_month_matched_null_v1'
          assert d['source_original_photo_rows']==447500
          assert d['source_four_state_classifiable_rows']==227107
          m=d['opportunity']['5km_same_month']
          assert m['n_species_with_local_pairs']==801
          assert m['n_species_with_any_different_colour_pair']==300
          assert m['n_species_with_ge5_local_pairs']==194
          assert m['n_species_with_ge30_local_pairs']==14
          assert m['pairs']==3485 and m['different_colour_pairs']==726
          a=d['month_stratified_5km_local_difference']['at_least_five_pairs']
          assert a['n_evaluable_species']==194
          assert abs(a['mean_excess_local_similarity_after_month_conditioning']-.0038700352279683616)<1e-12
          assert a['upper_p_199_month_conditioned_nulls']==.30
          b=d['month_stratified_5km_local_difference']['at_least_thirty_pairs']
          assert b['n_evaluable_species']==14
          assert b['upper_p_199_month_conditioned_nulls']==.275
          day=d['opportunity']['5km_same_day']
          assert day['n_species_with_local_pairs']==258
          assert day['n_species_with_any_different_colour_pair']==57
          assert d['all_tests_post_hoc'] is True
          print('FCP_STRICT_LOCAL_COEXISTENCE_OPPORTUNITY_AND_MONTH_NULL_AUTHENTICATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-local-photo-coexistence-feasibility-and-month-conditioned-negative-null
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp-local/results/
