name: Moricandia public pathway reanalysis

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/POLYMORPHISM_MORICANDIA_PUBLIC_PATHWAY_REANALYSIS_20260925.md
      - scripts/analysis/run_moricandia_public_pathway_reanalysis_20260925.py
      - .github/workflows/moricandia-public-pathway-reanalysis-20260925.yml

permissions:
  contents: read

jobs:
  reanalyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy openpyxl
          python -m py_compile scripts/analysis/run_moricandia_public_pathway_reanalysis_20260925.py
      - name: Download published public workbooks
        run: |
          mkdir -p /tmp/moricandia
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-020-17875-1/MediaObjects/41467_2020_17875_MOESM5_ESM.xlsx' \
            -o /tmp/moricandia/supp2.xlsx
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-020-17875-1/MediaObjects/41467_2020_17875_MOESM11_ESM.xlsx' \
            -o /tmp/moricandia/source_data.xlsx
          test -s /tmp/moricandia/supp2.xlsx
          test -s /tmp/moricandia/source_data.xlsx
          file /tmp/moricandia/supp2.xlsx /tmp/moricandia/source_data.xlsx
      - name: Run frozen node audit
        run: |
          rm -rf results/polymorphism_moricandia_public_pathway_reanalysis_20260925
          python scripts/analysis/run_moricandia_public_pathway_reanalysis_20260925.py \
            --supp2 /tmp/moricandia/supp2.xlsx \
            --source-data /tmp/moricandia/source_data.xlsx \
            --outdir results/polymorphism_moricandia_public_pathway_reanalysis_20260925
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/polymorphism_moricandia_public_pathway_reanalysis_20260925/result.json').read_text())
          assert x['schema']=='fcp_moricandia_public_pathway_reanalysis_v1'
          assert x['status']=='complete'
          assert x['fcp_nodes_total']==8
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: moricandia-public-pathway-reanalysis-v1
          if-no-files-found: error
          retention-days: 90
          path: results/polymorphism_moricandia_public_pathway_reanalysis_20260925
