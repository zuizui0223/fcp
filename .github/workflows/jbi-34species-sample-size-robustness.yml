name: JBI 34-species sample-size robustness

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful comprehensive 34-species run
        required: true
        default: "31142541223"
      source_artifact:
        description: Comprehensive artifact name
        required: true
        default: "34species-environmental-niche-comprehensive"
      simulation_reps:
        description: Replicates per metric/effect scenario
        required: true
        default: "3000"
  push:
    branches: [analysis/34species-environmental-niche-comprehensive]
    paths:
      - "analysis_34species_power_precision.py"
      - "analysis_34species_cluster_small_sample.R"
      - ".github/workflows/jbi-34species-sample-size-robustness.yml"

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: ${{ inputs.source_run_id || '31142541223' }}
  SOURCE_ARTIFACT: ${{ inputs.source_artifact || '34species-environmental-niche-comprehensive' }}
  REPS: ${{ inputs.simulation_reps || '3000' }}
  OUTDIR: analysis_outputs/jbi_34species_sample_size_robustness

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels
      - name: Install R small-sample inference dependency
        run: Rscript -e 'install.packages("clubSandwich", repos="https://cloud.r-project.org")'
      - name: Download frozen comprehensive artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source_analysis
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Locate frozen dataset
        run: |
          set -euo pipefail
          DATASET=$(find source_analysis -name environmental_niche_five_metric_model_dataset.csv | head -1)
          test -s "$DATASET"
          echo "DATASET=$DATASET" >> "$GITHUB_ENV"
      - name: Run design-based power and precision simulation
        run: |
          python analysis_34species_power_precision.py \
            --dataset "$DATASET" \
            --outdir "$OUTDIR/power_precision" \
            --reps "$REPS"
      - name: Run CR2 Satterthwaite small-cluster sensitivity
        run: |
          Rscript analysis_34species_cluster_small_sample.R \
            --dataset "$DATASET" \
            --outdir "$OUTDIR/cr2"
      - name: Validate outputs
        run: |
          set -euo pipefail
          test -s "$OUTDIR/power_precision/jbi_34species_power_precision_simulation.csv"
          test -s "$OUTDIR/power_precision/jbi_34species_power_precision_manifest.json"
          test -s "$OUTDIR/cr2/jbi_34species_cr2_satterthwaite_summary.csv"
          test -s "$OUTDIR/cr2/jbi_34species_cr2_manifest.json"
          python - <<'PY'
          import pandas as pd, os
          root=os.environ['OUTDIR']
          p=pd.read_csv(f"{root}/power_precision/jbi_34species_power_precision_simulation.csv")
          c=pd.read_csv(f"{root}/cr2/jbi_34species_cr2_satterthwaite_summary.csv")
          assert p['metric'].nunique()==5
          assert c['metric'].nunique()==5
          assert (c['n_species']==34).all()
          assert (c['n_families']==25).all()
          print(c.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jbi-34species-sample-size-robustness
          path: ${{ env.OUTDIR }}/
          if-no-files-found: error
          retention-days: 30
