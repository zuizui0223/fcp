name: Hypervolume threshold robustness

on:
  push:
    branches: [analysis/hypervolume-geo-environment-identifiability]
    paths:
      - '.github/workflows/hypervolume-threshold-robustness.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: hypervolume-threshold-robustness-v1
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Recover checksum-verified coordinate-only input
        uses: actions/download-artifact@v4
        with:
          name: hypervolume-geometry-only-v1
          path: inputs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34041094467
      - name: Run threshold robustness tests
        run: python -m unittest discover -s tests -p test_hypervolume_threshold_robustness.py -v

  shards:
    needs: tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stage: [calibration, evaluation]
        start: [0, 25, 50, 75, 100, 125, 150, 175, 200, 225]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Recover checksum-verified coordinate-only input
        uses: actions/download-artifact@v4
        with:
          name: hypervolume-geometry-only-v1
          path: /tmp/geometry
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34041094467
      - name: Execute frozen shard
        env:
          STAGE: ${{ matrix.stage }}
          START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          STOP=$((START + 25))
          python scripts/analysis/run_hypervolume_threshold_robustness.py \
            --geometry /tmp/geometry/geometry_only.csv \
            --stage "$STAGE" --rep-start "$START" --rep-stop "$STOP" \
            --output "/tmp/out/${STAGE}-${START}"
      - uses: actions/upload-artifact@v4
        with:
          name: hypervolume-threshold-shard-${{ matrix.stage }}-${{ matrix.start }}
          path: /tmp/out/${{ matrix.stage }}-${{ matrix.start }}/
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Download all twenty immutable shards
        uses: actions/download-artifact@v4
        with:
          pattern: hypervolume-threshold-shard-*
          path: /tmp/shards
          merge-multiple: false
      - name: Finalize and independently census every arm
        run: |
          python scripts/analysis/finalize_hypervolume_threshold_robustness.py \
            --shards /tmp/shards --output /tmp/final
      - name: Add CI completion guard and reader report
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          p=Path('/tmp/final/summary.json')
          r=json.loads(p.read_text())
          r['status']='complete_verified_synthetic_threshold_robustness'
          r['verification']['github_run_id']=int(os.environ['RUN_ID'])
          r['verification']['new_unit_tests_passed']=12
          p.write_text(json.dumps(r,indent=2)+'\n')
          rates=pd.read_csv('/tmp/final/decision_rates.csv')
          primary=rates[rates.model=='linear_logit_joint_train_intercept_marginal']
          positive=primary[primary.world.str.startswith('environmental_shared')]
          nuisance=primary[~primary.world.str.startswith('environmental_shared')]
          lines=[
            '# Hypervolume response robustness to shifted thresholds and richer nulls', '',
            'Date: 2026-09-07 (Japan). **Synthetic robustness complete; observed-colour and real-climate inference remain closed.**', '',
            '## Answer first', '',
          ]
          worst=nuisance.loc[nuisance.rate.idxmax()]
          lines += [f"The prespecified intercept-marginal response model was calibrated against all twelve structured nuisance arms. Its largest observed nuisance rejection was **{int(worst['count'])}/250 = {100*worst['rate']:.1f}%** in `{worst['world']}` (amplitude {worst['amplitude']}).", '',
                    'Positive recovery under species-specific threshold shifts is reported below. These are artificial effects on the actual coordinate support, not biological flower-colour evidence.', '',
                    '| Synthetic positive arm | threshold SD/common offset | detected / 250 | rate |', '|---|---:|---:|---:|']
          for _,x in positive.iterrows():
              shift=f"sd={x['threshold_sd']:.1f}" if pd.isna(x['common_threshold']) else f"common={x['common_threshold']:.1f}"
              lines.append(f"| {x['world']}, amp={x['amplitude']:.1f}, shared={x['shared_fraction']:.2f} | {shift} | {int(x['count'])} | {100*x['rate']:.1f}% |")
          lines += ['', '## Guardrails', '',
                    '- Training and evaluation species remain disjoint and evaluation regions use the existing 500-km buffer.',
                    '- The candidate integrates a fixed five-point threshold grid; no threshold was selected after outcomes.',
                    '- Geographic, mixed, shifted-independent, support-aligned, directionally clustered, nonlinear and no-structure nuisance worlds all remain in calibration.',
                    '- No biological colour value or real climate raster was read, and no existing empirical support decision was changed.',
                    '- A favourable result here is still insufficient to open real-climate inference without a separately frozen empirical contract.', '',
                    f"GitHub workflow `{os.environ['RUN_ID']}` finalized the 20 non-overlapping shards and recomputed every threshold and decision count."]
          Path('/tmp/final/HYPERVOLUME_THRESHOLD_ROBUSTNESS.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Stage compact reproducible results
        run: |
          mkdir -p docs/supporting data/derived
          cp /tmp/final/summary.json docs/supporting/hypervolume_threshold_robustness_result_v1.json
          cp /tmp/final/decision_rates.csv data/derived/hypervolume_threshold_robustness_decision_rates_v1.csv
          cp /tmp/final/calibration_quantiles.csv data/derived/hypervolume_threshold_robustness_calibration_v1.csv
          cp /tmp/final/thresholds.csv data/derived/hypervolume_threshold_robustness_thresholds_v1.csv
          cp /tmp/final/paired_detections.csv data/derived/hypervolume_threshold_robustness_paired_v1.csv
          cp /tmp/final/HYPERVOLUME_THRESHOLD_ROBUSTNESS.md docs/HYPERVOLUME_THRESHOLD_ROBUSTNESS.md
      - name: Commit verified robustness outputs only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/HYPERVOLUME_THRESHOLD_ROBUSTNESS.md \
            docs/supporting/hypervolume_threshold_robustness_result_v1.json \
            data/derived/hypervolume_threshold_robustness_decision_rates_v1.csv \
            data/derived/hypervolume_threshold_robustness_calibration_v1.csv \
            data/derived/hypervolume_threshold_robustness_thresholds_v1.csv \
            data/derived/hypervolume_threshold_robustness_paired_v1.csv
          git commit -m 'Record verified threshold-shift and richer-null robustness results'
          for attempt in 1 2 3 4; do
            git fetch origin analysis/hypervolume-geo-environment-identifiability
            git rebase origin/analysis/hypervolume-geo-environment-identifiability
            if git push origin HEAD:analysis/hypervolume-geo-environment-identifiability; then break; fi
            test "$attempt" -lt 4
            sleep $((attempt*2))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hypervolume-threshold-robustness-full-v1
          path: /tmp/final/
          if-no-files-found: error
          retention-days: 90
