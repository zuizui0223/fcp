name: FCP photographic classifiability geography audit

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/audit_polymorphism_classifiability_geography_20261010.py
      - tests/test_polymorphism_classifiability_geography_20261010.py
      - docs/POLYMORPHISM_CLASSIFIABILITY_GEOGRAPHY_PROTOCOL_20261010.md
      - .github/workflows/polymorphism-classifiability-geography-20261010.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcp-classifiability-geography
  cancel-in-progress: true

env:
  LEGACY_SHA: "5142f7951af0dde5364bb047a566d67e8c479e51"
  THIRD_SHA: "7e538e5c51c05a7cc47b2fcf53eea92634c8a863"
  DISC_SHA256: "ee854126eed2cfe23e333abe2c28d14df24895a5c52cbc389c060a5a4d6f91f4"
  VAL_SHA256: "0e2ed349122739eecfc725fb2d5e313d284cf30752da91f9a0429cff0eeaa5e6"
  THIRD_SHA256: "57630fc9f281bce94a0c40a70aaf7bce879dde93d6154175adcd021e8f5c1186"

jobs:
  technical-geography-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install pinned analysis dependencies
        run: python -m pip install numpy==2.4.6 pandas==3.0.6 scipy==1.17.1 pytest==8.4.2
      - name: Synthetic falsification guards
        run: python -m pytest tests/test_polymorphism_classifiability_geography_20261010.py -q
      - name: Recover immutable original measured photographs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$LEGACY_SHA" "$THIRD_SHA"
          git show "$LEGACY_SHA:data/derived/global_monte_carlo_measured_photos_v1.csv" > /tmp/discovery.csv
          git show "$LEGACY_SHA:data/derived/rgfca_reserve_replication_measured_photos_v1.csv" > /tmp/validation.csv
          git show "$THIRD_SHA:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv" > /tmp/third.csv
          echo "$DISC_SHA256  /tmp/discovery.csv" | sha256sum -c -
          echo "$VAL_SHA256  /tmp/validation.csv" | sha256sum -c -
          echo "$THIRD_SHA256  /tmp/third.csv" | sha256sum -c -
      - name: Run exact-source observation-process diagnostic
        run: |
          python scripts/analysis/audit_polymorphism_classifiability_geography_20261010.py \
            --discovery /tmp/discovery.csv \
            --validation /tmp/validation.csv \
            --third /tmp/third.csv \
            --outdir /tmp/fcp_classifiability_geography
      - name: Validate inference and source boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/fcp_classifiability_geography/result.json").read_text())
          assert r["schema"]=="fcp_classifiability_geography_posthoc_v1"
          assert r["confirmatory_decisions_changed"] is False
          assert [r[c]["n_high_depth_eligible_species"] for c in ("discovery","validation","third")]==[369,363,377]
          for c in ("discovery","validation","third"):
              assert r[c]["n_technical_evaluable_species"]<=r[c]["n_high_depth_eligible_species"]
              assert r[c]["n_matched_technical_colour_species"]<=r[c]["n_colour_evaluable_species"]
          print("PASS frozen sources + noncausal technical-state audit")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-classifiability-geography-posthoc-20261010
          if-no-files-found: error
          retention-days: 30
          path: /tmp/fcp_classifiability_geography/
