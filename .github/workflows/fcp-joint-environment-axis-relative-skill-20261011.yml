name: FCP joint environment white-axis versus hue relative skill
on:
  pull_request:
    branches:
      - analysis/fcp-all36-environment-joint-shapley-20261011
    paths:
      - scripts/analysis/fcp_joint_environment_axis_20261011.py
      - tests/test_fcp_joint_environment_axis_20261011.py
      - docs/FCP_JOINT_ENVIRONMENT_AXIS_RELATIVE_SKILL_20261011.md
      - .github/workflows/fcp-joint-environment-axis-relative-skill-20261011.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fcp-environment-axis-relative-skill-${{ github.ref }}
  cancel-in-progress: true
env:
  FCP_SOURCE_ROOT: /tmp/fcp_axis_original
  GH_SOURCE_PHOTO_ID: '11587115220'
  GH_SOURCE_36_ID: '11653183273'
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  original-source-axis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install original numerical requirements
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.6.1 pytest==8.4.2
      - name: Validate exact axis decomposition and baseline-error normalization
        run: python -m pytest tests/test_fcp_joint_environment_axis_20261011.py -q
      - name: Restore immutable original photographs and all-environment ledgers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$FCP_SOURCE_ROOT"
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$GH_SOURCE_PHOTO_ID/zip" > "$FCP_SOURCE_ROOT/fcp_original_photo_site_climate_soil_85337_20261010.zip"
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$GH_SOURCE_36_ID/zip" > "$FCP_SOURCE_ROOT/fcp_100543_all36_expanded_photo_site_environment_20261011.zip"
      - name: Run all eight source cohorts with 1999 paired genus bootstrap draws
        run: |
          python scripts/analysis/fcp_joint_environment_axis_20261011.py --source-root "$FCP_SOURCE_ROOT" --outdir /tmp/fcp_axis_result --bootstrap 1999
      - name: Verify source counts, algebra and historical total predictions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/fcp_axis_result/result.json').read_text())
          assert x['schema']=='fcp_joint_environment_orthogonal_white_hue_relative_skill_20261011_v1'
          assert x['source_counts']['all_rows']==100543
          assert x['source_counts']['classified']==45953
          assert x['source_counts']['climate_complete']==45836
          assert x['source_counts']['soil_complete']==31925
          assert len(x['cases'])==8 and x['bootstrap_repetitions']==1999
          expected={'soil_world':0.0014316707124248,'climate_world':0.0029429491669706}
          for name,old in expected.items():
              assert abs(x['cases'][name]['equal_genus']['total']['gain']-old)<1e-10
          for r in x['cases'].values():
              for weighting in ('equal_genus','equal_species'):
                  z=r[weighting]
                  for quantity in ('baseline_loss','environment_loss','gain'):
                      assert abs(z['white_axis'][quantity]+z['remaining_hue'][quantity]-z['total'][quantity])<1e-10
          print('PASS source SHA checks, all original targets and exact error decomposition; ecological sign not forced')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-joint-environment-orthogonal-axis-source-20261011
          retention-days: 60
          if-no-files-found: error
          path: /tmp/fcp_axis_result/
