name: White heat high-resolution matching robustness

on:
  pull_request:
    branches:
      - analysis/white-heat-local-match-result-20260925
    paths:
      - docs/POLYMORPHISM_WHITE_HEAT_HIGHRES_MATCH_ROBUSTNESS_20260925.md
      - .github/workflows/white-heat-highres-match-20260925.yml

permissions:
  contents: read
  actions: read

env:
  BIOLOGICAL_RUN_ID: "35177668182"
  BIOLOGICAL_ARTIFACT: h2-third-cohort-prospective-result-20260917
  TECHNICAL_RUN_ID: "35687421896"
  TECHNICAL_ARTIFACT: third-cohort-highlight-technical-seal-v1

jobs:
  highres-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy statsmodels rasterio
          python -m py_compile scripts/analysis/run_white_heat_local_match_20260925.py
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.BIOLOGICAL_RUN_ID }}
          github-token: ${{ github.token }}
          name: ${{ env.BIOLOGICAL_ARTIFACT }}
          path: /tmp/biological
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.TECHNICAL_RUN_ID }}
          github-token: ${{ github.token }}
          name: ${{ env.TECHNICAL_ARTIFACT }}
          path: /tmp/technical
      - name: Download WorldClim 2.5 arc-minute BIO5
        run: |
          mkdir -p /tmp/worldclim
          curl -L --fail --retry 5 --retry-delay 3             https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_2.5m_bio.zip             -o /tmp/worldclim/bio.zip
          unzip -q /tmp/worldclim/bio.zip -d /tmp/worldclim
          test -f /tmp/worldclim/wc2.1_2.5m_bio_5.tif
      - name: Run unchanged local matching at high resolution
        run: |
          MEASURED="$(find /tmp/biological -type f -name 'polymorphism_h2_third_cohort_measured_photos_v1.csv' -print -quit)"
          test -n "$MEASURED"
          rm -rf results/polymorphism_white_heat_highres_match_20260925
          python scripts/analysis/run_white_heat_local_match_20260925.py             --measured "$MEASURED"             --technical-table /tmp/technical/technical_table.csv.gz             --join-key /tmp/technical/sealed_join_key.csv             --high-clip-ids /tmp/technical/high_clip_ids.csv             --bio5 /tmp/worldclim/wc2.1_2.5m_bio_5.tif             --outdir results/polymorphism_white_heat_highres_match_20260925
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/polymorphism_white_heat_highres_match_20260925/result.json')
          x=json.loads(p.read_text())
          assert x['schema']=='fcp_white_heat_local_match_robustness_v1'
          assert x['status']=='complete'
          assert [r['threshold_km'] for r in x['results']]==[25,50,100,250]
          x['resolution']='WorldClim 2.1 2.5 arc-minute BIO5'
          p.write_text(json.dumps(x,indent=2)+'\n')
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: white-heat-highres-match-v1
          if-no-files-found: error
          retention-days: 90
          path: results/polymorphism_white_heat_highres_match_20260925
