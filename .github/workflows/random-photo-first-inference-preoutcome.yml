name: Random photo-first inference pre-outcome validation

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/random-photo-first-inference-execution
    paths:
      - ".github/workflows/random-photo-first-inference-preoutcome.yml"
      - ".github/workflows/random-photo-first-postmeasurement-inference.yml"
      - "docs/supporting/random_photo_first_inference_execution_v1.json"
      - "scripts/analysis/run_random_photo_first_h1_h2.py"
      - "scripts/analysis/run_random_photo_first_h1_h2_json_safe.py"
      - "fcp_pipeline/photo_first_h1_fast.py"
      - "fcp_pipeline/photo_first_h1_null_maps.py"
      - "fcp_pipeline/photo_first_h2_climate.py"
      - "tests/test_photo_first_h1_fast.py"
      - "tests/test_photo_first_h1_null_maps.py"
      - "tests/test_photo_first_h2_climate.py"

permissions:
  contents: read

concurrency:
  group: random-photo-first-inference-preoutcome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-frozen-inference:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyyaml
      - name: Validate execution contract and implementation identities
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          execution = json.loads(Path('docs/supporting/random_photo_first_inference_execution_v1.json').read_text())
          h1 = json.loads(Path('docs/supporting/random_photo_first_boundary_persistence_contract_v1.json').read_text())
          h2 = json.loads(Path('docs/supporting/random_photo_first_h2_climate_contract_v1.json').read_text())
          candidate = json.loads(Path('docs/supporting/random_photo_first_candidate_pool_manifest_v1.json').read_text())

          assert execution['protocol'] == 'random-photo-first-inference-execution-v1'
          assert execution['status'] == 'prospectively_frozen_before_complete_fresh_measurement_outcome'
          assert all(value is False for value in execution['outcome_firewall_at_freeze'].values())
          assert execution['immutable_input_frame']['candidate_table_sha256'] == candidate['candidate_table_sha256']
          assert execution['immutable_input_frame']['frozen_candidate_rows'] == candidate['counts']['observations'] == 20845
          assert execution['h1_primary']['photos_per_replicate'] == h1['primary_sampling']['photos_per_replicate'] == 10000
          assert execution['h1_primary']['replicates'] == h1['primary_sampling']['replicates'] == 200
          assert execution['h1_primary']['species_cap_per_cell_per_replicate'] == 2
          assert execution['h1_primary']['minimum_classifiable_photos_per_cell'] == 5
          assert execution['h1_primary']['permutations'] == h1['primary_null']['permutations'] == 999
          assert execution['h1_primary']['sampling_seed'] == 20260903
          assert execution['h1_primary']['permutation_seed'] == 20260904
          assert execution['h2_primary']['h2_must_not_rescue_non_significant_h1'] is True
          assert h2['hierarchical_role']['h2_must_not_rescue_a_non_significant_or_not_evaluable_h1'] is True

          identities = execution['implementation_identity']
          for path_key, sha_key in (
              ('h1_cached_engine_path', 'h1_cached_engine_git_blob_sha'),
              ('h1_null_maps_path', 'h1_null_maps_git_blob_sha'),
              ('h2_climate_path', 'h2_climate_git_blob_sha'),
          ):
              path = identities[path_key]
              observed = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert observed == identities[sha_key], (path, observed, identities[sha_key])

          for spec in [h2['environment_source']['primary_grid_source'], *h2['environment_source']['scale_sensitivities']]:
              observed = hashlib.sha256(Path(spec['path']).read_bytes()).hexdigest()
              assert observed == spec['content_sha256'], spec['path']
          print('frozen H1-H2 execution contract validated before measurement outcome')
          PY
      - name: Verify H1 cached/null-map and H2 cores
        run: |
          python -m pytest -q \
            tests/test_photo_first_h1_fast.py \
            tests/test_photo_first_h1_null_maps.py \
            tests/test_photo_first_h2_climate.py
      - name: Syntax-check post-measurement runners
        run: |
          python -m py_compile \
            scripts/analysis/run_random_photo_first_h1_h2.py \
            scripts/analysis/run_random_photo_first_h1_h2_json_safe.py
      - name: Verify JSON-safe technical serialization
        run: |
          python - <<'PY'
          import sys
          import numpy as np
          sys.path.insert(0, 'scripts/analysis')
          import run_random_photo_first_h1_h2_json_safe as safe

          payload = {
              'finite': 1.25,
              'nan': float('nan'),
              'inf': np.float64(float('inf')),
              'nested': [np.int64(3), np.nan],
          }
          cleaned = safe.json_safe(payload)
          assert cleaned == {
              'finite': 1.25,
              'nan': None,
              'inf': None,
              'nested': [3, None],
          }
          text = safe.safe_dumps(payload, allow_nan=False)
          assert 'NaN' not in text and 'Infinity' not in text
          print('json_safe_serialization=pass')
          PY
      - name: Parse both postmeasurement workflow YAML files
        run: |
          set -euo pipefail
          git fetch origin analysis/random-photo-first-measurement-execution
          git show origin/analysis/random-photo-first-measurement-execution:.github/workflows/random-photo-first-sync-complete-measurement-to-inference.yml > /tmp/measurement-sync.yml
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path('.github/workflows/random-photo-first-postmeasurement-inference.yml'),
              Path('/tmp/measurement-sync.yml'),
          ]
          for path in paths:
              parsed = yaml.safe_load(path.read_text())
              assert isinstance(parsed, dict)
              assert 'jobs' in parsed and parsed['jobs']
              print(f'yaml_parse=pass {path}')
          PY
