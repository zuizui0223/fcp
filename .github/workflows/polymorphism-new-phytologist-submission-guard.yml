name: New Phytologist submission guard

on:
  push:
    branches:
      - main
      - analysis/h2-third-cohort-preopening-20260916
      - promotion/polymorphism-paper-20260918
      - analysis/fcp-np-all4475-unified-20261021
    paths:
      - docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST.md
      - docs/POLYMORPHISM_NEW_PHYTOLOGIST_COVER_LETTER.md
      - tests/test_polymorphism_new_phytologist_submission.py
      - tests/test_fcp_np_all4475_submission.py
      - study_scope.json
      - results/fcp_np_all4475_unified_species_ledger_receipt_20261021.json
      - results/fcp_all4475_white_axis_structured_null_actual_20261021.json
      - results/fcp_np_all4475_W_geography_climate_fate_20261021.json
      - results/fcp_np_all4475_seven_abiotic_axes_verified_20261021.json
      - .github/workflows/polymorphism-new-phytologist-submission-guard.yml
  pull_request:
    paths:
      - docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST.md
      - docs/POLYMORPHISM_NEW_PHYTOLOGIST_COVER_LETTER.md
      - tests/test_polymorphism_new_phytologist_submission.py
      - .github/workflows/polymorphism-new-phytologist-submission-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submission-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Verify frozen historical New Phytologist data and original manuscript
        run: python -m pytest tests/test_polymorphism_new_phytologist_submission.py -q

      - name: Verify active global 4475 species New Phytologist report and source figures
        run: python -m pytest tests/test_fcp_np_all4475_submission.py -q
