name: FCP authentic colour-specific 50km neighbourhood null audit
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/fcp_colour_specific_neighbourhood_null_20261023.py
      - tests/test_fcp_colour_specific_neighbourhood_null_20261023.py
      - .github/workflows/fcp-colour-specific-neighbourhood-null-20261023.yml
      - docs/FCP_COLOUR_SPECIFIC_GEO_CLUSTER_AND_PHOTO_ERROR_20261023.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fcp-colour-specific-neighbourhood-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authenticate-four-hue-spatial-associations:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RELEASE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      ORIGINAL_RELEASE_ASSET: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      ORIGINAL_RELEASE_SHA256: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      ORIGINAL_PHOTO_SHA256: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic photo inference and synthetic-test dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
      - name: Synthetic colour-specific null/decomposition and season-confounding tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/analysis/fcp_colour_specific_neighbourhood_null_20261023.py
          python scripts/analysis/fcp_colour_specific_neighbourhood_null_20261023.py --self-test
          python -m pytest -q tests/test_fcp_colour_specific_neighbourhood_null_20261023.py
      - name: Recover exact original 447500-photo archive and source SHA
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-colour-cluster/{release,source,results}
          gh release download "$ORIGINAL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ORIGINAL_RELEASE_ASSET" --dir /tmp/fcp-colour-cluster/release
          echo "$ORIGINAL_RELEASE_SHA256  /tmp/fcp-colour-cluster/release/$ORIGINAL_RELEASE_ASSET" | sha256sum -c -
          tar -xzf "/tmp/fcp-colour-cluster/release/$ORIGINAL_RELEASE_ASSET" \
            -C /tmp/fcp-colour-cluster/source \
            measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$ORIGINAL_PHOTO_SHA256  /tmp/fcp-colour-cluster/source/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
      - name: Refit matched four-hue geographic null with independent observer and month checks
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_colour_specific_neighbourhood_null_20261023.py \
            --photos /tmp/fcp-colour-cluster/source/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --out /tmp/fcp-colour-cluster/results
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("/tmp/fcp-colour-cluster/results/colour_specific_spatial_clusters_20261023.json").read_text())
          assert a["original_photo_sha256"] == "8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6"
          assert a["n_original_photos"]==447500 and a["n_classified_photos"]==227107
          q=a["results"]
          for name,n in [
            ("two_colors_5photos",813),
            ("one_photo_per_observer_5photos",727),
            ("two_colors_10photos",462),
            ("one_photo_per_observer_10photos",406),
            ("two_colors_5photos_month_preserving_null",813)
          ]:
              assert q[name]["n_species"]==n,(name,q[name]["n_species"])
              assert q[name]["overall_adds_exactly_from_four_colour_components"] is True
              assert q[name]["overall_upper_p_199"] in [k/200 for k in range(1,201)]
          assert abs(q["two_colors_5photos"]["overall_observed_mean_global_minus_local_mismatch"]-.028549525382587742)<1e-10
          assert abs(q["one_photo_per_observer_5photos"]["overall_observed_mean_global_minus_local_mismatch"]-.026544914587817294)<1e-10
          print("FCP_FOUR_HUE_CLUSTER_REAL_SOURCE_COMPLETE",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcp-real-447500-photo-four-hue-spatial-neighbourhood-null-20261023
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/fcp-colour-cluster/results/
