name: White pollinator GloBI coverage v1

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/POLYMORPHISM_WHITE_POLLINATOR_COVERAGE_PROTOCOL_20260925.md
      - scripts/analysis/audit_white_pollinator_globi_coverage_20260925.py
      - .github/workflows/white-pollinator-globi-coverage-20260925.yml

permissions:
  contents: read
  actions: read

env:
  BIOLOGICAL_RUN_ID: "35177668182"
  BIOLOGICAL_ARTIFACT: h2-third-cohort-prospective-result-20260917

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests
          python -m py_compile scripts/analysis/audit_white_pollinator_globi_coverage_20260925.py
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.BIOLOGICAL_RUN_ID }}
          github-token: ${{ github.token }}
          name: ${{ env.BIOLOGICAL_ARTIFACT }}
          path: /tmp/biological
      - name: Run outcome-blind coverage audit
        run: |
          MEASURED="$(find /tmp/biological -type f -name 'polymorphism_h2_third_cohort_measured_photos_v1.csv' -print -quit)"
          test -n "$MEASURED"
          rm -rf results/polymorphism_white_pollinator_globi_coverage_20260925
          python scripts/analysis/audit_white_pollinator_globi_coverage_20260925.py             --measured "$MEASURED"             --outdir results/polymorphism_white_pollinator_globi_coverage_20260925             --limit 512 --workers 8 --timeout 60 --retries 4
      - name: Validate coverage contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/polymorphism_white_pollinator_globi_coverage_20260925/coverage_summary.json')
          x=json.loads(p.read_text())
          assert x['schema']=='fcp_white_pollinator_coverage_v1'
          assert x['role']=='outcome_blind_coverage_only'
          assert x['plant_frame_species']==499
          assert x['P0_query_integrity']['pass'] is True
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: white-pollinator-globi-coverage-v1
          if-no-files-found: error
          retention-days: 90
          path: results/polymorphism_white_pollinator_globi_coverage_20260925
