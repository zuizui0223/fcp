name: FCP source-authenticated 199700 photo species-leverage audit
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/audit_fcp_199700_spatial_species_leverage_20261017.py
      - tests/test_audit_fcp_199700_spatial_species_leverage_20261017.py
      - .github/workflows/fcp-199700-spatial-species-leverage-audit-20261017.yml
  push:
    branches: [main]
    paths:
      - scripts/analysis/audit_fcp_199700_spatial_species_leverage_20261017.py
      - tests/test_audit_fcp_199700_spatial_species_leverage_20261017.py
      - .github/workflows/fcp-199700-spatial-species-leverage-audit-20261017.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fcp-199700-source-verified-per-species-leverage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-source-and-leverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: fcp-real-original-199700-wave4-50km-H1-W-20261017
      RELEASE_ARCHIVE_SHA256: 844c255f28406b5158a8ac3e27d94b32aad48d785efd3c4ae512fb30ee1871ee
      RELEASE_RECEIPT_SHA256: 26c93dc7226bd0b2a96edbd626d143f26a91fc9cf1ed4b78e28bf276dbf78eeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run strict deterministic synthetic evidence guards
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m pytest -q tests/test_audit_fcp_199700_spatial_species_leverage_20261017.py
          python -m py_compile scripts/analysis/audit_fcp_199700_spatial_species_leverage_20261017.py
      - name: Recover ONLY the permanently archived genuine 199700 original-photo statistical result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-leverage/{release,unpacked,results}
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'fcp_real_original_199700_measured_and_50km_H1_W.tar.gz' \
            --dir /tmp/fcp-leverage/release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'fcp_real_199700_original_photo_H1_50km_W_receipt.json' \
            --dir /tmp/fcp-leverage/release
          echo "$RELEASE_ARCHIVE_SHA256  /tmp/fcp-leverage/release/fcp_real_original_199700_measured_and_50km_H1_W.tar.gz" | sha256sum --check
          echo "$RELEASE_RECEIPT_SHA256  /tmp/fcp-leverage/release/fcp_real_199700_original_photo_H1_50km_W_receipt.json" | sha256sum --check
          tar -xzf /tmp/fcp-leverage/release/fcp_real_original_199700_measured_and_50km_H1_W.tar.gz -C /tmp/fcp-leverage/unpacked
          test -s /tmp/fcp-leverage/unpacked/combined/original_149900_plus_wave4_species_50km.csv
          test -s /tmp/fcp-leverage/unpacked/combined/expanded_fcp_original_50km_result.json
          echo FCP_REAL_199700_ARCHIVE_AND_ORIGINAL_STATISTICAL_BYTES_AUTHENTICATED
      - name: Summarize species-sign heterogeneity and leave-largest-effect-out without changing original p
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analysis/audit_fcp_199700_spatial_species_leverage_20261017.py \
            --archive /tmp/fcp-leverage/release/fcp_real_original_199700_measured_and_50km_H1_W.tar.gz \
            --external-receipt /tmp/fcp-leverage/release/fcp_real_199700_original_photo_H1_50km_W_receipt.json \
            --extracted-root /tmp/fcp-leverage/unpacked \
            --out /tmp/fcp-leverage/results/fcp_real_199700_spatial_species_leverage_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/fcp-leverage/results/fcp_real_199700_spatial_species_leverage_audit.json')
          d=json.loads(p.read_text())
          assert d['spatially_eligible_50km_species']==741
          assert d['real_measured_photos']==199700
          assert d['not_new_statistical_confirmation'] is True
          assert d['pooled']['frozen_original_50km_upper_p']==0.005
          print('FCP_199700_SPECIES_LEVERAGE_DESCRIPTIVE_AUDIT_CONFIRMED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-real-199700-spatial-species-leverage-descriptive-audit
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp-leverage/results/
