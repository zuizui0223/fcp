name: Global RGFCA cross-domain barrier source acquisition

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "docs/supporting/global_rgfca_crossdomain_barrier_source_acquisition_authorization_v1.json"

permissions:
  contents: read

concurrency:
  group: global-rgfca-crossdomain-barrier-source-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce source-only one-shot authorization
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          if os.environ['RUN_ATTEMPT'] != '1': raise SystemExit('source acquisition rerun forbidden')
          auth=json.loads(Path('docs/supporting/global_rgfca_crossdomain_barrier_source_acquisition_authorization_v1.json').read_text())
          c=json.loads(Path(auth['contract']['path']).read_text())
          if auth.get('status')!='authorize_exactly_one_crossdomain_barrier_source_acquisition': raise SystemExit('authorization drift')
          if auth.get('workflow_attempts_allowed')!=1 or auth.get('all_three_sources_required') is not True: raise SystemExit('attempt/source gate drift')
          if auth.get('flower_colour_access_allowed') is not False or auth.get('interaction_statistic_allowed') is not False: raise SystemExit('source firewall drift')
          if c.get('status')!='postoutcome_crossdomain_source_urls_frozen_before_any_E3_or_E4_interaction_outcome': raise SystemExit('contract drift')
          if len(c.get('sources',[]))!=3 or c['acquisition_rules'].get('all_three_required') is not True: raise SystemExit('source family drift')
          actual=subprocess.check_output(['git','hash-object',auth['contract']['path']],text=True).strip()
          if actual!=auth['contract']['git_blob_sha']: raise SystemExit('contract blob drift')
          print({'gate':'pass','source_ids':[x['id'] for x in c['sources']]})
          PY

      - name: Install vector metadata dependency
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1

      - name: Download all three frozen archives once
        run: |
          set -euo pipefail
          mkdir -p /tmp/barrier-source/archives /tmp/barrier-source/extracted
          python - <<'PY' > /tmp/barrier_sources.tsv
          import json
          from pathlib import Path
          c=json.loads(Path('docs/supporting/global_rgfca_crossdomain_barrier_source_acquisition_contract_v1.json').read_text())
          for x in c['sources']:
              print(x['id'],x['url'],x['expected_archive_name'],sep='\t')
          PY
          while IFS=$'\t' read -r ident url filename; do
            echo "Downloading $ident from frozen URL"
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 "$url" -o "/tmp/barrier-source/archives/$filename"
            test -s "/tmp/barrier-source/archives/$filename"
            unzip -tq "/tmp/barrier-source/archives/$filename"
            mkdir -p "/tmp/barrier-source/extracted/$ident"
            unzip -q "/tmp/barrier-source/archives/$filename" -d "/tmp/barrier-source/extracted/$ident"
          done < /tmp/barrier_sources.tsv
          df -h /

      - name: Verify required shapefile components and freeze byte metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          import shapefile

          root=Path('/tmp/barrier-source')
          cpath=Path('docs/supporting/global_rgfca_crossdomain_barrier_source_acquisition_contract_v1.json')
          c=json.loads(cpath.read_text())
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1<<20),b''): h.update(chunk)
              return h.hexdigest()
          out=[]
          for src in c['sources']:
              ident=src['id']; archive=root/'archives'/src['expected_archive_name']
              extroot=root/'extracted'/ident
              candidates=list(extroot.rglob(src['required_internal_basename']+'.shp'))
              if len(candidates)!=1:
                  raise SystemExit(f'{ident}: expected exactly one shapefile, got {candidates}')
              shp=candidates[0]; base=shp.with_suffix('')
              components={}
              for suffix in src['required_extensions']:
                  p=Path(str(base)+suffix)
                  if not p.exists(): raise SystemExit(f'{ident}: missing {suffix}')
                  components[suffix]={"filename":p.name,"sha256":sha(p),"size_bytes":p.stat().st_size}
              r=shapefile.Reader(str(shp))
              fields=[f[0] for f in r.fields[1:]]
              required_attr=src.get('required_attribute_for_future_test')
              if required_attr and required_attr not in fields:
                  raise SystemExit(f'{ident}: missing required field {required_attr}')
              out.append({
                  "id":ident,
                  "provider":src['provider'],
                  "product":src['product'],
                  "version":src['version'],
                  "url":src['url'],
                  "archive_filename":archive.name,
                  "archive_sha256":sha(archive),
                  "archive_size_bytes":archive.stat().st_size,
                  "component_sha256":components,
                  "shape_record_count":len(r),
                  "bbox":list(map(float,r.bbox)),
                  "fields":fields,
                  "required_attribute_present": None if not required_attr else True
              })
              r.close()
          payload={
              "protocol":c['protocol'],
              "status":"pass_exact_crossdomain_barrier_source_acquisition_before_any_E3_or_E4_interaction_outcome",
              "date":"2026-09-06",
              "sources":out,
              "all_three_present":len(out)==3,
              "flower_colour_files_opened":False,
              "RGFCA_edge_join_performed":False,
              "E3_or_E4_interaction_statistic_computed":False,
              "lineage":{"source_contract_sha256":sha(cpath)}
          }
          p=root/'global_rgfca_crossdomain_barrier_source_verification_v1.json'
          p.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({"status":payload['status'],"sources":[{"id":x['id'],"sha256":x['archive_sha256'],"bytes":x['archive_size_bytes'],"records":x['shape_record_count']} for x in out]},indent=2))
          PY

      - name: Require source-only firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/barrier-source/global_rgfca_crossdomain_barrier_source_verification_v1.json').read_text())
          assert r['all_three_present'] is True
          assert r['flower_colour_files_opened'] is False
          assert r['RGFCA_edge_join_performed'] is False
          assert r['E3_or_E4_interaction_statistic_computed'] is False
          assert len(r['sources'])==3
          print('source-only barrier acquisition verified')
          PY

      - name: Upload immutable barrier source bundle
        uses: actions/upload-artifact@v4
        with:
          name: global-rgfca-crossdomain-barrier-sources-v1
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: |
            /tmp/barrier-source/archives/
            /tmp/barrier-source/global_rgfca_crossdomain_barrier_source_verification_v1.json
