name: FCP 85337 train-only geodesic spatial field beyond species photo colour means

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-multiabiotic-solar-20261010
    paths:
      - scripts/analysis/audit_fcp85337_species_geodesic_lowrank_spatial_all_abiotic_20261010.py
      - tests/test_fcp85337_species_geodesic_lowrank_spatial_all_abiotic_20261010.py
      - docs/FCP_85337_SOURCE_GEODESIC_SPATIAL_FIELD_ENVIRONMENT_20261010.md
      - .github/workflows/fcp85337-trainonly-lowrank-geodesic-spatial-20261010.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: fcp85337-original-photo-geodesic-lowrank-spatial-field-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ABIOTIC_RUN: '37861582446'
  SOURCE_ABIOTIC_ARTIFACT: 'fcp-global42111-original-photo-real-site-climate-soil-20261009'
  EXTENDED_RUN: '38011108135'
  EXTENDED_ARTIFACT: 'fcp-global42111-original-photo-complete-multiabiotic-20261010'

jobs:
  repeat-photo-species-real-geodesic-spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Test train-only geographical knots and original photographed species colour source
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.6.1 pytest==8.4.2
          python -m py_compile scripts/analysis/audit_fcp85337_species_geodesic_lowrank_spatial_all_abiotic_20261010.py
          python -m pytest tests/test_fcp85337_species_geodesic_lowrank_spatial_all_abiotic_20261010.py -q
          python scripts/analysis/audit_fcp85337_species_geodesic_lowrank_spatial_all_abiotic_20261010.py --help > /dev/null
      - name: Read checked 85337 original taxon-region photos and immutable four-state labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_ABIOTIC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ABIOTIC_ARTIFACT" --dir /tmp/fcp_original85337_geospatial_source
          f="$(find /tmp/fcp_original85337_geospatial_source -name taxon_cell_flower_colour_climate_soil.csv.gz -print -quit)"
          test -s "$f"
          cp "$f" /tmp/fcp_original_taxon_cell_geodesic_source.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          r=[]
          for p in Path('/tmp/fcp_original85337_geospatial_source').rglob('result.json'):
              z=json.loads(p.read_text())
              if z.get('schema')=='fcp_global42111_original_photo_climate_soil_attachment_v1':
                  r.append(z)
          assert len(r)==1
          assert r[0]['original_species_count']==42111
          assert r[0]['original_taxon_cell_count']==85337
          assert r[0]['new_colour_label_or_photo_pixel_opened'] is False
          PY
      - name: Reuse original true photo coordinates with 19 BIO, solar, wind, vapor, ten soils
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$EXTENDED_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$EXTENDED_ARTIFACT" --dir /tmp/fcp_original85337_expanded_source
          file="$(find /tmp/fcp_original85337_expanded_source -name all_original_100543_photo_sites_expanded_environment.csv.gz -print -quit)"
          test -s "$file"
          cp "$file" /tmp/fcp_original_100543_extended_sites.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          r=[]
          for p in Path('/tmp/fcp_original85337_expanded_source').rglob('result.json'):
              v=json.loads(p.read_text())
              if v.get('schema')=='fcp_42111_original_photo_expanded_worldclim_solar_v1':r.append(v)
          assert len(r)==1
          q=r[0]
          assert q['original_source_species']==42111
          assert q['original_source_photo_rows']==100543
          assert q['original_classified_photo_colours']==18457
          assert q['original_photo_colours_untouched'] is True
          assert q['source_cell_centroid_never_used_as_photo_location'] is True
          assert set(q['monthly_variables'])=={'srad','wind','vapr'}
          PY
      - name: Fit source train-only lowrank geodesic spatial fields at fixed 250 and 1000km and compare all seven environmental blocks
        run: |
          python scripts/analysis/audit_fcp85337_species_geodesic_lowrank_spatial_all_abiotic_20261010.py \
            --original-taxon-cell /tmp/fcp_original_taxon_cell_geodesic_source.csv.gz \
            --all-original-expanded-photo-sites /tmp/fcp_original_100543_extended_sites.csv.gz \
            --outdir /tmp/fcp_original85337_geodesic_spatial_photo_diagnostic
      - name: Verify all 85337/39075 source-photo classifications and both source-group spatial sensitivities
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          v=json.loads(Path('/tmp/fcp_original85337_geodesic_spatial_photo_diagnostic/result.json').read_text())
          assert v['schema']=='fcp_original_85337_species_fixed_geodesic_lowrank_space_all_environment_v1'
          assert v['original_85337_taxon_cell_source']['source_original_taxon_cell_photo_rows']==85337
          assert v['original_85337_taxon_cell_source']['source_four_state_colour_classifiable']==39075
          assert v['original_85337_taxon_cell_source']['source_unclassifiable_photo_cell_records']==46262
          assert v['original_42111_species_environment_coverage']['n_original_source_photo_cell_records']==85337
          assert v['source_photo_site_spatial_kernel_scales_km']==[250.0,1000.0]
          assert v['source_train_only_knot_count']==96
          assert v['source_original_photo_outcomes_unchanged'] is True
          assert v['source_original_independently_reserved_taxa_untouched'] is True
          assert v['source_species_invariant_phylogenetic_component_absorbed_in_species_intercepts'] is True
          assert v['source_spatial_field_is_low_rank_not_full_GP'] is True
          assert set(v['results'])=={'climate_without_soil_selection','climate_and_soil_complete'}
          for name,pool in v['results'].items():
              assert set(pool)=={'250km','1000km'}
              for scale,z in pool.items():
                  if z['status']!='SOURCE_SPECIES_INTERCEPT_AND_GEODESIC_LOW_RANK_SPATIAL_FIELD_EXPLORATION':
                      assert z['status'].startswith('HOLD_')
                      continue
                  assert z['training_only_unsupervised_source_photo_geographic_knots']
                  assert z['species_means_learned_only_from_other_source_geographic_regions']
                  assert z['every_source_photo_same_heldout_fold_and_model_comparison']
                  assert z['source_fourstate_photo_labels_never_reclassified']
                  assert z['n_train_species_heldout_original_photos']>=200
                  assert 'all_abiotic_beyond_species_nonlinear_space_and_geodesic_covariance' in z['source_block_predictive_gains']
          print('FCP_85337_SOURCE_TRUE_DISTANCE_LOW_RANK_SPATIAL_FIELD_ENVIRONMENTAL_EXPLORATION_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp85337-source-species-geodesic-spatial-field-20261010
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp_original85337_geodesic_spatial_photo_diagnostic/
      - name: Store exact original photo-space baseline and seven abiotic block result in separate draft branch
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = 'analysis/fcp-85337-spatial-kernel-sensitivity-20261010'
          dest=results/fcp_original85337_trainonly_geodesic_spatial_environment_20261010
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
            git reset --hard "origin/$HEAD_REF"
            mkdir -p "$dest"
            cp /tmp/fcp_original85337_geodesic_spatial_photo_diagnostic/* "$dest/"
            git add "$dest"
            if git diff --cached --quiet; then
              echo "Identical original photo source receipt already saved"
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Seal same species flower-colour environment after original train-only geodesic lowrank spatial field'
            if git push origin "HEAD:refs/heads/$HEAD_REF"; then exit 0; fi
            echo "Safe concurrent unrelated branch commit; retry from new head"
          done
          exit 1
