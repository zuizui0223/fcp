name: JBI atlas measurement v5 pre-image freeze

on:
  pull_request:
    paths:
      - "docs/supporting/jbi_atlas_measurement_execution_contract_v5.json"
      - "docs/supporting/jbi_atlas_real_colour_inference_amendment_v5.json"
      - "docs/supporting/jbi_image_first_atlas_inference_contract_v5.json"
      - "docs/supporting/jbi_atlas_shared_transition_v5_signal_recovery_result.json"
      - "docs/supporting/jbi_atlas_dated_source_uuid_bucket_amendment_v4.json"
      - "docs/supporting/jbi_atlas_dated_source_streaming_v3_stop_result.json"
      - "data/atlas/qualification/roi_v4_locked_test/jrc_roi_v4_locked_test_result.json"
      - "fcp_pipeline/atlas_acquisition_v5.py"
      - "fcp_pipeline/atlas_measurement_v5.py"
      - "fcp_pipeline/atlas_real_inference_v5.py"
      - "fcp_pipeline/atlas_measurement.py"
      - "fcp_pipeline/atlas_inference_cascade.py"
      - "scripts/data/acquire_jbi_atlas_blinded_images_v5.py"
      - "scripts/data/measure_jbi_atlas_blinded_images_v5.py"
      - "scripts/data/build_jbi_atlas_measurement_firewall_v5.py"
      - "scripts/data/evaluate_jbi_atlas_measurement_gate_v5.py"
      - "scripts/data/run_jbi_atlas_precolour_environmental_coverage_v5.py"
      - "scripts/data/validate_jbi_atlas_measurement_v5_contract.py"
      - "scripts/data/validate_jbi_atlas_real_colour_inference_v5.py"
      - "tests/test_atlas_measurement_v5.py"
      - "tests/test_atlas_real_inference_v5.py"
      - "tests/test_atlas_precolour_environmental_coverage_v5.py"
      - ".github/workflows/jbi-atlas-measurement-v5.yml"
  push:
    branches:
      - analysis/jbi-global-colour-boundaries-scaleup
    paths:
      - "docs/supporting/jbi_atlas_measurement_execution_contract_v5.json"
      - "docs/supporting/jbi_atlas_real_colour_inference_amendment_v5.json"
      - "docs/supporting/jbi_image_first_atlas_inference_contract_v5.json"
      - "docs/supporting/jbi_atlas_shared_transition_v5_signal_recovery_result.json"
      - "docs/supporting/jbi_atlas_dated_source_uuid_bucket_amendment_v4.json"
      - "docs/supporting/jbi_atlas_dated_source_streaming_v3_stop_result.json"
      - "data/atlas/qualification/roi_v4_locked_test/jrc_roi_v4_locked_test_result.json"
      - "fcp_pipeline/atlas_acquisition_v5.py"
      - "fcp_pipeline/atlas_measurement_v5.py"
      - "fcp_pipeline/atlas_real_inference_v5.py"
      - "fcp_pipeline/atlas_measurement.py"
      - "fcp_pipeline/atlas_inference_cascade.py"
      - "scripts/data/acquire_jbi_atlas_blinded_images_v5.py"
      - "scripts/data/measure_jbi_atlas_blinded_images_v5.py"
      - "scripts/data/build_jbi_atlas_measurement_firewall_v5.py"
      - "scripts/data/evaluate_jbi_atlas_measurement_gate_v5.py"
      - "scripts/data/run_jbi_atlas_precolour_environmental_coverage_v5.py"
      - "scripts/data/validate_jbi_atlas_measurement_v5_contract.py"
      - "scripts/data/validate_jbi_atlas_real_colour_inference_v5.py"
      - "tests/test_atlas_measurement_v5.py"
      - "tests/test_atlas_real_inference_v5.py"
      - "tests/test_atlas_precolour_environmental_coverage_v5.py"
      - ".github/workflows/jbi-atlas-measurement-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v5-preimage-freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate immutable v5 measurement parents
        run: |
          python scripts/data/validate_jbi_atlas_real_colour_inference_v5.py
          python scripts/data/validate_jbi_atlas_measurement_v5_contract.py
      - name: Test v5 gate conjunction, source v4, location blindness and real inference
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_atlas_measurement_v5.py \
            tests/test_atlas_real_inference_v5.py \
            tests/test_atlas_inference_cascade.py \
            tests/test_atlas_precolour_environmental_coverage_v5.py
      - name: Syntax-check v5 worker entrypoints without opening pixels
        run: |
          python -m py_compile \
            scripts/data/acquire_jbi_atlas_blinded_images_v5.py \
            scripts/data/measure_jbi_atlas_blinded_images_v5.py \
            scripts/data/evaluate_jbi_atlas_measurement_gate_v5.py \
            scripts/data/run_jbi_atlas_precolour_environmental_coverage_v5.py \
            scripts/data/build_jbi_atlas_measurement_firewall_v5.py
