name: disttrait empirical transport

on:
  push:
    paths:
      - "packages/disttrait/src/disttrait/**"
      - "packages/disttrait/fixtures/sf_street_trees_v1*"
      - "packages/disttrait/examples/sf_street_tree_empirical.py"
      - ".github/workflows/disttrait-empirical-transport.yml"
  pull_request:
    paths:
      - "packages/disttrait/src/disttrait/**"
      - "packages/disttrait/fixtures/sf_street_trees_v1*"
      - "packages/disttrait/examples/sf_street_tree_empirical.py"
      - ".github/workflows/disttrait-empirical-transport.yml"

permissions:
  contents: read

jobs:
  empirical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install disttrait
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/disttrait

      - name: Run SF street-tree transport
        run: |
          python packages/disttrait/examples/sf_street_tree_empirical.py \
            --output disttrait_sf_empirical_result.json

      - name: Upload empirical transport receipt
        uses: actions/upload-artifact@v4
        with:
          name: disttrait-sf-empirical-transport-only
          path: disttrait_sf_empirical_result.json
