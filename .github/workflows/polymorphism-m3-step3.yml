name: Polymorphism M3 Step 3

on:
  push:
    branches:
      - analysis/polymorphism-m3-step3
    paths:
      - "scripts/analysis/run_polymorphism_m3_step3_20260909.py"
      - "docs/POLYMORPHISM_M3_STEP3_PROTOCOL_20260909.md"
      - ".github/workflows/polymorphism-m3-step3.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . scipy pandas numpy
      - name: Run frozen Step 3
        run: python scripts/analysis/run_polymorphism_m3_step3_20260909.py
      - name: Commit Step 3 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/polymorphism_m3_step3_20260909/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record polymorphism M3 Step 3 result"
            git push
          fi
