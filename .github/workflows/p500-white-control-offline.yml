name: P500 white control offline qualification

on:
  push:
    branches: [analysis/p500-white-measurement-control-freeze-20260913]
    paths:
      - fcp_pipeline/p500_white_measurement_control.py
      - tests/test_p500_white_measurement_control.py
      - tests/test_p500_offline_workflow.py
      - .github/workflows/p500-white-control-offline.yml
      - .github/workflows/rgfca-independent-global-axis-metadata-recovery-v2.yml
      - docs/P500_WHITE_CONTROL_IMPLEMENTATION_ERRATUM_20260915.md
  pull_request:
    paths:
      - fcp_pipeline/p500_white_measurement_control.py
      - tests/test_p500_white_measurement_control.py
      - tests/test_p500_offline_workflow.py
      - .github/workflows/p500-white-control-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy pytest PyYAML
      - name: Test real-input rejection and synthetic contract guards
        run: python -m pytest tests/test_p500_white_measurement_control.py tests/test_p500_offline_workflow.py -q
      - name: Save static evidence without opening images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fcp_pipeline.p500_white_measurement_control import inspect_candidate_metadata, PREFLIGHT_PATH
          report = inspect_candidate_metadata(json.loads(Path(PREFLIGHT_PATH).read_text()))
          assert report['candidate_metadata_supported'] is True
          assert report['execution_chronology_verified'] is False
          assert report['opening_authorized'] is False
          Path('p500-static-evidence.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p500-static-evidence
          path: p500-static-evidence.json
          if-no-files-found: error
