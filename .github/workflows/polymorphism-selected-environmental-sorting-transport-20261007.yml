name: FCP selected environmental sorting transport

on:
  pull_request:
    branches: [main]
    paths:
      - docs/POLYMORPHISM_SELECTED_ENVIRONMENTAL_SORTING_TRANSPORT_PROTOCOL_20261007.md
      - scripts/analysis/run_polymorphism_selected_environmental_sorting_transport_20261007.py
      - .github/workflows/polymorphism-selected-environmental-sorting-transport-20261007.yml
  workflow_dispatch:

concurrency:
  group: fcp-selected-env-transport-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  THIRD_SHA: "7e538e5c51c05a7cc47b2fcf53eea92634c8a863"
  THIRD_SHA256: "57630fc9f281bce94a0c40a70aaf7bce879dde93d6154175adcd021e8f5c1186"

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install frozen runtime
        run: |
          python -m pip install -r requirements-np-bio5-replay-20260928.txt
          python -m py_compile scripts/analysis/run_polymorphism_selected_environmental_sorting_transport_20261007.py

      - name: Recover immutable third-cohort measured table
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$THIRD_SHA"
          git show "$THIRD_SHA:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv" > /tmp/third.csv
          echo "$THIRD_SHA256  /tmp/third.csv" | sha256sum -c -

      - name: Recover checksum-pinned WorldClim inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/worldclim/bio /tmp/worldclim/srad
          curl -L --fail --retry 5 --retry-delay 3 \
            https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip \
            -o /tmp/worldclim/bio.zip
          curl -L --fail --retry 5 --retry-delay 3 \
            https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_srad.zip \
            -o /tmp/worldclim/srad.zip
          echo '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf  /tmp/worldclim/bio.zip' | sha256sum -c -
          echo 'c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026  /tmp/worldclim/srad.zip' | sha256sum -c -
          unzip -q /tmp/worldclim/bio.zip -d /tmp/worldclim/bio
          unzip -q /tmp/worldclim/srad.zip -d /tmp/worldclim/srad
          echo '32e02d85868734c32547da70cf9c620f4739a3cf5dbc4f2b751e16ebb2338ae1  /tmp/worldclim/bio/wc2.1_10m_bio_5.tif' | sha256sum -c -

      - name: Run fixed third-cohort transport
        run: |
          rm -rf /tmp/fcp_selected_transport
          python scripts/analysis/run_polymorphism_selected_environmental_sorting_transport_20261007.py \
            --third /tmp/third.csv \
            --bio5 /tmp/worldclim/bio/wc2.1_10m_bio_5.tif \
            --srad-dir /tmp/worldclim/srad \
            --outdir /tmp/fcp_selected_transport

      - name: Validate transport boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/fcp_selected_transport/result.json").read_text())
          assert r["schema"]=="fcp_selected_environmental_sorting_transport_v1"
          assert r["status"]=="complete_fixed_species_disjoint_posthoc_transport"
          assert r["confirmatory_decisions_changed"] is False
          assert r["eligible_species"] >= 300
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fcp-selected-environmental-sorting-transport-20261007
          if-no-files-found: error
          retention-days: 30
          path: /tmp/fcp_selected_transport/
