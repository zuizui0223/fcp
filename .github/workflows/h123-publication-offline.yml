name: H1-H3 publication offline checks

on:
  push:
    branches: [analysis/fcp-h123-publication-20260915]
  pull_request:
    paths:
      - docs/FCP_H123*.md
      - tests/test_h123_publication_scope.py
      - tests/test_h123_evidence_figure.py
      - scripts/analysis/make_h123_evidence_figure.py
      - docs/figures/h123/**
      - tests/test_p500_technical_snapshot.py
      - fcp_pipeline/p500_technical_snapshot.py
      - fcp_pipeline/p500_coupling.py
      - tests/test_p500_coupling.py
      - .github/workflows/h123-publication-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install numpy pytest PyYAML scipy==1.15.3 statsmodels==0.14.6 matplotlib==3.10.8
      - name: Check draft evidence and closed-image safeguards
        run: python -m pytest tests/test_h123_publication_scope.py tests/test_p500_white_measurement_control.py tests/test_p500_offline_workflow.py tests/test_p500_technical_snapshot.py tests/test_p500_coupling.py tests/test_h123_evidence_figure.py -q --junitxml=h123-offline-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h123-offline-tests
          path: h123-offline-tests.xml
          if-no-files-found: error
