name: FCP H2 H3 real geoclimate crossing feasibility from 447500 source photos
on:
  push:
    branches: [analysis/fcp-h1-h5-minimal-20261020]
    paths:
      - scripts/analysis/fcp_h2_h3_geoclimatic_crossed_sites_20261020.py
      - .github/workflows/fcp-h2-h3-geoclimate-field-opportunity-20261020.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-real-climate-crossing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PHOTO_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      PHOTO_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      PHOTO_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      CLIMATE_TAG: fcp-worldclim-2.1-10m-20260925
      CLIMATE_FILE: wc2.1_10m_bio.zip
      CLIMATE_SHA: 00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen numerical dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 Pillow==11.0.0
      - name: Real geographical and climate site comparison arithmetic selftest
        run: |
          python -m py_compile scripts/analysis/fcp_h2_h3_geoclimatic_crossed_sites_20261020.py
          python scripts/analysis/fcp_h2_h3_geoclimatic_crossed_sites_20261020.py --self-test
      - name: Recover SHA-authenticated actual original 447500 photos and historical-normal raster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-h2-h3/{archive,measured,climate,results}
          gh release download "$PHOTO_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PHOTO_FILE" --dir /tmp/fcp-h2-h3/archive
          echo "$PHOTO_ARCHIVE_SHA  /tmp/fcp-h2-h3/archive/$PHOTO_FILE" | sha256sum -c -
          tar -xzf "/tmp/fcp-h2-h3/archive/$PHOTO_FILE" -C /tmp/fcp-h2-h3/measured
          test -s /tmp/fcp-h2-h3/measured/measured/fcp_all4730_original_method_measured_photos.csv.gz
          gh release download "$CLIMATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$CLIMATE_FILE" --dir /tmp/fcp-h2-h3/climate
          echo "$CLIMATE_SHA  /tmp/fcp-h2-h3/climate/$CLIMATE_FILE" | sha256sum -c -
      - name: Profile outcome-blind crossed distance versus climate locality-pair opportunities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_h2_h3_geoclimatic_crossed_sites_20261020.py \
            --photos /tmp/fcp-h2-h3/measured/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --worldclim-zip /tmp/fcp-h2-h3/climate/wc2.1_10m_bio.zip \
            --out /tmp/fcp-h2-h3/results
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/fcp-h2-h3/results/fcp_global_H2_H3_climate_crossing_source_result.json').read_text())
          assert x['original_photo_rows']==447500 and x['original_species']==4475
          assert x['original_classifiable_photo_rows']==227107
          assert x['independent_source_observation_rows_with_bioclim']>0
          assert len(x['source_frame_diagnostics'])==6
          assert x['label_outcome_not_used_to_choose_cells_or_pairings'] is True
          assert x['sensitive_coordinates_and_photo_identifiers_exported'] is False
          print("FCP_H2_H3_SOURCE_REAL_GEOGRAPHY_CROSSED_DESIGN_QA_PASS")
          print("FCP_H2_H3_FULL_GEOCELL_RESULT_JSON",json.dumps(x,sort_keys=True,separators=(",",":"),allow_nan=False))
          PY
      - name: Upload public safe world H2 H3 field feasibility artifacts without original coordinate exposure
        uses: actions/upload-artifact@v4
        with:
          name: fcp-original447500-H2H3-crossed-geoclimate-screen-20261020
          path: /tmp/fcp-h2-h3/results/
          if-no-files-found: error
          retention-days: 90
