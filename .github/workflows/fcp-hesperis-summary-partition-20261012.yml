name: FCP Hesperis summary partition and bounded source recovery
on:
  pull_request:
    branches: [analysis/fcp-field-census-benchmark-20261012]
    paths:
      - 'packages/fcp_hesperis_entropy_20261012/**'
      - '.github/workflows/fcp-hesperis-summary-partition-20261012.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - name: Focused tests
        run: python -m pytest -q packages/fcp_hesperis_entropy_20261012/tests
      - name: Recompute summary identity and independently verify
        working-directory: packages/fcp_hesperis_entropy_20261012
        run: |
          python scripts/analysis/fcp_hesperis_entropy_20261012.py --summary data/hesperis_published_summary.csv --counts data/linanthus_counts.csv --outdir results
          python scripts/analysis/verify_fcp_hesperis_entropy_20261012.py --root .
      - name: Record complete repository pytest outcome separately
        shell: bash
        run: |
          set +e
          python -m pytest -q > /tmp/fcp-hesperis-full-suite.txt 2>&1
          rc=$?
          echo "FULL_REPOSITORY_PYTEST_EXIT=$rc" | tee /tmp/fcp-hesperis-full-suite-status.txt
          tail -n 65 /tmp/fcp-hesperis-full-suite.txt
          exit 0
      - name: Attempt only four public companion-data downloads
        run: python packages/fcp_hesperis_entropy_20261012/scripts/analysis/recover_hesperis_public_data_20261012.py --outdir /tmp/fcp-hesperis-public-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcp-hesperis-summary-and-public-recovery-20261012
          retention-days: 60
          path: |
            packages/fcp_hesperis_entropy_20261012/results/
            /tmp/fcp-hesperis-public-recovery/
            /tmp/fcp-hesperis-full-suite.txt
            /tmp/fcp-hesperis-full-suite-status.txt
