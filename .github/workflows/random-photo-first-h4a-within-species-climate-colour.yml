name: Random photo-first exploratory H4a within-species climate colour

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/random-photo-first-inference-execution
    paths:
      - "docs/supporting/random_photo_first_h4a_within_species_climate_colour_contract_v1.json"
      - "scripts/analysis/run_random_photo_first_h4a_within_species_climate_colour.py"
      - ".github/workflows/random-photo-first-h4a-within-species-climate-colour.yml"

permissions:
  contents: write

concurrency:
  group: random-photo-first-h4a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h4a:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Require frozen exploratory H4a contract and completed parent lineage
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          contract = json.loads(Path('docs/supporting/random_photo_first_h4a_within_species_climate_colour_contract_v1.json').read_text())
          measurement = json.loads(Path('docs/supporting/random_photo_first_measurement_result_v1.json').read_text())
          h1 = json.loads(Path('docs/supporting/random_photo_first_h1_result_v1.json').read_text())
          h2 = json.loads(Path('docs/supporting/random_photo_first_h2_result_v1.json').read_text())
          capacity = json.loads(Path('docs/supporting/random_photo_first_h4_within_species_capacity_v1.json').read_text())
          measured = Path('data/derived/random_photo_first_measured_photos_v1.csv')

          assert contract['status'] == 'exploratory_frozen_after_h1_h2_outcomes_before_any_h4a_climate_colour_join_or_test'
          assert contract['introduced_after_h1_h2_outcomes'] is True
          assert contract['claim_role'] == 'exploratory_only_cannot_rescue_replace_or_reinterpret_h1_h2'
          assert contract['primary_species_frame']['capacity_audit_species'] == 74
          assert contract['primary_species_frame']['capacity_audit_photos'] == 1557
          assert contract['null']['permutations'] == 999
          assert contract['null']['seed'] == 20260905
          assert hashlib.sha256(measured.read_bytes()).hexdigest() == measurement['measurement_table_sha256'] == contract['lineage']['measurement_table_sha256']
          assert measurement['classified_rows'] == 10103
          assert capacity['status'] == 'complete_exploratory_capacity_audit_no_h4_model_fit'
          assert h1['decision'] == 'no_support_excess_recurrent_boundary_concentration'
          assert h1['primary']['p_upper'] == 0.413
          assert h2['hierarchical_decision'] == 'diagnostic_only_h1_not_supported_no_climate_mechanism_claim'
          assert h2['primary']['support'] is False
          print('h4a_prejoin_lineage=pass')
          PY
      - name: Run frozen H4a climate-colour join and permutation test
        run: python scripts/analysis/run_random_photo_first_h4a_within_species_climate_colour.py
      - name: Validate H4a decision and claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          h4a = json.loads(Path('docs/supporting/random_photo_first_h4a_result_v1.json').read_text())
          h1 = json.loads(Path('docs/supporting/random_photo_first_h1_result_v1.json').read_text())
          h2 = json.loads(Path('docs/supporting/random_photo_first_h2_result_v1.json').read_text())
          assert h4a['status'] in {'complete_exploratory_h4a_evaluable', 'not_evaluable_exploratory_h4a'}
          assert h4a['introduced_after_h1_h2_outcomes'] is True
          assert h4a['claim_role'] == 'exploratory_only_cannot_rescue_replace_or_reinterpret_h1_h2'
          assert h4a['colour_representation']['ordered_morph_axis_used'] is False
          assert h4a['lineage']['permutations'] == 999
          assert h4a['lineage']['seed'] == 20260905
          assert h4a['frozen_primary_decisions_unchanged']['h1'] == h1['decision']
          assert h4a['frozen_primary_decisions_unchanged']['h2'] == h2['hierarchical_decision']
          if h4a['status'] == 'complete_exploratory_h4a_evaluable':
              primary = h4a['primary']
              assert primary['primary'] is True
              assert primary['minimum_evaluable_species_required'] == 30
              assert primary['permutations'] == 999
              assert 0.0 <= primary['p_upper'] <= 1.0
              support = primary['evaluable_species'] >= 30 and primary['observed_mean_spearman_rho'] > 0 and primary['p_upper'] < 0.05
              assert primary['support'] is support
              assert h4a['h4b_directional_decomposition_opened'] is support
          else:
              assert h4a['h4b_directional_decomposition_opened'] is False
          print(json.dumps(h4a, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: random-photo-first-h4a-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            docs/supporting/random_photo_first_h4a_result_v1.json
            data/derived/random_photo_first_h4a_species_primary_v1.csv
            data/derived/random_photo_first_h4a_null_primary_v1.csv
            data/derived/random_photo_first_h4a_sensitivities_v1.csv
      - name: Commit H4a outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporting/random_photo_first_h4a_result_v1.json \
                  data/derived/random_photo_first_h4a_species_primary_v1.csv \
                  data/derived/random_photo_first_h4a_null_primary_v1.csv \
                  data/derived/random_photo_first_h4a_sensitivities_v1.csv
          git commit -m "Run exploratory random photo-first H4a"
          git fetch origin analysis/random-photo-first-inference-execution
          git rebase origin/analysis/random-photo-first-inference-execution
          git push origin HEAD:analysis/random-photo-first-inference-execution
