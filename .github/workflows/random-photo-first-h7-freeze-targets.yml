name: Random photo-first H7 freeze targets

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/random-photo-first-h7-balanced-itv
    paths:
      - "docs/supporting/random_photo_first_h7_balanced_itv_contract_v1.json"
      - "scripts/analysis/freeze_random_photo_first_h7_targets.py"
      - "scripts/analysis/freeze_random_photo_first_h7_exclusions.py"
      - ".github/workflows/random-photo-first-h7-freeze-targets.yml"

permissions:
  contents: write

concurrency:
  group: random-photo-first-h7-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate prospective H7 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/supporting/random_photo_first_h7_balanced_itv_contract_v1.json').read_text())
          a = json.loads(Path('docs/supporting/random_photo_first_h7_metadata_feasibility_result_v1.json').read_text())
          assert c['status'] == 'prospective_h7_frozen_after_metadata_feasibility_before_any_fresh_h7_query_or_pixel'
          assert c['species_discovery']['expected_species'] == 52
          assert c['target_cells']['cells_per_species'] == 6
          assert c['fresh_metadata_acquisition']['expected_queries'] == 312
          assert c['decision_rule']['conjunctive_gate'] is True
          assert a['outcome_firewall']['fresh_h7_api_queries_opened'] is False
          print('h7_contract_prequery=pass')
          PY

      - name: Download exact PR21 terminal metadata manifest
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/zuizui0223/fcp/f7003e57c82fec3023de93b9724166cf8b279877/data/atlas/jbi_image_first_atlas_observation_manifest_v1.csv" \
            -o /tmp/pr21_manifest.csv
          test "$(git hash-object /tmp/pr21_manifest.csv)" = "e019cb41abd37bbea19fe426a09b016056aaa7ea"

      - name: Freeze 52 species x 6 target cells
        run: python scripts/analysis/freeze_random_photo_first_h7_targets.py

      - name: Freeze prior-photo exclusion ledger
        run: python scripts/analysis/freeze_random_photo_first_h7_exclusions.py --pr21-manifest /tmp/pr21_manifest.csv

      - name: Validate target and exclusion firewalls
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          t = json.loads(Path('docs/supporting/random_photo_first_h7_target_manifest_v1.json').read_text())
          e = json.loads(Path('docs/supporting/random_photo_first_h7_exclusion_manifest_v1.json').read_text())
          tab = pd.read_csv('data/frozen/random_photo_first_h7_species_cells_v1.csv')
          assert t['species'] == 52 and t['species_cell_targets'] == 312
          assert len(tab) == 312 and tab['inat_taxon_id'].nunique() == 52
          assert (tab.groupby('inat_taxon_id')['cell_id'].nunique() == 6).all()
          assert t['outcome_firewall']['fresh_h7_api_queries_opened'] is False
          assert e['source_rows']['pr21_terminal_60000'] == 60000
          assert e['fresh_h7_api_queries_opened'] is False
          assert e['fresh_h7_pixels_opened'] is False
          print(json.dumps({'targets': t, 'exclusions': e}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: random-photo-first-h7-prequery-freeze-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            data/frozen/random_photo_first_h7_species_cells_v1.csv
            data/frozen/random_photo_first_h7_exclusion_ledger_v1.csv
            docs/supporting/random_photo_first_h7_target_manifest_v1.json
            docs/supporting/random_photo_first_h7_exclusion_manifest_v1.json

      - name: Commit prequery freezes if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/frozen/random_photo_first_h7_species_cells_v1.csv \
                  data/frozen/random_photo_first_h7_exclusion_ledger_v1.csv \
                  docs/supporting/random_photo_first_h7_target_manifest_v1.json \
                  docs/supporting/random_photo_first_h7_exclusion_manifest_v1.json
          if git diff --cached --quiet; then
            echo "h7_prequery_freezes_already_identical=true"
            exit 0
          fi
          git commit -m "Freeze H7 species cells and prior-photo exclusions"
          git fetch origin analysis/random-photo-first-h7-balanced-itv
          git rebase origin/analysis/random-photo-first-h7-balanced-itv
          git push origin HEAD:analysis/random-photo-first-h7-balanced-itv
