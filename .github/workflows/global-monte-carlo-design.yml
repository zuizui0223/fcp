name: Global Monte Carlo barrier-atlas design

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "fcp_pipeline/global_monte_carlo.py"
      - "fcp_pipeline/global_repeated_atlas.py"
      - "fcp_pipeline/global_rgfca_engine.py"
      - "fcp_pipeline/global_g3.py"
      - "fcp_pipeline/global_candidate_acquisition.py"
      - "fcp_pipeline/global_capacity_handoff.py"
      - "fcp_pipeline/global_capacity_recovery.py"
      - "fcp_pipeline/global_barrier_field.py"
      - "fcp_pipeline/global_overlay_alignment.py"
      - "fcp_pipeline/global_edge_mechanism_v2.py"
      - "fcp_pipeline/global_colour_zones.py"
      - "fcp_pipeline/global_community_colour_assembly.py"
      - "fcp_pipeline/global_pair_context_profiles.py"
      - "scripts/acquisition/freeze_global_monte_carlo_species_discovery.py"
      - "scripts/acquisition/run_global_monte_carlo_capacity_scan.py"
      - "scripts/acquisition/run_global_monte_carlo_capacity_429_recovery_shard.py"
      - "scripts/acquisition/run_global_monte_carlo_candidate_acquisition_shard.py"
      - "scripts/analysis/generate_global_monte_carlo_candidate_authorization.py"
      - "scripts/analysis/generate_global_monte_carlo_measurement_authorization.py"
      - "scripts/analysis/generate_global_monte_carlo_inference_authorization.py"
      - "scripts/analysis/reduce_global_monte_carlo_candidate_acquisition.py"
      - "scripts/analysis/reduce_global_monte_carlo_capacity_429_recovery.py"
      - "scripts/analysis/build_global_monte_carlo_measurement_firewall.py"
      - "scripts/analysis/reassemble_global_monte_carlo_measurement.py"
      - "scripts/analysis/run_global_rgfca_g1_shard.py"
      - "scripts/analysis/reduce_global_rgfca_g1.py"
      - "scripts/analysis/run_global_rgfca_g3.py"
      - "tests/test_global_monte_carlo.py"
      - "tests/test_global_repeated_atlas.py"
      - "tests/test_global_rgfca_engine.py"
      - "tests/test_global_g3.py"
      - "tests/test_global_candidate_acquisition.py"
      - "tests/test_global_capacity_handoff.py"
      - "tests/test_global_capacity_recovery.py"
      - "tests/test_global_barrier_field.py"
      - "tests/test_global_barrier_node_null.py"
      - "tests/test_global_overlay_alignment.py"
      - "tests/test_global_edge_mechanism_v2.py"
      - "tests/test_global_colour_zones.py"
      - "tests/test_global_community_colour_assembly.py"
      - "tests/test_global_pair_context_profiles.py"
      - "tests/test_global_species_discovery.py"
      - "tests/test_global_capacity_scan.py"
      - "docs/GLOBAL_MONTE_CARLO_BARRIER_ATLAS_PROTOCOL.md"
      - "docs/GLOBAL_BIOGEOGRAPHY_HYPOTHESIS_AMENDMENT_V2.md"
      - "docs/supporting/global_monte_carlo_barrier_atlas_contract_v1.json"
      - "docs/supporting/global_monte_carlo_barrier_field_contract_v1.json"
      - "docs/supporting/global_barrier_null_amendment_v1.json"
      - "docs/supporting/global_repeated_atlas_consensus_contract_v1.json"
      - "docs/supporting/global_monte_carlo_candidate_acquisition_contract_v1.json"
      - "docs/supporting/global_monte_carlo_measurement_execution_contract_v1.json"
      - "docs/supporting/global_monte_carlo_inference_execution_contract_v1.json"
      - "docs/supporting/global_monte_carlo_capacity_429_recovery_contract_v1.json"
      - "docs/supporting/global_colour_biogeography_overlay_contract_v1.json"
      - "docs/supporting/global_edge_mechanism_distance_control_amendment_v1.json"
      - "docs/supporting/global_sympatry_colour_assembly_contract_v1.json"
      - "docs/supporting/global_pair_context_profile_contract_v1.json"
      - "docs/supporting/global_biogeography_hypothesis_registry_v2.json"
      - "docs/supporting/global_overlay_source_registry_v1.json"
      - "docs/supporting/global_monte_carlo_information_audit_v1.json"
      - "docs/supporting/global_monte_carlo_species_discovery_contract_v1.json"
      - "docs/supporting/global_monte_carlo_capacity_scan_contract_v1.json"
      - ".github/workflows/global-monte-carlo-design.yml"
      - ".github/workflows/global-monte-carlo-species-discovery.yml"
      - ".github/workflows/global-monte-carlo-candidate-acquisition.yml"
      - ".github/workflows/global-monte-carlo-location-blind-measurement.yml"
      - ".github/workflows/global-monte-carlo-rgfca-inference.yml"
      - ".github/workflows/global-monte-carlo-capacity-429-recovery.yml"
  workflow_dispatch:

jobs:
  validate-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile metadata runners and global analysis modules
        run: |
          python -m py_compile scripts/acquisition/freeze_global_monte_carlo_species_discovery.py
          python -m py_compile scripts/acquisition/run_global_monte_carlo_capacity_scan.py
          python -m py_compile scripts/acquisition/run_global_monte_carlo_capacity_429_recovery_shard.py
          python -m py_compile scripts/acquisition/run_global_monte_carlo_candidate_acquisition_shard.py
          python -m py_compile scripts/analysis/generate_global_monte_carlo_candidate_authorization.py
          python -m py_compile scripts/analysis/generate_global_monte_carlo_measurement_authorization.py
          python -m py_compile scripts/analysis/generate_global_monte_carlo_inference_authorization.py
          python -m py_compile scripts/analysis/reduce_global_monte_carlo_candidate_acquisition.py
          python -m py_compile scripts/analysis/reduce_global_monte_carlo_capacity_429_recovery.py
          python -m py_compile scripts/analysis/build_global_monte_carlo_measurement_firewall.py
          python -m py_compile scripts/analysis/reassemble_global_monte_carlo_measurement.py
          python -m py_compile scripts/analysis/run_global_rgfca_g1_shard.py
          python -m py_compile scripts/analysis/reduce_global_rgfca_g1.py
          python -m py_compile scripts/analysis/run_global_rgfca_g3.py
          python -m py_compile fcp_pipeline/global_repeated_atlas.py
          python -m py_compile fcp_pipeline/global_rgfca_engine.py
          python -m py_compile fcp_pipeline/global_g3.py
          python -m py_compile fcp_pipeline/global_candidate_acquisition.py
          python -m py_compile fcp_pipeline/global_capacity_handoff.py
          python -m py_compile fcp_pipeline/global_capacity_recovery.py
          python -m py_compile fcp_pipeline/global_barrier_field.py
          python -m py_compile fcp_pipeline/global_overlay_alignment.py
          python -m py_compile fcp_pipeline/global_edge_mechanism_v2.py
          python -m py_compile fcp_pipeline/global_colour_zones.py
          python -m py_compile fcp_pipeline/global_community_colour_assembly.py
          python -m py_compile fcp_pipeline/global_pair_context_profiles.py
      - name: Run focused Monte Carlo design tests
        run: |
          pytest -q \
            tests/test_global_monte_carlo.py \
            tests/test_global_repeated_atlas.py \
            tests/test_global_rgfca_engine.py \
            tests/test_global_g3.py \
            tests/test_global_candidate_acquisition.py \
            tests/test_global_capacity_handoff.py \
            tests/test_global_capacity_recovery.py \
            tests/test_global_barrier_field.py \
            tests/test_global_barrier_node_null.py \
            tests/test_global_overlay_alignment.py \
            tests/test_global_edge_mechanism_v2.py \
            tests/test_global_colour_zones.py \
            tests/test_global_community_colour_assembly.py \
            tests/test_global_pair_context_profiles.py \
            tests/test_global_species_discovery.py \
            tests/test_global_capacity_scan.py
      - name: Validate JSON contracts
        run: |
          python -m json.tool docs/supporting/global_monte_carlo_barrier_atlas_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_monte_carlo_barrier_field_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_barrier_null_amendment_v1.json >/dev/null
          python -m json.tool docs/supporting/global_repeated_atlas_consensus_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_monte_carlo_candidate_acquisition_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_monte_carlo_measurement_execution_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_monte_carlo_inference_execution_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_monte_carlo_capacity_429_recovery_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_colour_biogeography_overlay_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_edge_mechanism_distance_control_amendment_v1.json >/dev/null
          python -m json.tool docs/supporting/global_sympatry_colour_assembly_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_pair_context_profile_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_biogeography_hypothesis_registry_v2.json >/dev/null
          python -m json.tool docs/supporting/global_overlay_source_registry_v1.json >/dev/null
          python -m json.tool docs/supporting/global_monte_carlo_information_audit_v1.json >/dev/null
          python -m json.tool docs/supporting/global_monte_carlo_species_discovery_contract_v1.json >/dev/null
          python -m json.tool docs/supporting/global_monte_carlo_capacity_scan_contract_v1.json >/dev/null
