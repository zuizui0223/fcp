name: Global RGFCA EarthEnv terrain block

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "docs/supporting/global_rgfca_earthenv_terrain_block_authorization_v1.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: global-rgfca-earthenv-terrain-block
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce one frozen terrain-block execution
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ['RUN_ATTEMPT'] != '1':
              raise SystemExit('terrain block reruns are forbidden')
          auth=json.loads(Path('docs/supporting/global_rgfca_earthenv_terrain_block_authorization_v1.json').read_text())
          panel=json.loads(Path('docs/supporting/global_rgfca_expanded_environmental_process_panel_contract_v1.json').read_text())
          order=json.loads(Path('docs/supporting/global_rgfca_expanded_environmental_panel_execution_v1.json').read_text())
          source=json.loads(Path('docs/supporting/global_rgfca_earthenv_terrain_source_verification_v1.json').read_text())
          if auth.get('status') != 'authorize_exactly_one_terrain_structure_block_execution':
              raise SystemExit('terrain block not authorized')
          if auth.get('workflow_attempts_allowed') != 1 or auth.get('favourable_rerun_allowed') is not False:
              raise SystemExit('authorization drift')
          if auth.get('null_indices') != '0..998 exactly once':
              raise SystemExit('null family drift')
          if panel.get('status') != 'postoutcome_secondary_panel_frozen_before_any_expanded_environmental_panel_result_or_new_source_payload_is_opened':
              raise SystemExit('panel contract drift')
          if order.get('status') != 'technical_execution_order_frozen_before_any_expanded_panel_block_colour_alignment_result':
              raise SystemExit('execution-order drift')
          if order.get('execution_order',[None])[0] != 'terrain_structure':
              raise SystemExit('terrain no longer first source-ready block')
          if source.get('status') != 'pass_exact_earthenv_terrain_source_acquisition_before_any_terrain_colour_alignment':
              raise SystemExit('terrain source verification missing')
          if source.get('artifact',{}).get('artifact_id') != 9984413514:
              raise SystemExit('terrain artifact lineage drift')
          if Path('docs/supporting/global_rgfca_earthenv_terrain_block_result_v1.json').exists():
              raise SystemExit('terrain block result already committed')
          print({'gate':'pass','final_support_pending_full_panel_holm':True})
          PY

  terrain:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen package, raster reader and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "rasterio==1.4.4" pytest
      - name: Preflight code and unchanged inference invariants
        run: |
          python -m py_compile scripts/analysis/run_global_rgfca_earthenv_terrain_block.py
          python -m pytest -q tests/test_global_edge_mechanism_v2.py tests/test_global_rgfca_engine.py tests/test_global_repeated_atlas.py
      - name: Recover exact frozen EarthEnv source artifact
        uses: actions/download-artifact@v4
        with:
          name: global-rgfca-exact-earthenv-terrain-50km-v1
          path: /tmp/earthenv-terrain
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/fcp
          run-id: 34017520302
      - name: Recheck exact EarthEnv source bytes before alignment
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('/tmp/earthenv-terrain')
          source=json.loads(Path('docs/supporting/global_rgfca_earthenv_terrain_source_verification_v1.json').read_text())
          for item in source['files']:
              p=root/item['filename']
              if not p.exists(): raise SystemExit(f'missing {p}')
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got != item['sha256']: raise SystemExit(f"SHA drift: {item['id']}")
          print({'source':'verified','files':len(source['files'])})
          PY
      - name: Execute frozen terrain block once
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          mkdir -p /tmp/rgfca-terrain-result
          python scripts/analysis/run_global_rgfca_earthenv_terrain_block.py \
            --terrain-dir /tmp/earthenv-terrain \
            --output-result /tmp/rgfca-terrain-result/global_rgfca_earthenv_terrain_block_result_v1.json \
            --output-species /tmp/rgfca-terrain-result/global_rgfca_earthenv_terrain_block_species_v1.csv \
            --output-null /tmp/rgfca-terrain-result/global_rgfca_earthenv_terrain_block_null_v1.csv \
            --null-batch-size 64
      - name: Require complete nonselective block output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/rgfca-terrain-result')
          result=json.loads((root/'global_rgfca_earthenv_terrain_block_result_v1.json').read_text())
          if result.get('null_permutations') != 999 or result.get('null_indices_exact_0_998') is not True:
              raise SystemExit('incomplete null result')
          if result.get('final_panel_support_decision_available') is not False:
              raise SystemExit('terrain block cannot make final panel decision early')
          if result.get('individual_variable_decomposition_open') is not False:
              raise SystemExit('variable decomposition opened too early')
          print({k:result[k] for k in ['observed_mean_species_partial_rho','raw_p_upper','n_evaluable_species','terrain_edge_occurrence_coverage_fraction']})
          PY
      - name: Upload immutable terrain-block result
        uses: actions/upload-artifact@v4
        with:
          name: global-rgfca-earthenv-terrain-block-v1
          retention-days: 90
          if-no-files-found: error
          path: /tmp/rgfca-terrain-result/
