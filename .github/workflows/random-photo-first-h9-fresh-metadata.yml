name: Random photo-first H9 fresh metadata freeze

on:
  push:
    branches:
      - analysis/random-photo-first-h9-individual-distance-replication
    paths:
      - "docs/supporting/random_photo_first_h9_query_authorization_v1.json"

permissions:
  contents: write

concurrency:
  group: random-photo-first-h9-fresh-metadata
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install acquisition runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate one-shot H9 authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('docs/supporting/random_photo_first_h9_query_authorization_v1.json').read_text())
          c = json.loads(Path('docs/supporting/random_photo_first_h9_individual_distance_contract_v1.json').read_text())
          e = json.loads(Path('docs/supporting/random_photo_first_h9_exclusion_manifest_v1.json').read_text())
          assert a['status'] == 'authorize_exactly_one_h9_fresh_metadata_query_run'
          assert a['queries'] == 38 and a['request_retries'] == 0
          assert c['fresh_metadata_acquisition']['queries'] == 38
          assert e['unique_exclusion_observation_ids'] == 86745
          assert e['h9_api_queries_opened'] is False
          assert not Path('data/frozen/random_photo_first_h9_fresh_metadata_v1.csv').exists()
          assert not Path('docs/supporting/random_photo_first_h9_fresh_metadata_manifest_v1.json').exists()
          print('h9_one_shot_authorization=pass')
          PY

      - name: Execute exactly 38 one-attempt H9 fresh metadata queries
        run: python scripts/acquisition/freeze_random_photo_first_h9_fresh_metadata.py

      - name: Validate H9 frozen metadata and premeasurement gate
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          m = json.loads(Path('docs/supporting/random_photo_first_h9_fresh_metadata_manifest_v1.json').read_text())
          d = pd.read_csv('data/frozen/random_photo_first_h9_fresh_metadata_v1.csv')
          a = pd.read_csv('data/frozen/random_photo_first_h9_fresh_metadata_species_audit_v1.csv')
          assert m['status'] == 'h9_fresh_metadata_frozen_before_pixels'
          assert m['query_attempts'] == 38 and m['expected_query_attempts'] == 38
          assert m['query_retries'] == 0
          assert m['freshness_firewall']['prior_observations_retained'] == 0
          assert m['freshness_firewall']['prior_photos_retained'] == 0
          assert m['candidate_image_pixels_opened'] is False
          assert m['colour_used_for_selection'] is False
          assert m['query_completed_without_replacement'] is True
          assert len(a) == 38
          assert len(d) == m['retained_fresh_photos']
          assert d['observation_id'].nunique() == len(d)
          assert d['photo_id'].nunique() == len(d)
          print(json.dumps(m, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: random-photo-first-h9-fresh-metadata-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            data/frozen/random_photo_first_h9_fresh_metadata_v1.csv
            data/frozen/random_photo_first_h9_fresh_metadata_species_audit_v1.csv
            docs/supporting/random_photo_first_h9_fresh_metadata_manifest_v1.json

      - name: Commit the H9 one-shot metadata freeze
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/frozen/random_photo_first_h9_fresh_metadata_v1.csv \
                  data/frozen/random_photo_first_h9_fresh_metadata_species_audit_v1.csv \
                  docs/supporting/random_photo_first_h9_fresh_metadata_manifest_v1.json
          git commit -m "Freeze H9 one-shot fresh metadata"
          git fetch origin analysis/random-photo-first-h9-individual-distance-replication
          git rebase origin/analysis/random-photo-first-h9-individual-distance-replication
          git push origin HEAD:analysis/random-photo-first-h9-individual-distance-replication
