name: Random photo-first H4 within-species capacity audit

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/random-photo-first-inference-execution
    paths:
      - "scripts/analysis/audit_random_photo_first_h4_within_species_capacity.py"
      - ".github/workflows/random-photo-first-h4-capacity-audit.yml"

permissions:
  contents: write

concurrency:
  group: random-photo-first-h4-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capacity-audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Audit within-species H4 capacity without climate join
        run: python scripts/analysis/audit_random_photo_first_h4_within_species_capacity.py
      - name: Validate claim ceiling and full threshold grid
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          result = json.loads(Path('docs/supporting/random_photo_first_h4_within_species_capacity_v1.json').read_text())
          grid = pd.read_csv('data/derived/random_photo_first_h4_within_species_capacity_thresholds_v1.csv')
          assert result['status'] == 'complete_exploratory_capacity_audit_no_h4_model_fit'
          assert result['claim_role'] == 'capacity_only_no_biological_h4_claim'
          assert result['introduced_after_h1_h2_outcomes'] is True
          assert result['threshold_grid_is_complete_not_outcome_selected'] is True
          assert len(grid) == 4 * 3 * 2
          assert result['measurement']['classifiable_rows'] == 10103
          assert result['lineage']['h1_p_upper'] == 0.413
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: random-photo-first-h4-capacity-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            docs/supporting/random_photo_first_h4_within_species_capacity_v1.json
            data/derived/random_photo_first_h4_within_species_capacity_v1.csv
            data/derived/random_photo_first_h4_within_species_capacity_thresholds_v1.csv
      - name: Commit H4 capacity outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporting/random_photo_first_h4_within_species_capacity_v1.json \
                  data/derived/random_photo_first_h4_within_species_capacity_v1.csv \
                  data/derived/random_photo_first_h4_within_species_capacity_thresholds_v1.csv
          git commit -m "Audit exploratory within-species H4 capacity"
          git fetch origin analysis/random-photo-first-inference-execution
          git rebase origin/analysis/random-photo-first-inference-execution
          git push origin HEAD:analysis/random-photo-first-inference-execution
