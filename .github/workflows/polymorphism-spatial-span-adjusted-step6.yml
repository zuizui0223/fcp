name: Polymorphism spatial span-adjusted Step 6

on:
  push:
    branches:
      - analysis/polymorphism-spatial-span-adjusted-step6
    paths:
      - "scripts/analysis/run_polymorphism_spatial_span_adjusted_step6_20260910.py"
      - "docs/POLYMORPHISM_SPATIAL_SPAN_ADJUSTED_STEP6_PROTOCOL_20260910.md"
      - ".github/workflows/polymorphism-spatial-span-adjusted-step6.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy

      - name: Verify frozen inputs
        run: |
          test -f results/polymorphism_species_attributes_step4_association_20260910/species_analysis_table.csv
          test -f results/polymorphism_spatial_subset_step5_20260909/species_membership_and_observed_rho.csv
          test -f results/polymorphism_spatial_reserve_step5b_20260909/reserve_species_membership_and_observed_metrics.csv
          test -f data/derived/rgfca_reserve_replication_measured_photos_v1.csv

      - name: Run span-adjusted robustness analysis
        run: |
          python scripts/analysis/run_polymorphism_spatial_span_adjusted_step6_20260910.py

      - name: Verify result receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/polymorphism_spatial_span_adjusted_step6_20260910/result.json')
          r = json.loads(p.read_text())
          assert r['analysis'] == 'polymorphism_spatial_span_adjusted_step6'
          assert r['discovery']['descriptive']['n_species'] == 369
          assert r['reserve_primary']['descriptive']['n_species'] == 363
          assert r['new_image_acquisition'] is False
          assert r['new_spatial_permutations_generated'] is False
          print(json.dumps({
              'decision': r['decision'],
              'discovery_partial': r['discovery']['continuous_partial'],
              'reserve_primary_partial': r['reserve_primary']['continuous_partial'],
              'reserve_background_partial': r['reserve_matched_background_differential']['continuous_partial'],
          }, indent=2))
          PY

      - name: Commit Step 6 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/polymorphism_spatial_span_adjusted_step6_20260910/
          if git diff --cached --quiet; then
            echo "No Step 6 result changes"
          else
            git commit -m "Record Step 6 span-adjusted spatial robustness result"
            git push
          fi
