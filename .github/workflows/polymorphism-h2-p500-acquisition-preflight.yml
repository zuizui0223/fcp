name: polymorphism-h2-p500-acquisition-preflight

on:
  push:
    branches:
      - analysis/polymorphism-42111-h1-h2-gates-20260912
    paths:
      - "scripts/analysis/preflight_polymorphism_h2_p500_acquisition_20260913.py"
      - ".github/workflows/polymorphism-h2-p500-acquisition-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas
      - name: Syntax compile
        run: python -m py_compile scripts/analysis/preflight_polymorphism_h2_p500_acquisition_20260913.py
      - name: Run metadata-only preflight
        run: python scripts/analysis/preflight_polymorphism_h2_p500_acquisition_20260913.py
      - name: Verify outcome firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('results/polymorphism_h2_p500_acquisition_preflight_20260913/result.json').read_text())
          assert r['status'] == 'pass_metadata_only_acquisition_preflight'
          assert r['P500']['species'] == 500
          assert r['P500']['sha256'] == 'f54d07fb2338a20a3f92808b58f0ebc948ab0d5af3cb01fb26702f861184b7a4'
          assert r['P500']['colour_outcomes_opened'] is False
          assert r['outcome_firewall']['morph_read'] is False
          assert r['outcome_firewall']['palette_read'] is False
          assert r['outcome_firewall']['coordinates_read'] is False
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: polymorphism-h2-p500-acquisition-preflight-20260913
          path: results/polymorphism_h2_p500_acquisition_preflight_20260913
          if-no-files-found: error
          retention-days: 90
