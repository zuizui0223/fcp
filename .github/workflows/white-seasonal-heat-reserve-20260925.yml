name: White seasonal heat reserve confirmation

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/POLYMORPHISM_WHITE_SEASONAL_HEAT_RESERVE_PROTOCOL_20260925.md
      - scripts/analysis/run_white_seasonal_heat_reserve_20260925.py
      - .github/workflows/white-seasonal-heat-reserve-20260925.yml

permissions:
  contents: read
  actions: read

env:
  LEGACY_COMMIT: db2514f622468747a7d5896c2696fcbf13729ef6
  RESERVE_SHA256: 0e2ed349122739eecfc725fb2d5e313d284cf30752da91f9a0429cff0eeaa5e6
  THIRD_RUN_ID: "35177668182"
  THIRD_ARTIFACT: h2-third-cohort-prospective-result-20260917
  OUTDIR: results/polymorphism_white_seasonal_heat_reserve_20260925

jobs:
  reserve-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy statsmodels rasterio
          python -m py_compile scripts/analysis/run_white_seasonal_heat_reserve_20260925.py
      - name: Materialize immutable reserve table from repository history
        run: |
          git show "${LEGACY_COMMIT}:data/derived/rgfca_reserve_replication_measured_photos_v1.csv" > /tmp/reserve.csv
          echo "${RESERVE_SHA256}  /tmp/reserve.csv" | sha256sum -c -
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.THIRD_RUN_ID }}
          github-token: ${{ github.token }}
          name: ${{ env.THIRD_ARTIFACT }}
          path: /tmp/third
      - name: Verify reserve is species-disjoint from third cohort
        run: |
          THIRD="$(find /tmp/third -type f -name 'polymorphism_h2_third_cohort_measured_photos_v1.csv' -print -quit)"
          test -n "$THIRD"
          python - /tmp/reserve.csv "$THIRD" <<'PY'
          import sys,pandas as pd
          a=set(pd.read_csv(sys.argv[1],usecols=['species']).species.astype(str))
          b=set(pd.read_csv(sys.argv[2],usecols=['species']).species.astype(str))
          overlap=sorted(a&b)
          print({'reserve_species':len(a),'third_species':len(b),'overlap':len(overlap)})
          assert not overlap, overlap[:20]
          PY
      - name: Download frozen WorldClim predictors
        run: |
          mkdir -p /tmp/worldclim/bio /tmp/worldclim/tmax
          curl -L --fail --retry 5 --retry-delay 3 https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip -o /tmp/worldclim/bio.zip
          curl -L --fail --retry 5 --retry-delay 3 https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_tmax.zip -o /tmp/worldclim/tmax.zip
          unzip -q /tmp/worldclim/bio.zip -d /tmp/worldclim/bio
          unzip -q /tmp/worldclim/tmax.zip -d /tmp/worldclim/tmax
      - name: Run frozen reserve confirmation
        run: |
          rm -rf "$OUTDIR"
          python scripts/analysis/run_white_seasonal_heat_reserve_20260925.py             --reserve /tmp/reserve.csv             --bio5 /tmp/worldclim/bio/wc2.1_10m_bio_5.tif             --tmax-dir /tmp/worldclim/tmax             --outdir "$OUTDIR"
      - name: Validate result
        run: |
          python - <<'PY'
          import json,os
          x=json.load(open(os.environ['OUTDIR']+'/result.json'))
          assert x['schema']=='fcp_white_seasonal_heat_reserve_v1'
          assert x['status'] in {'RESERVE_SEASONAL_HEAT_CONFIRMED','RESERVE_SEASONAL_HEAT_NOT_CONFIRMED','RESERVE_LOCAL_GATE_NOT_ESTIMABLE'}
          assert x['reserve_species']>=100
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: white-seasonal-heat-reserve-v1
          if-no-files-found: error
          retention-days: 90
          path: ${{ env.OUTDIR }}
