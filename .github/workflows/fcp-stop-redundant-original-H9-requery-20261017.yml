name: FCP one-shot stop redundant original H9 repeated API run
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fcp-stop-redundant-original-H9-requery-20261017.yml
permissions:
  contents: read
  actions: write
jobs:
  stop-only-exact-repeated-2733-H9-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPEAT_RUN: "38996980811"
      REPEAT_SHA: "e1d1708b244b64b1aa85cb60baa7eac02831d2b9"
      FROZEN_REPAIR_RUN: "38996743273"
      FROZEN_REPAIR_SHA: "61abc4f71e74db3a6633a790e37d1f30e8e3bfcc"
    steps:
      - name: Verify source already successfully saved and repetition exact ID/SHA before cancellation
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPEAT_RUN" > /tmp/fcp_repeat.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROZEN_REPAIR_RUN" > /tmp/fcp_repaired.json
          python - <<'PY'
          import json,os
          repeat=json.load(open('/tmp/fcp_repeat.json'))
          repair=json.load(open('/tmp/fcp_repaired.json'))
          if not (repair['id']==38996743273
                  and repair['head_sha']==os.environ['FROZEN_REPAIR_SHA']
                  and repair['status']=='completed' and repair['conclusion']=='success'
                  and repeat['id']==38996980811
                  and repeat['head_sha']==os.environ['REPEAT_SHA']
                  and repeat['head_branch']=='fix/fcp-4730-consolidate-original-h9-global-seen-20261017'
                  and repeat['event']=='pull_request'
                  and repeat['name']=='FCP full 4730 U100 bulk historical-H9 photo metadata'):
              raise SystemExit('Original H9 cancellation identity gate blocked')
          if repeat['status']=='completed':
              open('/tmp/fcp_repeated_already_terminal','w').write(repeat['conclusion'])
              print('FCP_REQUERY_RUN_ALREADY_TERMINAL',repeat['conclusion'])
          elif repeat['status'] in ('queued','in_progress','waiting','pending'):
              print('FCP_REQUERY_ONLY_EXACT_RUN_CANCEL_AUTHORIZED',repeat['id'])
          else:
              raise SystemExit('Unexpected acquisition run state')
          PY
      - name: Stop only duplicate unsanctioned original H9 API acquisition
        shell: bash
        run: |
          if test -f /tmp/fcp_repeated_already_terminal; then
            echo FCP_REQUERY_ALREADY_STOPPED
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$REPEAT_RUN/cancel"
          echo FCP_REDUNDANT_2733_ORIGINAL_H9_REQUERY_CANCEL_REQUESTED
