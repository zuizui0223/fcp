name: Polymorphism species attributes Step 4 preflight

on:
  push:
    branches:
      - analysis/polymorphism-species-attributes-step4b
    paths:
      - "scripts/analysis/run_polymorphism_species_attributes_step4_preflight_20260910.py"
      - "docs/POLYMORPHISM_SPECIES_ATTRIBUTES_STEP4_PREFLIGHT_PROTOCOL_20260910.md"
      - ".github/workflows/polymorphism-species-attributes-step4-preflight.yml"

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy

      - name: Download frozen island trait artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/island-step4-traits
          mkdir -p /tmp/island-step4-traits
          gh run download 29409415292 \
            --repo zuizui0223/island \
            --name all-master-trait-ledger-29409415292 \
            --dir /tmp/island-step4-traits
          test "$(find /tmp/island-step4-traits -name all_species_traits.csv | wc -l)" -eq 1
          test "$(find /tmp/island-step4-traits -name all_species_trait_evidence.csv.gz | wc -l)" -eq 1

      - name: Build pre-outcome covariate panel
        run: |
          python scripts/analysis/run_polymorphism_species_attributes_step4_preflight_20260910.py \
            --island-artifact-root /tmp/island-step4-traits

      - name: Verify outcome firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/polymorphism_species_attributes_step4_preflight_20260910/result.json')
          r = json.loads(p.read_text())
          assert r['species_rows'] == 369
          assert r['D_association_computed'] is False
          print(json.dumps({
              'species_rows': r['species_rows'],
              'family_nonmissing': r['family_nonmissing'],
              'pollination': r['pollination'],
              'life_form_source_preflight': r['life_form_source_preflight'],
          }, indent=2))
          PY

      - name: Commit frozen preflight result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/polymorphism_species_attributes_step4_preflight_20260910/
          if git diff --cached --quiet; then
            echo "No preflight result changes"
          else
            git commit -m "Record Step 4 species-attribute preflight"
            git push
          fi
