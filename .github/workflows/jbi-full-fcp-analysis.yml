name: JBI full FCP all-species analysis

on:
  push:
    branches: [audit/upstream-spatial-reaudit]
    paths:
      - '.github/workflows/jbi-full-fcp-analysis.yml'
      - 'scripts/run_full_fcp_hurdle_models.py'
      - 'scripts/run_full_fcp_latent_models_v2.py'
      - 'scripts/literature/derive_v22_core_fcp_universe.py'
      - 'scripts/literature/derive_v22_core_fcp_universe_v3.py'
      - 'scripts/literature/derive_v22_core_fcp_universe_v5.py'
      - 'scripts/literature/derive_v22_core_fcp_universe_v6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CLIMATE_RUN_ID: '32932477834'
  CLIMATE_ARTIFACT: 'jbi-full-fcp-climate-rebuild'
  EXPANDED_RUN_ID: '32930987729'
  EXPANDED_ARTIFACT: 'jbi-v22-full-fcp-universe'
  RECORD_SCREEN_RUN_ID: '32835034885'
  RECORD_SCREEN_ARTIFACT: 'jbi-v22-canonical-record-screening'
  ATTENTION_RUN_ID: '32932116967'
  ATTENTION_ARTIFACT: 'jbi-full-fcp-literature-attention'

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels scikit-learn
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CLIMATE_ARTIFACT }}
          path: climate
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.CLIMATE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXPANDED_ARTIFACT }}
          path: expanded
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.EXPANDED_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RECORD_SCREEN_ARTIFACT }}
          path: record_screen
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.RECORD_SCREEN_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ATTENTION_ARTIFACT }}
          path: attention
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.ATTENTION_RUN_ID }}
      - name: Derive focal-consistent v6 core from fixed upstream artifacts
        run: |
          mkdir -p core
          python scripts/literature/derive_v22_core_fcp_universe_v6.py \
            --source-audit expanded/v22_full_fcp_source_audit.csv \
            --record-screen record_screen/v22_record_screening_blind.csv \
            --outdir core
      - name: Validate final analysis inputs
        run: |
          python - <<'PY'
          import pandas as pd, json
          climate=pd.read_csv('climate/full_fcp_climate_analysis_dataset.csv')
          core=pd.read_csv('core/v22_core_fcp_species_universe.csv')
          expanded=pd.read_csv('expanded/v22_full_fcp_species_universe.csv')
          att=pd.read_csv('attention/full_fcp_literature_attention.csv')
          cs=json.load(open('core/v22_core_fcp_universe_summary.json'))
          core_names=set(core.canonical_name)
          assert len(expanded)==78
          assert len(core)==74
          assert len(core_names)==74
          assert cs['core_protocol_version']=='display-core-v6-focal-consistent', cs
          assert cs['core_FCP_species_universe']==74
          assert cs['organization_unresolved_species']==42
          assert core_names<=set(expanded.canonical_name)
          assert set(climate.canonical_name)<=set(expanded.canonical_name)
          assert len(climate)==70
          assert len(att)==78
          assert {'Acer pictum','Butomus umbellatus','Salvia hispanica','Viola sieheana'}.isdisjoint(core_names)
          assert {'Aquilegia coerulea','Cosmos bipinnatus','Eruca sativa'}<=core_names
          assert {'geographic_radius_95_km','temperature_breadth','moisture_breadth','climatic_heterogeneity','pca_dispersion','pca_hull_area'}<=set(climate.columns)
          print({'expanded':len(expanded),'core':len(core),'climate_eligible':len(climate),'attention':len(att)})
          PY
      - name: Run two-stage documentation/organization analysis
        run: |
          mkdir -p analysis_outputs/jbi_full_fcp_hurdle
          python scripts/run_full_fcp_hurdle_models.py \
            --analysis climate/full_fcp_climate_analysis_dataset.csv \
            --core-species core/v22_core_fcp_species_universe.csv \
            --attention attention/full_fcp_literature_attention.csv \
            --outdir analysis_outputs/jbi_full_fcp_hurdle \
            --family-bootstraps 499 --seed 20260826
      - name: Validate hurdle outputs
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('analysis_outputs/jbi_full_fcp_hurdle/full_fcp_documentation_models.csv')
          m=pd.read_csv('analysis_outputs/jbi_full_fcp_hurdle/full_fcp_conditional_multinomial.csv')
          p=pd.read_csv('analysis_outputs/jbi_full_fcp_hurdle/full_fcp_documentation_propensity.csv')
          b=pd.read_csv('analysis_outputs/jbi_full_fcp_hurdle/full_fcp_conditional_multinomial_bootstrap.csv')
          assert len(d)==10 and len(m)==10
          assert set(d.scope)=={'core','expanded'} and set(m.scope)=={'core','expanded'}
          assert set(p.scope)=={'core','expanded'}
          assert set(d.status)<={'complete','fit_failed'}
          assert set(m.status)<={'complete','missing_class'}
          assert (m.loc[m.status.eq('complete'),'family_bootstraps_valid']>0).all()
          assert len(b)<=4990, len(b)
          assert set(d.loc[d.scope.eq('core'),'n_species'])=={66}
          assert set(m.loc[m.scope.eq('core'),'n_species'])=={32}
          print(d[['scope','metric','status','n_species','climate_or','climate_p']].to_string(index=False))
          print(m[['scope','metric','status','n_species','S_vs_C_OR','mixed_vs_C_OR','mixed_vs_S_OR','family_bootstraps_valid']].to_string(index=False))
          PY
      - name: Run detection-aware latent diagnostic sensitivity
        run: |
          mkdir -p analysis_outputs/jbi_full_fcp_latent_diag
          PYTHONPATH=scripts python scripts/run_full_fcp_latent_models_v2.py \
            --analysis climate/full_fcp_climate_analysis_dataset.csv \
            --source-audit expanded/v22_full_fcp_source_audit.csv \
            --core-source-audit core/v22_core_fcp_membership_sources.csv \
            --core-species core/v22_core_fcp_species_universe.csv \
            --outdir analysis_outputs/jbi_full_fcp_latent_diag \
            --epsilon 0.0 --parametric-bootstraps 99 --family-bootstraps 99 --seed 20260826
      - name: Validate latent diagnostic outputs
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('analysis_outputs/jbi_full_fcp_latent_diag/full_fcp_latent_cs_models.csv')
          assert len(d)==20
          assert set(d.scope)=={'core','expanded'} and set(d.axis)=={'C','S'}
          complete=d.analysis_status.eq('complete')
          assert complete.sum()>=10, d.analysis_status.value_counts().to_dict()
          assert (d.loc[complete,'parametric_bootstraps_valid']>0).all()
          print(d[['scope','axis','metric','analysis_status','n_species','n_sources','odds_ratio','estimated_source_detection_probability','parametric_bootstrap_p']].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jbi-full-fcp-analysis-v6core
          path: |
            core/
            analysis_outputs/jbi_full_fcp_hurdle/
            analysis_outputs/jbi_full_fcp_latent_diag/
          if-no-files-found: error
          retention-days: 30