name: FCP verify 447800 genuine original photo IDs across all five U100 cohorts
on:
  push:
    branches: [analysis/fcp-4730-source-five-cohort-identity-audit-20261017]
    paths:
      - scripts/analysis/fcp_u100_4730_five_cohort_source_id_audit_20261017.py
      - tests/test_fcp_u100_4730_five_cohort_source_id_audit_20261017.py
      - .github/workflows/fcp-4730-all-five-original-source-id-audit-20261017.yml
permissions:
  contents: read
  actions: read
jobs:
  attest-authentic-5-cohort-source-identities-before-original-ROI-finishes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: "."
      WAVE4_SOURCE_RUN: "38989666486"
      NEW_U100_SOURCE_RUN: "38996743273"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source ledger source-ID and overlap audit guards synthetically
        run: |
          python -m pip install pandas==2.2.3 numpy==2.1.3 pytest==8.4.2
          python -m pytest -q tests/test_fcp_u100_4730_five_cohort_source_id_audit_20261017.py
      - name: Authenticate exact historical two original source runs before touching scientific photo IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp_u100_fivecohort/{wave4,new,old,out}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WAVE4_SOURCE_RUN" > /tmp/fcp_u100_fivecohort/wave4_run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NEW_U100_SOURCE_RUN" > /tmp/fcp_u100_fivecohort/new_run.json
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('/tmp/fcp_u100_fivecohort')
          wave=json.loads((base/'wave4_run.json').read_text())
          new=json.loads((base/'new_run.json').read_text())
          for item in (wave,new):
              assert item['run_attempt']==1
              assert item['status']=='completed' and item['conclusion']=='success'
              assert item['head_repository']['full_name']=='zuizui0223/fcp'
          assert wave['id']==38989666486
          assert wave['head_sha']=='a948fd95c57fd5da404a20348174fb4e96796ec4'
          assert wave['event']=='pull_request'
          assert wave['name']=='FCP wave4 same 149900-method original source'
          assert new['id']==38996743273
          assert new['head_sha']=='61abc4f71e74db3a6633a790e37d1f30e8e3bfcc'
          assert new['event']=='push'
          assert new['name']=='FCP recover 4730 exact H9 global ID source from four authentic shards'
          print('FCP_ORIGINAL_FIVE_COHORT_SOURCES_TWO_REAL_RUN_SHA_VERIFIED')
          PY
          gh run download "$WAVE4_SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name fcp-wave4-same-original-method-selection-and-metadata-20261017 \
            --dir /tmp/fcp_u100_fivecohort/wave4
          gh run download "$NEW_U100_SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name fcp-all4730-actual-H9-2733-source-metadata-terminal \
            --dir /tmp/fcp_u100_fivecohort/new
      - name: Restore only byte-verified old 149900 photograph-identity rows
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 5142f7951af0dde5364bb047a566d67e8c479e51
          git fetch --no-tags --depth=1 origin 7e538e5c51c05a7cc47b2fcf53eea92634c8a863
          git show 5142f7951af0dde5364bb047a566d67e8c479e51:data/derived/global_monte_carlo_measured_photos_v1.csv > /tmp/fcp_u100_fivecohort/old/discovery.csv
          git show 5142f7951af0dde5364bb047a566d67e8c479e51:data/derived/rgfca_reserve_replication_measured_photos_v1.csv > /tmp/fcp_u100_fivecohort/old/validation.csv
          git show 7e538e5c51c05a7cc47b2fcf53eea92634c8a863:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv > /tmp/fcp_u100_fivecohort/old/prospective.csv
      - name: Verify actual 447800 distinct original photo IDs, taxa and U100 fixed100 ledger
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_u100_4730_five_cohort_source_id_audit_20261017.py \
            --discovery /tmp/fcp_u100_fivecohort/old/discovery.csv \
            --validation /tmp/fcp_u100_fivecohort/old/validation.csv \
            --prospective /tmp/fcp_u100_fivecohort/old/prospective.csv \
            --wave4 /tmp/fcp_u100_fivecohort/wave4/metadata/wave4_authorized_metadata.csv.gz \
            --wave4-metadata-receipt /tmp/fcp_u100_fivecohort/wave4/metadata/metadata_result.json \
            --new /tmp/fcp_u100_fivecohort/new/remaining_U100_authorized_metadata.csv.gz \
            --new-metadata-receipt /tmp/fcp_u100_fivecohort/new/all4730_metadata_result.json \
            --original-U100 /tmp/fcp_u100_fivecohort/new/full_U100_4730_status_after_H9.csv \
            --out /tmp/fcp_u100_fivecohort/out
          python - <<'PY'
          import json
          p='/tmp/fcp_u100_fivecohort/out/five_cohort_original_447800_photo_source_identity_audit.json'
          x=json.load(open(p))
          assert x['original_eligible_taxa_below_historical_fixed100']==252
          assert x['all_five_cohort_original_complete100_photo_taxa']==4478
          assert x['actual_original_source_photo_IDs']==447800
          assert x['all_source_photo_taxon_names_match_original_U100_ledger'] is True
          assert x['not_biological_inference'] is True
          print('FCP_ALL_FIVE_ORIGINAL_SOURCES_447800_VERIFIED_WITHOUT_PIXELS_OR_NULLS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-all4730-all-five-original-447800-source-identity-audit
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp_u100_fivecohort/out/
