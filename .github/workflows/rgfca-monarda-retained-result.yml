name: RGFCA Monarda retained result verification

on:
  push:
    branches: [analysis/hypervolume-geo-environment-identifiability]
    paths:
      - 'scripts/analysis/verify_rgfca_monarda_region_result.py'
      - 'tests/test_monarda_independent_result_verifier.py'
      - 'data/validation/monarda_region_agreement_v1/**'
      - '.github/workflows/rgfca-monarda-retained-result.yml'

permissions:
  contents: read

jobs:
  verify-retained-counts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - name: Independent arithmetic and complete-bundle corruption tests
        env:
          PYTHONPATH: '.'
        run: python -m pytest tests/test_monarda_independent_result_verifier.py -q
      - name: Verify the retained complete result when published
        run: |
          if test -f data/validation/monarda_region_agreement_v1/monarda_region_agreement_result_v1.json; then
            python scripts/analysis/verify_rgfca_monarda_region_result.py data/validation/monarda_region_agreement_v1
          else
            echo 'retained_result_not_published_yet=true; artificial verification only'
          fi
