name: Regenerate current polymorphism manuscript figures

on:
  push:
    branches:
      - main
    paths:
      - scripts/analysis/make_polymorphism_manuscript_figures.py
      - tests/test_make_polymorphism_manuscript_figures.py
      - docs/POLYMORPHISM_FIGURE_PLAN_20260918.md
      - docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST.md
      - results/polymorphism_distributed_polymorphism_posthoc_20261007/result.json
      - results/polymorphism_distributed_polymorphism_robustness_20261007/result.json
      - results/polymorphism_phenotypic_IBD_IBE_posthoc_20261007/result.json
      - .github/workflows/regenerate-polymorphism-figures-reader-flow-20260926.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pytest pandas numpy matplotlib
      - name: Run figure tests
        run: python -m pytest tests/test_make_polymorphism_manuscript_figures.py -q
      - name: Regenerate canonical figure package
        run: |
          rm -rf docs/figures/polymorphism_20260918
          python scripts/analysis/make_polymorphism_manuscript_figures.py --root . --output-dir docs/figures/polymorphism_20260918
      - name: Re-run tests against regenerated package
        run: python -m pytest tests/test_make_polymorphism_manuscript_figures.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: current-paper-figure-qa
          if-no-files-found: error
          retention-days: 30
          path: |
            docs/figures/polymorphism_20260918/polymorphism_figure1_measurement_frame.png
            docs/figures/polymorphism_20260918/polymorphism_figure1_measurement_frame.pdf
            docs/figures/polymorphism_20260918/polymorphism_figure2_h1_reproducibility.png
            docs/figures/polymorphism_20260918/polymorphism_figure2_h1_reproducibility.pdf
            docs/figures/polymorphism_20260918/polymorphism_figure3_h2_target_localization.png
            docs/figures/polymorphism_20260918/polymorphism_figure3_h2_target_localization.pdf
            docs/figures/polymorphism_20260918/polymorphism_figure4_prospective_h2.png
            docs/figures/polymorphism_20260918/polymorphism_figure4_prospective_h2.pdf
            docs/figures/polymorphism_20260918/polymorphism_figure5_explanatory_boundaries.png
            docs/figures/polymorphism_20260918/polymorphism_figure5_explanatory_boundaries.pdf
            docs/figures/polymorphism_20260918/polymorphism_figureS9_secondary_mechanism_evidence.png
            docs/figures/polymorphism_20260918/polymorphism_figureS9_secondary_mechanism_evidence.pdf
      - name: Commit regenerated figure outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures/polymorphism_20260918
          if git diff --cached --quiet; then
            echo "No figure changes"
            exit 0
          fi
          git commit -m "Regenerate current polymorphism manuscript figures"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
