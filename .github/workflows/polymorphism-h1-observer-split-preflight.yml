name: polymorphism H1 observer-split preflight

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/polymorphism-42111-h1-h2-gates-20260912
    paths:
      - scripts/analysis/run_polymorphism_h1_observer_split_preflight_20260913.py
      - .github/workflows/polymorphism-h1-observer-split-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run outcome-blind observer split preflight
        run: python scripts/analysis/run_polymorphism_h1_observer_split_preflight_20260913.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: polymorphism-h1-observer-split-preflight-20260913
          path: results/polymorphism_h1_observer_split_preflight_20260913/
          if-no-files-found: error
