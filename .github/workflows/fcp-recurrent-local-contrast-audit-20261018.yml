name: FCP recurrent local contrast and ROI colour-purity audit
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/fcp_recurrent_local_photo_morph_candidates_20261018.py
      - tests/test_fcp_recurrent_local_photo_morph_candidates_20261018.py
      - .github/workflows/fcp-recurrent-local-contrast-audit-20261018.yml
  push:
    branches: [main]
    paths:
      - scripts/analysis/fcp_recurrent_local_photo_morph_candidates_20261018.py
      - tests/test_fcp_recurrent_local_photo_morph_candidates_20261018.py
      - .github/workflows/fcp-recurrent-local-contrast-audit-20261018.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fcp-recurrent-local-contrasts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authentic-interannual-photo-colour-opportunity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_SHA256: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test photo identity, strict site proximity, calendar month and four-observer recurrence
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m pytest -q tests/test_fcp_recurrent_local_photo_morph_candidates_20261018.py
          python -m py_compile scripts/analysis/fcp_recurrent_local_photo_morph_candidates_20261018.py
      - name: Download actual 447500 genuine original photo-measurement archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-recurrence/{original,extracted,output}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_FILE" --dir /tmp/fcp-recurrence/original
          echo "$SOURCE_SHA256  /tmp/fcp-recurrence/original/$SOURCE_FILE" | sha256sum -c -
          tar -xzf "/tmp/fcp-recurrence/original/$SOURCE_FILE" -C /tmp/fcp-recurrence/extracted
          test -s /tmp/fcp-recurrence/extracted/measured/fcp_all4730_original_method_measured_photos.csv.gz
      - name: Screen each species for repeated two-colour contrasts at the same site/month in two years
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_recurrent_local_photo_morph_candidates_20261018.py \
            --photos /tmp/fcp-recurrence/extracted/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --output_dir /tmp/fcp-recurrence/output
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          root=Path('/tmp/fcp-recurrence/output')
          d=json.loads((root/'fcp_local_recurrence_quality_summary.json').read_text())
          v=d['radius_sensitivity']
          assert d['actual_original_measured_photos']==447500
          assert d['original_four_state_classified_photos']==227107
          assert d['precise_coordinates_and_source_observation_identifiers_publicly_withheld'] is True
          for radius,any_pairs,differents,recurrent in [
              ('0.25',107,28,2),('0.5',176,49,3),('1.0',287,91,8),
              ('2.0',453,145,8),('5.0',801,300,17)]:
              row=v[radius]
              assert row['photo_opportunity_species']==any_pairs,(radius,row)
              assert row['photographic_colour_contrast_species']==differents,(radius,row)
              assert row['interannual_recurrent_four_observer_species']==recurrent,(radius,row)
          assert v['1.0']['interannual_species_purity_threshold_sensitivity']['65']==1
          assert v['5.0']['interannual_species_purity_threshold_sensitivity']['65']==3
          sites=pd.read_csv(root/'fcp_repeated_local_photo_contrast_candidates_NO_EXACT_COORDINATES.csv')
          assert sites.loc[sites.radius_km.eq(1),'taxon_id'].nunique()==8
          assert sites.loc[sites.radius_km.eq(5),'taxon_id'].nunique()==17
          assert 'Collinsia multicolor' in set(sites.species)
          assert 'Navarretia heterodoxa' in set(sites.species)
          forbidden=['latitude','longitude','photo_id','observation_id','observer_id',
                     'geohash','site_lat','site_lon']
          assert not set(forbidden).intersection(sites.columns)
          assert (sites.example_year_2>sites.example_year_1).all()
          assert sites.distinct_observers_in_example.eq(4).all()
          print('FCP_TRUE_PHOTO_SITE_MONTH_RECURRENCE_SOURCE_VERIFIED_8_17_CANDIDATES')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-real-local-contrast-recurrence-and-photo-purity-audit
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp-recurrence/output/
