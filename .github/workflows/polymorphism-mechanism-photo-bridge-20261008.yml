name: FCP ecological maintenance source-photo crosswalk

on:
  pull_request:
    branches: [main]
    paths:
      - data/curated/fcp_morph_maintenance_primary_studies_20261008.json
      - scripts/analysis/run_polymorphism_mechanism_photo_overlap_20261008.py
      - tests/test_polymorphism_mechanism_photo_overlap_20261008.py
      - docs/POLYMORPHISM_MAINTENANCE_PRIMARY_SOURCE_PHOTO_BRIDGE_PROTOCOL_20261008.md
      - .github/workflows/polymorphism-mechanism-photo-bridge-20261008.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcp-mechanism-photo-bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  LEGACY_SHA: '5142f7951af0dde5364bb047a566d67e8c479e51'
  THIRD_SHA: '7e538e5c51c05a7cc47b2fcf53eea92634c8a863'
  DISC_SHA256: 'ee854126eed2cfe23e333abe2c28d14df24895a5c52cbc389c060a5a4d6f91f4'
  VAL_SHA256: '0e2ed349122739eecfc725fb2d5e313d284cf30752da91f9a0429cff0eeaa5e6'
  THIRD_SHA256: '57630fc9f281bce94a0c40a70aaf7bce879dde93d6154175adcd021e8f5c1186'

jobs:
  organism-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Test exact source/photo scientific identity and inference boundaries
        run: |
          python -m pip install -r requirements-np-bio5-replay-20260928.txt
          python -m pip install pytest==8.4.2
          python -m py_compile scripts/analysis/run_polymorphism_mechanism_photo_overlap_20261008.py
          python -m pytest tests/test_polymorphism_mechanism_photo_overlap_20261008.py -q

      - name: Reopen original immutable photo tables and verify SHA256
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$LEGACY_SHA" "$THIRD_SHA"
          git show "$LEGACY_SHA:data/derived/global_monte_carlo_measured_photos_v1.csv" > /tmp/fcp_mechanism_d.csv
          git show "$LEGACY_SHA:data/derived/rgfca_reserve_replication_measured_photos_v1.csv" > /tmp/fcp_mechanism_v.csv
          git show "$THIRD_SHA:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv" > /tmp/fcp_mechanism_t.csv
          echo "$DISC_SHA256  /tmp/fcp_mechanism_d.csv" | sha256sum -c -
          echo "$VAL_SHA256  /tmp/fcp_mechanism_v.csv" | sha256sum -c -
          echo "$THIRD_SHA256  /tmp/fcp_mechanism_t.csv" | sha256sum -c -

      - name: Inspect primary study organism systems for truly comparable photo morphs
        run: |
          python scripts/analysis/run_polymorphism_mechanism_photo_overlap_20261008.py \
            --registry data/curated/fcp_morph_maintenance_primary_studies_20261008.json \
            --discovery /tmp/fcp_mechanism_d.csv \
            --validation /tmp/fcp_mechanism_v.csv \
            --third /tmp/fcp_mechanism_t.csv \
            --outdir /tmp/fcp_mechanism_overlap

      - name: Fail closed on pretending coloured photos establish payoff selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('/tmp/fcp_mechanism_overlap/result.json').read_text())
          assert q['schema']=='fcp_morph_maintenance_primary_study_photo_overlap_v1'
          assert q['confirmatory_decisions_changed'] is False
          assert q['n_independent_literature_species']==11
          assert q['n_literature_species_any_measured_photo_cohort']<=11
          assert q['n_literature_species_ge40_classifiable']<=q['n_literature_species_any_measured_photo_cohort']
          assert q['n_literature_species_ge5_white_and_ge5_nonwhite']<=q['n_literature_species_ge40_classifiable']
          assert q['n_true_morph_genotype_chemistry_photo_links']==0
          assert q['direct_biochemical_genotype_fitness_bridge_estimable'] is False
          assert set(q['photo_cohort_sha256'])=={'discovery','validation','third'}
          print('FCP_SOURCE_MECHANISM_BRIDGE_FEASIBILITY_AUDITED_NO_CAUSAL_CLAIM_PROMOTED')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fcp-maintenance-photo-source-bridge-20261008
          if-no-files-found: error
          retention-days: 30
          path: /tmp/fcp_mechanism_overlap/
