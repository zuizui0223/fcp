name: Global RGFCA expanded CHELSA process blocks

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "docs/supporting/global_rgfca_expanded_chelsa_blocks_authorization_v1.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: global-rgfca-expanded-chelsa-blocks
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce one complete nonselective CHELSA family execution
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ['RUN_ATTEMPT'] != '1':
              raise SystemExit('favourable workflow reruns are forbidden')
          panel=json.loads(Path('docs/supporting/global_rgfca_expanded_environmental_process_panel_contract_v1.json').read_text())
          order=json.loads(Path('docs/supporting/global_rgfca_expanded_environmental_panel_execution_v1.json').read_text())
          acquire=json.loads(Path('docs/supporting/global_rgfca_chelsa_expanded_source_acquisition_contract_v1.json').read_text())
          verify=json.loads(Path('docs/supporting/global_rgfca_chelsa_expanded_source_verification_v1.json').read_text())
          auth=json.loads(Path('docs/supporting/global_rgfca_expanded_chelsa_blocks_authorization_v1.json').read_text())
          if panel.get('status')!='postoutcome_secondary_panel_frozen_before_any_expanded_environmental_panel_result_or_new_source_payload_is_opened': raise SystemExit('panel contract drift')
          if order.get('status')!='technical_execution_order_frozen_before_any_expanded_panel_block_colour_alignment_result': raise SystemExit('execution-order drift')
          if order.get('execution_order') != ['terrain_structure','thermal_regime','water_balance','atmospheric_energy_dryness','edaphic_regime']: raise SystemExit('five-block order drift')
          if acquire.get('status')!='exact_postoutcome_secondary_chelsa_source_urls_frozen_before_any_expanded_chelsa_colour_alignment': raise SystemExit('CHELSA URL contract drift')
          if verify.get('status')!='pass_exact_expanded_chelsa_source_acquisition_before_any_expanded_chelsa_colour_alignment': raise SystemExit('CHELSA source verification missing')
          if verify.get('all_twelve_present') is not True or verify.get('colour_join_performed') is not False: raise SystemExit('source firewall drift')
          if auth.get('status')!='authorize_exactly_one_complete_three_block_chelsa_execution': raise SystemExit('CHELSA family not authorized')
          if auth.get('workflow_attempts_allowed')!=1 or auth.get('all_three_blocks_required') is not True: raise SystemExit('authorization drift')
          if auth.get('blocks') != ['thermal_regime','water_balance','atmospheric_energy_dryness']: raise SystemExit('block family drift')
          if auth.get('null_indices')!='0..998 exactly once' or auth.get('favourable_rerun_allowed') is not False: raise SystemExit('null/rerun drift')
          print({'gate':'pass','blocks':auth['blocks'],'final_holm_pending':True})
          PY

  block:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        block:
          - thermal_regime
          - water_balance
          - atmospheric_energy_dryness
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen package and raster dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "rasterio==1.4.3" pytest
      - name: Preflight unchanged edge inference and CHELSA runner
        run: |
          python -m py_compile scripts/analysis/run_global_rgfca_chelsa_block.py
          python -m pytest -q tests/test_global_edge_mechanism_v2.py tests/test_global_rgfca_engine.py tests/test_global_repeated_atlas.py
      - name: Download and verify exact four CHELSA rasters for this frozen block
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chelsa
          python - <<'PY' > /tmp/chelsa_sources.tsv
          import json, os
          from pathlib import Path
          block=os.environ['BLOCK']
          contract=json.loads(Path('docs/supporting/global_rgfca_chelsa_expanded_source_acquisition_contract_v1.json').read_text())
          verify=json.loads(Path('docs/supporting/global_rgfca_chelsa_expanded_source_verification_v1.json').read_text())
          base=contract['dataset']['base_url']
          frozen={x['filename']:x for x in verify['files'] if x['block']==block}
          entries=contract['process_blocks'][block]
          if len(entries)!=4 or len(frozen)!=4: raise SystemExit('frozen four-axis source family drift')
          for x in entries:
              v=frozen[x['filename']]
              print(base+x['filename'], x['filename'], v['sha256'], sep='\t')
          PY
          while IFS=$'\t' read -r url filename sha; do
            curl -fL --retry 3 --retry-delay 3 "$url" -o "/tmp/chelsa/$filename"
            got=$(sha256sum "/tmp/chelsa/$filename" | awk '{print $1}')
            test "$got" = "$sha"
          done < /tmp/chelsa_sources.tsv
      - name: Execute frozen CHELSA block with all 999 colour nulls
        env:
          BLOCK: ${{ matrix.block }}
          PYTHONUNBUFFERED: "1"
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          mkdir -p "/tmp/result-$BLOCK"
          python scripts/analysis/run_global_rgfca_chelsa_block.py \
            --block "$BLOCK" \
            --source-dir /tmp/chelsa \
            --output-result "/tmp/result-$BLOCK/global_rgfca_${BLOCK}_block_result_v1.json" \
            --output-species "/tmp/result-$BLOCK/global_rgfca_${BLOCK}_block_species_v1.csv" \
            --output-null "/tmp/result-$BLOCK/global_rgfca_${BLOCK}_block_null_v1.csv" \
            --null-batch-size 64
      - name: Require complete raw block result and keep final Holm closed
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          block=os.environ['BLOCK']; root=Path('/tmp')/f'result-{block}'
          p=root/f'global_rgfca_{block}_block_result_v1.json'
          r=json.loads(p.read_text())
          if r.get('block')!=block: raise SystemExit('block identity drift')
          if r.get('null_permutations')!=999 or r.get('null_indices_exact_0_998') is not True: raise SystemExit('incomplete nulls')
          if r.get('final_panel_support_decision_available') is not False or r.get('p_holm') is not None: raise SystemExit('Holm gate opened early')
          if r.get('individual_variable_decomposition_open') is not False: raise SystemExit('component gate opened early')
          print({k:r[k] for k in ['block','observed_mean_species_partial_rho','raw_p_upper','n_evaluable_species','block_edge_occurrence_coverage_fraction']})
          PY
      - name: Upload immutable complete raw block artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-rgfca-expanded-${{ matrix.block }}-block-v1
          retention-days: 90
          if-no-files-found: error
          path: /tmp/result-${{ matrix.block }}/
