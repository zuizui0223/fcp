name: Silene S3 biochemistry preflight

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/preflight_silene_s3_biochemistry_20260925.py
      - .github/workflows/silene-s3-biochemistry-preflight-20260925.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas python-docx
          python -m py_compile scripts/analysis/preflight_silene_s3_biochemistry_20260925.py
      - name: Download Supplementary Table S3
        run: |
          mkdir -p /tmp/silene
          curl -L --fail --retry 5 --retry-delay 2 'https://media.springernature.com/original/springer-static/esm/art%3A10.1186%2Fs12870-019-2082-6/MediaObjects/12870_2019_2082_MOESM4_ESM.docx' -o /tmp/silene/table_s3.docx
          test -s /tmp/silene/table_s3.docx
      - name: Parse schema only
        run: |
          rm -rf results/polymorphism_silene_s3_biochemistry_preflight_20260925
          python scripts/analysis/preflight_silene_s3_biochemistry_20260925.py --docx /tmp/silene/table_s3.docx --outdir results/polymorphism_silene_s3_biochemistry_preflight_20260925
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/polymorphism_silene_s3_biochemistry_preflight_20260925/result.json').read_text())
          assert x['schema']=='fcp_silene_s3_biochemistry_preflight_v1'
          assert x['status']=='complete'
          assert len(x['tables'])>=1
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: silene-s3-biochemistry-preflight-v1
          if-no-files-found: error
          retention-days: 90
          path: results/polymorphism_silene_s3_biochemistry_preflight_20260925
