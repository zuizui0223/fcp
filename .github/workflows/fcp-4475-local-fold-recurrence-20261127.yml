name: FCP local colour observer-fold recurrence
on:
  pull_request:
    paths:
      - scripts/analysis/fcp4475_local_fold_recurrence_20261127.py
      - .github/workflows/fcp-4475-local-fold-recurrence-20261127.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recurrence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Authenticate exact prior workflow artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-local-repeat
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15178380182/zip > /tmp/fcp-local-repeat/source.zip
          echo "b157ab08214cf1b67b37e8be5ba5db10bf5a511e4cc9c0e935b2a78017f59d4a  /tmp/fcp-local-repeat/source.zip" | sha256sum -c -
      - name: Repeated independent-observer local contrast
        run: |
          python scripts/analysis/fcp4475_local_fold_recurrence_20261127.py \
            --artifact /tmp/fcp-local-repeat/source.zip \
            --out /tmp/fcp-local-repeat/out/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: fcp4475-local-fold-recurrence-20261127
          path: /tmp/fcp-local-repeat/out/
          retention-days: 90
