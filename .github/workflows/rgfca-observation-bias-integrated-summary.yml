name: RGFCA integrated observation-bias summary

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "scripts/analysis/summarize_rgfca_observation_bias_controls.py"
      - "data/frozen/global_monte_carlo_sampling_availability_cells_v1.csv"
      - "data/frozen/global_monte_carlo_platform_effort_cells_v1.csv"
      - ".github/workflows/rgfca-observation-bias-integrated-summary.yml"

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run pre-colour integrated observation-bias analysis
        run: python scripts/analysis/summarize_rgfca_observation_bias_controls.py
      - name: Validate outcome firewall and commit result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/supporting/rgfca_observation_bias_integrated_summary_v1.json')
          x = json.loads(p.read_text())
          assert x['status'] == 'complete_precolour_integrated_observation_bias_summary'
          assert x['candidate_image_pixels_opened'] is False
          assert x['flower_colour_used'] is False
          assert x['cells'] == 162
          assert x['top_decile_geometry']['n_cells_each'] == 17
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporting/rgfca_observation_bias_integrated_summary_v1.json
          git commit -m "Freeze integrated RGFCA observation-bias summary"
          git fetch origin analysis/global-monte-carlo-barrier-atlas
          git rebase origin/analysis/global-monte-carlo-barrier-atlas
          git push origin HEAD:analysis/global-monte-carlo-barrier-atlas
