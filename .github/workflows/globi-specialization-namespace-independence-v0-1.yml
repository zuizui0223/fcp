name: GloBI specialization namespace independence v0.1

on:
  pull_request:
    paths:
      - 'data/spatiotemporal_predictor_independence_contract_v0_1.json'
      - 'data/spatiotemporal_predictor_source_matrix_v0_1.csv'
      - 'scripts/analysis/audit_globi_specialization_namespace_independence_v0_1.py'
      - '.github/workflows/globi-specialization-namespace-independence-v0-1.yml'
      - 'tests/test_spatiotemporal_predictor_eligibility_v0_1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install pytest
      - name: Download pinned GloBI dataset index only
        run: |
          set -euo pipefail
          mkdir -p build/globi_specialization_namespace_v0_1
          curl --fail --location --retry 4 --retry-delay 2             'https://zenodo.org/records/22691479/files/datasets.tsv?download=1'             -o build/globi_specialization_namespace_v0_1/datasets.tsv
          echo '6b5191180e9bbfdb7867ff2fdef3e2e305f78cfe6f6405209e455497a06e30c4  build/globi_specialization_namespace_v0_1/datasets.tsv' | sha256sum -c -
      - name: Run namespace-only independence audit
        run: |
          python scripts/analysis/audit_globi_specialization_namespace_independence_v0_1.py             --datasets build/globi_specialization_namespace_v0_1/datasets.tsv             --out build/globi_specialization_namespace_v0_1/result.json
      - name: Validate firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/globi_specialization_namespace_v0_1/result.json'))
          assert x['status']=='GLOBI_SPECIALIZATION_NAMESPACE_PREFLIGHT_COMPLETE'
          assert x['interaction_rows_opened'] is False
          assert x['taxon_identities_opened'] is False
          assert x['specialization_values_computed'] is False
          assert x['dataset_rows']>=400
          PY
      - name: Validate predictor contracts
        run: python -m pytest tests/test_spatiotemporal_predictor_eligibility_v0_1.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: globi-specialization-namespace-independence-v0-1
          path: build/globi_specialization_namespace_v0_1/result.json
