name: JBI non-English search v2 probe

on:
  push:
    branches: [audit/upstream-spatial-reaudit]
    paths:
      - '.github/workflows/jbi-nonenglish-v2-probe.yml'
      - 'literature/itv_fcp_nonenglish_expansion_probe_v2.json'
      - 'scripts/systematic_search/probe_nonenglish_oql_v2.py'
  pull_request:
    paths:
      - '.github/workflows/jbi-nonenglish-v2-probe.yml'
      - 'literature/itv_fcp_nonenglish_expansion_probe_v2.json'
      - 'scripts/systematic_search/probe_nonenglish_oql_v2.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jbi-nonenglish-v2-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe broader non-English title-abstract OQL blocks
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          mkdir -p analysis_outputs/jbi_nonenglish_v2_probe
          python scripts/systematic_search/probe_nonenglish_oql_v2.py \
            --config literature/itv_fcp_nonenglish_expansion_probe_v2.json \
            --out analysis_outputs/jbi_nonenglish_v2_probe/counts.csv \
            --summary-out analysis_outputs/jbi_nonenglish_v2_probe/summary.json \
            --api-key-env OPENALEX_API_KEY --timeout 30 --retries 3
      - name: Validate probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('analysis_outputs/jbi_nonenglish_v2_probe/summary.json').read_text())
          assert len(x['counts']) == 5, x
          assert all(int(v) >= 0 for v in x['counts'].values()), x
          print(x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jbi-nonenglish-v2-probe
          path: analysis_outputs/jbi_nonenglish_v2_probe/
          if-no-files-found: error
          retention-days: 30
