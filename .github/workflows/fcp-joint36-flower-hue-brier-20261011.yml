name: FCP original photo all-environment four-hue explanatory prediction
on:
  pull_request:
    branches:
      - analysis/fcp-all36-environment-joint-shapley-20261011
    paths:
      - scripts/analysis/fcp_joint36_photo_hue_Brier_all_environment_20261011.py
      - tests/test_fcp_joint36_photo_hue_Brier_all_environment_20261011.py
      - .github/workflows/fcp-joint36-flower-hue-brier-20261011.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fcp-joint36-four-hue-${{ github.ref }}
  cancel-in-progress: true
env:
  FCP_SOURCE_ROOT: "/tmp/fcp_original_joint36"
  GH_SOURCE_PHOTO_ID: "11587115220"
  GH_SOURCE_PHOTO_SHA: "2d6097ba1b0434632e13bbe79dd78180608a287ff5dabebc770b5c0a2cfb52a0"
  GH_SOURCE_36_ID: "11653183273"
  GH_SOURCE_36_SHA: "6e287294b3a05eaa383be3de644551825915bfecca9c4bde6950b4890f5e16ca"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
jobs:
  photo-hue-all-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [soil, climate]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install fixed original photographed flora numerical runtime
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.6.1 pytest==8.4.2
      - name: Test original photo hue identity and Brier decomposition math
        run: python -m pytest tests/test_fcp_joint36_photo_hue_Brier_all_environment_20261011.py -q
      - name: Restore and SHA256 verify source original 100543 photo and 36 measured abiotic exposure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$FCP_SOURCE_ROOT"
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$GH_SOURCE_PHOTO_ID/zip" > "$FCP_SOURCE_ROOT/fcp_original_photo_site_climate_soil_85337_20261010.zip"
          echo "$GH_SOURCE_PHOTO_SHA  $FCP_SOURCE_ROOT/fcp_original_photo_site_climate_soil_85337_20261010.zip" | sha256sum -c -
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$GH_SOURCE_36_ID/zip" > "$FCP_SOURCE_ROOT/fcp_100543_all36_expanded_photo_site_environment_20261011.zip"
          echo "$GH_SOURCE_36_SHA  $FCP_SOURCE_ROOT/fcp_100543_all36_expanded_photo_site_environment_20261011.zip" | sha256sum -c -
      - name: Quantify total abiotic Brier information for each flower photo colour over original regions
        run: |
          python scripts/analysis/fcp_joint36_photo_hue_Brier_all_environment_20261011.py --mode "$MODE" --regions all --outdir /tmp/fcp_hue_all36_result
      - name: Verify all original four-hue Brier gains reconstruct original full joint score
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('/tmp/fcp_hue_all36_result/result.json').read_text())
          assert d["original_photo_ids"]==100543 and d["original_classified_photo_ids"]==45953
          assert set(d["cases"])=={"soil_world","soil_east","soil_elsewhere"} or set(d["cases"])=={"climate_world","climate_east","climate_elsewhere"}
          expected={"soil_world":13961,"soil_east":3307,"soil_elsewhere":10307,"climate_world":17183,"climate_east":4555,"climate_elsewhere":12653}
          for name,r in d["cases"].items():
              assert r["n_source_test_species"]==expected[name]
              assert r["four_class_gain_reassembles_full"]
              g=r["hue_Brier_contributions"]
              class_sum=sum(g[k]["genus_equal_gain"] for k in ("white","yellow_orange","red_pink","blue_purple"))
              assert abs(g["total_multiclass_Brier"]["genus_equal_gain"]-class_sum)<1e-12
          print("PASS 100543 original photos, identical source folds, summed class contributions")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-original-joint36-four-hue-${{ matrix.mode }}
          retention-days: 45
          if-no-files-found: error
          path: /tmp/fcp_hue_all36_result/result.json
