name: FCP post hoc adaptive spatial sorting

on:
  pull_request:
    branches: [main]
    paths:
      - docs/POLYMORPHISM_ADAPTIVE_SPATIAL_SORTING_POSTHOC_PROTOCOL_20261007.md
      - scripts/analysis/run_polymorphism_adaptive_spatial_sorting_posthoc_20261007.py
      - .github/workflows/polymorphism-adaptive-spatial-sorting-posthoc-20261007.yml
  workflow_dispatch:

concurrency:
  group: fcp-adaptive-spatial-sorting-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_SHA: "5142f7951af0dde5364bb047a566d67e8c479e51"
  DISC_SHA256: "ee854126eed2cfe23e333abe2c28d14df24895a5c52cbc389c060a5a4d6f91f4"
  VAL_SHA256: "0e2ed349122739eecfc725fb2d5e313d284cf30752da91f9a0429cff0eeaa5e6"

jobs:
  adaptive-sorting:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install frozen spatial-environment runtime
        run: |
          python -m pip install -r requirements-np-bio5-replay-20260928.txt
          python -m py_compile scripts/analysis/run_polymorphism_adaptive_spatial_sorting_posthoc_20261007.py

      - name: Recover immutable discovery and validation tables
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git show "$SOURCE_SHA:data/derived/global_monte_carlo_measured_photos_v1.csv" > /tmp/discovery.csv
          git show "$SOURCE_SHA:data/derived/rgfca_reserve_replication_measured_photos_v1.csv" > /tmp/validation.csv
          echo "$DISC_SHA256  /tmp/discovery.csv" | sha256sum -c -
          echo "$VAL_SHA256  /tmp/validation.csv" | sha256sum -c -

      - name: Recover checksum-pinned WorldClim inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/worldclim/bio /tmp/worldclim/srad
          curl -L --fail --retry 5 --retry-delay 3 \
            https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip \
            -o /tmp/worldclim/bio.zip
          curl -L --fail --retry 5 --retry-delay 3 \
            https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_srad.zip \
            -o /tmp/worldclim/srad.zip
          echo '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf  /tmp/worldclim/bio.zip' | sha256sum -c -
          echo 'c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026  /tmp/worldclim/srad.zip' | sha256sum -c -
          unzip -q /tmp/worldclim/bio.zip -d /tmp/worldclim/bio
          unzip -q /tmp/worldclim/srad.zip -d /tmp/worldclim/srad
          echo '32e02d85868734c32547da70cf9c620f4739a3cf5dbc4f2b751e16ebb2338ae1  /tmp/worldclim/bio/wc2.1_10m_bio_5.tif' | sha256sum -c -
          echo 'a759ceb007d02574128148af7f47ab578b18a07e2f5624725d7f222c3c457812  /tmp/worldclim/bio/wc2.1_10m_bio_14.tif' | sha256sum -c -

      - name: Run frozen post hoc analysis
        run: |
          rm -rf /tmp/fcp_adaptive_sorting
          python scripts/analysis/run_polymorphism_adaptive_spatial_sorting_posthoc_20261007.py \
            --discovery /tmp/discovery.csv \
            --validation /tmp/validation.csv \
            --bio5 /tmp/worldclim/bio/wc2.1_10m_bio_5.tif \
            --bio14 /tmp/worldclim/bio/wc2.1_10m_bio_14.tif \
            --srad-dir /tmp/worldclim/srad \
            --outdir /tmp/fcp_adaptive_sorting

      - name: Validate post hoc boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/fcp_adaptive_sorting/result.json").read_text())
          assert r["schema"]=="fcp_adaptive_spatial_sorting_posthoc_v1"
          assert r["status"]=="complete_posthoc_ecological_diagnostic"
          assert r["confirmatory_decisions_changed"] is False
          assert r["discovery"]["species"] >= 300
          assert r["validation"]["species"] >= 300
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fcp-adaptive-spatial-sorting-posthoc-20261007
          if-no-files-found: error
          retention-days: 30
          path: /tmp/fcp_adaptive_sorting/
