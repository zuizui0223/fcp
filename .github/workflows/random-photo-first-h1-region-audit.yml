name: Random photo-first predeclared regional H1 audit

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/random-photo-first-inference-execution
    paths:
      - "scripts/analysis/run_random_photo_first_h1_region_audit.py"
      - ".github/workflows/random-photo-first-h1-region-audit.yml"
      - "data/derived/random_photo_first_h1_edges_v1.csv"
      - "data/derived/random_photo_first_h1_null_maps_v1.npz"
      - "data/derived/random_photo_first_h2_climate_edges_250km_v1.csv"

permissions:
  contents: write

concurrency:
  group: random-photo-first-h1-region-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regional-h1-audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Recover predeclared regional H1 sensitivity
        run: python scripts/analysis/run_random_photo_first_h1_region_audit.py
      - name: Validate audit cannot replace primary H1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('docs/supporting/random_photo_first_h1_region_audit_v1.json').read_text())
          h1 = json.loads(Path('docs/supporting/random_photo_first_h1_result_v1.json').read_text())
          assert result['status'] == 'complete_predeclared_regional_sensitivity_recovery'
          assert result['role'] == 'sensitivity_only_primary_global_h1_decision_unchanged'
          assert result['primary_h1_decision'] == h1['decision']
          assert result['primary_h1_p_upper'] == h1['primary']['p_upper']
          assert result['global_replay']['p_upper'] == h1['primary']['p_upper']
          assert abs(result['global_replay']['observed_concentration'] - h1['primary']['observed_concentration']) < 1e-12
          assert result['within_biome_predeclared']['permutations'] == 999
          assert result['within_continent_predeclared']['status'] == 'not_evaluable_missing_prospectively_frozen_continent_labels'
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: random-photo-first-h1-region-audit-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            docs/supporting/random_photo_first_h1_region_audit_v1.json
            data/derived/random_photo_first_h1_region_audit_v1.csv
      - name: Commit regional audit outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporting/random_photo_first_h1_region_audit_v1.json data/derived/random_photo_first_h1_region_audit_v1.csv
          git commit -m "Recover predeclared random photo-first regional H1 sensitivity"
          git fetch origin analysis/random-photo-first-inference-execution
          git rebase origin/analysis/random-photo-first-inference-execution
          git push origin HEAD:analysis/random-photo-first-inference-execution
