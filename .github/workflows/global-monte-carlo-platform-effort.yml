name: RGFCA platform-wide effort negative control

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "docs/supporting/global_monte_carlo_platform_effort_contract_v1.json"
      - "scripts/acquisition/freeze_global_monte_carlo_platform_effort.py"
      - ".github/workflows/global-monte-carlo-platform-effort.yml"

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and validate frozen no-colour contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m py_compile scripts/acquisition/freeze_global_monte_carlo_platform_effort.py
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/supporting/global_monte_carlo_platform_effort_contract_v1.json').read_text())
          assert c['status'] == 'frozen_after_target_group_availability_census_and_before_any_rgfca_global_flower_colour_field'
          assert c['fixed_request_attempts'] == 162
          assert c['query']['taxon_filter'] is None
          assert c['outcome_firewall']['candidate_image_pixels_opened'] is False
          assert c['outcome_firewall']['flower_colour_used'] is False
          assert c['outcome_firewall']['RGFCA_colour_result_available_at_freeze'] is False
          PY
      - name: Execute fixed all-taxa count census
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/acquisition/freeze_global_monte_carlo_platform_effort.py
      - name: Validate and commit immutable effort surface
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          m = json.loads(Path('docs/supporting/global_monte_carlo_platform_effort_manifest_v1.json').read_text())
          d = pd.read_csv('data/frozen/global_monte_carlo_platform_effort_cells_v1.csv')
          assert m['status'] == 'complete_metadata_only_platform_effort_surface'
          assert m['candidate_image_pixels_opened'] is False and m['flower_colour_used'] is False
          assert m['request_attempts'] == 162 and m['request_errors'] <= 8
          assert len(d) == 162 and d['cell_id'].nunique() == 162
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/frozen/global_monte_carlo_platform_effort_cells_v1.csv docs/supporting/global_monte_carlo_platform_effort_manifest_v1.json
          git commit -m "Freeze RGFCA platform-wide effort surface"
          git fetch origin analysis/global-monte-carlo-barrier-atlas
          git rebase origin/analysis/global-monte-carlo-barrier-atlas
          git push origin HEAD:analysis/global-monte-carlo-barrier-atlas
