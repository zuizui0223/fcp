name: disttrait package

on:
  push:
    paths:
      - "packages/disttrait/**"
      - ".github/workflows/disttrait-package.yml"
  pull_request:
    paths:
      - "packages/disttrait/**"
      - ".github/workflows/disttrait-package.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/disttrait pytest

      - name: Compile package
        run: python -m compileall -q packages/disttrait/src/disttrait

      - name: Run disttrait tests
        run: python -m pytest packages/disttrait/tests -q

      - name: Run external empirical transport
        run: |
          python packages/disttrait/examples/sf_street_tree_empirical.py \
            --output disttrait_sf_empirical_result.json

      - name: Verify empirical transport receipt
        run: |
          python packages/disttrait/scripts/check_sf_empirical_receipt.py \
            --observed disttrait_sf_empirical_result.json \
            --expected results/disttrait_sf_street_tree_empirical_v0_6_20260919/result.json

      - name: Upload empirical transport receipt
        uses: actions/upload-artifact@v4
        with:
          name: disttrait-sf-empirical-transport
          path: disttrait_sf_empirical_result.json
