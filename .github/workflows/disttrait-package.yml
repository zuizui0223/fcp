name: disttrait package

on:
  push:
    paths:
      - "packages/disttrait/**"
      - ".github/workflows/disttrait-package.yml"
  pull_request:
    paths:
      - "packages/disttrait/**"
      - ".github/workflows/disttrait-package.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/disttrait pytest

      - name: Compile package
        run: python -m compileall -q packages/disttrait/src/disttrait

      - name: Run disttrait tests
        run: python -m pytest packages/disttrait/tests -q
