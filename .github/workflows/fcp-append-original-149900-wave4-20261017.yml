name: FCP original 149900 plus unchanged-wave4 append checks
on:
  push:
    branches: [analysis/fcp-append-exact-wave4-originals-20261017]
    paths:
      - scripts/analysis/append_wave4_to_original_149900_20261017.py
      - tests/test_append_wave4_to_original_149900_20261017.py
      - .github/workflows/fcp-append-original-149900-wave4-20261017.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/append_wave4_to_original_149900_20261017.py
      - tests/test_append_wave4_to_original_149900_20261017.py
      - .github/workflows/fcp-append-original-149900-wave4-20261017.yml
  workflow_run:
    workflows:
      - FCP wave4 identical original photo ROI and D W spatial replay
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  immutable-source-append-only-tests:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run photo-ID and immutable-photo-denominator regression tests
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m pytest -q tests/test_append_wave4_to_original_149900_20261017.py
          python -m py_compile scripts/analysis/append_wave4_to_original_149900_20261017.py
  append-real-photos-after-original-roi-success:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.id == 38990487465 && github.event.workflow_run.head_sha == '4462c5cee5a190f6d551f232712ff161f16910bf' && github.event.workflow_run.head_repository.full_name == 'zuizui0223/fcp' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: fcp-append-149900-wave4-38990487465
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_FCP_DISCOVERY: ee854126eed2cfe23e333abe2c28d14df24895a5c52cbc389c060a5a4d6f91f4
      ORIGINAL_FCP_VALIDATION: 0e2ed349122739eecfc725fb2d5e313d284cf30752da91f9a0429cff0eeaa5e6
      ORIGINAL_FCP_PROSPECTIVE: 57630fc9f281bce94a0c40a70aaf7bce879dde93d6154175adcd021e8f5c1186
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exactly frozen original source and original new-photo measurement receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fcp-wave4/old" "$RUNNER_TEMP/fcp-wave4/new" "$RUNNER_TEMP/fcp-wave4/combined"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38990487465" > "$RUNNER_TEMP/fcp-wave4/upstream_run.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'fcp-wave4/upstream_run.json').read_text())
          assert r['id']==38990487465
          assert r['event']=='pull_request'
          assert r['head_sha']=='4462c5cee5a190f6d551f232712ff161f16910bf'
          assert r['head_branch']=='analysis/fcp-wave4-unchanged-pixel-replay-20261017'
          assert r['conclusion']=='success' and r['status']=='completed'
          print('WAVE4_REAL_ORIGINAL_ROI_WORKFLOW_CONFIRMED',r['html_url'])
          PY
          gh run download 38990487465 --repo "$GITHUB_REPOSITORY" \
            --name fcp-wave4-149900-method-expansion-actual-measured-and-inferred \
            --dir "$RUNNER_TEMP/fcp-wave4/new"
          git fetch --no-tags --depth=1 origin \
            5142f7951af0dde5364bb047a566d67e8c479e51 \
            7e538e5c51c05a7cc47b2fcf53eea92634c8a863
          git show 5142f7951af0dde5364bb047a566d67e8c479e51:data/derived/global_monte_carlo_measured_photos_v1.csv > "$RUNNER_TEMP/fcp-wave4/old/discovery.csv"
          git show 5142f7951af0dde5364bb047a566d67e8c479e51:data/derived/rgfca_reserve_replication_measured_photos_v1.csv > "$RUNNER_TEMP/fcp-wave4/old/validation.csv"
          git show 7e538e5c51c05a7cc47b2fcf53eea92634c8a863:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv > "$RUNNER_TEMP/fcp-wave4/old/prospective.csv"
          echo "$ORIGINAL_FCP_DISCOVERY  $RUNNER_TEMP/fcp-wave4/old/discovery.csv" | sha256sum -c -
          echo "$ORIGINAL_FCP_VALIDATION  $RUNNER_TEMP/fcp-wave4/old/validation.csv" | sha256sum -c -
          echo "$ORIGINAL_FCP_PROSPECTIVE  $RUNNER_TEMP/fcp-wave4/old/prospective.csv" | sha256sum -c -
      - name: Append original 149900 plus genuinely measured new original photographic terminal IDs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pandas==2.2.3 numpy==2.1.3
          python scripts/analysis/append_wave4_to_original_149900_20261017.py \
            --discovery "$RUNNER_TEMP/fcp-wave4/old/discovery.csv" \
            --validation "$RUNNER_TEMP/fcp-wave4/old/validation.csv" \
            --prospective "$RUNNER_TEMP/fcp-wave4/old/prospective.csv" \
            --wave4 "$RUNNER_TEMP/fcp-wave4/new/wave4-real/wave4_original_method_measured_photos.csv" \
            --wave4-terminal "$RUNNER_TEMP/fcp-wave4/new/wave4-real/terminal_result.json" \
            --outdir "$RUNNER_TEMP/fcp-wave4/combined"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'fcp-wave4/combined/expanded_data_receipt.json'
          r=json.loads(p.read_text())
          assert r['schema']=='fcp_original_149900_plus_same_method_wave4_merged_v1'
          assert r['original_source_rows']==149900
          assert 179900<=r['all_original_photo_rows']<=199900
          assert r['append_only'] is True and r['four_state_method_relabelled'] is False
          assert r['existing_50km_null_reweighted'] is False
          assert r['all_named_species']==1499+r['new_named_species']
          print('ORIGINAL_FCP_149900_PHOTOS_EXPANDED_TO',r['all_original_photo_rows'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-original149900-plus-wave4-actual-original-photos-20261017
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/fcp-wave4/combined/
