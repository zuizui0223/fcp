name: FCP original 149900 plus unchanged-wave4 append checks
on:
  push:
    branches: [analysis/fcp-append-exact-wave4-originals-20261017]
    paths:
      - scripts/analysis/append_wave4_to_original_149900_20261017.py
      - tests/test_append_wave4_to_original_149900_20261017.py
      - .github/workflows/fcp-append-original-149900-wave4-20261017.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/append_wave4_to_original_149900_20261017.py
      - tests/test_append_wave4_to_original_149900_20261017.py
      - .github/workflows/fcp-append-original-149900-wave4-20261017.yml
permissions:
  contents: read
jobs:
  immutable-source-append-only-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run photo-ID and immutable-photo-denominator regression tests
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m pytest -q tests/test_append_wave4_to_original_149900_20261017.py
          python -m py_compile scripts/analysis/append_wave4_to_original_149900_20261017.py
