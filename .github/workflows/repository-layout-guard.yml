name: Current paper repository layout guard

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CURRENT_PAPER_REPRODUCIBILITY.md
      - pyproject.toml
      - .github/workflows/**
      - archive/workflows/**
      - tests/test_repository_layout.py
      - tests/test_upstream_spatial_reaudit.py
  pull_request:
    branches: [main]
    paths:
      - README.md
      - CURRENT_PAPER_REPRODUCIBILITY.md
      - pyproject.toml
      - .github/workflows/**
      - archive/workflows/**
      - tests/test_repository_layout.py
      - tests/test_upstream_spatial_reaudit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify active-paper and archived-workflow boundaries
        run: |
          python tests/test_repository_layout.py
          python tests/test_upstream_spatial_reaudit.py
