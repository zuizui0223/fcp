name: GloBI filter-only parquet schema v0.1

on:
  pull_request:
    paths:
      - 'data/globi_filter_only_schema_design_v0_1.json'
      - 'results/globi_filter_only_file_inventory_v0_1/result.json'
      - 'scripts/analysis/audit_globi_filter_only_parquet_schema_v0_1.py'
      - '.github/workflows/globi-filter-only-parquet-schema-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema runtime
        run: python -m pip install duckdb
      - name: Read Parquet schema only
        run: |
          mkdir -p build/globi_filter_only_schema_v0_1
          python scripts/analysis/audit_globi_filter_only_parquet_schema_v0_1.py \
            --url 'https://zenodo.org/api/records/22691479/files/interactions.parquet/content' \
            --out build/globi_filter_only_schema_v0_1/result.json
      - name: Validate row firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/globi_filter_only_schema_v0_1/result.json'))
          assert x['rows_opened'] is False
          assert x['taxon_values_opened'] is False
          assert x['interaction_values_opened'] is False
          assert x['specialization_values_computed'] is False
          assert x['status'] in {
            'PASS_GLOBI_PARQUET_SCHEMA_REQUIRED_ROLES_PRESENT',
            'HOLD_GLOBI_PARQUET_SCHEMA_REQUIRED_ROLE_MISSING'
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: globi-filter-only-parquet-schema-v0-1
          path: build/globi_filter_only_schema_v0_1/result.json
