name: Build frozen polymorphism publication figures

on:
  push:
    branches:
      - analysis/h2-third-cohort-preopening-20260916
    paths:
      - scripts/analysis/make_polymorphism_manuscript_figures.py
      - tests/test_make_polymorphism_manuscript_figures.py
      - results/polymorphism_publication_figure_source_20260918/**
      - results/polymorphism_h1_observer_disjoint_reliability_20260913/result.json
      - results/polymorphism_h1_observer_disjoint_D_reliability_20260913/result.json
      - results/polymorphism_white_axis_targeted_test_20260912/result.json
      - results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/**
      - results/polymorphism_h3a_phylogenetic_signal_20260912/frozen_result_manifest.json
      - docs/POLYMORPHISM_H3B_RESERVE_SPAN_RESULT_FREEZE_20260912.md
      - .github/workflows/polymorphism-publication-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-figures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install figure dependencies
        run: python -m pip install --upgrade pytest pandas numpy matplotlib

      - name: Verify figure contracts
        run: python -m pytest tests/test_make_polymorphism_manuscript_figures.py -q

      - name: Generate canonical figures
        run: |
          rm -rf docs/figures/polymorphism_20260918
          python scripts/analysis/make_polymorphism_manuscript_figures.py \
            --root . \
            --output-dir docs/figures/polymorphism_20260918

      - name: Verify generated file set
        run: |
          test -s docs/figures/polymorphism_20260918/polymorphism_figure_manifest_20260918.json
          test "$(find docs/figures/polymorphism_20260918 -maxdepth 1 -name '*.png' | wc -l)" -eq 5
          test "$(find docs/figures/polymorphism_20260918 -maxdepth 1 -name '*.pdf' | wc -l)" -eq 5

      - name: Commit canonical generated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures/polymorphism_20260918
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "Generate frozen polymorphism publication figures [skip ci]"
            git fetch origin analysis/h2-third-cohort-preopening-20260916
            git rebase origin/analysis/h2-third-cohort-preopening-20260916
            git push origin HEAD:analysis/h2-third-cohort-preopening-20260916
          fi

      - name: Upload publication figure artifact
        uses: actions/upload-artifact@v4
        with:
          name: polymorphism-publication-figures-20260918
          path: docs/figures/polymorphism_20260918
          if-no-files-found: error
          retention-days: 90
