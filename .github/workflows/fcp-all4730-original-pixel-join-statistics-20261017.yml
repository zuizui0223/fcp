name: FCP all 4730 original photo join and unchanged H1 W 50km
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/combine_fcp_all4730_originals_20261017.py
      - tests/test_combine_fcp_all4730_originals_20261017.py
      - .github/workflows/fcp-all4730-original-pixel-join-statistics-20261017.yml
  workflow_run:
    workflows:
      - FCP full 4730 original flower ROI and H1 D 50km W replay
    types: [completed]
  workflow_dispatch:
    inputs:
      roi_run_id:
        description: Authenticated completed 4730 original ROI run ID
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: fcp-4730-original-final-join-once
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: "."
  WAVE4_ROI_RUN: "38992543115"
  WAVE4_ROI_SHA: "ef448c9514e0c702e7887e00b288ee966728b0d5"
  ORIGINAL_U100_SOURCE_RUN: "38993836606"
  ORIGINAL_U100_SOURCE_SHA: "9c1298956941769fdfd62aeaa7d61febf1154c3e"
  ALL4730_ROI_RUN: ${{ github.event.workflow_run.id || inputs.roi_run_id }}
jobs:
  code-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Original H1 and 50km statistical code preflight, no photographs
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 pytest==8.4.2
          python - <<'PY'
          # Crucial: true old photo-join and original 50km workers do NOT first
          # restore the historic ROI modules. Import must work in main checkout.
          from scripts.analysis import combine_fcp_all4730_originals_20261017 as pipeline
          assert callable(pipeline.combine)
          assert callable(pipeline.replay_same_old_50km)
          print('FCP4730_STANDALONE_50KM_AND_JOIN_IMPORT_VERIFIED')
          PY
          bash scripts/analysis/materialize_fcp_wave4_original_machine_20261017.sh
          python -m pytest -q tests/test_combine_fcp_all4730_originals_20261017.py
          python -m py_compile scripts/analysis/combine_fcp_all4730_originals_20261017.py
  frozen-original-plus-two-genuine-new-wave-measurements:
    needs: code-preflight
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'zuizui0223/fcp' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
      - name: Verify actual successful ROI runs and original 4730 source record
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ALL4730_ROI_RUN"
          mkdir -p /tmp/fcpallfinal/{old,wave4,new,metadata,combined}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ALL4730_ROI_RUN" > /tmp/fcpallfinal/new_run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WAVE4_ROI_RUN" > /tmp/fcpallfinal/wave4_run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_U100_SOURCE_RUN" > /tmp/fcpallfinal/meta_run.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path('/tmp/fcpallfinal')
          new=json.loads((base/'new_run.json').read_text())
          wave=json.loads((base/'wave4_run.json').read_text())
          source=json.loads((base/'meta_run.json').read_text())
          assert new['id']==int(os.environ['ALL4730_ROI_RUN'])
          assert new['name']=='FCP full 4730 original flower ROI and H1 D 50km W replay'
          assert new['head_branch']=='main'
          assert new['status']=='completed' and new['conclusion']=='success'
          assert new['run_attempt']==1
          assert wave['id']==int(os.environ['WAVE4_ROI_RUN'])
          assert wave['head_sha']==os.environ['WAVE4_ROI_SHA']
          assert wave['event']=='pull_request'
          assert wave['status']=='completed' and wave['conclusion']=='success'
          assert wave['run_attempt']==1
          assert source['id']==int(os.environ['ORIGINAL_U100_SOURCE_RUN'])
          assert source['head_sha']==os.environ['ORIGINAL_U100_SOURCE_SHA']
          assert source['status']=='completed' and source['conclusion']=='success'
          assert source['run_attempt']==1
          print('ALL_4730_EXACT_ORIGINAL_PHOTO_SOURCE_AND_ROI_RUNS_VERIFIED',new['id'])
          PY
          gh run download "$ALL4730_ROI_RUN" --repo "$GITHUB_REPOSITORY" \
            --name fcp-all4730-genuine-original-pixel-measurement-and-inference \
            --dir /tmp/fcpallfinal/new
          gh run download "$WAVE4_ROI_RUN" --repo "$GITHUB_REPOSITORY" \
            --name fcp-wave4-149900-method-expansion-actual-measured-and-inferred \
            --dir /tmp/fcpallfinal/wave4
          gh run download "$ORIGINAL_U100_SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name fcp-all4730-actual-H9-2733-source-metadata-terminal \
            --dir /tmp/fcpallfinal/metadata
      - name: Recover exactly three old immutable measured cohorts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 5142f7951af0dde5364bb047a566d67e8c479e51
          git fetch --no-tags --depth=1 origin 7e538e5c51c05a7cc47b2fcf53eea92634c8a863
          git show 5142f7951af0dde5364bb047a566d67e8c479e51:data/derived/global_monte_carlo_measured_photos_v1.csv > /tmp/fcpallfinal/old/discovery.csv
          git show 5142f7951af0dde5364bb047a566d67e8c479e51:data/derived/rgfca_reserve_replication_measured_photos_v1.csv > /tmp/fcpallfinal/old/validation.csv
          git show 7e538e5c51c05a7cc47b2fcf53eea92634c8a863:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv > /tmp/fcpallfinal/old/prospective.csv
      - name: Combine U100 4730 species without changing any photo colour, old 149900 records or species weights
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analysis/combine_fcp_all4730_originals_20261017.py combine \
            --discovery /tmp/fcpallfinal/old/discovery.csv \
            --validation /tmp/fcpallfinal/old/validation.csv \
            --prospective /tmp/fcpallfinal/old/prospective.csv \
            --wave4 /tmp/fcpallfinal/wave4/wave4-real/wave4_original_method_measured_photos.csv \
            --wave4-terminal /tmp/fcpallfinal/wave4/wave4-real/terminal_result.json \
            --new /tmp/fcpallfinal/new/wave4-real/all4730_new_original_measured_photos.csv.gz \
            --new-terminal /tmp/fcpallfinal/new/wave4-real/all4730_new_photo_terminal_result.json \
            --all-U100 /tmp/fcpallfinal/metadata/full_U100_4730_status_after_H9.csv \
            --metadata-receipt /tmp/fcpallfinal/metadata/all4730_metadata_result.json \
            --out /tmp/fcpallfinal/combined
          python - <<'PY'
          import json
          r=json.load(open('/tmp/fcpallfinal/combined/fcp_all4730_original_photo_combine_receipt.json'))
          assert r['full_original_eligible_U100_taxa']==4730
          assert r['old_50km_and_W_estimators_unchanged'] is True
          assert r['original_149900_photo_rows_unchanged'] is True
          assert r['total_original_100photo_measured_species']+r['remaining_U100_under_100_original_H9_photos']==4730
          print('FCP_REAL_ALL_4730_SOURCE_JOIN_PHOTO_ROWS',r['total_original_pixel_terminal_photo_rows'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-all4730-verified-full-original-measured-photo-table
          if-no-files-found: error
          retention-days: 90
          path: /tmp/fcpallfinal/combined/
  replay-exact-original-50km-for-all-U100:
    needs: frozen-original-plus-two-genuine-new-wave-measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
      - uses: actions/download-artifact@v4
        with:
          name: fcp-all4730-verified-full-original-measured-photo-table
          path: /tmp/fcpallfinal/combined
      - name: Exact old species-label permutation 50km 199-world null, old 3 effects reproducibility gate
        run: |
          python scripts/analysis/combine_fcp_all4730_originals_20261017.py 50km \
            --combined /tmp/fcpallfinal/combined/fcp_all4730_original_method_measured_photos.csv.gz \
            --receipt /tmp/fcpallfinal/combined/fcp_all4730_original_photo_combine_receipt.json \
            --out /tmp/fcpallfinal/spatial
          python - <<'PY'
          import json
          p='/tmp/fcpallfinal/spatial/fcp_all4730_unchanged_original_50km_results.json'
          d=json.load(open(p))
          assert d['old_three_original_149900_effects_exactly_reproduced']
          assert d['original_199_vertex_null_changed'] is False
          print('FCP_ALL4730_UNCHANGED_50KM_EVALUABLE',d['all_evaluable_species'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-all4730-original-same-50km-permutation-inference
          if-no-files-found: error
          retention-days: 90
          path: /tmp/fcpallfinal/spatial/
  replay-historical-observer-D-and-fixed-W:
    needs: frozen-original-plus-two-genuine-new-wave-measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore original unchanged H1/D and H2/W statistical implementations
        run: |
          bash scripts/analysis/materialize_fcp_wave4_original_machine_20261017.sh
          python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
      - uses: actions/download-artifact@v4
        with:
          name: fcp-all4730-verified-full-original-measured-photo-table
          path: /tmp/fcpallfinal/combined
      - name: Same original observer-disjoint H1 D and four-state fixed-axis W on all measured 4730 U100
        run: |
          python scripts/analysis/combine_fcp_all4730_originals_20261017.py H1-D-W \
            --combined /tmp/fcpallfinal/combined/fcp_all4730_original_method_measured_photos.csv.gz \
            --receipt /tmp/fcpallfinal/combined/fcp_all4730_original_photo_combine_receipt.json \
            --out /tmp/fcpallfinal/h1w
          python - <<'PY'
          import json
          p='/tmp/fcpallfinal/h1w/fcp_all4730_H1_D_W_results.json'
          d=json.load(open(p))
          assert d['existing_method_called_directly'] is True
          assert d['old_frozen_149900_inference_not_overwritten']
          print('FCP_ALL4730_ALL_ORIGINAL_H1_D_AND_W_COMPLETE',d['all_real_photo_rows'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-all4730-original-same-H1-D-W-inference
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcpallfinal/h1w/
