name: Canonical paper figures

on:
  push:
    branches:
      - manuscript/jbi-theory-positioning
    paths:
      - "scripts/make_paper_figures.py"
      - "fcp_pipeline/**"
      - "data/frozen/**"
      - "docs/supporting/jbi_gbif_doi_bundle/jbi_gbif_exact_occurrence_subset.csv.gz"
      - ".github/workflows/paper-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-figures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manuscript/jbi-theory-positioning
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install figure dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check matplotlib cartopy
      - name: Generate canonical figures
        run: |
          python scripts/make_paper_figures.py \
            --dataset data/frozen/frozen_34species_five_metric_dataset.csv \
            --occurrences docs/supporting/jbi_gbif_doi_bundle/jbi_gbif_exact_occurrence_subset.csv.gz \
            --outdir docs/figures
      - name: Validate outputs
        run: |
          set -euo pipefail
          for stem in \
            figure1_geographic_context \
            figure2_five_metric_forest \
            figure3_raw_species_metrics \
            figureS1_34_species_distribution_context; do
            test -s "docs/figures/${stem}.png"
            test -s "docs/figures/${stem}.pdf"
          done
      - name: Commit generated figures to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures/*.png docs/figures/*.pdf
          if git diff --cached --quiet; then
            echo "Figures unchanged"
            exit 0
          fi
          git commit -m "Generate canonical JBI paper figures"
          git push origin HEAD:manuscript/jbi-theory-positioning
