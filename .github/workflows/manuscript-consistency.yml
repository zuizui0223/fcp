name: Manuscript consistency

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/jbi_manuscript.md"
      - "docs/jbi_cover_letter_template.md"
      - "docs/JBI_POSITIONING_AND_HYPOTHESES.md"
      - "docs/FIGURE_PLAN.md"
      - "docs/figures/**"
      - "docs/jbi_supporting_information_index.md"
      - "docs/jbi_submission_completion_checklist.md"
      - "docs/supporting/cr2_satterthwaite_summary.csv"
      - "scripts/make_paper_figures.py"
      - "scripts/update_manuscript_figure_calls.py"
      - "tests/test_manuscript_consistency.py"
      - "tests/test_figures.py"
      - ".github/workflows/manuscript-consistency.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/jbi_manuscript.md"
      - "docs/jbi_cover_letter_template.md"
      - "docs/JBI_POSITIONING_AND_HYPOTHESES.md"
      - "docs/FIGURE_PLAN.md"
      - "docs/figures/**"
      - "docs/jbi_supporting_information_index.md"
      - "docs/jbi_submission_completion_checklist.md"
      - "docs/supporting/cr2_satterthwaite_summary.csv"
      - "scripts/make_paper_figures.py"
      - "scripts/update_manuscript_figure_calls.py"
      - "tests/test_manuscript_consistency.py"
      - "tests/test_figures.py"
      - ".github/workflows/manuscript-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscript-consistency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manuscript-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check canonical manuscript, figures, cover letter, SI and frozen result guards
        run: |
          python tests/test_manuscript_consistency.py
          python tests/test_figures.py
