name: FCP white chromatic landscape ecology
on:
  pull_request:
    paths:
      - scripts/analysis/fcp4475_white_chromatic_landscape_20261127.py
      - .github/workflows/fcp-4475-white-chromatic-landscape-20261127.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      PHOTO_SHA: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Verify exact additive decomposition
        run: python scripts/analysis/fcp4475_white_chromatic_landscape_20261127.py --self-test
      - name: Authenticate original photos and fixed climate landscape
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-components/{release,measured,out}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_FILE" --dir /tmp/fcp-components/release
          echo "$SOURCE_ARCHIVE_SHA  /tmp/fcp-components/release/$SOURCE_FILE" | sha256sum -c -
          tar -xzf /tmp/fcp-components/release/$SOURCE_FILE -C /tmp/fcp-components measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$PHOTO_SHA  /tmp/fcp-components/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15184882647/zip > /tmp/fcp-components/landscape.zip
          echo "a3398a827f9d8b5a3478c3096f94d15752d858cfd95c62be2fa4e48c0b45adf4  /tmp/fcp-components/landscape.zip" | sha256sum -c -
      - name: Estimate white-specific versus chromatic associations
        run: |
          python scripts/analysis/fcp4475_white_chromatic_landscape_20261127.py \
            --photos /tmp/fcp-components/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --landscape /tmp/fcp-components/landscape.zip \
            --out /tmp/fcp-components/out
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('/tmp/fcp-components/out')
          d=pd.read_csv(p/'species_white_chromatic_landscape.csv.gz')
          j=json.loads((p/'results.json').read_text())
          assert len(d)==4475 and d.inat_taxon_id.nunique()==4475
          assert d.source_n.sum()==447500 and d.classifiable_n.sum()==227107
          for typ,k in j['results'].items():
              for radius,panel in k['panels'].items():
                  for metric,v in panel.items():
                      assert v['status']=='estimable', (typ,radius,metric,v)
                      assert v['n']==k['common_component_scale_taxa']
                      for pred,x in v['effects'].items():
                          assert abs(x['white']['coefficient_per_predictor_sd']-x['chromatic']['coefficient_per_predictor_sd']-x['white_minus_chromatic']['coefficient_per_predictor_sd'])<1e-8
          print('FCP_COMPONENT_LEDGER_QA_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp4475-white-chromatic-landscape-20261127
          path: /tmp/fcp-components/out/
          retention-days: 90
