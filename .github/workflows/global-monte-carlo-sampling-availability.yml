name: RGFCA metadata-only sampling availability census

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "docs/supporting/global_monte_carlo_sampling_availability_authorization_v1.json"

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify one-shot metadata authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('docs/supporting/global_monte_carlo_sampling_availability_authorization_v1.json').read_text())
          c = json.loads(Path('docs/supporting/global_monte_carlo_observation_bias_contract_v1.json').read_text())
          assert a['status'] == 'authorized_once_after_successful_validation'
          assert a['validation_run_id'] == 33853340114
          assert a['validated_head_sha'] == '99dafc6c14aa7eb4c4d7c68a0bccd8411176b6df'
          assert a['candidate_image_pixels_may_open'] is False
          assert a['flower_colour_may_open'] is False
          assert c['status'] == 'frozen_before_any_rgfca_global_flower_colour_field'
          PY
      - name: Execute fixed count-only census
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/acquisition/freeze_global_monte_carlo_sampling_availability.py
      - name: Validate terminal products
        run: |
          python -m json.tool docs/supporting/global_monte_carlo_sampling_availability_manifest_v1.json >/dev/null
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          m = json.loads(Path('docs/supporting/global_monte_carlo_sampling_availability_manifest_v1.json').read_text())
          d = pd.read_csv('data/frozen/global_monte_carlo_sampling_availability_cells_v1.csv')
          assert m['candidate_image_pixels_opened'] is False
          assert m['flower_colour_used'] is False
          assert m['request_attempts'] == 486
          assert len(d) == 162 and d['cell_id'].nunique() == 162
          PY
      - name: Commit immutable sampling-availability surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/frozen/global_monte_carlo_sampling_availability_cells_v1.csv docs/supporting/global_monte_carlo_sampling_availability_manifest_v1.json
          git commit -m "Freeze RGFCA metadata sampling-availability surface"
          git fetch origin analysis/global-monte-carlo-barrier-atlas
          git rebase origin/analysis/global-monte-carlo-barrier-atlas
          git push origin HEAD:analysis/global-monte-carlo-barrier-atlas
