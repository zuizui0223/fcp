name: FCP original within-species 50-500km photo colour spatial-null feasibility

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-species-spatial-kernel-20261010
    paths:
      - scripts/analysis/audit_fcp85337_same_species_microgeographic_exchange_20261010.py
      - tests/test_fcp85337_same_species_microgeographic_exchange_20261010.py
      - docs/FCP85337_ORIGINAL_NEARBY_SAME_SPECIES_PHOTO_NULL_20261010.md
      - .github/workflows/fcp85337-withinspecies-microphoto-null-20261010.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: fcp85337-original-withinspecies-photo-spatial-null-${{ github.ref }}
  cancel-in-progress: true

env:
  ORIGINAL_ABIOTIC_RUN: '37861582446'
  ORIGINAL_ABIOTIC_ARTIFACT: 'fcp-global42111-original-photo-real-site-climate-soil-20261009'
  FULL_SITE_RUN: '38011108135'
  FULL_SITE_ARTIFACT: 'fcp-global42111-original-photo-complete-multiabiotic-20261010'

jobs:
  original-photo-nearby-colour-label-exchange-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Synthetic controls for original fixed photo identity and 50 100 250 500 km intrataxon clusters
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pytest==8.4.2
          python -m py_compile scripts/analysis/audit_fcp85337_same_species_microgeographic_exchange_20261010.py
          python -m pytest tests/test_fcp85337_same_species_microgeographic_exchange_20261010.py -q
          python scripts/analysis/audit_fcp85337_same_species_microgeographic_exchange_20261010.py --help > /dev/null
      - name: Reopen immutable original 85337 taxon-cell photo outcomes and 100543 source site coordinates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp85337_nearby_original /tmp/fcp100543_nearby_original
          gh run download "$ORIGINAL_ABIOTIC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$ORIGINAL_ABIOTIC_ARTIFACT" --dir /tmp/fcp85337_nearby_original
          gh run download "$FULL_SITE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$FULL_SITE_ARTIFACT" --dir /tmp/fcp100543_nearby_original
          old="$(find /tmp/fcp85337_nearby_original -name taxon_cell_flower_colour_climate_soil.csv.gz -print -quit)"
          sites="$(find /tmp/fcp100543_nearby_original -name all_original_100543_photo_sites_expanded_environment.csv.gz -print -quit)"
          test -s "$old"
          test -s "$sites"
          cp "$old" /tmp/fcp85337_nearby_original_photo_cell.csv.gz
          cp "$sites" /tmp/fcp100543_nearby_all_photo_sites.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          source=[]
          for p in Path('/tmp/fcp100543_nearby_original').rglob('result.json'):
              j=json.loads(p.read_text())
              if j.get('schema')=='fcp_42111_original_photo_expanded_worldclim_solar_v1':
                  source.append(j)
          assert len(source)==1
          q=source[0]
          assert q['original_source_species']==42111
          assert q['original_source_photo_rows']==100543
          assert q['original_classified_photo_colours']==18457
          assert q['original_photo_colours_untouched'] is True
          assert q['source_cell_centroid_never_used_as_photo_location'] is True
          PY
      - name: Audit colour-blind original same-species photo microgeography and whether truly matched label-exchange null is identifiable
        run: |
          python scripts/analysis/audit_fcp85337_same_species_microgeographic_exchange_20261010.py \
            --original-taxon-cell /tmp/fcp85337_nearby_original_photo_cell.csv.gz \
            --expanded-all-original-photo-sites /tmp/fcp100543_nearby_all_photo_sites.csv.gz \
            --outdir /tmp/fcp_original_photo_withinspecies_nearby_null
      - name: Fail closed on original fixed 85337 and 39075 classified source photos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/fcp_original_photo_withinspecies_nearby_null/result.json').read_text())
          assert d['schema']=='fcp_original85337_within_species_nearby_photo_colour_exchangeability_v1'
          assert d['original_repeated_species_photo_ledger']['source_original_taxon_cell_photo_rows']==85337
          assert d['original_repeated_species_photo_ledger']['source_four_state_colour_classifiable']==39075
          assert d['original_repeated_species_photo_ledger']['source_unclassifiable_photo_cell_records']==46262
          assert d['original_repeated_species_photo_ledger']['all_original_photo_ID_triples_matched_exactly']
          assert d['distance_caps_km_fixed_all_reported']==[50.0,100.0,250.0,500.0]
          assert d['source_group_membership_no_outcome_selection']
          assert d['no_additional_original_source_photo_pixels_or_environment_lookups']
          for name,expected in [('CLIMATE_SOURCE_ONLY',(38968,20546)),('CLIMATE_AND_SOIL',(27003,11136))]:
              x=d['cohorts'][name]
              assert x['n_original_classifiable_geolocated_environment_complete_photo_cells']==expected[0]
              assert x['n_heldout_species_photo_records']==expected[1]
              assert set(x['distance_audit'])=={'50','100','250','500'}
              for radius,m in x['distance_audit'].items():
                  assert m['max_site_pair_distance_km']==int(radius)
                  assert m['n_source_species_photo_records']==expected[0]
                  assert m['n_original_photos_in_two_plus_geographically_nearby_same_species_groups']<=expected[0]
                  assert m['n_source_photo_records_in_colour_exchangeable_nearby_groups']<=m['n_original_photos_in_two_plus_geographically_nearby_same_species_groups']
                  assert m['n_heldout_evaluable_original_photos_in_exchangeable_groups']<=expected[1]
                  assert m['group_membership_photo_colour_blind']
                  assert m['same_original_species_and_photo_cell_only']
                  if m['is_colour_permutation_null_identifiable']:
                      assert m['readiness']=='SOURCE_SAME_SPECIES_SPATIALLY_MATCHED_COLOUR_NULL_FEASIBLE'
                      assert m['n_source_photo_records_in_colour_exchangeable_nearby_groups']>=100
                  else:
                      assert m['readiness']=='HOLD_INSUFFICIENT_NEARBY_INTRASPECIFIC_COLOUR_EXCHANGE'
          print('FCP_ORIGINAL_85337_INTRASPECIFIC_PHOTO_SITE_MATCHED_NULL_FEASIBILITY_OR_EXPLICIT_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp85337-original-nearby-species-photo-colour-null-feasibility-20261010
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp_original_photo_withinspecies_nearby_null/
      - name: Seal complete source-nearby photo opportunity receipt as analysis only
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = 'analysis/fcp-global42111-withinspecies-spatial-exchange-20261010'
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          folder=results/fcp85337_original_same_species_photo_geodistance_null_feasibility_20261010
          mkdir -p "$folder"
          cp /tmp/fcp_original_photo_withinspecies_nearby_null/* "$folder/"
          git add "$folder"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Freeze original within-species 50 100 250 500km flower-photo spatial exchangeability coverage'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
