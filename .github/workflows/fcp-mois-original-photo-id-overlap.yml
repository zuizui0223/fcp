name: FCP–MOIS original photo-ID overlap provenance
on:
  pull_request:
    paths:
      - "scripts/audit_fcp_mois_photo_id_overlap.py"
      - "tests/test_fcp_mois_photo_id_overlap.py"
      - ".github/workflows/fcp-mois-original-photo-id-overlap.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cross-paper-original-photo-id-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test identifier-overlap and nonindependence logic
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_fcp_mois_photo_id_overlap.py
      - name: Recover byte-frozen FCP high-depth original measured CSVs from immutable commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original"
          git fetch --no-tags --depth=1 origin 5142f7951af0dde5364bb047a566d67e8c479e51
          git fetch --no-tags --depth=1 origin 7e538e5c51c05a7cc47b2fcf53eea92634c8a863
          git show 5142f7951af0dde5364bb047a566d67e8c479e51:data/derived/global_monte_carlo_measured_photos_v1.csv > "$RUNNER_TEMP/original/fcp_discovery.csv"
          git show 5142f7951af0dde5364bb047a566d67e8c479e51:data/derived/rgfca_reserve_replication_measured_photos_v1.csv > "$RUNNER_TEMP/original/fcp_validation.csv"
          git show 7e538e5c51c05a7cc47b2fcf53eea92634c8a863:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv > "$RUNNER_TEMP/original/fcp_prospective.csv"
          echo "Frozen CSVs recovered; audit script verifies complete SHA256 before analysis."
      - name: Recover original MOIS 100543-photo source artifact by immutable GitHub artifact ID
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/zuizui0223/fcp/actions/artifacts/11587115220/zip" \
            --output "$RUNNER_TEMP/original/mois_source.zip"
          test -s "$RUNNER_TEMP/original/mois_source.zip"
      - name: Audit literal original-photo ID intersections and freeze aggregate receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result_cross_paper
          python scripts/audit_fcp_mois_photo_id_overlap.py \
            --mois-zip "$RUNNER_TEMP/original/mois_source.zip" \
            --discovery "$RUNNER_TEMP/original/fcp_discovery.csv" \
            --validation "$RUNNER_TEMP/original/fcp_validation.csv" \
            --prospective "$RUNNER_TEMP/original/fcp_prospective.csv" \
            --output result_cross_paper/photo_id_overlap_20261016.json
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('result_cross_paper/photo_id_overlap_20261016.json').read_text())
          assert o['frozen_mois_source']['distinct_photo_ids']==100543
          assert o['comparison']['fcp_total_distinct_photo_ids']==149900
          assert o['comparison']['fcp_cross_cohort_duplicate_photo_ids']==0
          print('ORIGINAL_SOURCE_PHOTO_ID_OVERLAP_AUDIT_PASS')
          print('Shared IDs:',o['comparison']['shared_distinct_photo_ids'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-mois-original-photo-id-overlap-20261016
          path: result_cross_paper/photo_id_overlap_20261016.json
          retention-days: 90
