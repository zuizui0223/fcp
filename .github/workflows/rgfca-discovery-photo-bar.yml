name: RGFCA discovery licensed ROI photo bar

on:
  push:
    branches: [analysis/hypervolume-geo-environment-identifiability]
    paths: [.github/workflows/rgfca-discovery-photo-bar.yml]

permissions:
  contents: read

concurrency:
  group: rgfca-discovery-photo-bar-v1
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  reconstruct-licensed-discovery-crops:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata and synthetic-test dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 Pillow==12.1.1 scipy==1.17.0 pytest==8.3.5 matplotlib==3.10.8
      - name: Verify saved metadata-only plan and reproduction guards before acquisition
        run: |
          python -m pytest tests/test_rgfca_photo_bar.py -q
          python - <<'PY'
          import json
          from pathlib import Path
          from fcp_pipeline.rgfca_photo_bar import canonical, make_plan, sha256
          saved=Path('docs/supporting/rgfca_photo_bar_plan_v1.json').read_bytes()
          assert saved==canonical(make_plan())
          assert sha256(saved)=='63e916f4833d938bef371a03e0cfdbeec76a58f7e8e7f18b712f7e0b0cbc0246'
          print('fixed_24_slot_discovery_display_plan_verified; no source images opened')
          PY
      - name: Materialize the unchanged qualified measurement runtime
        run: bash scripts/analysis/materialize_random_photo_first_h9_measurement_infrastructure.sh
      - name: Install exact CPU measurement and display runtime
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . -r requirements-atlas-roi-v4.txt matplotlib==3.10.8
      - name: Download and hash-check fixed EfficientSAM weights
        run: |
          mkdir -p /tmp/rgfca-photo-sam
          curl --fail --location --retry 4 --retry-delay 2 https://raw.githubusercontent.com/yformer/EfficientSAM/d525f622e6f640acf5a0fc37c7ca1f243da5bde0/weights/efficient_sam_vitt_encoder.onnx --output /tmp/rgfca-photo-sam/efficient_sam_vitt_encoder.onnx
          curl --fail --location --retry 4 --retry-delay 2 https://raw.githubusercontent.com/yformer/EfficientSAM/d525f622e6f640acf5a0fc37c7ca1f243da5bde0/weights/efficient_sam_vitt_decoder.onnx --output /tmp/rgfca-photo-sam/efficient_sam_vitt_decoder.onnx
          echo '84ed466ffcc5c1f8d08409bc34a23bb364ab2c15e402cb12d4335a42be0e0951  /tmp/rgfca-photo-sam/efficient_sam_vitt_encoder.onnx' | sha256sum -c -
          echo 'a62f8fa5ea080447c0689418d69e58f1e83e0b7adf9c142e2bd9bcc8045c0b11  /tmp/rgfca-photo-sam/efficient_sam_vitt_decoder.onnx' | sha256sum -c -
      - name: Verify all photo-level CC0 declarations then reconstruct selected crops
        run: >-
          python scripts/analysis/make_rgfca_photo_bar.py acquire
          --plan docs/supporting/rgfca_photo_bar_plan_v1.json
          --output-dir /tmp/rgfca-photo-bar/inputs
          --detector-weight data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt
          --efficient-sam-dir /tmp/rgfca-photo-sam
      - name: Render twice and verify exact output identity
        run: |
          python scripts/analysis/make_rgfca_photo_bar.py render --plan docs/supporting/rgfca_photo_bar_plan_v1.json --inputs-dir /tmp/rgfca-photo-bar/inputs --output-dir /tmp/rgfca-photo-bar/figures
          python scripts/analysis/make_rgfca_photo_bar.py render --plan docs/supporting/rgfca_photo_bar_plan_v1.json --inputs-dir /tmp/rgfca-photo-bar/inputs --output-dir /tmp/rgfca-photo-bar/second-render
          cmp /tmp/rgfca-photo-bar/figures/photo_bar_figure_manifest.json /tmp/rgfca-photo-bar/second-render/photo_bar_figure_manifest.json
      - name: Retain complete display or explicit failure receipts without source images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgfca-discovery-cc0-photo-bar-v1
          path: |
            /tmp/rgfca-photo-bar/inputs
            /tmp/rgfca-photo-bar/figures
            docs/supporting/rgfca_photo_bar_plan_v1.json
          if-no-files-found: error
          retention-days: 90
