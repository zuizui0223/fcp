name: Verify New Phytologist core reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - CURRENT_PAPER_REPRODUCIBILITY.md
      - docs/POLYMORPHISM_REPRODUCIBILITY_AUDIT_20260927.md
      - .github/workflows/verify-np-core-reproduction-20260927.yml
      - .github/workflows/build-np-provenance-snapshot-20260926.yml
  push:
    branches: [main]
    paths:
      - CURRENT_PAPER_REPRODUCIBILITY.md
      - docs/POLYMORPHISM_REPRODUCIBILITY_AUDIT_20260927.md
      - .github/workflows/verify-np-core-reproduction-20260927.yml
      - .github/workflows/build-np-provenance-snapshot-20260926.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  LEGACY_SHA: "5142f7951af0dde5364bb047a566d67e8c479e51"
  THIRD_SHA: "7e538e5c51c05a7cc47b2fcf53eea92634c8a863"

jobs:
  reproduce-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical runtime
        run: python -m pip install --upgrade "numpy>=1.26" "pandas>=2.0" "scipy>=1.11"

      - name: Materialize exact historical execution tree
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$THIRD_SHA"
          git fetch --no-tags --depth=1 origin "$LEGACY_SHA"
          rm -rf /tmp/fcp_core_repro
          git worktree add --detach /tmp/fcp_core_repro "$THIRD_SHA"

          mkdir -p /tmp/fcp_core_repro/data/derived
          git show "$LEGACY_SHA:data/derived/global_monte_carlo_measured_photos_v1.csv" \
            > /tmp/fcp_core_repro/data/derived/global_monte_carlo_measured_photos_v1.csv
          git show "$LEGACY_SHA:data/derived/rgfca_reserve_replication_measured_photos_v1.csv" \
            > /tmp/fcp_core_repro/data/derived/rgfca_reserve_replication_measured_photos_v1.csv

          echo 'ee854126eed2cfe23e333abe2c28d14df24895a5c52cbc389c060a5a4d6f91f4  /tmp/fcp_core_repro/data/derived/global_monte_carlo_measured_photos_v1.csv' | sha256sum -c -
          echo '0e2ed349122739eecfc725fb2d5e313d284cf30752da91f9a0429cff0eeaa5e6  /tmp/fcp_core_repro/data/derived/rgfca_reserve_replication_measured_photos_v1.csv' | sha256sum -c -

      - name: Freeze expected core outputs before rerun
        run: |
          set -euo pipefail
          cd /tmp/fcp_core_repro
          cp results/polymorphism_h1_observer_disjoint_reliability_20260913/result.json /tmp/expected_h1.json
          cp results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json /tmp/expected_h2.json
          sha256sum results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/primary_0_10_structured_null.csv > /tmp/expected_primary_null.sha
          sha256sum results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/strict_0_20_structured_null.csv > /tmp/expected_strict_null.sha

      - name: Recompute first-frozen H1
        run: |
          cd /tmp/fcp_core_repro
          python scripts/analysis/run_polymorphism_h1_observer_disjoint_reliability_20260913.py

      - name: Recompute prospective H2
        run: |
          cd /tmp/fcp_core_repro
          python scripts/analysis/run_polymorphism_h2_third_cohort_prospective_white_axis_20260917.py \
            --measured-csv data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv \
            --measurement-result results/polymorphism_h2_third_cohort_prospective_measurement_20260917/result.json \
            --output-dir results/polymorphism_h2_third_cohort_prospective_white_axis_20260917

      - name: Compare recomputed results with frozen outputs
        run: |
          set -euo pipefail
          cd /tmp/fcp_core_repro
          python - <<'PY'
          import json
          from pathlib import Path

          expected_h1 = json.loads(Path('/tmp/expected_h1.json').read_text())
          observed_h1 = json.loads(Path('results/polymorphism_h1_observer_disjoint_reliability_20260913/result.json').read_text())
          assert observed_h1 == expected_h1, 'H1 recomputation differs from frozen result'

          expected_h2 = json.loads(Path('/tmp/expected_h2.json').read_text())
          observed_h2 = json.loads(Path('results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json').read_text())
          assert observed_h2 == expected_h2, 'H2 recomputation differs from frozen result'
          print('core_json_reproduction=pass')
          PY

          expected="$(cut -d' ' -f1 /tmp/expected_primary_null.sha)"
          actual="$(sha256sum results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/primary_0_10_structured_null.csv | cut -d' ' -f1)"
          test "$expected" = "$actual"

          expected="$(cut -d' ' -f1 /tmp/expected_strict_null.sha)"
          actual="$(sha256sum results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/strict_0_20_structured_null.csv | cut -d' ' -f1)"
          test "$expected" = "$actual"

          echo "structured_null_reproduction=pass"
