  workflow_dispatch:
    inputs:
      run_roi_benchmark:
        description: Run the locked Oxford-17 flower-tissue benchmark
        required: true
        default: true
        type: boolean
      run_signal_recovery:
        description: Run the formal 100 x 999 exact-geometry simulations
        required: true
        default: false
        type: boolean
      run_scaleout_metadata:
        description: Run the complete 500-candidate, 200-species metadata feasibility audit
        required: true
        default: false
        type: boolean
      run_overlay_null_qualification:
        description: Run the formal spatially constrained overlay-null simulations
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jbi-atlas-qualification-${{ github.ref }}-${{ github.event_name }}-roi-${{ inputs.run_roi_benchmark }}-signal-${{ inputs.run_signal_recovery }}-metadata-${{ inputs.run_scaleout_metadata }}-overlay-${{ inputs.run_overlay_null_qualification }}
  cancel-in-progress: false

jobs:
  contract-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest scikit-image
      - name: Validate the pre-image expansion contract and immutable parents
        run: |
          python scripts/data/validate_jbi_image_first_atlas_expansion.py
          python scripts/data/validate_jbi_atlas_inference_contract_v3.py
          python scripts/data/validate_jbi_atlas_scaleout_geometry_amendment.py
          python scripts/data/validate_jbi_atlas_dated_source_amendment.py
          python scripts/data/validate_jbi_atlas_inaturalist_snapshot_receipt.py
          python scripts/data/validate_jbi_atlas_bombus_source_gate.py
          python scripts/data/validate_jbi_atlas_roi_benchmark_result_v2.py
          python scripts/data/validate_jbi_atlas_roi_v3_source_freeze.py
          python scripts/data/validate_jbi_atlas_roi_v3_development_result.py
          python scripts/data/validate_jbi_atlas_roi_v4_contract.py
          python scripts/data/validate_jbi_atlas_roi_v4_training_evidence.py
          python scripts/data/validate_jbi_atlas_colour_surface_contract.py
          python scripts/data/validate_jbi_atlas_environmental_overlay_contract.py
          python scripts/data/validate_jbi_atlas_climate_ecoregion_freeze.py
          python scripts/data/validate_jbi_atlas_worldcover_freeze.py
          python scripts/data/validate_jbi_atlas_environmental_source_freeze.py
          python scripts/data/validate_jbi_atlas_environmental_boundary_freeze.py
      - name: Test repeated cohorts, joint null, ROI metrics and signal recovery
        run: >-
          python -m pytest -q
          tests/test_atlas_expansion.py
          tests/test_atlas_measurement.py
          tests/test_atlas_environment.py
          tests/test_atlas_acquisition_authorization.py
          tests/test_atlas_dated_source.py
          tests/test_atlas_precolour_environmental_coverage.py
          tests/test_atlas_overlay_null.py
          tests/test_atlas_roi_benchmark.py
          tests/test_atlas_scaleout.py
          tests/test_atlas_signal_recovery.py
          tests/test_segformer_roi.py
          tests/test_flower_roi_v4.py
          tests/test_atlas_roi_v4_training_evidence.py

  roi-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_roi_benchmark
    needs: contract-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the frozen estimator environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-inaturalist-auto-colour.txt
      - name: Download and verify the pinned CLIPSeg revision
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="CIDAS/clipseg-rd64-refined",
              revision="999e0328d9e10b484360c477313983f9afdd7050",
              local_dir="/tmp/clipseg",
          )
          PY
          echo "d00ca85d6b859f9d07b7cfb8ef26fe9771cb275b34c9368f2ecf603139307f55  /tmp/clipseg/model.safetensors" | sha256sum -c -
      - name: Download and verify the official Oxford-17 benchmark
        run: |
          mkdir -p /tmp/oxford17 /tmp/atlas-roi-result
          curl --fail --location --retry 3 \
            https://www.robots.ox.ac.uk/~vgg/data/flowers/17/17flowers.tgz \
            --output /tmp/oxford17/17flowers.tgz
          curl --fail --location --retry 3 \
            https://www.robots.ox.ac.uk/~vgg/data/flowers/17/trimaps.tgz \
            --output /tmp/oxford17/trimaps.tgz
          echo "fe38a60f8b4a95e657551247d3e7d799a3fafcdbc595be504b12839967823d70  /tmp/oxford17/17flowers.tgz" | sha256sum -c -
          echo "55928dddca447a129f525ff2c525cd0a62b94e7fe74c62ae0ef956191bd24c77  /tmp/oxford17/trimaps.tgz" | sha256sum -c -
          tar -xzf /tmp/oxford17/17flowers.tgz -C /tmp/oxford17
          tar -xzf /tmp/oxford17/trimaps.tgz -C /tmp/oxford17
      - name: Run the no-retuning independent ROI gate
        run: |
          python scripts/data/benchmark_jbi_atlas_flower_roi.py \
            --images-dir /tmp/oxford17/jpg \
            --trimaps-dir /tmp/oxford17/trimaps \
            --images-archive /tmp/oxford17/17flowers.tgz \
            --trimaps-archive /tmp/oxford17/trimaps.tgz \
            --model-dir /tmp/clipseg \
            --output-dir /tmp/atlas-roi-result
      - name: Upload the immutable ROI benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbi-atlas-oxford17-roi-benchmark
          path: /tmp/atlas-roi-result
          if-no-files-found: error

  signal-recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.run_signal_recovery
    needs: contract-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run the frozen exact-geometry signal-recovery suite
        run: |
          mkdir -p /tmp/atlas-signal-recovery
          python scripts/data/run_jbi_atlas_signal_recovery.py \
            --output-dir /tmp/atlas-signal-recovery
      - name: Upload the immutable signal-recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbi-atlas-signal-recovery
          path: /tmp/atlas-signal-recovery
          if-no-files-found: error

  scaleout-metadata:
    if: github.event_name == 'workflow_dispatch' && inputs.run_scaleout_metadata
    needs: contract-and-tests
    runs-on: ubuntu-latest
    # A complete 500-species audit can require up to 2,500 deliberately
    # throttled API pages.  Runtime is not a stopping rule.
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Audit the complete 500-species metadata candidate pool
        run: >-
          python scripts/data/build_jbi_atlas_scaleout_metadata_feasibility.py
          --candidate-species 500
          --maximum-candidates-per-species 1000
          --output-dir /tmp/fcp-atlas-scaleout
      - name: Upload pass, shortfall and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbi-atlas-200-species-metadata-feasibility
          path: /tmp/fcp-atlas-scaleout
          if-no-files-found: error

  overlay-null-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.run_overlay_null_qualification
    needs: contract-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run frozen 100/250/500-km overlay-null qualification
        run: |
          mkdir -p /tmp/fcp-atlas-overlay-null
          python scripts/data/run_jbi_atlas_overlay_null_qualification.py \
            --output-dir /tmp/fcp-atlas-overlay-null
      - name: Upload pass, STOP and not-evaluable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbi-atlas-overlay-null-qualification
          path: /tmp/fcp-atlas-overlay-null
          if-no-files-found: error
