name: FCP original direct LCVP dated phylogeny and photo rainfall dyads

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-phylogeny-coverage-20261010
    paths:
      - scripts/analysis/assess_fcp_direct_LCVP_phylogeny_climate_dyads_20261010.py
      - tests/test_fcp_direct_LCVP_phylogeny_climate_dyads_20261010.py
      - docs/FCP_GLOBAL42111_DIRECT_PHYLO_CLIMATE_DYADS_20261010.md
      - .github/workflows/fcp-direct-LCVP-local-colour-climate-dyads-20261010.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fcp42111-direct-LCVP-original-photo-rainfall-dyads-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ENV_RUN: '37861582446'
  SOURCE_ENV_ARTIFACT: 'fcp-global42111-original-photo-real-site-climate-soil-20261009'
  DIRECT_LCVP_SOURCE: 'results/fcp_global42111_original_local_LCVP_backbone_20261010'

jobs:
  directly-tipped-local-photo-dyads:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Synthetic strict source-phylogenetic dyad and actual-photo environment tests
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 biopython==1.85 scikit-learn==1.6.1 pytest==8.4.2
          python -m py_compile scripts/analysis/assess_fcp_direct_LCVP_phylogeny_climate_dyads_20261010.py
          python -m pytest tests/test_fcp_direct_LCVP_phylogeny_climate_dyads_20261010.py -q
          python scripts/analysis/assess_fcp_direct_LCVP_phylogeny_climate_dyads_20261010.py --help > /dev/null
      - name: Require previously source-verified original 342 and 649 direct LCVP species and dated trees
        run: |
          set -euo pipefail
          test -s "$DIRECT_LCVP_SOURCE/result.json"
          test -s "$DIRECT_LCVP_SOURCE/original_local_1761_LCVP_direct_tip_ledger.csv"
          test -s "$DIRECT_LCVP_SOURCE/original_local_250km_direct_LCVP_tree.tre"
          test -s "$DIRECT_LCVP_SOURCE/original_local_500km_direct_LCVP_tree.tre"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/fcp_global42111_original_local_LCVP_backbone_20261010/result.json')
          x=json.loads(p.read_text())
          assert x['schema']=='fcp_global42111_local_congener_LCVP_direct_backbone_coverage_v1'
          assert x['cohorts']['km250']['n_exact_direct_lcvp_tip_species']==342
          assert x['cohorts']['km500']['n_exact_direct_lcvp_tip_species']==649
          assert x['source_taxon_colour_labels_read'] is False
          assert x['decision']=='HOLD_DIRECT_LCVP_SUBGENUS_COVERAGE_FOR_FULL_250_500'
          PY
      - name: Reuse frozen original 42111 one-photo per-species colours, actual positions and four climate fields
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_ENV_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ENV_ARTIFACT" --dir /tmp/fcp42111_source_direct_phylo_dyads
          f="$(find /tmp/fcp42111_source_direct_phylo_dyads -name breadth_flower_colour_climate_soil.csv.gz -print -quit)"
          test -s "$f"
          cp "$f" /tmp/fcp_original_breadth_direct_photo_phylo.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          z=[]
          for p in Path('/tmp/fcp42111_source_direct_phylo_dyads').rglob('result.json'):
              r=json.loads(p.read_text())
              if r.get('schema')=='fcp_global42111_original_photo_climate_soil_attachment_v1':
                  z.append(r)
          assert len(z)==1
          assert z[0]['original_species_count']==42111
          assert z[0]['n_unique_original_photo_IDs']==100543
          assert z[0]['breadth_classifiable_by_covariate']['environment_climate_complete']==18413
          assert z[0]['new_colour_label_or_photo_pixel_opened'] is False
          assert z[0]['geographic_cell_centroid_imputation'] is False
          PY
      - name: Genus-heldout source-only true-phylogeny and rain prediction at exact 50/100km local photos
        run: |
          python scripts/analysis/assess_fcp_direct_LCVP_phylogeny_climate_dyads_20261010.py \
            --original-breadth-abiotic /tmp/fcp_original_breadth_direct_photo_phylo.csv.gz \
            --original-LCVP-tip-ledger "$DIRECT_LCVP_SOURCE/original_local_1761_LCVP_direct_tip_ledger.csv" \
            --tree-250 "$DIRECT_LCVP_SOURCE/original_local_250km_direct_LCVP_tree.tre" \
            --tree-500 "$DIRECT_LCVP_SOURCE/original_local_500km_direct_LCVP_tree.tre" \
            --outdir /tmp/fcp42111_actual_phylo_photo_dyads
      - name: Guard same source 42111/18457 and fully reported nested original local dyads
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/fcp42111_actual_phylo_photo_dyads/result.json').read_text())
          assert r['schema']=='fcp_42111_direct_LCVP_local_congener_colour_climate_prediction_v1'
          assert r['global_source_original_42111_photo_species']==42111
          assert r['global_original_photo_fourstate_classifiable']==18457
          assert r['source_250_and_500km_cohorts_nested_not_independent']
          assert r['source_direct_LCVP_only_no_synthetic_genus_grafting']
          assert r['all_original_photo_ids_and_colour_classes_unchanged']
          assert r['no_new_photographic_phenotypes_or_observations_opened']
          assert r['full_original_250_500km_phylogenetic_inference_remains_HOLD']
          expect={'250':{'50':244,'100':477},'500':{'50':318,'100':593}}
          for cohort,nfull,ntip in [('250',872,342),('500',1761,649)]:
              z=r['cohorts'][cohort]
              assert z['n_original_250_or_500km_photo_species']==nfull
              assert z['n_source_species_directly_tipped_in_LCVP']==ntip
              for diameter,n_pairs in expect[cohort].items():
                  q=z['subcohorts'][diameter]
                  assert q['coverage']['n_original_congeneric_photo_pair_dyads']==n_pairs
                  assert q['coverage']['all_pairs_direct_LCVP_tips']
                  assert q['coverage']['group_selection_did_not_use_photo_colour_or_rainfall']
                  if q['models']['status']=='EXPLORATORY_DIRECT_DATED_PHYLO_CLIMATE_PAIRWISE_PREDICTION':
                      assert q['models']['same_original_dyads_and_genus_cv_folds_all_models']
                      assert q['models']['n_original_photo_pair_dyads']==n_pairs
                      assert set(q['models']['models'])=={
                          'GEO_THERMAL','GEO_THERMAL_PHYLO',
                          'GEO_THERMAL_RAIN','GEO_THERMAL_PHYLO_RAIN'}
                      assert set(q['models']['incremental_prediction'])=={
                          'phylogeny_beyond_geo_thermal',
                          'rain_beyond_geo_thermal_without_phylogeny',
                          'rain_beyond_geo_thermal_and_dated_phylogeny'}
                  else:
                      assert q['models']['status'].startswith('HOLD_') or q['models']['status']=='NOT_FIT_BECAUSE_COVERAGE_HOLD'
          print('ORIGINAL_LCVP_DIRECT_TIP_LOCAL_PHOTOGRAPHED_PHYLO_RAINFALL_DYAD_SOURCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp42111-direct-LCVP-local-original-colour-rain-dyads-20261010
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp42111_actual_phylo_photo_dyads/
      - name: Seal source-only numerical phylo-rainfall sensitivity with full original study HOLD
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = 'analysis/fcp-global42111-phylo-photo-env-20261010'
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          d=results/fcp_global42111_direct_LCVP_local_photo_environment_20261010
          mkdir -p "$d"
          cp /tmp/fcp42111_actual_phylo_photo_dyads/* "$d/"
          git add "$d"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Seal LCVP directly tipped congeneric original photo mismatch geography phylo and rain exploratory diagnostics'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
