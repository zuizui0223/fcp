name: FCP New Phytologist all 4475 photo missingness sharp-bound audit
on:
  push:
    branches: [analysis/fcp-np-all4475-unified-20261021]
    paths:
      - scripts/analysis/fcp_all4475_missing_photo_sharp_bounds_20261021.py
      - .github/workflows/fcp-all4475-photo-missingness-20261021.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  all4475-sharp-unclassified-photo-colour-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned original analysis numerical environment
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Verify analytically sharp extrema by exhaustive small examples
        run: |
          python -m py_compile scripts/analysis/fcp_all4475_missing_photo_sharp_bounds_20261021.py
          python scripts/analysis/fcp_all4475_missing_photo_sharp_bounds_20261021.py --self-test
      - name: Authenticate and unpack original actual 447500-photo results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcpall4475missing/{archive,source,results}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_FILE" --dir /tmp/fcpall4475missing/archive
          echo "$SOURCE_ARCHIVE_SHA  /tmp/fcpall4475missing/archive/$SOURCE_FILE" | sha256sum -c -
          tar -xzf "/tmp/fcpall4475missing/archive/$SOURCE_FILE" -C /tmp/fcpall4475missing/source
          test -s /tmp/fcpall4475missing/source/measured/fcp_all4730_original_method_measured_photos.csv.gz
      - name: Compute exact lower and upper photo colour diversity completion bounds for all 4475 taxa
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analysis/fcp_all4475_missing_photo_sharp_bounds_20261021.py \
            --photos /tmp/fcpall4475missing/source/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --out /tmp/fcpall4475missing/results
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/fcpall4475missing/results/all4475_source_label_missingness_summary.json").read_text())
          assert d["n_taxa"]==4475
          assert d["n_original_photos"]==447500
          assert d["n_observed_classifiable_four_state"]==227107
          assert d["taxa_eliminated_or_missing_records_imputed"]==0
          assert d["mean_D_hypothetical_all100_sharp_lower"]<=d["mean_D_hypothetical_all100_sharp_upper"]
          print("FCP_ALL4475_ADVERSARIAL_MISSINGNESS_RECEIPT_PASS")
          PY
      - name: Upload all-species safe classification bounds and complete scientific result
        uses: actions/upload-artifact@v4
        with:
          name: fcp-all4475-adversarial-photo-colour-missingness-bounds-20261021
          path: /tmp/fcpall4475missing/results/
          retention-days: 90
          if-no-files-found: error
