name: JBI Chapter 1 calibration image audit

on:
  push:
    branches:
      - analysis/jbi-global-colour-boundaries
    paths:
      - ".github/workflows/jbi-ch1-calibration-images.yml"
      - "scripts/data/materialize_jbi_ch1_calibration_images.py"
      - "fcp_pipeline/photo_calibration.py"
      - "tests/test_photo_calibration.py"
      - "tests/test_calibration_image_materialization.py"
      - "pyproject.toml"
      - "data/frozen/jbi_ch1_photo_split_v1.csv"
      - "data/frozen/jbi_ch1_photo_split_v1_manifest.json"
      - "data/calibration/jbi_ch1_calibration_review_v1.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jbi-ch1-calibration-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-calibration-only:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-calibration-materialize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/jbi-global-colour-boundaries
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate calibration-only code paths
        run: |
          python -m pytest -q \
            tests/test_photo_calibration.py \
            tests/test_calibration_image_materialization.py \
            tests/test_photo_split.py

      - name: Materialize only the frozen 480 calibration images
        run: |
          python scripts/data/materialize_jbi_ch1_calibration_images.py \
            --split data/frozen/jbi_ch1_photo_split_v1.csv \
            --image-root artifacts/jbi_ch1_calibration_images_v1/images \
            --contact-root artifacts/jbi_ch1_calibration_images_v1/contact_sheets \
            --qc-csv data/calibration/jbi_ch1_calibration_image_qc_v1.csv \
            --manifest docs/supporting/jbi_ch1_calibration_image_manifest_v1.json

      - name: Enforce calibration/evaluation firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          split = pd.read_csv('data/frozen/jbi_ch1_photo_split_v1.csv')
          qc = pd.read_csv('data/calibration/jbi_ch1_calibration_image_qc_v1.csv')
          manifest = json.loads(Path('docs/supporting/jbi_ch1_calibration_image_manifest_v1.json').read_text())
          calibration_ids = set(split.loc[split['split'].eq('calibration'), 'photo_id'].astype(str))
          evaluation_ids = set(split.loc[split['split'].eq('evaluation'), 'photo_id'].astype(str))
          qc_ids = set(qc['photo_id'].astype(str))
          assert len(qc) == 480
          assert qc_ids == calibration_ids
          assert qc_ids.isdisjoint(evaluation_ids)
          assert manifest['status'] == 'pass'
          assert manifest['n_expected'] == 480
          assert manifest['n_materialized'] == 480
          assert manifest['n_failed'] == 0
          assert manifest['evaluation_rows_opened'] is False
          assert manifest['technical_metrics_used_for_colour_assignment'] is False
          assert manifest['technical_flags_are_exclusion_rules'] is False
          print('Calibration firewall passed: 480 calibration images, 0 evaluation images.')
          PY

      - name: Upload non-image calibration audit records
        uses: actions/upload-artifact@v4
        with:
          name: jbi-ch1-calibration-image-audit-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            data/calibration/jbi_ch1_calibration_image_qc_v1.csv
            docs/supporting/jbi_ch1_calibration_image_manifest_v1.json

      - name: Commit technical audit records only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/calibration/jbi_ch1_calibration_image_qc_v1.csv \
            docs/supporting/jbi_ch1_calibration_image_manifest_v1.json
          if git diff --cached --quiet; then
            echo "Technical calibration audit already matches repository state."
            exit 0
          fi
          git commit -m "Audit frozen 480 calibration images [skip-calibration-materialize]"
          git push origin HEAD:analysis/jbi-global-colour-boundaries
