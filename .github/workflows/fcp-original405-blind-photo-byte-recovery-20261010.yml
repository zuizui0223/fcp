name: FCP source-verified 405 blinded photo original-byte recovery

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/probe_fcp_original405_blinded_image_bytes_20261010.py
      - tests/test_probe_fcp_original405_blinded_image_bytes_20261010.py
      - .github/workflows/fcp-original405-blind-photo-byte-recovery-20261010.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fcp-original405-open-photo-recovery
  cancel-in-progress: true

env:
  LEGACY_SHA: "5142f7951af0dde5364bb047a566d67e8c479e51"
  THIRD_SHA: "7e538e5c51c05a7cc47b2fcf53eea92634c8a863"
  DISC_SHA256: "ee854126eed2cfe23e333abe2c28d14df24895a5c52cbc389c060a5a4d6f91f4"
  VAL_SHA256: "0e2ed349122739eecfc725fb2d5e313d284cf30752da91f9a0429cff0eeaa5e6"
  THIRD_SHA256: "57630fc9f281bce94a0c40a70aaf7bce879dde93d6154175adcd021e8f5c1186"

jobs:
  source405-openphoto-byte-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install source-exact source-photo/technical runtime
        run: python -m pip install numpy==2.4.6 pandas==3.0.6 scipy==1.17.1 pillow==11.3.0 pytest==8.4.2
      - name: Synthetic source blinding and image checksum guard tests
        run: |
          python -m pytest \
            tests/test_probe_fcp_original405_blinded_image_bytes_20261010.py \
            tests/test_probe_fcp_blinded_open_photo_bytes_20261010.py \
            tests/test_polymorphism_blinded_photo_queue_20261010.py -q
      - name: Recover the frozen three high-depth source-photo datasets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$LEGACY_SHA" "$THIRD_SHA"
          git show "$LEGACY_SHA:data/derived/global_monte_carlo_measured_photos_v1.csv" > /tmp/discovery.csv
          git show "$LEGACY_SHA:data/derived/rgfca_reserve_replication_measured_photos_v1.csv" > /tmp/validation.csv
          git show "$THIRD_SHA:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv" > /tmp/third.csv
          echo "$DISC_SHA256  /tmp/discovery.csv" | sha256sum -c -
          echo "$VAL_SHA256  /tmp/validation.csv" | sha256sum -c -
          echo "$THIRD_SHA256  /tmp/third.csv" | sha256sum -c -
      - name: Reconstruct the exact composition-preserving source attack
        run: |
          python scripts/analysis/audit_polymorphism_adversarial_label_swaps_20261010.py \
            --discovery /tmp/discovery.csv \
            --validation /tmp/validation.csv \
            --third /tmp/third.csv \
            --outdir /tmp/source_attack
      - name: Reconstruct and byte-match original 405-case blinded source-photo ledger
        run: |
          python scripts/analysis/build_polymorphism_blinded_photo_audit_queue_20261010.py \
            --discovery /tmp/discovery.csv \
            --validation /tmp/validation.csv \
            --third /tmp/third.csv \
            --constructed-swaps /tmp/source_attack/constructed_label_swaps.csv \
            --outdir /tmp/source_attack/photo_review
          echo "8cc44a71dfb64601e23f68b68c25e8cbc534a332e0a17ff51a51bd8737a35c27  /tmp/source_attack/photo_review/BLINDED_reannotation_photo_queue.csv" | sha256sum -c -

      - name: Recover original archived sealed 405-photo review source artifact
        uses: actions/download-artifact@v4
        with:
          name: fcp-adversarial-composition-preserving-photo-colour-20261010
          run-id: 38027546572
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/fcp_original_review_receipt
      - name: Verify original sealed key byte identity and full semantic source match
        run: |
          echo "8cc44a71dfb64601e23f68b68c25e8cbc534a332e0a17ff51a51bd8737a35c27  /tmp/fcp_original_review_receipt/photo_review/BLINDED_reannotation_photo_queue.csv" | sha256sum -c -
          echo "ef0275fedf7ab4e3e0aa5309fd80c9a9aee97de733b79a93bc2137a04f6f4b5c  /tmp/fcp_original_review_receipt/photo_review/UNBLINDING_KEY_do_not_show_reviewers.csv" | sha256sum -c -
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          orig=Path("/tmp/fcp_original_review_receipt/photo_review/UNBLINDING_KEY_do_not_show_reviewers.csv")
          regen=Path("/tmp/source_attack/photo_review/UNBLINDING_KEY_do_not_show_reviewers.csv")
          a=pd.read_csv(orig,dtype=str).fillna("")
          b=pd.read_csv(regen,dtype=str).fillna("")
          assert len(a)==len(b)==405 and list(a.columns)==list(b.columns)
          assert a.audit_case_id.is_unique and b.audit_case_id.is_unique
          a=a.sort_values("audit_case_id",kind="stable").reset_index(drop=True)
          b=b.sort_values("audit_case_id",kind="stable").reset_index(drop=True)
          assert a.audit_case_id.equals(b.audit_case_id)
          divergences={}
          for col in a.columns:
            if col=="match_distance_km":
              x=pd.to_numeric(a[col],errors="coerce")
              y=pd.to_numeric(b[col],errors="coerce")
              import numpy as np
              if not np.allclose(x,y,rtol=0,atol=1e-8,equal_nan=True):
                divergences[col]="numeric_value_difference"
            elif not a[col].equals(b[col]):
              divergences[col]="source_identity_or_label_difference"
          assert not divergences, ("The sealed original 405 key differs in values: "+str(divergences))
          print("PASS 405 original-source IDs, label-key values, hashes and taxonomy semantically match")
          print("The archived original byte-identical key remains the sole authoritative photo hash source.")
          PY
      - name: Probe original image byte identity for ALL 405 frozen photo IDs
        run: |
          python scripts/analysis/probe_fcp_original405_blinded_image_bytes_20261010.py \
            --blind /tmp/source_attack/photo_review/BLINDED_reannotation_photo_queue.csv \
            --sealed-key /tmp/fcp_original_review_receipt/photo_review/UNBLINDING_KEY_do_not_show_reviewers.csv \
            --outdir /tmp/fcp_original405_pixel_receipt
      - name: Validate no raw photo pixels, no old colour labels, no dropped source IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("/tmp/fcp_original405_pixel_receipt")
          z=json.loads((root/"result.json").read_text())
          assert z["schema"]=="fcp_original_405_blinded_openphoto_provenance_v1"
          assert z["n_original_blinded_photo_ids"]==405
          assert sum(z[k] for k in ("n_exact_historical_image_bytes",
            "n_retrieved_original_photo_id_but_different_bytes",
            "n_unavailable_on_open_data_host"))==405
          assert z["source_colour_labels_seen_by_photo_fetcher"] is False
          assert z["image_pixels_retained_in_result"] is False
          assert z["label_reannotation_completed"] is False
          assert sorted(p.name for p in root.iterdir())==[
            "photo_byte_provenance_and_whole_frame_qc.csv","result.json"]
          print("PASS entire source-locked 405 photo-ID byte recovery only")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-405-original-photo-byte-provenance-20261010
          retention-days: 30
          if-no-files-found: error
          path: /tmp/fcp_original405_pixel_receipt/
