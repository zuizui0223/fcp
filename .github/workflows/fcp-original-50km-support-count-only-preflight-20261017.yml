name: FCP verify original 50km support count reporting only
on:
  push:
    branches: [fix/fcp-4730-original-spatial-support-count-20261017]
    paths:
      - scripts/analysis/run_fcp_wave4_original_roi_and_statistics_20261017.py
      - scripts/analysis/fcp_all4730_original_roi_bulk_20261017.py
      - tests/test_fcp_wave4_original_roi_and_statistics_20261017.py
      - tests/test_fcp_all4730_original_roi_bulk_20261017.py
      - .github/workflows/fcp-original-50km-support-count-only-preflight-20261017.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fcp-original-50km-support-count-only-preflight-20261017.yml
permissions:
  contents: read
jobs:
  validate-original-50km-string-key-and-pixel-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact frozen historical modules, never change source or pixel models
        run: |
          bash scripts/analysis/materialize_fcp_wave4_original_machine_20261017.sh
          python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 pytest==8.4.2
      - name: Verify exact 50km sample gate reporting is consistent with original string-keyed summary
        run: |
          python -m pytest -q \
            tests/test_fcp_wave4_original_roi_and_statistics_20261017.py \
            tests/test_fcp_all4730_original_roi_bulk_20261017.py
          python - <<'PY'
          from scripts.analysis.run_fcp_wave4_original_roi_and_statistics_20261017 import original_spatial_primary_50km_n
          from scripts.analysis.run_polymorphism_distributed_polymorphism_posthoc_20261007 import cohort_summary, RADII_KM
          import numpy as np
          import pandas as pd
          test=pd.DataFrame({
             'D_pair':[.4,.5,.6],
             **{f'depletion_{int(k)}km':[.03,.01,.02] for k in RADII_KM}
          })
          null={k:[np.linspace(-.05,.05,199) for _ in range(3)] for k in RADII_KM}
          actual=cohort_summary(test,null)
          assert '50' in actual and 50.0 not in actual
          assert original_spatial_primary_50km_n(actual)==3
          print('FCP_GENUINE_ORIGINAL_SPATIAL_STRING_KEY_50KM_COUNT_VERIFIED', actual['50']['n_species'])
          PY
