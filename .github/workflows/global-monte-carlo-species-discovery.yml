name: Global Monte Carlo species discovery

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "docs/supporting/global_monte_carlo_species_discovery_authorization_v1.json"

permissions:
  contents: write

jobs:
  discover-species:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify one-shot authorization lineage
        env:
          EXPECTED_BRANCH: analysis/global-monte-carlo-barrier-atlas
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          auth = json.loads(Path('docs/supporting/global_monte_carlo_species_discovery_authorization_v1.json').read_text())
          if auth.get('status') != 'authorized_once_after_design_validation':
              raise SystemExit('species discovery is not explicitly authorized')
          if auth.get('branch') != os.environ['EXPECTED_BRANCH']:
              raise SystemExit('authorization branch mismatch')
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          if auth.get('validated_parent_sha') != parent:
              raise SystemExit(f'authorization parent mismatch: {parent}')
          if auth.get('flower_colour_may_open') is not False:
              raise SystemExit('authorization unexpectedly permits flower-colour pixels')
          PY
      - name: Execute fixed repeated metadata-only discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/acquisition/freeze_global_monte_carlo_species_discovery.py
      - name: Validate terminal manifest
        run: |
          python -m json.tool docs/supporting/global_monte_carlo_species_discovery_manifest_v1.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('docs/supporting/global_monte_carlo_species_discovery_manifest_v1.json').read_text())
          if manifest.get('candidate_image_pixels_opened') is not False:
              raise SystemExit('metadata discovery opened candidate image pixels')
          if manifest.get('flower_colour_used') is not False:
              raise SystemExit('metadata discovery used flower colour')
          if manifest['fresh']['request_attempts'] != manifest['fresh']['expected_request_attempts']:
              raise SystemExit('fresh request-attempt count mismatch')
          PY
      - name: Upload discovery products
        uses: actions/upload-artifact@v4
        with:
          name: global-monte-carlo-species-discovery-v1
          path: |
            data/frozen/global_monte_carlo_species_discovery_observation_index_v1.csv.gz
            data/frozen/global_monte_carlo_species_discovery_species_v1.csv
            data/frozen/global_monte_carlo_species_discovery_round_audit_v1.csv
            data/frozen/global_monte_carlo_species_discovery_cell_audit_v1.csv
            docs/supporting/global_monte_carlo_species_discovery_manifest_v1.json
      - name: Commit immutable discovery products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/frozen/global_monte_carlo_species_discovery_observation_index_v1.csv.gz \
            data/frozen/global_monte_carlo_species_discovery_species_v1.csv \
            data/frozen/global_monte_carlo_species_discovery_round_audit_v1.csv \
            data/frozen/global_monte_carlo_species_discovery_cell_audit_v1.csv \
            docs/supporting/global_monte_carlo_species_discovery_manifest_v1.json
          git commit -m "Freeze repeated global metadata species discovery"
          git fetch origin analysis/global-monte-carlo-barrier-atlas
          git rebase origin/analysis/global-monte-carlo-barrier-atlas
          git push origin HEAD:analysis/global-monte-carlo-barrier-atlas
