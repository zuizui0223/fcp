name: polymorphism-h3a-phylogeny-preflight

on:
  push:
    branches:
      - analysis/polymorphism-42111-h1-h2-gates-20260912
    paths:
      - "scripts/analysis/run_polymorphism_h3a_phylogeny_preflight_20260912.R"
      - "docs/POLYMORPHISM_H3A_PHYLOGENETIC_SIGNAL_PROTOCOL_20260912.md"
      - ".github/workflows/polymorphism-h3a-phylogeny-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install base R dependencies without repository scan
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: |
            any::ape
            any::jsonlite
          cache-version: h3a-preflight-v3

      - name: Install pinned V.PhyloMaker2 from immutable commit archive
        env:
          VPHYLO_SHA: 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/V.PhyloMaker2.tar.gz \
            "https://codeload.github.com/jinyizju/V.PhyloMaker2/tar.gz/${VPHYLO_SHA}"
          tar -tzf /tmp/V.PhyloMaker2.tar.gz > /tmp/vphylomaker2_archive_listing.txt
          head /tmp/vphylomaker2_archive_listing.txt
          R CMD INSTALL /tmp/V.PhyloMaker2.tar.gz
          Rscript -e 'stopifnot(as.character(packageVersion("V.PhyloMaker2")) == "0.1.0"); x <- packageDescription("V.PhyloMaker2"); print(list(version=x$Version, source_commit=Sys.getenv("VPHYLO_SHA")))'

      - name: Syntax parse
        run: Rscript -e 'parse(file="scripts/analysis/run_polymorphism_h3a_phylogeny_preflight_20260912.R")'

      - name: Build outcome-blind S1-S3 trees and coverage gate
        run: Rscript scripts/analysis/run_polymorphism_h3a_phylogeny_preflight_20260912.R

      - name: Verify outcome firewall
        if: always()
        run: |
          if test -f results/polymorphism_h3a_phylogeny_preflight_20260912/result.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/polymorphism_h3a_phylogeny_preflight_20260912/result.json').read_text())
          assert r['D_association_computed'] is False
          assert r['phylogenetic_signal_computed'] is False
          print(json.dumps(r, indent=2))
          PY
          fi

      - name: Upload preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymorphism-h3a-phylogeny-preflight-20260912
          path: results/polymorphism_h3a_phylogeny_preflight_20260912
          if-no-files-found: warn
