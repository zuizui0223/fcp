name: FCP completed source status documentation guard

on:
  pull_request:
    paths:
      - README.md
      - docs/FCP_CURRENT_MEASURED_RESULTS_AND_NP_DRAFT_STATUS_20261022.md
      - tests/test_fcp_latest_source_status_20261022.py
      - .github/workflows/fcp-completed-source-status-guard-20261022.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/FCP_CURRENT_MEASURED_RESULTS_AND_NP_DRAFT_STATUS_20261022.md
      - tests/test_fcp_latest_source_status_20261022.py
      - .github/workflows/fcp-completed-source-status-guard-20261022.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-status-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence-check test dependency
        run: python -m pip install pytest==8.4.2
      - name: Verify completed real photo evidence and frozen pending snapshot
        run: python -m pytest -q tests/test_fcp_latest_source_status_20261022.py
