name: Polymorphism spatial reserve Step 5b

on:
  push:
    branches:
      - analysis/polymorphism-spatial-reserve-step5b
    paths:
      - "scripts/analysis/run_polymorphism_spatial_reserve_step5b_20260909.py"
      - "docs/POLYMORPHISM_SPATIAL_RESERVE_STEP5B_PROTOCOL_20260909.md"
      - ".github/workflows/polymorphism-spatial-reserve-step5b.yml"

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM_RUN_ID: "34178957447"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy

      - name: Download immutable reserve inference artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/reserve-spatial
          mkdir -p /tmp/reserve-spatial
          gh run download "${UPSTREAM_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir /tmp/reserve-spatial
          test "$(find /tmp/reserve-spatial -path '*/null.npz' | wc -l)" -eq 20
          test "$(find /tmp/reserve-spatial -path '*/receipt.json' | wc -l)" -eq 20
          test -f /tmp/reserve-spatial/rgfca-reserve-replication-full-result-v1/result.json
          test -f /tmp/reserve-spatial/rgfca-reserve-replication-full-result-v1/species.csv
          test -f /tmp/reserve-spatial/rgfca-reserve-replication-full-result-v1/global_null.csv

      - name: Run frozen reserve Step 5b
        run: |
          python scripts/analysis/run_polymorphism_spatial_reserve_step5b_20260909.py \
            --artifact-root /tmp/reserve-spatial

      - name: Commit reserve Step 5b result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/polymorphism_spatial_reserve_step5b_20260909/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record reserve polymorphism spatial Step 5b result"
            git push
          fi
