name: FCP original-photo multi-colour and observer-robustness audit
on:
  pull_request:
    paths:
      - scripts/analysis/audit_fcp_photo_labels_original_20261023.py
      - .github/workflows/fcp-original-photo-label-error-audit-20261023.yml
      - docs/FCP_PHOTOGRAPHIC_MULTICOLOUR_ERROR_AUDIT_20261023.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  permanent-species-ledger-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-analysis dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Validate 4475-source species counts and historical photo colour classification
        run: |
          set -euo pipefail
          python -m py_compile scripts/analysis/audit_fcp_photo_labels_original_20261023.py
          python scripts/analysis/audit_fcp_photo_labels_original_20261023.py --self-test
          python scripts/analysis/audit_fcp_photo_labels_original_20261023.py \
            --out /tmp/fcp-photo-colour-counts
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/fcp-photo-colour-counts/fcp_photo_label_robustness_summary_20261023.json").read_text())
          c=r["species_counts"]
          assert c["n_species"]==4475 and c["n_four_colour_classifiable_photo_rows"]==227107
          assert c["observed_n_colour_classes"]=={"1":286,"2":1743,"3":1632,"4":814}
          assert c["colour_photo_count_tiers"]["8"]["at_least_2_colours_each_ge_5"]==2400
          assert c["colour_photo_count_tiers"]["8"]["at_least_3_colours_each_ge_5"]==435
          assert c["colour_photo_count_tiers"]["8"]["at_least_4_colours_each_ge_5"]==19
          assert c["colour_photo_count_tiers"]["40"]["at_least_2_colours_each_ge_5"]==1592
          print("FCP_PERMANENT_SPECIES_LEDGER_COLOUR_SUPPORT_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-4475-species-4-colour-coverage-error-audit-20261023
          path: /tmp/fcp-photo-colour-counts/
          retention-days: 90
  authenticated-447500-photo-observer-and-spatial-null:
    needs: permanent-species-ledger-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_ASSET: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA256: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      ORIGINAL_PHOTO_SHA256: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same numeric versions as source census
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Recover archived original-photo measurements and authenticate exact bytes
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-real-colour-audit/{release,source,output}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern "$SOURCE_ASSET" --dir /tmp/fcp-real-colour-audit/release
          echo "$SOURCE_ARCHIVE_SHA256  /tmp/fcp-real-colour-audit/release/$SOURCE_ASSET" | sha256sum -c -
          tar -xzf "/tmp/fcp-real-colour-audit/release/$SOURCE_ASSET" \
             -C /tmp/fcp-real-colour-audit/source \
             measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$ORIGINAL_PHOTO_SHA256  /tmp/fcp-real-colour-audit/source/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
      - name: Evaluate independent-colour observers and repeat P2 permutation null after colour-blind observer thinning
        run: |
          set -euo pipefail
          python scripts/analysis/audit_fcp_photo_labels_original_20261023.py \
            --photos /tmp/fcp-real-colour-audit/source/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --out /tmp/fcp-real-colour-audit/output
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/fcp-real-colour-audit/output/fcp_photo_label_robustness_summary_20261023.json")
          d=json.loads(p.read_text())
          v=d["original_photo_and_observer_check"]
          assert v["n_source_classifiable_photos"]==227107
          assert v["max_original_photos_per_observer_per_taxon"]<=2
          x=v["species_conditioned_spatial_null_sensitivity"]
          assert x["full_original"]["n_species"]==3600
          assert abs(x["full_original"]["mean_delta"]-0.016115883798023662)<1e-10
          assert x["full_original"]["upper_p_199"]==.005
          print("FCP_ERROR_AUDIT_REAL_ORIGINAL_447500_PHOTOS_COMPLETE")
          print("FCP_ERROR_AUDIT_KEY_COUNTS",json.dumps({
            "two_colours_5photos_three_observers":v["n_species_two_colours_each_ge5_photos_and_3_observers_and_3_observations"],
            "three_colours_5photos_three_observers":v["n_species_three_colours_each_ge5_photos_and_3_observers_and_3_observations"],
            "four_colours_5photos_three_observers":v["n_species_four_colours_each_ge5_photos_and_3_observers_and_3_observations"],
            "same_observation_conflicting_colour_label_groups":v["same_observation_conflicting_colour_label_groups"],
            "spatial_robustness":x
          },sort_keys=True,allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcp-447500-real-photo-observer-colour-p2-null-audit-20261023
          path: /tmp/fcp-real-colour-audit/output/
          if-no-files-found: warn
          retention-days: 90
