name: FCP site-pair-balanced 50-km robustness

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/analysis/run_polymorphism_sitebalanced_50km_posthoc_20261017.py
      - tests/test_polymorphism_sitebalanced_50km_posthoc_20261017.py
      - docs/POLYMORPHISM_SITEBALANCED_50KM_POSTHOC_PROTOCOL_20261017.md
      - .github/workflows/polymorphism-sitebalanced-50km-posthoc-20261017.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-original-photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 pytest==8.4.2
      - name: Verify spatial blocks, null and deterministic diagnostics
        run: python -m pytest -q tests/test_polymorphism_sitebalanced_50km_posthoc_20261017.py
      - name: Recover the exact frozen original FCP photo measurements
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 5142f7951af0dde5364bb047a566d67e8c479e51
          git fetch --no-tags --depth=1 origin 7e538e5c51c05a7cc47b2fcf53eea92634c8a863
          git show 5142f7951af0dde5364bb047a566d67e8c479e51:data/derived/global_monte_carlo_measured_photos_v1.csv > "$RUNNER_TEMP/discovery.csv"
          git show 5142f7951af0dde5364bb047a566d67e8c479e51:data/derived/rgfca_reserve_replication_measured_photos_v1.csv > "$RUNNER_TEMP/validation.csv"
          git show 7e538e5c51c05a7cc47b2fcf53eea92634c8a863:data/derived/polymorphism_h2_third_cohort_measured_photos_v1.csv > "$RUNNER_TEMP/third.csv"
      - name: Refit site-balanced 50km depletion with immutable source SHA gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analysis/run_polymorphism_sitebalanced_50km_posthoc_20261017.py \
            --discovery "$RUNNER_TEMP/discovery.csv" \
            --validation "$RUNNER_TEMP/validation.csv" \
            --third "$RUNNER_TEMP/third.csv" \
            --outdir "$RUNNER_TEMP/sitebalanced"
          python - <<'PY'
          import json, pathlib
          out = json.loads((pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'sitebalanced/result.json').read_text())
          assert out['schema'] == 'fcp_site_pair_balanced_50km_posthoc_v1'
          assert out['original_frozen_results_changed'] is False
          assert out['design']['primary_radius_km'] == 50.0
          assert all(c in out['cohorts'] for c in ('discovery','validation','third'))
          print('FCP_SITE_BALANCED_50KM_REAL_ANALYSIS_COMPLETED')
          print(json.dumps(out['cohorts'], indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-sitebalanced-50km-20261017
          path: ${{ runner.temp }}/sitebalanced/
          if-no-files-found: error
          retention-days: 90
