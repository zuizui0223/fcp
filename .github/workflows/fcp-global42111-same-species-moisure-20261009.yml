name: FCP 3182 original same-species photo pairs rainfall vs temperature

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-abiotic-join-execution-20261009
    paths:
      - scripts/analysis/audit_fcp_global42111_same_species_moisture_blocks_20261009.py
      - tests/test_fcp_global42111_same_species_moisture_blocks_20261009.py
      - docs/FCP_GLOBAL42111_SAME_SPECIES_MOISTURE_BLOCKS_20261009.md
      - .github/workflows/fcp-global42111-same-species-moisure-20261009.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fcp-global42111-fixed3182-photo-climate-blocks-${{ github.ref }}
  cancel-in-progress: true

env:
  FROZEN_PAIRS_COMMIT: '2b5390ea74f8d196012499d2d35dd477f9795938'
  FROZEN_PAIRS_SHA256: '26755316b2cbd07e1e2241eb4ddc1cddc85219fd7e96424df8c14df32575a4d2'
  SOURCE_ENV_RUN: '37861582446'
  SOURCE_ENV_ARTIFACT: 'fcp-global42111-original-photo-real-site-climate-soil-20261009'

jobs:
  frozen-photo-pair-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Check self-contained original-pair moisture/thermal statistical tests
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.6.1 pytest==8.4.2
          python -m py_compile scripts/analysis/audit_fcp_global42111_same_species_moisture_blocks_20261009.py
          python -m pytest tests/test_fcp_global42111_same_species_moisture_blocks_20261009.py -q
      - name: Restore frozen original same-species observer-disjoint photographed pair source
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$FROZEN_PAIRS_COMMIT"
          git show "$FROZEN_PAIRS_COMMIT:results/rgfca_42111_crosscell_discordance_step8g_20260911/crosscell_discordance_pairs_13416.csv.gz" > /tmp/fcp_orig_13416_pairs.csv.gz
          echo "$FROZEN_PAIRS_SHA256  /tmp/fcp_orig_13416_pairs.csv.gz" | sha256sum -c -
      - name: Reuse source-checked original photo sites and climate without new image or raster downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_ENV_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ENV_ARTIFACT" --dir /tmp/fcp_pair_moisture_source
          source="$(find /tmp/fcp_pair_moisture_source -name all_original_photo_site_abiotic_coverage.csv.gz -print -quit)"
          test -s "$source"
          cp "$source" /tmp/fcp_orig_photo_env.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          z=[]
          for p in Path('/tmp/fcp_pair_moisture_source').rglob('result.json'):
              x=json.loads(p.read_text())
              if x.get('schema')=='fcp_global42111_original_photo_climate_soil_attachment_v1':
                  z.append(x)
          assert len(z)==1
          assert z[0]['original_species_count']==42111
          assert z[0]['original_taxon_cell_count']==85337
          assert z[0]['n_unique_original_photo_IDs']==100543
          assert z[0]['new_colour_label_or_photo_pixel_opened'] is False
          PY
      - name: Distinguish rainfall vs heat contrasts in exactly original 3182 photographed within-species pairs
        run: |
          python scripts/analysis/audit_fcp_global42111_same_species_moisture_blocks_20261009.py \
            --fixed-pairs /tmp/fcp_orig_13416_pairs.csv.gz \
            --original-photo-environment /tmp/fcp_orig_photo_env.csv.gz \
            --outdir /tmp/fcp_global42111_same_species_climate_blocks
      - name: Audit original 13416/3196/797 pair outcome ledger and group heldout climate block increments
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/fcp_global42111_same_species_climate_blocks/result.json').read_text())
          assert z['schema']=='fcp_global42111_3182_same_species_photo_pairs_temperature_vs_moisture_v1'
          assert z['source_original_fixed_species_pairs']==13416
          assert z['source_original_four_colour_classifiable_pairs']==3196
          assert z['source_original_discordant_photo_pairs']==797
          assert z['source_two_site_climate_evaluable_pairs']==3182
          assert z['source_two_site_climate_evaluable_discordant']==793
          assert z['source_pair_missing_photo_colour_preserved']==10220
          assert z['no_source_photo_pixels_redownloaded'] and z['no_new_photo_classification_or_prospective_source_opened']
          assert z['fixed_source_genus_and_midpoint_cell_fivefold']
          assert {m['heldout_group'] for m in z['models']}=={'genus','pair_midpoint_cell_162'}
          for m in z['models']:
              assert m['status']=='ORIGINAL_SAME_SPECIES_PHOTOGRAPHED_PAIR_CLIMATE_BLOCK_MODEL'
              assert m['n_original_source_species_pairs']==3182
              assert set(m['models'])=={'GEOGRAPHY','GEOGRAPHY_TEMPERATURE','GEOGRAPHY_MOISTURE','GEOGRAPHY_ALL_CLIMATE'}
              assert set(m['climate_increments'])=={
                  'total_climate_beyond_geography',
                  'unique_temperature_beyond_geography_moisture',
                  'unique_moisture_beyond_geography_temperature'}
              assert all(len(v['original_genus_or_cell_block_bootstrap_95CI'])==2 for v in m['climate_increments'].values())
          print('FCP_ORIGINAL_SAME_SPECIES_MOISTURE_HEAT_PHOTO_PAIR_COMPARISON_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-original-3182-photo-pair-rainfall-heat-ablation-20261009
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp_global42111_same_species_climate_blocks/
      - name: Commit numerical original photographed pair climate block outcome only
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = "analysis/fcp-global42111-withingenus-abiotic-20261009"
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          output=results/fcp_global42111_same_species_moisture_blocks_20261009
          mkdir -p "$output"
          cp /tmp/fcp_global42111_same_species_climate_blocks/* "$output/"
          git add "$output"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Seal 3182 original within-species photo-pair heat versus moisture climate contrasts'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
