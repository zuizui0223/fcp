name: FCP Sisyrinchium cross-site shoreline-gradient transport
on:
  push:
    branches:
      - analysis/fcp-sisyrinchium-shore-gradient-transport-20261013
  pull_request:
    paths:
      - 'packages/fcp_sisyrinchium_shore_gradient_transfer_20261013/**'
      - '.github/workflows/fcp-shore-gradient-transfer-20261013.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-outer-population-transport:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned numerical and focused test dependencies
        run: python -m pip install -r packages/fcp_sisyrinchium_shore_gradient_transfer_20261013/requirements-lock.txt
      - name: Recover authenticated 2016 field survey and immutable prior source results
        run: |
          set -euo pipefail
          ROOT=packages/fcp_sisyrinchium_shore_gradient_transfer_20261013
          mkdir -p "$ROOT/source" "$ROOT/results" "$ROOT/docs"
          python packages/fcp_sisyrinchium_line_20261013/src/recover_original_sources.py --outdir "$ROOT/source"
          cp packages/fcp_sisyrinchium_heldout_line_20261013/results/result.json "$ROOT/source/parent_result.json"
          cp packages/fcp_sisyrinchium_heldout_line_20261013/results/heldout_quadrat_predictions.csv "$ROOT/source/parent_predictions.csv"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('packages/fcp_sisyrinchium_shore_gradient_transfer_20261013')
          manifest=json.loads((root/'results/FROZEN_MANIFEST_SHA256.json').read_text())
          for k,want in manifest['source_code_input_checksums'].items():
              got=hashlib.sha256((root/k).read_bytes()).hexdigest()
              assert got==want,(k,got,want)
              print('FROZEN_CODE_AND_INPUT_HASH_PASS',k)
          PY
      - name: Save originally committed results before recomputation
        run: |
          set -euo pipefail
          ROOT=packages/fcp_sisyrinchium_shore_gradient_transfer_20261013
          mkdir -p /tmp/fcp_gradient_frozen
          for n in result.json posthoc_distance_scale.json named_site_transfer_scores.csv borrowed_line_predictions.csv outer_site_and_inner_line_fit_ledger.csv site_deletion_transfer_sensitivity.csv posthoc_distance_scale_predictions.csv independent_verification.json; do
            cp "$ROOT/results/$n" "/tmp/fcp_gradient_frozen/$n"
          done
      - name: Focused controls on source, nested heldouts, slopes, calibration and independent replication
        run: python -m pytest -q packages/fcp_sisyrinchium_shore_gradient_transfer_20261013/tests
      - name: Recompute both raw and posthoc standardized transfer scores from authenticated source
        run: |
          set -euo pipefail
          cd packages/fcp_sisyrinchium_shore_gradient_transfer_20261013
          python src/transport.py --source source/Sisyrinchium_data.zip --parent-result source/parent_result.json --parent-predictions source/parent_predictions.csv --outdir results
          python src/posthoc_standardized.py --source source/Sisyrinchium_data.zip --primary-result results/result.json --outdir results
          python src/verify_independent.py --source source/Sisyrinchium_data.zip --result results/result.json --posthoc results/posthoc_distance_scale.json --outdir results
          python src/make_figures.py --root .
      - name: Verify intact source and independently reproduced numerical claims without float-bit overclaim
        run: |
          python - <<'PY'
          import csv,hashlib,json,math
          from pathlib import Path
          root=Path('packages/fcp_sisyrinchium_shore_gradient_transfer_20261013')
          checks=[];maxerr=[0.];count=[0]
          manifest=json.loads((root/'results/FROZEN_MANIFEST_SHA256.json').read_text())
          for fn,expected in manifest['source_code_input_checksums'].items():
              got=hashlib.sha256((root/fn).read_bytes()).hexdigest()
              assert got==expected,('UNEXPECTED_ANALYTIC_INPUT_CHANGE',fn,got,expected)
              checks.append({'file':fn,'sha256':got,'match':True})
          exact=[]
          def match(a,b,label):
              count[0]+=1
              if isinstance(a,dict):
                  assert isinstance(b,dict) and set(a)==set(b),label
                  for k in a:match(a[k],b[k],label+'.'+k)
              elif isinstance(a,list):
                  assert isinstance(b,list) and len(a)==len(b),label
                  for k,(x,y) in enumerate(zip(a,b)):match(x,y,label+f'[{k}]')
              elif type(a) in [int,float] and type(b) in [int,float]:
                  assert math.isfinite(a) and math.isfinite(b)
                  dd=abs(a-b)
                  maxerr[0]=max(maxerr[0],dd)
                  assert math.isclose(a,b,abs_tol=1e-8,rel_tol=1e-8),(label,a,b)
              else:
                  assert a==b,(label,a,b)
          for name in ['result.json','posthoc_distance_scale.json','independent_verification.json']:
              old=json.loads(Path('/tmp/fcp_gradient_frozen',name).read_text())
              new=json.loads((root/'results'/name).read_text())
              match(old,new,name)
              exact.append({'file':name,'exact_bytes':Path('/tmp/fcp_gradient_frozen',name).read_bytes()==(root/'results'/name).read_bytes()})
          for name in ['named_site_transfer_scores.csv','borrowed_line_predictions.csv','outer_site_and_inner_line_fit_ledger.csv','site_deletion_transfer_sensitivity.csv','posthoc_distance_scale_predictions.csv']:
              with Path('/tmp/fcp_gradient_frozen',name).open(newline='') as f:a=list(csv.DictReader(f))
              with (root/'results'/name).open(newline='') as f:b=list(csv.DictReader(f))
              assert len(a)==len(b),(name,len(a),len(b))
              for i,(ra,rb) in enumerate(zip(a,b)):
                  assert set(ra)==set(rb)
                  for field in ra:
                      x=ra[field];y=rb[field]
                      if x==y:count[0]+=1;continue
                      try:
                          xx=float(x);yy=float(y)
                      except ValueError:raise AssertionError(('NON_NUMERIC_CSV_DRIFT',name,i,field,x,y))
                      count[0]+=1;maxerr[0]=max(maxerr[0],abs(xx-yy))
                      assert math.isclose(xx,yy,rel_tol=1e-8,abs_tol=1e-8),(name,i,field,x,y)
              exact.append({'file':name,'exact_bytes':Path('/tmp/fcp_gradient_frozen',name).read_bytes()==(root/'results'/name).read_bytes()})
          p=json.loads((root/'results/result.json').read_text())
          z=json.loads((root/'results/posthoc_distance_scale.json').read_text())
          ind=json.loads((root/'results/independent_verification.json').read_text())
          assert p['main']['n_sites']==6 and p['main']['n_folds']==32 and p['main']['n_M']==6692
          assert p['main']['n_source_sites_negative_gradient']==5
          assert p['main']['n_source_sites_positive_gradient']==1
          assert p['main']['mean']['gain_borrow_vs_base']<0
          assert z['status']=='POSTHOC_DIAGNOSTIC_NOT_PRIMARY' and z['main']['n_gain_median_vs_base']==5
          assert ind['status']=='PASS' and ind['n_independent_arithmetic_checks']>=1100 and ind['max_absolute_numeric_difference']<1e-8
          rec={'status':'PASS','tested_scope':'SAME_2016_SOURCE_ONLY','original_source_verified':True,
            'primary_raw_unit_borrow_not_portable':True,'posthoc_standardized_borrow_helpful_in_5_of_6_sites':True,
            'focused_tests':16,'independent_newton_checks':ind['n_independent_arithmetic_checks'],
            'recursive_and_csv_comparisons':count[0],'max_abs_replay_difference':maxerr[0],
            'exact_vs_numerical_checks':exact,'source_manifest_checks':checks,
            'no_causal_genetic_biological_independent_claim':True,'no_whole_repository_test_claim':True}
          (root/'results/remote_replay_receipt.json').write_text(json.dumps(rec,indent=2)+'\n')
          print(json.dumps(rec))
          PY
      - name: Persist original publication bytes and replay evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcp-sisyrinchium-shore-gradient-transport-20261013
          retention-days: 60
          path: |
            packages/fcp_sisyrinchium_shore_gradient_transfer_20261013/source/
            packages/fcp_sisyrinchium_shore_gradient_transfer_20261013/results/
            packages/fcp_sisyrinchium_shore_gradient_transfer_20261013/docs/*.png
