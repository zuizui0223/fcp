name: FCP observer-disjoint twofold original photo-source independent audit
on:
  pull_request:
    paths:
      - scripts/analysis/audit_fcp4475_observer_crossfit_photo_slope_20261024.py
      - .github/workflows/fcp-4475-observer-crossfit-source-audit-20261024.yml
      - docs/FCP_4475_OBSERVER_CROSSFIT_RESULTS_20261024.md
      - results/fcp4475_crossfit_photo_slope_reliability_verified_20261024.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  observer-source-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Compile independent source-audit and genus correlation fixture
        run: |
          python -m py_compile scripts/analysis/audit_fcp4475_observer_crossfit_photo_slope_20261024.py
          python scripts/analysis/audit_fcp4475_observer_crossfit_photo_slope_20261024.py --self-test
      - name: Download exact original 447500 photo derived crossfit artifact from successful source CI
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-crossfit-independent/{original,audit}
          SOURCE_DIGEST="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12554693263" --jq '.digest')"
          test "$SOURCE_DIGEST" = "sha256:50d5d15a2d145b0db7a176f945435701251768ba614f659d9dac496011b33177"
          gh run download 40080001765 --repo "$GITHUB_REPOSITORY" \
            --name fcp4475-source-photo-observer-disjoint-white-thermal-crossfit-20261024 \
            --dir /tmp/fcp-crossfit-independent/original
          cd /tmp/fcp-crossfit-independent/original
          echo '40b8be90523f876aaf755354fd9527d7429782d8cb42414a69783dedbfa4e4c9  fcp4475_observer_disjoint_crossfit_white_thermal_results.json' | sha256sum -c -
          echo '079241c220a5f5993a17d361a2ea5fc276c7d13e99a168111cc14a3f51ce7253  fcp4475_source_all_taxa_twofold_observer_crossfit_thermal_white.csv' | sha256sum -c -
      - name: Verify observer disjoint results and quantify baseline class agreement and split-photo thermal-slope reliability
        run: |
          set -euo pipefail
          python scripts/analysis/audit_fcp4475_observer_crossfit_photo_slope_20261024.py \
            --source /tmp/fcp-crossfit-independent/original \
            --out /tmp/fcp-crossfit-independent/audit
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/fcp-crossfit-independent')
          a=json.loads((root/'audit/original_source_twofold_photo_group_stability_and_slope_reliability.json').read_text())
          s=json.loads((root/'original/fcp4475_observer_disjoint_crossfit_white_thermal_results.json').read_text())
          assert a['original_source_photos']==s['source_original_photos']==447500
          assert a['source_taxa']==s['source_taxa']==4475
          assert a['source_classified_nine_hue_photos']==s['source_classified_nine_photo_hue']==227107
          for panel,z in a['panels'].items():
              assert z['paired']['n_taxa_both_baseline_folds_support']>1000
              assert 0 <= z['paired']['baseline_photo_state_agreement'] <= 1
              assert -1 <= z['paired']['cohens_kappa_baseline_photo_state'] <=1
              assert z['paired']['n_taxa_both_temperature_slope_folds_estimable']>1000
              assert len(z['paired']['slope_crossfold_pearson_genus_bootstrap95'])==2
              for direction in ('forward','reverse'):
                  assert z[direction]['n_source_taxa']==s['panels'][direction+'__'+panel]['n_heldout_thermal_estimable']
          print('FCP4475_CROSSFIT_SOURCE_INDEPENDENT_AUDIT_PASS')
          print('FCP4475_CROSSFIT_SOURCE_AUDIT_FULL_JSON',json.dumps(a,separators=(',',':'),sort_keys=True,allow_nan=False))
          print('FCP4475_CROSSFIT_SOURCE_ORIGINAL_RECEIPT_FULL_JSON',json.dumps(s,separators=(',',':'),sort_keys=True,allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp4475-original-crossfit-photo-slope-reliability-audit-20261024
          path: /tmp/fcp-crossfit-independent/audit/
          retention-days: 90
