name: Frozen 34-species paper pipeline

on:
  push:
    branches:
      - cleanup/34species-paper-pipeline-final
    paths:
      - "fcp_pipeline/**"
      - "scripts/run_34species_models.py"
      - "scripts/run_34species_power_precision.py"
      - "scripts/run_34species_phylogenetic.R"
      - "scripts/run_34species_cr2.R"
      - "tests/**"
      - "pyproject.toml"
      - "docs/supporting/jbi_opentree_induced_topology.tre"
      - "docs/supporting/jbi_dated_phylogeny_s1.tre"
      - "docs/supporting/jbi_dated_phylogeny_s2.tre"
      - "docs/supporting/jbi_dated_phylogeny_s3.tre"
      - ".github/workflows/34species-paper.yml"
  pull_request:
    paths:
      - "fcp_pipeline/**"
      - "scripts/run_34species_models.py"
      - "scripts/run_34species_power_precision.py"
      - "scripts/run_34species_phylogenetic.R"
      - "scripts/run_34species_cr2.R"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/34species-paper.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "31100106980"
  OUTDIR: analysis_outputs/34species_paper

jobs:
  reproduce-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run production-unit tests
        run: python -m unittest discover -s tests -v
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("ape","jsonlite","phylolm","clubSandwich"), repos="https://cloud.r-project.org")'
      - name: Download frozen upstream climate artifact
        uses: actions/download-artifact@v4
        with:
          name: climatic-niche-breadth-analysis
          path: source_analysis
          github-token: ${{ github.token }}
          repository: zuizui0223/fcp
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Locate and freeze the 34-species input
        run: |
          set -euo pipefail
          SOURCE=$(find source_analysis -name climatic_niche_spatial_scale_dataset.csv | head -1)
          test -s "$SOURCE"
          mkdir -p "$OUTDIR/input" "$OUTDIR/models" "$OUTDIR/phylogeny" "$OUTDIR/finite_sample"
          python - <<'PY'
          import os, pandas as pd
          from pathlib import Path
          from fcp_pipeline.validation import validate_frozen_dataset
          source=next(Path('source_analysis').rglob('climatic_niche_spatial_scale_dataset.csv'))
          d=pd.read_csv(source)
          d=d[(d['classification_source']=='baseline_unambiguous') & (pd.to_numeric(d['n_climate_cells'],errors='coerce')>=20)].copy()
          d=validate_frozen_dataset(d)
          out=Path(os.environ['OUTDIR'])/'input'/'frozen_34species_five_metric_dataset.csv'
          # Preserve the validated upstream row order. The manuscript permutation run
          # used this order; re-sorting changes only the finite Monte Carlo draw sequence.
          d.to_csv(out,index=False)
          print(out)
          PY
          echo "DATASET=$OUTDIR/input/frozen_34species_five_metric_dataset.csv" >> "$GITHUB_ENV"
      - name: Run five symmetric niche models
        run: python scripts/run_34species_models.py --dataset "$DATASET" --outdir "$OUTDIR/models" --permutations 9999 --seed 20260719
      - name: Run collinearity and phylogenetic sensitivities
        run: Rscript scripts/run_34species_phylogenetic.R --dataset "$DATASET" --outdir "$OUTDIR/phylogeny" --min_cells 20 --replicates 100 --seed 20260724
      - name: Run design-based power and precision
        run: python scripts/run_34species_power_precision.py --dataset "$DATASET" --outdir "$OUTDIR/finite_sample/power_precision" --reps 3000 --seed 20260812
      - name: Run CR2/Satterthwaite sensitivity
        run: Rscript scripts/run_34species_cr2.R --dataset "$DATASET" --outdir "$OUTDIR/finite_sample/cr2"
      - name: Validate frozen scope and outputs
        run: |
          python - <<'PY'
          import json, os, pandas as pd
          from pathlib import Path
          from fcp_pipeline.constants import METRICS
          from fcp_pipeline.validation import validate_frozen_dataset, validate_model_results
          root=Path(os.environ['OUTDIR'])
          validate_frozen_dataset(pd.read_csv(root/'input'/'frozen_34species_five_metric_dataset.csv'))
          models=pd.read_csv(root/'models'/'environmental_niche_five_metric_models.csv')
          validate_model_results(models)
          coll=pd.read_csv(root/'phylogeny'/'environmental_niche_collinearity.csv')
          op=pd.read_csv(root/'phylogeny'/'environmental_niche_opentree_summary.csv')
          dated=pd.read_csv(root/'phylogeny'/'environmental_niche_dated_phyloglm.csv')
          cr2=pd.read_csv(root/'finite_sample'/'cr2'/'jbi_34species_cr2_satterthwaite_summary.csv')
          power=json.loads((root/'finite_sample'/'power_precision'/'jbi_34species_power_precision_manifest.json').read_text())
          assert len(coll)==5 and set(coll.metric)==set(METRICS)
          assert len(op)==5 and set(op.metric)==set(METRICS)
          assert len(dated)==15
          assert len(cr2)==5
          assert power['n_species']==34 and power['n_families']==25
          assert all(models.odds_ratio < 1), 'Expected current five point estimates to remain negative'
          expected_perm = {
              'temperature_breadth': 0.6029,
              'moisture_breadth': 0.0475,
              'climatic_heterogeneity': 0.3574,
              'pca_dispersion': 0.3820,
              'pca_hull_area': 0.2382,
          }
          observed_perm = dict(zip(models.metric, models.permutation_p_two_sided))
          for metric, expected in expected_perm.items():
              actual = round(float(observed_perm[metric]), 4)
              assert actual == expected, f'{metric}: manuscript permutation p drifted: {actual} != {expected}'
          expected_or = {
              'temperature_breadth': 0.8169211307,
              'moisture_breadth': 0.4124623604,
              'climatic_heterogeneity': 0.681017,
              'pca_dispersion': 0.712125,
              'pca_hull_area': 0.576950,
          }
          observed_or = dict(zip(models.metric, models.odds_ratio))
          for metric, expected in expected_or.items():
              assert abs(float(observed_or[metric]) - expected) < 5e-6, f'{metric}: OR drifted'
          print('PASS: frozen 34-species paper pipeline and manuscript permutation regression')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-34species-paper-pipeline
          path: analysis_outputs/34species_paper/
          if-no-files-found: error
          retention-days: 30
