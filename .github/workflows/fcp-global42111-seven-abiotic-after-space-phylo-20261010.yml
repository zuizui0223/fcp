name: FCP seven abiotic blocks after true LCVP Brownian and geodesic spatial kernels

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-phylo-photo-env-20261010
    paths:
      - scripts/analysis/run_fcp_global42111_all_abiotic_beyond_space_phylogeny_20261010.py
      - tests/test_fcp_global42111_all_abiotic_beyond_space_phylogeny_20261010.py
      - docs/FCP_GLOBAL42111_ALL_ABIOTIC_AFTER_GEO_PHYLO_20261010.md
      - .github/workflows/fcp-global42111-seven-abiotic-after-space-phylo-20261010.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fcp42111-real-LCVP-seven-abiotic-fixed-photo-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN: '38011108135'
  SOURCE_ARTIFACT: 'fcp-global42111-original-photo-complete-multiabiotic-20261010'
  SOURCE_LCVP: 'results/fcp_global42111_original_local_LCVP_backbone_20261010'

jobs:
  genuine-phylogeny-and-geodesic-spatial-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Check all seven environmental block predefinition and true-tree/space comparator
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.6.1 biopython==1.85 pytest==8.4.2
          python -m py_compile scripts/analysis/run_fcp_global42111_all_abiotic_beyond_space_phylogeny_20261010.py
          python -m pytest tests/test_fcp_global42111_all_abiotic_beyond_space_phylogeny_20261010.py -q
          python scripts/analysis/run_fcp_global42111_all_abiotic_beyond_space_phylogeny_20261010.py --help >/dev/null
      - name: Restore actual original 42111 photo-site BIO1-19 srad wind vapr and 10 soil source from sealed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" --dir /tmp/fcp42111_actual_phylo_seven_abiotic_source
          file="$(find /tmp/fcp42111_actual_phylo_seven_abiotic_source -name source_original_42111_species_expanded_solar_bio_soil.csv.gz -print -quit)"
          test -s "$file"
          cp "$file" /tmp/fcp42111_original_photo_breadth_full_weather_soil.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          z=[]
          for p in Path('/tmp/fcp42111_actual_phylo_seven_abiotic_source').rglob('result.json'):
              d=json.loads(p.read_text())
              if d.get('schema')=='fcp_42111_original_photo_expanded_worldclim_solar_v1':
                  z.append(d)
          assert len(z)==1
          d=z[0]
          assert d['original_source_species']==42111
          assert d['original_source_photo_rows']==100543
          assert d['original_classified_photo_colours']==18457
          assert d['original_photo_unclassified']==23654
          assert d['original_photo_colours_untouched'] is True
          assert d['source_cell_centroid_never_used_as_photo_location'] is True
          assert set(d['monthly_variables'])=={'srad','wind','vapr'}
          assert set(d['source_extended_soil_properties'])=={'cec','sand','silt','bdod','cfvo'}
          PY
      - name: Require original dated LCVP subtrees and note incomplete direct-tip original source coverage
        run: |
          set -euo pipefail
          test -s "$SOURCE_LCVP/original_local_1761_LCVP_direct_tip_ledger.csv"
          test -s "$SOURCE_LCVP/original_local_250km_direct_LCVP_tree.tre"
          test -s "$SOURCE_LCVP/original_local_500km_direct_LCVP_tree.tre"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/fcp_global42111_original_local_LCVP_backbone_20261010/result.json').read_text())
          assert r['cohorts']['km250']['n_exact_direct_lcvp_tip_species']==342
          assert r['cohorts']['km500']['n_exact_direct_lcvp_tip_species']==649
          assert r['decision']=='HOLD_DIRECT_LCVP_SUBGENUS_COVERAGE_FOR_FULL_250_500'
          assert r['source_photo_pixels_read'] is False
          PY
      - name: Fit all environment model additions AFTER actual Brownian tree shared branches AND 50/250km original photo distance kernels
        run: |
          python scripts/analysis/run_fcp_global42111_all_abiotic_beyond_space_phylogeny_20261010.py \
            --original-expanded-breadth /tmp/fcp42111_original_photo_breadth_full_weather_soil.csv.gz \
            --original-lcvp-ledger "$SOURCE_LCVP/original_local_1761_LCVP_direct_tip_ledger.csv" \
            --tree-250 "$SOURCE_LCVP/original_local_250km_direct_LCVP_tree.tre" \
            --tree-500 "$SOURCE_LCVP/original_local_500km_direct_LCVP_tree.tre" \
            --outdir /tmp/fcp42111_full_abiotic_after_real_space_phylo
      - name: Verify every full environment block across both source and both spatial / genus / region heldouts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,pandas as pd
          p=Path('/tmp/fcp42111_full_abiotic_after_real_space_phylo')
          r=json.loads((p/'result.json').read_text())
          table=pd.read_csv(p/'full_seven_block_spatial_phylogenetic_robustness.csv')
          assert r['schema']=='fcp_global42111_all_abiotic_beyond_true_spatial_phylogenetic_covariance_v1'
          assert r['original_global_source_species']==42111
          assert r['original_classified_source_photo_species']==18457
          assert r['source_actual_LCVP_direct_original_photo_species']=={'250km':342,'500km':649}
          assert set(r['all_seven_full_environment_blocks'])=={
              'elevation','temperature','precipitation','solar_radiation',
              'wind','vapor_pressure','soil'}
          assert r['no_predictor_block_selected_after_colour_effects']
          assert r['full_original_phylogenetic_inference_HOLD']
          assert r['source_full_kernel_model']['full_872_1761_direct_tip_phylogenetic_coverage_HOLD']
          assert len(table)==(2*6+2*7)*4
          for cohort, z in r['source_full_kernel_model']['cohorts'].items():
              assert z['source']['n_direct_original_photo_taxa_pre_missingness'] in (342,649)
              assert set(z['models'])=={
                  '50km__genus','50km__true_photo_cell',
                  '250km__genus','250km__true_photo_cell'}
              for m in z['models'].values():
                  if m['status'].startswith('HOLD_'):
                      continue
                  assert m['modelled_true_phylogeny_BM_shared_branch_covariance']
                  assert m['modelled_original_photograph_spatial_exponential_covariance']
                  assert m['same_original_species_and_fold_assignments']
                  assert 'all_abiotic_beyond_spatial_plus_real_phylogeny' in m['conditional_feature_gains']
          assert len(r['robustness_matrix'])==26
          print('FCP_42111_ALL_ABIOTIC_AFTER_ACTUAL_SPACE_AND_ACTUAL_DATED_LCVP_PHYLOGENY_SOURCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp42111-seven-abiotic-beyond-true-LCVP-and-geodesic-space-20261010
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp42111_full_abiotic_after_real_space_phylo/
      - name: Seal source-supported seven block exploratory result without changing original high-depth FCP study
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = 'analysis/fcp-global42111-multiabiotic-solar-20261010'
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          target=results/fcp_global42111_all_abiotic_after_real_space_phylo_20261010
          mkdir -p "$target"
          cp /tmp/fcp42111_full_abiotic_after_real_space_phylo/* "$target/"
          git add "$target"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Seal full temperature rain sun wind vapor elevation and soil gains after true dated phylogenetic and spatial covariance'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
