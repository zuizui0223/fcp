name: Hypervolume pooled-response validation
on:
  push:
    branches: [analysis/hypervolume-geo-environment-identifiability]
    paths:
      - .github/workflows/hypervolume-pooled-response-validation.yml
      - scripts/analysis/run_hypervolume_pooled_response.py
      - tests/test_hypervolume_pooled_response.py
      - docs/supporting/hypervolume_pooled_response_result_v1.json
permissions:
  contents: write
  actions: read
concurrency:
  group: hypervolume-pooled-response-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact already-executed bytes after single upload transcription
        run: |
          python - <<'PY'
          import hashlib, json, py_compile
          from pathlib import Path
          p=Path('scripts/analysis/run_hypervolume_pooled_response.py')
          good='e87f8343fdd84f64c7245dff0399fb6b33ec8040f5290ffe5a8fdf1a1158581d'
          bad='29d9efb6297197bfc348338ef94f238784360a5ae681971df9a88827ac397e06'
          b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
          assert h in (good,bad), 'unrecognized source bytes: refuse repair'
          if h==bad:
              assert b.count(b'rates.append(dict(model=model=model,')==1
              b=b.replace(b'rates.append(dict(model=model=model,',b'rates.append(dict(model=model,')
              assert hashlib.sha256(b).hexdigest()==good
              p.write_bytes(b)
          py_compile.compile(str(p),doraise=True)
          print(json.dumps({'source_sha256':good,'upload_transcription_corrected':h==bad,'scientific_computation_modified':False}))
          PY
      - name: Commit exact byte restoration if needed
        run: |
          if ! git diff --quiet -- scripts/analysis/run_hypervolume_pooled_response.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/analysis/run_hypervolume_pooled_response.py
            git commit -m 'Restore exact executed pooled-response runner after one upload typo'
            git pull --rebase origin analysis/hypervolume-geo-environment-identifiability
            git push origin HEAD:analysis/hypervolume-geo-environment-identifiability
          fi
      - name: Install reference dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          name: hypervolume-geometry-only-v1
          run-id: 34041094467
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs
      - name: Run all 20 tests including actual geometry
        run: python -m unittest discover -s tests -p test_hypervolume_pooled_response.py -v 2>&1 | tee pooled-response-ci-tests.txt
      - name: Verify source and optional completed result guards
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('scripts/analysis/run_hypervolume_pooled_response.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='e87f8343fdd84f64c7245dff0399fb6b33ec8040f5290ffe5a8fdf1a1158581d'
          r=Path('docs/supporting/hypervolume_pooled_response_result_v1.json')
          if r.exists():
              x=json.loads(r.read_text())
              assert x['status']=='complete_independently_verified_synthetic_benchmark'
              assert x['unique_worlds']==6000 and x['score_records']==30000
              assert x['verification']['fully_verified'] is True
              assert x['biological_colour_values_read'] is False
              assert x['real_climate_used'] is False
              assert x['true_parameters_used_in_predictors'] is False
              assert x['parent_decisions_modified'] is False
          print('Source and available recorded guards verified; no scientific simulations rerun.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hypervolume-pooled-response-code-summary-v1
          path: |
            scripts/analysis/run_hypervolume_pooled_response.py
            tests/test_hypervolume_pooled_response.py
            docs/supporting/hypervolume_pooled_response_contract_v1.json
            docs/supporting/hypervolume_pooled_response_result_v1.json
            pooled-response-ci-tests.txt
          if-no-files-found: error
