name: Polymorphism spatial subset Step 5

on:
  push:
    branches:
      - analysis/polymorphism-spatial-subset-step5
    paths:
      - "scripts/analysis/run_polymorphism_spatial_subset_step5_20260909.py"
      - "docs/POLYMORPHISM_SPATIAL_SUBSET_STEP5_PROTOCOL_20260909.md"
      - ".github/workflows/polymorphism-spatial-subset-step5.yml"

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM_RUN_ID: "34088925008"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy

      - name: Download immutable upstream spatial artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/upstream-spatial
          mkdir -p /tmp/upstream-spatial
          gh run download "${UPSTREAM_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir /tmp/upstream-spatial
          test "$(find /tmp/upstream-spatial -path '*/species_rho_permutations.csv' | wc -l)" -eq 20
          test -f /tmp/upstream-spatial/global-rgfca-within-species-spatial-omnibus-full-v1/species_results.csv
          test -f /tmp/upstream-spatial/global-rgfca-within-species-spatial-omnibus-full-v1/global_null.csv

      - name: Run frozen Step 5
        run: |
          python scripts/analysis/run_polymorphism_spatial_subset_step5_20260909.py \
            --artifact-root /tmp/upstream-spatial

      - name: Commit Step 5 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/polymorphism_spatial_subset_step5_20260909/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record polymorphism spatial subset Step 5 result"
            git push
          fi
