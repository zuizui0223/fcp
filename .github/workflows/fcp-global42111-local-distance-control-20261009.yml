name: FCP true-distance local congeneric flower colour climate control

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-withingenus-abiotic-20261009
    paths:
      - scripts/analysis/audit_fcp_global42111_local_congener_diameters_20261009.py
      - tests/test_fcp_global42111_local_congener_diameters_20261009.py
      - docs/FCP_GLOBAL42111_LOCAL_PHOTO_DIAMETER_20261009.md
      - .github/workflows/fcp-global42111-local-distance-control-20261009.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: fcp42111-source-local-photocell-diameter-${{ github.ref }}
  cancel-in-progress: true

env:
  ORIGINAL_SOURCE_RUN: '37861582446'
  ORIGINAL_SOURCE_ARTIFACT: 'fcp-global42111-original-photo-real-site-climate-soil-20261009'

jobs:
  fixed-local-diameter-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Test original point-source geometry and stable 100/250/500km non-outcome thresholds
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m py_compile scripts/analysis/audit_fcp_global42111_local_congener_diameters_20261009.py
          python -m pytest tests/test_fcp_global42111_local_congener_diameters_20261009.py -q
          python -m pytest tests/test_fcp_global42111_local_congeners_20261009.py -q
      - name: Restore original 42111 source photo environmental values, no external queries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$ORIGINAL_SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$ORIGINAL_SOURCE_ARTIFACT" --dir /tmp/fcp_diameter_original_source
          f="$(find /tmp/fcp_diameter_original_source -name breadth_flower_colour_climate_soil.csv.gz -print -quit)"
          test -s "$f"
          cp "$f" /tmp/fcp_local_diameter_breadth.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          matches=[]
          for p in Path('/tmp/fcp_diameter_original_source').rglob('result.json'):
              x=json.loads(p.read_text())
              if x.get('schema')=='fcp_global42111_original_photo_climate_soil_attachment_v1':
                  matches.append(x)
          assert len(matches)==1
          x=matches[0]
          assert x['original_species_count']==42111
          assert x['original_taxon_cell_count']==85337
          assert x['n_unique_original_photo_IDs']==100543
          assert x['breadth_classifiable_by_covariate']['environment_climate_complete']==18413
          assert x['breadth_classifiable_by_covariate']['environment_all_complete']==14136
          assert x['geographic_cell_centroid_imputation'] is False
          assert x['new_colour_label_or_photo_pixel_opened'] is False
          PY
      - name: Check all whole-group true great-circle diameters 100 250 500 km including all low coverage HOLDs
        run: |
          python scripts/analysis/audit_fcp_global42111_local_congener_diameters_20261009.py \
            --original-breadth-abiotic /tmp/fcp_local_diameter_breadth.csv.gz \
            --outdir /tmp/fcp42111_original_congener_diameter
      - name: No source morph-outcome based radius rescue or inappropriate adaptation claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/fcp42111_original_congener_diameter/result.json').read_text())
          assert x['schema']=='fcp_global42111_same_genus_cell_distance_bounded_colour_climate_v1'
          assert x['original_species_source_denominator']==42111
          assert x['original_source_photo_coverage']['source_classified_photo_taxa']==18457
          assert x['original_source_photo_coverage']['climate_eligible_classified_source_taxa']==18413
          assert x['original_source_photo_coverage']['soil_eligible_classified_source_taxa']==14136
          assert x['no_true_photo_colour_reclassification_or_new_raster_download']
          assert x['old_1499_and_independent_2000_730_untouched']
          for key,source_n in [('climate_photo_population',18413),('soil_photo_population',14136)]:
              d=x[key]
              assert d['n_original_complete_case_photo_species']==source_n
              assert d['distance_cutoff_km_prespecified_all_reported']==[100.0,250.0,500.0]
              z=d['distance_bounded_studies']
              assert set(z)=={'100','250','500'}
              assert z['100']['n_original_source_species']<=z['250']['n_original_source_species']<=z['500']['n_original_source_species']
              for km in ('100','250','500'):
                  r=z[km];m=r['model']
                  assert r['sampling_rule'].startswith('Select entire original')
                  assert m['within_same_genus_and_same_source_162_cell_only']
                  assert m['photo_colour_never_used_for_group_selection']
                  assert r['n_original_source_species']==m['original_photo_support']['n_original_complete_photo_species']
                  if m['status']=='SOURCE_LOCAL_GENUS_CELL_HELDOUT_PHOTO_SPECIES_ANALYSIS':
                      assert m['n_original_photo_species_evaluated']>=300
                      assert all(len(v['original_cell_cluster_bootstrap_95CI'])==2 and
                                 len(v['genus_cluster_bootstrap_95CI'])==2 and
                                 len(v['local_genus_cell_cluster_bootstrap_95CI'])==2
                                 for v in m['incremental_source_photo_prediction'].values())
                  else:
                      assert m['status'].startswith('HOLD_INSUFFICIENT')
          print('TRUE_GEO_100_250_500KM_PHOTO_CONGENERIC_COMPARABILITY_AUDITED_NO_COLOUR_BASED_SELECTION')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp42111-original-samecell-congener-diameters-20261009
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp42111_original_congener_diameter/
      - name: Save all radius sensitivity results on draft branch, no photo pixels
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = 'analysis/fcp-global42111-local-congeners-20261009'
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          folder=results/fcp_global42111_local_congener_diameters_20261009
          mkdir -p "$folder"
          cp /tmp/fcp42111_original_congener_diameter/* "$folder/"
          git add "$folder"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Seal 100 250 500 km true photo-site local congener source-climate sensitivity'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
