name: FCP v2 post-seal synthetic analysis tests

on:
  push:
    branches:
      - analysis/fcp-v2-postseal-mv-20260924
    paths:
      - scripts/analysis/analyze_fcp_v2_mv1_mv3_20260924.py
      - scripts/analysis/analyze_fcp_v2_mv4_20260924.py
      - scripts/analysis/run_fcp_v2_mv4_shard_20260924.py
      - scripts/analysis/finalize_fcp_v2_mv4_20260924.py
      - tests/test_fcp_v2_postseal_analysis.py
      - .github/workflows/fcp-v2-postseal-synthetic-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install synthetic-test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy pytest
      - name: Compile and test frozen post-seal analysis
        run: |
          python -m py_compile             scripts/analysis/analyze_fcp_v2_mv1_mv3_20260924.py             scripts/analysis/analyze_fcp_v2_mv4_20260924.py \
            scripts/analysis/run_fcp_v2_mv4_shard_20260924.py \
            scripts/analysis/finalize_fcp_v2_mv4_20260924.py
          pytest -q tests/test_fcp_v2_postseal_analysis.py
