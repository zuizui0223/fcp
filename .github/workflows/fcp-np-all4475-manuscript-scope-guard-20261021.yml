name: FCP New Phytologist all4475 historical and active source/figure contract
on:
  push:
    branches: [analysis/fcp-np-all4475-unified-20261021]
    paths:
      - study_scope.json
      - scripts/check_study_scope.py
      - docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST.md
      - .github/workflows/fcp-np-all4475-manuscript-scope-guard-20261021.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-model-and-manuscript-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on original 1499 and active 4475 inference-scope identities
        run: |
          python -m py_compile scripts/check_study_scope.py
          python scripts/check_study_scope.py
      - name: Validate correct global-paper manuscript language and actual rendered SVG coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manuscript=Path('docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST.md').read_text()
          study=json.loads(Path('study_scope.json').read_text())
          original='results/polymorphism_h2_third_cohort_prospective_white_axis_20260917/result.json'
          assert Path(original).exists()
          assert Path(study['active_manuscript']).exists()
          assert study['fixed_analysis_frame']=={
            'photographs':149900,'named_species':1499,
            'cohorts':{'discovery':500,'validation':500,'prospective':499},
            'is_global_polymorphism_prevalence_denominator':False
          }
          full=study['current_New_Phytologist_analysis_frame']
          assert full['original_source_species']==4475
          assert len(study['New_Phytologist_main_data_figures'])==7
          for fragment in [
            '4,475','447,500','227,107','3,600','4,112',
            '0.4789','0.4320','0.0161',
            'Fig. 1.','Fig. 2.','Fig. 3.','Fig. 4.','Fig. 5.',
            'genotype','not a prevalence','photographic']:
              assert fragment in manuscript,(fragment,'missing from paper')
          assert 'not identify inherited polymorphism' in manuscript.lower() or 'neither stable genetic coexistence' in manuscript.lower()
          for path in study['New_Phytologist_main_data_figures']:
              manuscript_relative=Path(path).relative_to('docs').as_posix()
              assert manuscript_relative in manuscript,\
                  'Figure not referenced relative to manuscript: '+manuscript_relative
          print('FCP_NP_ALL4475_SOURCE_AUTHENTIC_MANUSCRIPT_FIGURES_PASS')
          PY
