name: JBI Chapter 1 Florence colour pilot

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/jbi-global-colour-boundaries
    paths:
      - ".github/workflows/jbi-ch1-florence-colour-pilot.yml"
      - "scripts/data/run_jbi_ch1_florence_colour_pilot.py"
      - "docs/supporting/jbi_ch1_florence_pilot_expected_v1.json"

permissions:
  contents: write

concurrency:
  group: jbi-ch1-florence-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  six-image-open-model-pilot:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-florence-pilot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/jbi-global-colour-boundaries
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: florence-community-florence2-base-ft-v1

      - name: Install open-model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=5,<6" accelerate
          python - <<'PY'
          import torch, transformers
          from transformers import AutoModelForMultimodalLM
          print('torch', torch.__version__, 'cuda_available=', torch.cuda.is_available())
          print('transformers', transformers.__version__)
          print('AutoModelForMultimodalLM available')
          PY

      - name: Materialize the same six frozen calibration images
        run: |
          python scripts/data/materialize_jbi_ch1_vision_pilot.py \
            --split data/frozen/jbi_ch1_photo_split_v1.csv \
            --output-root artifacts/jbi_ch1_florence_colour_pilot_v1/images \
            --manifest-csv artifacts/jbi_ch1_florence_colour_pilot_v1/pilot_manifest.csv

      - name: Run Florence-2 localization and numeric colour pilot
        run: |
          python scripts/data/run_jbi_ch1_florence_colour_pilot.py \
            --pilot-manifest artifacts/jbi_ch1_florence_colour_pilot_v1/pilot_manifest.csv \
            --output-json docs/supporting/jbi_ch1_florence_colour_pilot_v1.json \
            --overlay-dir artifacts/jbi_ch1_florence_colour_pilot_v1/overlays

      - name: Compare against frozen diagnostic expectations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('docs/supporting/jbi_ch1_florence_colour_pilot_v1.json').read_text())
          expected = json.loads(Path('docs/supporting/jbi_ch1_florence_pilot_expected_v1.json').read_text())['expectations']
          assert result['calibration_only'] is True
          assert result['evaluation_rows_opened'] is False
          assert result['final_label'] is False
          assert len(result['results']) == 6
          comparisons = []
          for row in result['results']:
              exp = expected[row['blind_id']]['expected_candidate_state']
              match = None if exp is None else row['deterministic_candidate_state'] == exp
              comparisons.append({
                  'species': row['species'],
                  'blind_id': row['blind_id'],
                  'expected': exp,
                  'observed': row['deterministic_candidate_state'],
                  'match': match,
                  'localization_status': row['localization_status'],
                  'n_detected_boxes': row['n_detected_boxes'],
              })
          result['diagnostic_comparison'] = comparisons
          result['n_predeclared_state_checks'] = sum(c['expected'] is not None for c in comparisons)
          result['n_predeclared_state_matches'] = sum(c['match'] is True for c in comparisons)
          Path('docs/supporting/jbi_ch1_florence_colour_pilot_v1.json').write_text(
              json.dumps(result, indent=2, ensure_ascii=False, sort_keys=True) + '\n'
          )
          print(json.dumps(comparisons, indent=2, ensure_ascii=False))
          PY

      - name: Upload pilot overlays and result
        uses: actions/upload-artifact@v4
        with:
          name: jbi-ch1-florence-colour-pilot-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            artifacts/jbi_ch1_florence_colour_pilot_v1/overlays/*.jpg
            artifacts/jbi_ch1_florence_colour_pilot_v1/pilot_manifest.csv
            docs/supporting/jbi_ch1_florence_colour_pilot_v1.json

      - name: Commit text result on latest branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporting/jbi_ch1_florence_colour_pilot_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record quota-independent Florence colour pilot [skip-florence-pilot]"
          git fetch origin analysis/jbi-global-colour-boundaries
          git rebase origin/analysis/jbi-global-colour-boundaries
          git push origin HEAD:analysis/jbi-global-colour-boundaries
