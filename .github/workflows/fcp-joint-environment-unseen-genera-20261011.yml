name: FCP joint environment transfer to unseen genera
on:
  pull_request:
    branches: [analysis/fcp-all36-joint-hue-components-20261011]
    paths:
      - scripts/analysis/fcp_joint_environment_unseen_genera_20261011.py
      - tests/test_joint_environment_unseen_genera_20261011.py
      - .github/workflows/fcp-joint-environment-unseen-genera-20261011.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fcp-unseen-genus-joint-environment-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  source-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install frozen numerical runtime
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.6.1 pytest==8.4.2
      - name: Test taxonomic isolation and exact ecological contrast arithmetic
        run: python -m pytest tests/test_joint_environment_unseen_genera_20261011.py -q
      - name: Recover two exact original source archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp_sources
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11587115220/zip" > /tmp/fcp_sources/fcp_original_photo_site_climate_soil_85337_20261010.zip
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11653183273/zip" > /tmp/fcp_sources/fcp_100543_all36_expanded_photo_site_environment_20261011.zip
      - name: Recompute every eligible genus at all three ecological levels
        run: |
          python scripts/analysis/fcp_joint_environment_unseen_genera_20261011.py \
            --source-root /tmp/fcp_sources --outdir /tmp/fcp_unseen_genus \
            --bootstrap 1999 --mode both --quality both
      - name: Verify source coverage, fold isolation and algebraic decomposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/fcp_unseen_genus/result.json').read_text())
          assert r['source_counts']['all_rows']==100543
          assert r['source_counts']['classified']==45953
          assert len(r['full36_predictors'])==36
          assert r['bootstrap']==1999 and not r['original_main_H1H2_changed']
          expected={'soil_all':20786,'climate_all':25028,'soil_quality':6457,'climate_quality':8145}
          assert set(r['case_results'])==set(expected)
          for name,c in r['case_results'].items():
              assert c['n_input_species']==expected[name]
              assert c['all_eligible_genera_tested_once']
              for level,e in c['levels'].items():
                  assert len(e['folds'])==5
                  assert all(f['shared_train_test_genera']==0 for f in e['folds'])
              e=c['levels']['absolute']
              for contrast,d in e['same_predictions_genus_mean_vs_species_deviation'].items():
                  for weighting in ('genus_equal','species_equal'):
                      x=d[weighting]
                      assert abs(x['total']['gain']-x['genus_mean']['gain']-x['within_genus_deviation']['gain'])<1e-10
                      assert abs(x['total']['gain']-e['results'][contrast][weighting]['total']['gain'])<1e-10
          print('PASS: authentic sources, unseen genera, all 36 variables, all sensitivities; no significance gate')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcp-joint-environment-unseen-genera-source-20261011
          retention-days: 60
          if-no-files-found: error
          path: /tmp/fcp_unseen_genus/
