name: Global RGFCA G5 sympatry colour assembly

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - "docs/supporting/global_rgfca_g5_execution_authorization_v1.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: global-rgfca-g5-sympatry-colour-assembly
  cancel-in-progress: false

jobs:
  validate-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Enforce one scientific execution attempt
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_ATTEMPT" = "1" || { echo "G5 workflow reruns are forbidden"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/supporting/global_rgfca_g5_metadata_matching_implementation_contract_v1.json').read_text())
          a=json.loads(Path('docs/supporting/global_rgfca_g5_execution_authorization_v1.json').read_text())
          if c.get('status') != 'prospective_technical_implementation_frozen_before_any_new_g5_gbif_payload_or_any_g5_colour_outcome_is_opened':
              raise SystemExit('G5 implementation contract drift')
          if a.get('status') != 'authorize_exactly_one_g5_metadata_freeze_and_conditional_primary_inference':
              raise SystemExit('G5 authorization drift')
          if a.get('workflow_attempts_allowed') != 1 or a.get('favourable_rerun_allowed') is not False:
              raise SystemExit('G5 authorization retry policy drift')
          print({'gate':'pass'})
          PY
      - name: Install validation dependencies
        run: python -m pip install -e . pytest
      - name: Validate new G5 code
        run: |
          python -m py_compile scripts/analysis/freeze_global_rgfca_g5_matching.py scripts/analysis/run_global_rgfca_g5_sympatry_colour_assembly.py
          pytest -q tests/test_global_g5_matching.py tests/test_global_community_colour_assembly.py

  freeze-metadata:
    needs: validate-code
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      matching_status: ${{ steps.read_status.outputs.matching_status }}
      matching_commit: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install metadata dependencies
        run: python -m pip install -e . "requests==2.32.5" "rasterio==1.4.4"
      - name: Freeze independent GBIF occupancy and outcome-blind matched sets
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          rm -rf /tmp/g5-metadata
          mkdir -p /tmp/g5-metadata
          python scripts/analysis/freeze_global_rgfca_g5_matching.py --output-dir /tmp/g5-metadata --workers 8
      - name: Read fail-closed matching status
        id: read_status
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/g5-metadata/global_rgfca_g5_matching_manifest_v1.json').read_text())
          print(f"matching_status={x['status']}")
          print(f"focals={x['focals_with_at_least_two_sets']}")
          print(f"sets={x['directed_matched_sets']}")
          PY
      - name: Commit frozen metadata before any colour opening
        id: commit
        env:
          BRANCH: analysis/global-monte-carlo-barrier-atlas
        run: |
          cp /tmp/g5-metadata/global_rgfca_g5_species_metadata_v1.csv data/frozen/global_rgfca_g5_species_metadata_v1.csv
          cp /tmp/g5-metadata/global_rgfca_g5_occupancy_cells_v1.csv.gz data/frozen/global_rgfca_g5_occupancy_cells_v1.csv.gz
          cp /tmp/g5-metadata/global_rgfca_g5_matched_sets_v1.csv data/frozen/global_rgfca_g5_matched_sets_v1.csv
          cp /tmp/g5-metadata/global_rgfca_g5_matching_manifest_v1.json docs/supporting/global_rgfca_g5_matching_manifest_v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/frozen/global_rgfca_g5_species_metadata_v1.csv \
                  data/frozen/global_rgfca_g5_occupancy_cells_v1.csv.gz \
                  data/frozen/global_rgfca_g5_matched_sets_v1.csv \
                  docs/supporting/global_rgfca_g5_matching_manifest_v1.json
          git commit -m "Freeze outcome-blind G5 GBIF matched sets"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: global-rgfca-g5-outcome-blind-matching-v1
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/g5-metadata/global_rgfca_g5_species_metadata_v1.csv
            /tmp/g5-metadata/global_rgfca_g5_occupancy_cells_v1.csv.gz
            /tmp/g5-metadata/global_rgfca_g5_matched_sets_v1.csv
            /tmp/g5-metadata/global_rgfca_g5_matching_manifest_v1.json

  primary-inference:
    needs: freeze-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/global-monte-carlo-barrier-atlas
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify matched metadata is committed and decide colour gate
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          x=json.loads(Path('docs/supporting/global_rgfca_g5_matching_manifest_v1.json').read_text())
          print(f"status={x['status']}")
          print('open_colour=' + ('true' if x['status']=='pass_primary_inference_coverage' else 'false'))
          PY
      - name: Materialize scientific not-evaluable result without opening colour
        if: steps.gate.outputs.open_colour != 'true'
        run: |
          mkdir -p /tmp/g5-inference
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.')
          parent=json.loads((root/'docs/supporting/global_sympatry_colour_assembly_contract_v1.json').read_text())
          match=json.loads((root/'docs/supporting/global_rgfca_g5_matching_manifest_v1.json').read_text())
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          out={
            'protocol':parent['protocol'],
            'status':'not_evaluable_primary_inference_coverage',
            'reason':'fewer than 30 focal species have at least two frozen outcome-blind matched sets',
            'focals_with_at_least_two_sets':match['focals_with_at_least_two_sets'],
            'minimum_evaluable_focal_species':match['minimum_evaluable_focal_species'],
            'directed_matched_sets':match['directed_matched_sets'],
            'flower_colour_file_opened':False,
            'thresholds_relaxed':False,
            'rerun_for_coverage_forbidden':True,
            'lineage':{
              'matching_manifest_sha256':sha('docs/supporting/global_rgfca_g5_matching_manifest_v1.json'),
              'matched_sets_sha256':sha('data/frozen/global_rgfca_g5_matched_sets_v1.csv')
            },
            'claim_ceiling':parent['claim_ceiling']
          }
          Path('/tmp/g5-inference/global_rgfca_g5_sympatry_colour_assembly_result_v1.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Install inference dependencies
        if: steps.gate.outputs.open_colour == 'true'
        run: python -m pip install -e .
      - name: Run frozen 999-permutation G5 primary inference
        if: steps.gate.outputs.open_colour == 'true'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          rm -rf /tmp/g5-inference
          mkdir -p /tmp/g5-inference
          python scripts/analysis/run_global_rgfca_g5_sympatry_colour_assembly.py --output-dir /tmp/g5-inference
      - name: Commit exact G5 primary result
        env:
          BRANCH: analysis/global-monte-carlo-barrier-atlas
        run: |
          cp /tmp/g5-inference/global_rgfca_g5_sympatry_colour_assembly_result_v1.json docs/supporting/global_rgfca_g5_sympatry_colour_assembly_result_v1.json
          if [ -f /tmp/g5-inference/global_rgfca_g5_matched_set_colour_distances_v1.csv ]; then
            cp /tmp/g5-inference/global_rgfca_g5_matched_set_colour_distances_v1.csv data/derived/global_rgfca_g5_matched_set_colour_distances_v1.csv
            cp /tmp/g5-inference/global_rgfca_g5_species_colour_assembly_v1.csv data/derived/global_rgfca_g5_species_colour_assembly_v1.csv
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporting/global_rgfca_g5_sympatry_colour_assembly_result_v1.json
          if [ -f data/derived/global_rgfca_g5_matched_set_colour_distances_v1.csv ]; then
            git add data/derived/global_rgfca_g5_matched_set_colour_distances_v1.csv data/derived/global_rgfca_g5_species_colour_assembly_v1.csv
          fi
          git commit -m "Freeze G5 sympatry colour assembly result"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: global-rgfca-g5-sympatry-colour-assembly-result-v1
          retention-days: 90
          if-no-files-found: error
          path: /tmp/g5-inference/
