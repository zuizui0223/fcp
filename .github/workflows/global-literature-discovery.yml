name: Literature evidence refresh

on:
  workflow_dispatch:
    inputs:
      pages_per_query:
        description: "OpenAlex cursor pages per original broad query"
        required: true
        default: "2"
      census_artifact_id:
        description: "Validated angiosperm census artifact ID"
        required: true
        default: "8347738258"

permissions:
  contents: read
  actions: read

concurrency:
  group: fcp-literature-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reuse validated angiosperm census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CENSUS_DIR="$RUNNER_TEMP/fcp-census"
          mkdir -p "$CENSUS_DIR"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/artifacts/${{ inputs.census_artifact_id }}/zip" \
            > "$RUNNER_TEMP/fcp-census.zip"
          unzip -q "$RUNNER_TEMP/fcp-census.zip" -d "$CENSUS_DIR"
          CENSUS_FILE="$CENSUS_DIR/angiosperm_census.csv"
          test -s "$CENSUS_FILE"
          test $(( $(wc -l < "$CENSUS_FILE") - 1 )) -ge 10000
          echo "CENSUS_FILE=$CENSUS_FILE" >> "$GITHUB_ENV"

      - name: Run original broad discovery and species mapping
        run: |
          mkdir -p analysis_outputs/literature_refresh
          python scripts/literature/global_literature_discovery.py \
            --census "$CENSUS_FILE" \
            --works-out analysis_outputs/literature_refresh/global_flower_colour_works.csv \
            --species-out analysis_outputs/literature_refresh/global_flower_colour_species_ranked.csv \
            --pages-per-query "${{ inputs.pages_per_query }}" \
            --per-page 200 --timeout 30 --retries 3 --api-key-env OPENALEX_API_KEY

      - name: Build QC and initial evidence queue
        run: |
          python scripts/literature/analyze_global_discovery.py \
            --works analysis_outputs/literature_refresh/global_flower_colour_works.csv \
            --species analysis_outputs/literature_refresh/global_flower_colour_species_ranked.csv \
            --shortlist-out analysis_outputs/literature_refresh/global_flower_colour_shortlist.csv \
            --qc-out analysis_outputs/literature_refresh/global_flower_colour_qc.json --top 500
          python scripts/literature/build_evidence_review_queue.py \
            --species analysis_outputs/literature_refresh/global_flower_colour_species_ranked.csv \
            --out analysis_outputs/literature_refresh/global_flower_colour_review_queue.csv \
            --deferred-out analysis_outputs/literature_refresh/global_flower_colour_deferred.csv \
            --qc-out analysis_outputs/literature_refresh/global_flower_colour_review_queue_qc.json \
            --max-review 300

      - name: Target strong deferred candidates and rebuild queue
        run: |
          python scripts/literature/targeted_deferred_followup.py \
            --deferred analysis_outputs/literature_refresh/global_flower_colour_deferred.csv \
            --species analysis_outputs/literature_refresh/global_flower_colour_species_ranked.csv \
            --works-out analysis_outputs/literature_refresh/targeted_followup_works.csv \
            --qc-out analysis_outputs/literature_refresh/targeted_followup_qc.json \
            --max-targets 80 --per-page 25 --timeout 30 --retries 3 --api-key-env OPENALEX_API_KEY
          python scripts/literature/analyze_global_discovery.py \
            --works analysis_outputs/literature_refresh/global_flower_colour_works.csv \
            --species analysis_outputs/literature_refresh/global_flower_colour_species_ranked.csv \
            --shortlist-out analysis_outputs/literature_refresh/global_flower_colour_shortlist.csv \
            --qc-out analysis_outputs/literature_refresh/global_flower_colour_qc.json --top 500
          python scripts/literature/build_evidence_review_queue.py \
            --species analysis_outputs/literature_refresh/global_flower_colour_species_ranked.csv \
            --out analysis_outputs/literature_refresh/global_flower_colour_review_queue.csv \
            --deferred-out analysis_outputs/literature_refresh/global_flower_colour_deferred.csv \
            --qc-out analysis_outputs/literature_refresh/global_flower_colour_review_queue_qc.json \
            --max-review 300

      - name: Record refresh boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('analysis_outputs/literature_refresh')
          qc=json.loads((root/'global_flower_colour_qc.json').read_text())
          queue=json.loads((root/'global_flower_colour_review_queue_qc.json').read_text())
          manifest={
            'status':'complete',
            'role':'current literature-index refresh, not the frozen manuscript evidence set',
            'historical_frozen_chain':'1075 retained works -> 664 candidates -> 72 initial queue -> 111 resolved queue -> 34 frozen species',
            'current_discovery_qc':qc,
            'current_queue_qc':queue,
            'guard':'Search-index changes do not overwrite the frozen 34-species manuscript sample.'
          }
          (root/'refresh_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: literature-evidence-refresh
          path: analysis_outputs/literature_refresh/
          if-no-files-found: error
          retention-days: 30
