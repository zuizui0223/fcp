name: FCP all-photo same-genus rainfall eastern transport audit

on:
  pull_request:
    branches:
      - analysis/fcp-42111-rainfall-white-geographic-commonality-20261011
    paths:
      - scripts/analysis/audit_fcp_same_genus_east_elsewhere_rain_tradeoff_20261011.py
      - tests/test_fcp_same_genus_east_elsewhere_rain_tradeoff_20261011.py
      - docs/FCP_42111_SAME_GENUS_GEOGRAPHICAL_CLIMATIC_TRADEOFF_20261011.md
      - .github/workflows/fcp-same-genus-region-rain-original-20261011.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fcp-source-shared-genera-regional-rainfall
  cancel-in-progress: true

env:
  SOURCE_ARTIFACT_ID: "11587115220"
  SOURCE_SHA256: "2d6097ba1b0434632e13bbe79dd78180608a287ff5dabebc770b5c0a2cfb52a0"
  OPENBLAS_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  source-genera-photo-evolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install deterministic original photo response runtime
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.6.1 pytest==8.4.2
      - name: Verify same source genera and distinct-species statistical support
        run: python -m pytest tests/test_fcp_same_genus_east_elsewhere_rain_tradeoff_20261011.py -q
      - name: Restore historical original photo source ZIP with exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            > /tmp/fcp_42111_original_source.zip
          echo "$SOURCE_SHA256  /tmp/fcp_42111_original_source.zip" | sha256sum -c -
      - name: Test identical-genera regional photo white-rain association, common climate, quality and species-pair controls
        run: |
          python scripts/analysis/audit_fcp_same_genus_east_elsewhere_rain_tradeoff_20261011.py \
            --source-archive /tmp/fcp_42111_original_source.zip \
            --bootstrap 999 --outdir /tmp/fcp_shared_genus_eco_rain
      - name: Check authentic original photo counts and all sensitivity cohorts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path("/tmp/fcp_shared_genus_eco_rain/result.json").read_text())
          assert a["schema"]=="fcp_global42111_identical_genus_east_rest_abiotic_flower_photo_v1"
          assert a["original_unique_photo_opportunities"]==100543
          assert a["original_4state_classified_photo_ids"]==45953
          assert a["original_classifiable_geoclimate_photo_ids"]==45836
          assert a["original_classifiable_geoclimate_species"]==25028
          assert a["frozen_original_main_H1_H2_unchanged"]
          assert 350<a["geography"]["common_rainfall_interval_mm"][0]<360
          assert 1830<a["geography"]["common_rainfall_interval_mm"][1]<1840
          p=a["same_genera_across_geographic_sectors"]["all_classified_original_source_photos"]["3"]
          assert p["source_qualified_shared_genera"]==394
          assert p["n_unique_source_species"]==9938
          assert p["n_original_photo_records"]==21176
          assert p["n_same_named_species_observed_both_regions"]==1102
          assert "response_four_original_photo_hues" in p["models"]["equal_species"]
          assert a["same_species_across_geographic_sectors"]["1"]["n_same_taxa_both_geographies"]==1773
          assert a["same_species_across_geographic_sectors"]["2"]["n_same_taxa_both_geographies"]==733
          assert a["same_species_across_geographic_sectors"]["3"]["n_same_taxa_both_geographies"]==391
          assert a["same_species_across_geographic_sectors"]["5"]["n_same_taxa_both_geographies"]==129
          print("PASS original 42111 species/100543 photo opportunity, matched 394 genera and 1773 named species")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-source-global-same-genera-geography-20261011
          retention-days: 60
          if-no-files-found: error
          path: /tmp/fcp_shared_genus_eco_rain/
