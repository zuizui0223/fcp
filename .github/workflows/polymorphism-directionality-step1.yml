name: Polymorphism directionality Step 1

on:
  push:
    branches:
      - analysis/polymorphism-directionality-step1
    paths:
      - scripts/analysis/run_polymorphism_directionality_step1_20260909.py
      - .github/workflows/polymorphism-directionality-step1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --quiet numpy pandas scipy
      - name: Run frozen Step 1
        run: python scripts/analysis/run_polymorphism_directionality_step1_20260909.py
      - name: Commit Step 1 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/polymorphism_directionality_step1_20260909/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record polymorphism directionality Step 1 result"
            git push
          fi
