name: Build New Phytologist review manuscript

on:
  push:
    branches:
      - analysis/h2-third-cohort-preopening-20260916
    paths:
      - scripts/publication/build_new_phytologist_submission_doc.py
      - tests/test_build_new_phytologist_submission_doc.py
      - docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST.md
      - docs/figures/polymorphism_20260918/**
      - .github/workflows/polymorphism-new-phytologist-document.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document dependencies
        run: python -m pip install --upgrade pytest python-docx Pillow

      - name: Verify document contract
        run: python -m pytest tests/test_build_new_phytologist_submission_doc.py -q

      - name: Build review-ready DOCX
        run: |
          mkdir -p build/new_phytologist
          python scripts/publication/build_new_phytologist_submission_doc.py \
            --source docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST.md \
            --figures docs/figures/polymorphism_20260918 \
            --output build/new_phytologist/FCP_New_Phytologist_review_manuscript.docx

      - name: Upload review manuscript
        uses: actions/upload-artifact@v4
        with:
          name: fcp-new-phytologist-review-manuscript
          path: build/new_phytologist/FCP_New_Phytologist_review_manuscript.docx
          if-no-files-found: error
          retention-days: 90
