name: FCP one unified New Phytologist editorial and claim gate

on:
  pull_request:
    branches:
      - analysis/fcp-m1-matched-spatial-support-20261014
    paths:
      - docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST_UNIFIED_20261014.md
      - docs/POLYMORPHISM_UNIFIED_EVIDENCE_AND_CLAIM_LEDGER_20261014.md
      - docs/POLYMORPHISM_NEW_PHYTOLOGIST_UNIFIED_COVER_LETTER_20261014.md
      - tests/test_np_unified_manuscript_20261014.py
      - tests/test_np_ecological_balance_20261014.py
      - tests/test_np_global_photo_diversity_20261014.py
      - tests/test_np_global_to_within_axis_20261014.py
      - tests/test_np_matched_photo_moisture_bridge_20261014.py
      - scripts/analysis/reconcile_np_global_to_within_axis_20261014.py
      - scripts/analysis/reconcile_np_matched_photo_moisture_bridge_20261014.py
      - docs/POLYMORPHISM_CROSS_SCALE_COLOUR_MEASUREMENT_AND_INTERPRETATION_20261014.md
      - docs/POLYMORPHISM_SUPPORTING_INFORMATION_UNIFIED_20261014.md
      - scripts/analysis/build_np_ecological_balance_bridge_20261014.py
      - results/np_unified_20261014/**
      - .github/workflows/fcp-unified-new-phytologist-manuscript-guard-20261014.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript-one-paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install narrow one-paper manuscript guard
        run: python -m pip install pytest==8.4.2
      - name: Assert source-confirmed science and New Phytologist format
        run: |
          python scripts/analysis/build_np_ecological_balance_bridge_20261014.py --check
          python scripts/analysis/reconcile_np_global_to_within_axis_20261014.py --check
          python scripts/analysis/reconcile_np_matched_photo_moisture_bridge_20261014.py --check
          python -m pytest -q tests/test_np_unified_manuscript_20261014.py tests/test_np_ecological_balance_20261014.py tests/test_np_global_photo_diversity_20261014.py tests/test_np_global_to_within_axis_20261014.py tests/test_np_matched_photo_moisture_bridge_20261014.py
      - name: Print bounded editorial readiness
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/POLYMORPHISM_MANUSCRIPT_NEW_PHYTOLOGIST_UNIFIED_20261014.md').read_text()
          parts={}
          hdrs=['Introduction','Materials and Methods','Results','Discussion']
          for i,h in enumerate(hdrs):
              a=s.index('## '+h)+len('## '+h)
              b=(s.index('## Table 1.',a) if h=='Materials and Methods' else s.index('## '+hdrs[i+1],a)) if i<3 else s.index('## Acknowledgements',a)
              parts[h]=len(s[a:b].strip().split())
          summary=s[s.index('## Summary')+len('## Summary'):s.index('**Keywords')].strip()
          words=len(summary.split())
          total=sum(parts.values())
          print('SINGLE NEW PHYTOLOGIST PAPER: summary',words,'main',total,'display items: 6 figures + 1 table')
          print('Sections:',parts)
          assert words<=200 and 6500<=total<=7500
          assert s.count('**Figure 6.')==1
          assert 'a unified permanent submission archive needs to be frozen' in s
          print('DRAFT: author metadata / supplemental figures and tables / unified archive remain open')
          PY
