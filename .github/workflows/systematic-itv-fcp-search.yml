name: Systematic ITV and FCP literature search

on:
  push:
    branches:
      - literature/systematic-itv-fcp-search
  pull_request:
    paths:
      - "systematic_itv_fcp_search.py"
      - "run_systematic_itv_fcp_search.py"
      - "run_itv_fcp_query_shard.py"
      - "run_itv_fcp_citation_shard.py"
      - "merge_itv_fcp_search_shards.py"
      - "validate_itv_fcp_search_protocol.py"
      - "literature/itv_fcp_search_config.json"
      - "literature/itv_fcp_screening_codebook.csv"
      - "literature/itv_fcp_systematic_search_protocol.md"
      - ".github/workflows/systematic-itv-fcp-search.yml"
  workflow_dispatch:
    inputs:
      max_openalex_records:
        description: Maximum OpenAlex and Europe PMC records per query
        required: false
        default: "10000"
      max_crossref_records:
        description: Maximum Crossref records per query
        required: false
        default: "2000"
      max_citations_per_seed:
        description: Maximum forward citations retained per seed review
        required: false
        default: "2000"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
  LITERATURE_SEARCH_CONTACT_EMAIL: ${{ secrets.LITERATURE_SEARCH_CONTACT_EMAIL }}

jobs:
  validate-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate protocol, code and configuration
        run: |
          python -m json.tool literature/itv_fcp_search_config.json >/dev/null
          python -m py_compile \
            systematic_itv_fcp_search.py \
            run_systematic_itv_fcp_search.py \
            run_itv_fcp_query_shard.py \
            run_itv_fcp_citation_shard.py \
            merge_itv_fcp_search_shards.py \
            validate_itv_fcp_search_protocol.py
          python validate_itv_fcp_search_protocol.py \
            --config literature/itv_fcp_search_config.json \
            --protocol literature/itv_fcp_systematic_search_protocol.md \
            --script systematic_itv_fcp_search.py

  query-shards:
    needs: validate-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        query_id:
          - fcp_exact
          - colour_morph
          - itv_explicit
          - within_population
          - among_population
          - continuous_colour_itv
          - pigment_variation
          - white_alba_morph
          - floral_reflectance
          - orchid_labellum
          - showy_bract
          - selection_mechanisms
          - spanish_portuguese
          - french_german_italian
          - japanese_chinese
        database: [openalex, crossref, europe_pmc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure full-search shard cap
        env:
          DB: ${{ matrix.database }}
          DISPATCH_OPENALEX: ${{ inputs.max_openalex_records }}
          DISPATCH_CROSSREF: ${{ inputs.max_crossref_records }}
        run: |
          set -euo pipefail
          if [[ "$DB" == "crossref" ]]; then
            cap="${DISPATCH_CROSSREF:-2000}"
          else
            cap="${DISPATCH_OPENALEX:-10000}"
          fi
          echo "SHARD_CAP=$cap" >> "$GITHUB_ENV"
      - name: Retrieve one query/database shard
        run: |
          python run_itv_fcp_query_shard.py \
            --config literature/itv_fcp_search_config.json \
            --census data/angiosperm_census.csv \
            --outdir "analysis_outputs/shard-${{ matrix.query_id }}-${{ matrix.database }}" \
            --query-id "${{ matrix.query_id }}" \
            --database "${{ matrix.database }}" \
            --max-records "$SHARD_CAP" \
            --timeout 45 \
            --retries 4
      - name: Upload query shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itv-fcp-query-${{ matrix.query_id }}-${{ matrix.database }}
          path: analysis_outputs/shard-${{ matrix.query_id }}-${{ matrix.database }}/
          if-no-files-found: error
          retention-days: 30

  citation-shards:
    needs: validate-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed_index: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure full-search citation cap
        env:
          DISPATCH_MAX: ${{ inputs.max_citations_per_seed }}
        run: |
          set -euo pipefail
          echo "CITATION_CAP=${DISPATCH_MAX:-2000}" >> "$GITHUB_ENV"
      - name: Retrieve one citation seed
        run: |
          python run_itv_fcp_citation_shard.py \
            --config literature/itv_fcp_search_config.json \
            --census data/angiosperm_census.csv \
            --outdir "analysis_outputs/citation-seed-${{ matrix.seed_index }}" \
            --seed-index "${{ matrix.seed_index }}" \
            --max-citations "$CITATION_CAP" \
            --timeout 45 \
            --retries 4
      - name: Upload citation shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itv-fcp-citation-${{ matrix.seed_index }}
          path: analysis_outputs/citation-seed-${{ matrix.seed_index }}/
          if-no-files-found: error
          retention-days: 30

  merge-search:
    needs: [query-shards, citation-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download query shards
        uses: actions/download-artifact@v4
        with:
          pattern: itv-fcp-query-*
          path: analysis_outputs/shards/query
      - name: Download citation shards
        uses: actions/download-artifact@v4
        with:
          pattern: itv-fcp-citation-*
          path: analysis_outputs/shards/citation
      - name: Copy full merge configuration
        run: |
          mkdir -p analysis_outputs
          cp literature/itv_fcp_search_config.json analysis_outputs/merge_config.json
      - name: Merge, deduplicate and build human-screening queue
        run: |
          python merge_itv_fcp_search_shards.py \
            --config analysis_outputs/merge_config.json \
            --census data/angiosperm_census.csv \
            --shards-root analysis_outputs/shards \
            --outdir analysis_outputs/systematic_itv_fcp_search
      - name: Validate full merged retrieval
        run: |
          set -euo pipefail
          root=analysis_outputs/systematic_itv_fcp_search
          test -s "$root/itv_fcp_search_raw_records.csv"
          test -s "$root/itv_fcp_search_log.csv"
          test -s "$root/itv_fcp_search_deduplicated_records.csv"
          test -s "$root/itv_fcp_human_screening_queue.csv"
          test -s "$root/itv_fcp_search_shard_status.csv"
          test -s "$root/itv_fcp_search_manifest.json"
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('analysis_outputs/systematic_itv_fcp_search')
          manifest = json.loads((root / 'itv_fcp_search_manifest.json').read_text())
          queue = list(csv.DictReader((root / 'itv_fcp_human_screening_queue.csv').open(encoding='utf-8')))
          assert manifest['status'] == 'complete', manifest
          assert manifest['query_count'] == 15, manifest
          assert manifest['seed_review_count'] == 7, manifest
          assert manifest['expected_query_database_shards'] == 45, manifest
          assert manifest['expected_citation_shards'] == 7, manifest
          assert manifest['successful_shards'] == 52, manifest
          assert manifest['failed_or_incomplete_shards'] == 0, manifest
          assert len(queue) == manifest['deduplicated_records']
          assert all(row['review_status'] == 'unreviewed' for row in queue)
          print(json.dumps(manifest, indent=2))
          PY
      - name: Upload final merged search
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systematic-itv-fcp-literature-search-full
          path: analysis_outputs/systematic_itv_fcp_search/
          if-no-files-found: error
          retention-days: 30
