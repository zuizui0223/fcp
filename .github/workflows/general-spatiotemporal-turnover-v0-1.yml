name: General spatiotemporal turnover programme v0.1

on:
  pull_request:
    paths:
      - 'data/general_spatiotemporal_turnover_design_v0_1.json'
      - 'data/general_spatiotemporal_turnover_eligibility_matrix_v0_1.csv'
      - 'data/general_spatiotemporal_turnover_source_audit_v0_1.json'
      - 'data/general_spatiotemporal_turnover_source_search_registry_v0_1.csv'
      - 'docs/GENERAL_SPATIOTEMPORAL_TURNOVER_PROGRAM_V0_1.md'
      - 'tests/test_general_spatiotemporal_turnover_program_v0_1.py'
      - '.github/workflows/general-spatiotemporal-turnover-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run programme contract tests
        run: python -m pytest tests/test_general_spatiotemporal_turnover_program_v0_1.py -q
      - name: Confirm current paper boundaries
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/general_spatiotemporal_turnover_design_v0_1.json'))
          a=json.load(open('data/general_spatiotemporal_turnover_source_audit_v0_1.json'))
          assert d['relation_to_existing_programmes']['active_FCP_manuscript_changed'] is False
          assert d['relation_to_existing_programmes']['frozen_CHUN_EL_v0_3_changed'] is False
          assert a['current_fcp_manuscript_changed'] is False
          assert a['chun_el_v0_3_changed'] is False
          assert a['outcome_opening_authorized'] is False
          PY
