name: Floral-specific decoupling coverage preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/POLYMORPHISM_FLORAL_SPECIFIC_DECOUPLING_PREFLIGHT_20260925.md
      - data/derived/floral_specific_decoupling_molecular_registry_v1.csv
      - scripts/analysis/run_floral_specific_decoupling_preflight_20260925.py
      - .github/workflows/floral-specific-decoupling-preflight-20260925.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas
          python -m py_compile scripts/analysis/run_floral_specific_decoupling_preflight_20260925.py
      - name: Run molecular-only coverage gate
        run: |
          rm -rf results/polymorphism_floral_specific_decoupling_preflight_20260925
          python scripts/analysis/run_floral_specific_decoupling_preflight_20260925.py \
            --registry data/derived/floral_specific_decoupling_molecular_registry_v1.csv \
            --outdir results/polymorphism_floral_specific_decoupling_preflight_20260925
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/polymorphism_floral_specific_decoupling_preflight_20260925/result.json').read_text())
          assert x['schema']=='fcp_floral_specific_decoupling_preflight_v1'
          assert x['status'] in {
            'PLEIOTROPIC_COST_COMPARISON_AUTHORIZED',
            'PLEIOTROPIC_COST_COMPARISON_NOT_AUTHORIZED'
          }
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: floral-specific-decoupling-preflight-v1
          if-no-files-found: error
          retention-days: 90
          path: results/polymorphism_floral_specific_decoupling_preflight_20260925
