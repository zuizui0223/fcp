name: RGFCA discovery publication figures

on:
  push:
    branches: [analysis/hypervolume-geo-environment-identifiability]
    paths:
      - scripts/analysis/make_rgfca_publication_figures.py
      - tests/test_rgfca_publication_figures.py
      - tests/test_rgfca_manuscript_references.py
      - tests/test_rgfca_supporting_evidence.py
      - docs/RGFCA_MANUSCRIPT.md
      - docs/RGFCA_IMAGE_ECOLOGY_LITERATURE_AUDIT.md
      - docs/RGFCA_STATISTICAL_LITERATURE_AUDIT.md
      - docs/RGFCA_METHOD_NOVELTY_POSITIONING.md
      - docs/RGFCA_SUPPORTING_EVIDENCE.md
      - docs/RGFCA_PUBLICATION_FIGURES.md
      - docs/supporting/rgfca_publication_figure_manifest_v1.json
      - docs/figures/rgfca_figure*.png
      - docs/figures/rgfca_figure*.pdf
      - .github/workflows/rgfca-publication-figures.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed display and test dependencies
        run: >-
          python -m pip install numpy==2.2.6 pandas==2.3.3 matplotlib==3.10.8
          geopandas==0.14.4 shapely==2.1.2 pyproj==3.7.1 fiona==1.10.1 pytest==8.3.5
      - name: Audit exact discovery bytes, numerical claims and two-render identity
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest tests/test_rgfca_publication_figures.py
          tests/test_rgfca_manuscript_references.py tests/test_rgfca_supporting_evidence.py -q
      - name: Export verified discovery figures without reserve outcomes
        run: >-
          python scripts/analysis/make_rgfca_publication_figures.py
          --output-dir /tmp/rgfca-publication/figures
          --manifest /tmp/rgfca-publication/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: rgfca-discovery-publication-figures
          path: /tmp/rgfca-publication
          if-no-files-found: error
          retention-days: 90
      - name: Preserve the source-audited discovery draft and reading ceilings
        uses: actions/upload-artifact@v4
        with:
          name: rgfca-core-literature-audit
          path: |
            docs/RGFCA_MANUSCRIPT.md
            docs/RGFCA_IMAGE_ECOLOGY_LITERATURE_AUDIT.md
            docs/RGFCA_STATISTICAL_LITERATURE_AUDIT.md
            docs/RGFCA_METHOD_NOVELTY_POSITIONING.md
            docs/RGFCA_SUPPORTING_EVIDENCE.md
          if-no-files-found: error
          retention-days: 90
