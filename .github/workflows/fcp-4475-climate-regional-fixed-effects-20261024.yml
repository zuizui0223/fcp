name: FCP photo-climate within-region BIO5 independent falsification
on:
  pull_request:
    paths:
      - scripts/analysis/fcp4475_seven_climate_within_region_falsification_20261024.py
      - .github/workflows/fcp-4475-climate-regional-fixed-effects-20261024.yml
      - docs/FCP_7CLIMATE_WITHIN_REGION_FALSIFICATION_20261024.md
      - results/fcp4475_climate_within_region_verified_20261024.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Test spatial-confounded artificial source vs genuine region-conditional hue
        run: |
          python -m py_compile scripts/analysis/fcp4475_seven_climate_within_region_falsification_20261024.py
          OPENBLAS_NUM_THREADS=1 python scripts/analysis/fcp4475_seven_climate_within_region_falsification_20261024.py --self-test
  authenticated-source:
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      PHOTO_SHA: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      CLIMATE_TAG: fcp-worldclim-2.1-10m-20260925
      BIO_SHA: 00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf
      SRAD_SHA: c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Authenticate original measured photos and original WorldClim archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcpregion/{release,measured,climate,results}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_FILE" --dir /tmp/fcpregion/release
          echo "$SOURCE_ARCHIVE_SHA  /tmp/fcpregion/release/$SOURCE_FILE" | sha256sum -c -
          tar -xzf /tmp/fcpregion/release/$SOURCE_FILE -C /tmp/fcpregion \
            measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$PHOTO_SHA  /tmp/fcpregion/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
          gh release download "$CLIMATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern wc2.1_10m_bio.zip --pattern wc2.1_10m_srad.zip \
            --dir /tmp/fcpregion/climate
          echo "$BIO_SHA  /tmp/fcpregion/climate/wc2.1_10m_bio.zip" | sha256sum -c -
          echo "$SRAD_SHA  /tmp/fcpregion/climate/wc2.1_10m_srad.zip" | sha256sum -c -
      - name: Test whether seven abiotic photographed hue relationships persist within regions
        run: |
          set -euo pipefail
          python scripts/analysis/fcp4475_seven_climate_within_region_falsification_20261024.py \
            --photos /tmp/fcpregion/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --worldclim-bio /tmp/fcpregion/climate/wc2.1_10m_bio.zip \
            --worldclim-srad /tmp/fcpregion/climate/wc2.1_10m_srad.zip \
            --out /tmp/fcpregion/results
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('/tmp/fcpregion/results')
          z=json.loads((p/'region_month_climate_falsification_summary.json').read_text())
          assert z['source_n_species']==4475
          assert z['source_n_photos']==447500
          assert z['source_n_4state_classified']==227107
          assert len(z['results'])==4
          for name,record in z['results'].items():
              assert len(record['seven_abiotic_axes'])==7
              table=p/f'original_all4475_{name.split("degree_")[1]}_{name.split("degree_")[0]}_regio'  # reconstructed below
              scale,thin=name.split('degree_')
              t=pd.read_csv(p/f'original_all4475_{thin}_{scale}degree_regional_photo9_climate7.csv',low_memory=False)
              assert len(t)==4475
              assert t.inat_taxon_id.is_unique
              assert int(t.n_source_classifiable.sum())==227107
              r=record['seven_abiotic_axes']['BIO5']
              assert 0<=r['n_total_support']<=4475
              assert r['n_between_label_mixed_within_blocks']<=r['n_total_support']
              if r['n_total_support']>0:
                  pvals=r['components']['total']
                  for k in ('signed_two_sided_p_199','signed_two_sided_p_199_holm7',
                            'norm_upper_p_199','norm_upper_p_199_holm7'):
                      assert 0<=pvals[k]<=1
          print('FCP4475_REGION_MONTH_SOURCE_SHA_CLIMATE_QA_PASS')
          print('FCP4475_REGION_MONTH_SOURCE_COMPLETE_JSON',json.dumps(z,sort_keys=True,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp4475-seven-climate-within-region-original-20261024
          path: /tmp/fcpregion/results/
          retention-days: 90
