name: FCP M1 same-species environmental direction versus spatial matching

on:
  pull_request:
    branches:
      - analysis/fcp-macro-abiotic-hue-direction-20261013
    paths:
      - scripts/analysis/fcp_macro_spatial_support_decomposition_20261014.py
      - scripts/analysis/verify_fcp_macro_spatial_support_20261014.py
      - scripts/analysis/build_fcp_macro_spatial_support_decision_20261014.py
      - tests/test_spatial_support_decomposition.py
      - docs/FCP_MACRO_HUE_MATCHED_SPATIAL_SUPPORT_20261014.md
      - results/fcp_m1_matched_spatial_support_20261014/**
      - .github/workflows/fcp-m1-matched-spatial-support-original-20261014.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fcp-original-spatial-matched-m1-${{ github.ref }}
  cancel-in-progress: true

env:
  PHOTO_ARTIFACT_ID: "11587115220"
  PHOTO_SHA256: "2d6097ba1b0434632e13bbe79dd78180608a287ff5dabebc770b5c0a2cfb52a0"
  ENV_ARTIFACT_ID: "11653183273"
  ENV_SHA256: "6e287294b3a05eaa383be3de644551825915bfecca9c4bde6950b4890f5e16ca"
  OPENBLAS_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  source-matched-spatial-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install pinned source-compatible numerical runtime
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 pytest==8.4.2
      - name: Check synthetic matched species, paired differences and correct HOLDs
        run: |
          python -m pytest -q tests/test_spatial_support_decomposition.py tests/test_fcp_macro_abiotic_direction_20261013.py
      - name: Retrieve BOTH exact original archived photo/environment sources by SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp_m1_source
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PHOTO_ARTIFACT_ID/zip" > /tmp/fcp_m1_source/photos.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ENV_ARTIFACT_ID/zip" > /tmp/fcp_m1_source/env.zip
          echo "$PHOTO_SHA256  /tmp/fcp_m1_source/photos.zip" | sha256sum -c -
          echo "$ENV_SHA256  /tmp/fcp_m1_source/env.zip" | sha256sum -c -
      - name: Run same named genera/species matched original-photo 999 genus bootstrap
        run: |
          python scripts/analysis/fcp_macro_spatial_support_decomposition_20261014.py \
            --photo-archive /tmp/fcp_m1_source/photos.zip \
            --environment-archive /tmp/fcp_m1_source/env.zip \
            --bootstrap 999 \
            --outdir /tmp/fcp_m1_spatial_result
      - name: Independently re-open BOTH original sources and verify 288 direct regression coefficients
        run: |
          python scripts/analysis/verify_fcp_macro_spatial_support_20261014.py \
            --photo-archive /tmp/fcp_m1_source/photos.zip \
            --environment-archive /tmp/fcp_m1_source/env.zip \
            --result /tmp/fcp_m1_spatial_result/result.json \
            --out /tmp/fcp_m1_spatial_result/independent_verified.json
      - name: Freeze supported claims and negative familywise inference
        run: |
          python scripts/analysis/build_fcp_macro_spatial_support_decision_20261014.py \
            --result-json /tmp/fcp_m1_spatial_result/result.json \
            --result-csv /tmp/fcp_m1_spatial_result/matched_spatial_support_differences.csv \
            --independent /tmp/fcp_m1_spatial_result/independent_verified.json \
            --out /tmp/fcp_m1_spatial_result/decision_receipt.json
      - name: Match ALL original-photo calculations, CSV and negative gates to frozen repo results
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          import numpy as np,pandas as pd
          observed=Path('/tmp/fcp_m1_spatial_result')
          freeze=Path('results/fcp_m1_matched_spatial_support_20261014')
          a=json.loads((observed/'result.json').read_text())
          b=json.loads((freeze/'result.json').read_text())
          d=json.loads((observed/'decision_receipt.json').read_text())
          prev=json.loads((freeze/'decision_receipt.json').read_text())
          ind=json.loads((observed/'independent_verified.json').read_text())
          assert a['schema']=='fcp_macro_hue_same_species_spatial_conditioning_20261014_v1'
          assert a['photo_source_sha256']=='2d6097ba1b0434632e13bbe79dd78180608a287ff5dabebc770b5c0a2cfb52a0'
          assert a['abiotic_source_sha256']=='6e287294b3a05eaa383be3de644551825915bfecca9c4bde6950b4890f5e16ca'
          assert a['regions']['world']['support']['n_matched_species']==9370
          assert a['regions']['E90_E180']['support']['n_matched_species']==2886
          assert d['claims']['same_species_spatial_adjustment_difference']=='NOT_FAMILYWISE_ROBUST_IN_EITHER_GENUS_EQUAL_GLOBAL_OR_EAST'
          assert ind['status']=='PASS' and ind['independent_direct_WLS_slope_reconstructions']==288
          assert ind['max_abs_coeff_difference_probability_units']<1e-10
          nnum=0
          def compare(x,y,loc='root'):
              global nnum
              if isinstance(x,dict):
                  assert isinstance(y,dict) and set(x)==set(y),loc
                  for k in x:compare(x[k],y[k],loc+'/'+str(k))
              elif isinstance(x,list):
                  assert isinstance(y,list) and len(x)==len(y),loc
                  for i,(xx,yy) in enumerate(zip(x,y)):compare(xx,yy,loc+'/'+str(i))
              elif isinstance(x,(int,float)) and not isinstance(x,bool):
                  assert math.isclose(x,y,abs_tol=1e-9,rel_tol=0),(loc,x,y)
                  nnum+=1
              else:assert x==y,(loc,x,y)
          compare(a,b)
          compare(d,prev)
          aa=pd.read_csv(observed/'matched_spatial_support_differences.csv')
          bb=pd.read_csv(freeze/'matched_spatial_support_differences.csv')
          assert aa.shape==bb.shape==(576,11)
          assert aa.columns.tolist()==bb.columns.tolist()
          for col in aa.columns:
              if pd.api.types.is_numeric_dtype(aa[col]):
                  assert np.allclose(aa[col],bb[col],rtol=0,atol=1e-9,equal_nan=True),col
              else:assert aa[col].fillna('___').equals(bb[col].fillna('___')),col
          main=aa.query("type=='paired_difference' and comparison=='spatial_adjustment_on_same_species' and weight=='genus_equal'")
          assert len(main)==48 and not((main.maxT95_lo_pp>0)|(main.maxT95_hi_pp<0)).any()
          print('PASS two SHA256 original sources; 576 result rows; 288 independent direct WLS checks;',nnum,'paired original numerical claims; no genus-equal M1 causal promotion')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-m1-spatial-matched-original-photo-20261014
          path: /tmp/fcp_m1_spatial_result/
          retention-days: 60
          if-no-files-found: error
