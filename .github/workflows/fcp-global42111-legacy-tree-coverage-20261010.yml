name: FCP global 42111 old dated phylogeny local congener exact tip coverage

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-microspatial-label-null-20261009
    paths:
      - scripts/analysis/audit_fcp_global42111_existing_tree_coverage_20261010.py
      - tests/test_fcp_global42111_existing_tree_coverage_20261010.py
      - docs/FCP_GLOBAL42111_TREE_COVERAGE_PREFLIGHT_20261010.md
      - .github/workflows/fcp-global42111-legacy-tree-coverage-20261010.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fcp42111-old-tree-exact-local-phylogenetic-opportunity-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN: '37861582446'
  SOURCE_ARTIFACT: 'fcp-global42111-original-photo-real-site-climate-soil-20261009'
  H3A_TREE_RUN: '34676531258'
  H3A_TREE_ARTIFACT: 'polymorphism-h3a-phylogeny-preflight-20260912'

jobs:
  taxon-only-phylogeny-source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Check source-defined exact tree taxon-match firewalls
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 biopython==1.85 pytest==8.4.2
          python -m py_compile scripts/analysis/audit_fcp_global42111_existing_tree_coverage_20261010.py
          python -m pytest tests/test_fcp_global42111_existing_tree_coverage_20261010.py -q
      - name: Recover immutable original global photo positions/colour records and three H3a dated trees
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp_legacy_tree_audit/source /tmp/fcp_legacy_tree_audit/h3a
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" --dir /tmp/fcp_legacy_tree_audit/source
          gh run download "$H3A_TREE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$H3A_TREE_ARTIFACT" --dir /tmp/fcp_legacy_tree_audit/h3a
          orig="$(find /tmp/fcp_legacy_tree_audit/source -name breadth_flower_colour_climate_soil.csv.gz -print -quit)"
          test -s "$orig"
          cp "$orig" /tmp/fcp_legacy_tree_audit/old_original_42111_photo_abiotic.csv.gz
          for i in 1 2 3; do
            file="$(find /tmp/fcp_legacy_tree_audit/h3a -name "h3a_s${i}.tre" -print -quit)"
            test -s "$file"
            cp "$file" "/tmp/fcp_legacy_tree_audit/h3a_s${i}.tre"
          done
          echo 'ce4a2ede815dbe0eb2407d3d9ebb58d0218d85ece85ea1b9ab58e00e7dd84d19  /tmp/fcp_legacy_tree_audit/h3a_s1.tre' | sha256sum -c -
          echo '384c9d1bcde150ac200d7006703de55ebfee6f83fc9108bb9b7c02cee3107abb  /tmp/fcp_legacy_tree_audit/h3a_s2.tre' | sha256sum -c -
          echo '9a25eb77d87e7a698697f8c4835f8c24e98ee3c8bfc7c02d317f46090e382c26  /tmp/fcp_legacy_tree_audit/h3a_s3.tre' | sha256sum -c -
          cp docs/supporting/jbi_dated_phylogeny_s1.tre /tmp/fcp_legacy_tree_audit/jbi34.tre
          python - <<'PY'
          import json
          from pathlib import Path
          receipts=[]
          for p in Path('/tmp/fcp_legacy_tree_audit/source').rglob('result.json'):
              q=json.loads(p.read_text())
              if q.get('schema')=='fcp_global42111_original_photo_climate_soil_attachment_v1':
                  receipts.append(q)
          assert len(receipts)==1
          r=receipts[0]
          assert r['original_species_count']==42111
          assert r['original_taxon_cell_count']==85337
          assert r['breadth_classifiable_by_covariate']['environment_climate_complete']==18413
          assert r['geographic_cell_centroid_imputation'] is False
          assert r['new_colour_label_or_photo_pixel_opened'] is False
          PY
      - name: Check S1-S3 exact existing tip overlap with original 250 and 500km congeneric photo species
        run: |
          python scripts/analysis/audit_fcp_global42111_existing_tree_coverage_20261010.py \
            --original-breadth-abiotic /tmp/fcp_legacy_tree_audit/old_original_42111_photo_abiotic.csv.gz \
            --h3a-s1 /tmp/fcp_legacy_tree_audit/h3a_s1.tre \
            --h3a-s2 /tmp/fcp_legacy_tree_audit/h3a_s2.tre \
            --h3a-s3 /tmp/fcp_legacy_tree_audit/h3a_s3.tre \
            --jbi34 /tmp/fcp_legacy_tree_audit/jbi34.tre \
            --outdir /tmp/fcp_legacy_tree_audit/output
      - name: Freeze a phylogenetic coverage opportunity/HOLD, not a coefficient
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/fcp_legacy_tree_audit/output/result.json').read_text())
          assert r['schema']=='fcp_global42111_existing_tree_local_congener_coverage_v1'
          assert r['status']=='LEGACY_TREE_OVERLAP_ONLY_NO_PHYLOGENETIC_SIGNAL_ESTIMATED'
          assert r['source_global_taxa']==42111
          assert r['original_source_classifiable_photo_taxa']==18457
          assert r['original_climate_complete_photo_taxa']==18413
          assert set(r['tree_metadata'])=={'h3a_s1','h3a_s2','h3a_s3','jbi34'}
          assert set(r['local_cohorts'])=={'250','500'}
          assert r['no_new_colour_outcomes_or_prospective_taxa_opened']
          assert r['original_source_tree_leaf_labels_and_photo_taxa_left_unchanged']
          for cap,n in [('250',872),('500',1761)]:
              item=r['local_cohorts'][cap]
              assert item['n_original_species']==n
              for tree in item['existing_tree_coverage'].values():
                  assert tree['n_original_photo_source_species']==n
                  assert tree['n_exact_original_source_species_tree_tips']<=n
                  assert tree['genus_overlap_is_not_species_phylogeny']
          if not r['old_h3a_trees_support_this_global_test']:
              assert r['decision']=='HOLD_EXISTING_TREE_COVERAGE_REQUIRE_NEW_OUTCOME_BLIND_DATED_TREE'
          print('FCP_SOURCE_EXACT_PHYLOGENETIC_LOCAL_SPECIES_COVERAGE_RECORDED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-global42111-existing-phylogeny-coverage-20261010
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp_legacy_tree_audit/output/
      - name: Seal original tree-tip opportunity in new exploratory PR only
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = 'analysis/fcp-global42111-phylogeny-coverage-20261010'
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          dest=results/fcp_global42111_existing_phylogeny_coverage_20261010
          mkdir -p "$dest"
          cp /tmp/fcp_legacy_tree_audit/output/* "$dest/"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Seal exact historical H3a/JBI phylogeny coverage of original global FCP local congeneric species'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
