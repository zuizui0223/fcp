name: Global Monte Carlo measurement reassembly technical recovery

on:
  push:
    branches:
      - analysis/global-monte-carlo-barrier-atlas
    paths:
      - ".github/workflows/global-monte-carlo-measurement-reassembly-technical.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: global-monte-carlo-measurement-reassembly-technical
  cancel-in-progress: false

jobs:
  reassemble-sealed-results-only:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Materialize exact validated H9 reassembly infrastructure only
        run: bash scripts/analysis/materialize_random_photo_first_h9_measurement_infrastructure.sh
      - name: Install frozen package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Download exact firewall from completed measurement run
        uses: actions/download-artifact@v4
        with:
          name: global-monte-carlo-measurement-firewall-v1
          path: /tmp/firewall
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33947369389
      - name: Download all exact 256 sealed terminal artifacts with explicit pagination
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile
          import urllib.request
          import zipfile
          from pathlib import Path

          owner = 'zuizui0223'
          repo = 'fcp'
          run_id = 33947369389
          token = os.environ['GH_TOKEN']
          expected = {
              f'global-terminal-b{b}-s{s}-p{p}'
              for b in range(2)
              for s in range(32)
              for p in range(4)
          }
          pattern = re.compile(r'^global-terminal-b[01]-s(?:[0-9]|[12][0-9]|3[01])-p[0-3]$')
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'fcp-frozen-measurement-reassembly',
          }

          artifacts = {}
          total_count = None
          for page in range(1, 5):
              url = (
                  f'https://api.github.com/repos/{owner}/{repo}/actions/runs/{run_id}/artifacts'
                  f'?per_page=100&page={page}'
              )
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.load(response)
              if total_count is None:
                  total_count = int(payload['total_count'])
              rows = payload.get('artifacts', [])
              for artifact in rows:
                  name = str(artifact['name'])
                  if pattern.fullmatch(name):
                      if name in artifacts:
                          raise SystemExit(f'duplicate terminal artifact name: {name}')
                      if artifact.get('expired'):
                          raise SystemExit(f'expired terminal artifact: {name}')
                      artifacts[name] = artifact
              if not rows:
                  break

          got = set(artifacts)
          if got != expected:
              missing = sorted(expected - got)
              extra = sorted(got - expected)
              raise SystemExit(
                  f'terminal artifact census mismatch: got={len(got)} '
                  f'missing={missing[:10]} extra={extra[:10]} total_run_artifacts={total_count}'
              )

          out = Path('/tmp/partition-results')
          out.mkdir(parents=True, exist_ok=True)
          extracted = set()
          for name in sorted(expected):
              artifact = artifacts[name]
              with tempfile.NamedTemporaryFile(suffix='.zip') as tmp:
                  subprocess.run(
                      [
                          'curl', '--fail', '--location', '--silent', '--show-error',
                          '--retry', '4', '--retry-delay', '1',
                          '-H', f'Authorization: Bearer {token}',
                          '-H', 'Accept: application/vnd.github+json',
                          '-H', 'X-GitHub-Api-Version: 2022-11-28',
                          str(artifact['archive_download_url']),
                          '--output', tmp.name,
                      ],
                      check=True,
                  )
                  with zipfile.ZipFile(tmp.name) as zf:
                      for member in zf.infolist():
                          if member.is_dir():
                              continue
                          base = Path(member.filename).name
                          if base in extracted:
                              raise SystemExit(f'duplicate extracted terminal filename: {base}')
                          extracted.add(base)
                          target = out / base
                          with zf.open(member) as src, target.open('wb') as dst:
                              dst.write(src.read())

          print({
              'run_total_artifacts': total_count,
              'terminal_artifacts': len(artifacts),
              'extracted_terminal_files': len(extracted),
              'pixels_reopened': False,
          })
          PY
      - name: Reassemble only; do not reopen pixels or rerun any partition
        run: |
          set -euo pipefail
          test ! -e docs/supporting/global_monte_carlo_measurement_result_v1.json
          python scripts/analysis/reassemble_global_monte_carlo_measurement.py \
            --results-dir /tmp/partition-results \
            --worker-batch0 /tmp/firewall/batch_0/worker_packet/measurement_manifest.csv \
            --worker-batch1 /tmp/firewall/batch_1/worker_packet/measurement_manifest.csv \
            --metadata-join-key /tmp/firewall/sealed_keys/metadata_join_key.csv \
            --firewall-manifest /tmp/firewall/measurement_firewall_manifest.json \
            --output-csv "$GITHUB_WORKSPACE/data/derived/global_monte_carlo_measured_photos_v1.csv" \
            --output-manifest "$GITHUB_WORKSPACE/docs/supporting/global_monte_carlo_measurement_result_v1.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('docs/supporting/global_monte_carlo_measurement_result_v1.json').read_text())
          assert r['status'] == 'complete_global_location_blind_measurement_and_join'
          assert r['partition_receipts'] == 256
          assert r['terminal_result_rows'] == r['joined_rows'] == r['frozen_candidate_rows']
          assert r['coordinate_colour_join_opened_after_complete_measurement'] is True
          assert r['g1_g3_inference_run'] is False
          assert r['external_overlay_opened'] is False
          print(json.dumps(r, indent=2))
          PY
      - name: Commit exact frozen reassembly products
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/derived/global_monte_carlo_measured_photos_v1.csv \
            data/derived/global_monte_carlo_measurement_species_support_v1.csv \
            docs/supporting/global_monte_carlo_measurement_result_v1.json
          git commit -m "Complete frozen global measurement reassembly from sealed artifacts"
          for attempt in 1 2 3 4; do
            git fetch origin analysis/global-monte-carlo-barrier-atlas
            git rebase origin/analysis/global-monte-carlo-barrier-atlas
            if git push origin HEAD:analysis/global-monte-carlo-barrier-atlas; then break; fi
            test "$attempt" -lt 4
            sleep $((attempt * 2))
          done
      - name: Authorize frozen G1 G3 only if the committed postmeasurement gate passes
        run: |
          set -euo pipefail
          PASS=$(python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('docs/supporting/global_monte_carlo_measurement_result_v1.json').read_text())
          print('true' if r['postmeasurement_gate']['pass'] else 'false')
          PY
          )
          if [ "$PASS" != "true" ]; then
            echo "postmeasurement gate did not pass; no inference authorization will be created"
            exit 0
          fi
          python scripts/analysis/generate_global_monte_carlo_inference_authorization.py
          git add docs/supporting/global_monte_carlo_inference_authorization_v1.json
          git commit -m "Authorize frozen global RGFCA G1 G3 inference"
          for attempt in 1 2 3 4; do
            git fetch origin analysis/global-monte-carlo-barrier-atlas
            git rebase origin/analysis/global-monte-carlo-barrier-atlas
            if git push origin HEAD:analysis/global-monte-carlo-barrier-atlas; then exit 0; fi
            test "$attempt" -lt 4
            sleep $((attempt * 2))
          done
