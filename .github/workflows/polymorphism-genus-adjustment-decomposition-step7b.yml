name: Polymorphism genus adjustment decomposition Step 7b

on:
  push:
    branches:
      - analysis/polymorphism-genus-adjustment-decomposition-step7b
    paths:
      - "scripts/analysis/run_polymorphism_genus_adjustment_decomposition_step7b_20260910.py"
      - "docs/POLYMORPHISM_GENUS_ADJUSTMENT_DECOMPOSITION_STEP7B_PROTOCOL_20260910.md"
      - ".github/workflows/polymorphism-genus-adjustment-decomposition-step7b.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy

      - name: Verify frozen inputs
        run: |
          test -f results/polymorphism_species_attributes_step4_association_20260910/species_analysis_table.csv
          test -f results/polymorphism_spatial_span_adjusted_step6_20260910/reserve_species_span_adjusted_input.csv
          test -f results/polymorphism_genus_replication_step7_20260910/result.json
          test -f results/polymorphism_genus_replication_step7_20260910/shared_repeated_genus_means.csv
          test -f results/polymorphism_mixed_step2_20260909/result.json

      - name: Run adjustment decomposition
        run: |
          python scripts/analysis/run_polymorphism_genus_adjustment_decomposition_step7b_20260910.py

      - name: Verify result receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('results/polymorphism_genus_adjustment_decomposition_step7b_20260910/result.json').read_text())
          assert r['analysis'] == 'polymorphism_genus_adjustment_decomposition_step7b'
          assert r['fixed_photo_denominator_verified'] == {'discovery': 100, 'reserve': 100}
          assert r['n_permutations_each_test'] == 20000
          assert r['shared_23_genus_D_unbiased_concordance']['n'] == 23
          print(json.dumps({
              'decision': r['decision'],
              'discovery': r['discovery'],
              'reserve': r['reserve'],
              'shared': r['shared_23_genus_D_unbiased_concordance'],
          }, indent=2))
          PY

      - name: Commit Step 7b results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/polymorphism_genus_adjustment_decomposition_step7b_20260910/
          if git diff --cached --quiet; then
            echo "No Step 7b result changes"
          else
            git commit -m "Record Step 7b genus adjustment decomposition result"
            git push
          fi
