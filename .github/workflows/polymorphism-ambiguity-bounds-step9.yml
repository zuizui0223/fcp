name: Polymorphism ambiguity bounds Step 9

on:
  push:
    branches:
      - analysis/polymorphism-ambiguity-bounds-step9
    paths:
      - "scripts/analysis/run_polymorphism_ambiguity_bounds_step9_20260910.py"
      - "docs/POLYMORPHISM_AMBIGUITY_BOUNDS_STEP9_PROTOCOL_20260910.md"
      - ".github/workflows/polymorphism-ambiguity-bounds-step9.yml"

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCOVERY_RUN_ID: "34088925008"
      RESERVE_RUN_ID: "34178957447"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy

      - name: Verify fixed sources
        run: |
          test -f data/derived/global_monte_carlo_measured_photos_v1.csv
          test -f data/derived/rgfca_reserve_replication_measured_photos_v1.csv
          test -f results/polymorphism_species_attributes_step4_association_20260910/species_analysis_table.csv
          test -f results/polymorphism_spatial_span_adjusted_step6_20260910/reserve_species_span_adjusted_input.csv
          test -f results/polymorphism_genus_replication_step7_20260910/shared_repeated_genus_means.csv

      - name: Download immutable discovery spatial nulls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/discovery-spatial
          mkdir -p /tmp/discovery-spatial
          gh run download "${DISCOVERY_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir /tmp/discovery-spatial
          test "$(find /tmp/discovery-spatial -path '*/species_rho_permutations.csv' | wc -l)" -eq 20

      - name: Download immutable reserve spatial nulls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/reserve-spatial
          mkdir -p /tmp/reserve-spatial
          gh run download "${RESERVE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir /tmp/reserve-spatial
          test "$(find /tmp/reserve-spatial -path '*/null.npz' | wc -l)" -eq 20
          test "$(find /tmp/reserve-spatial -path '*/receipt.json' | wc -l)" -eq 20

      - name: Run Step 9 ambiguity endpoint analysis
        run: |
          python scripts/analysis/run_polymorphism_ambiguity_bounds_step9_20260910.py \
            --discovery-artifact-root /tmp/discovery-spatial \
            --reserve-artifact-root /tmp/reserve-spatial

      - name: Verify result receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('results/polymorphism_ambiguity_bounds_step9_20260910/result.json').read_text())
          assert r['analysis'] == 'polymorphism_ambiguity_bounds_step9'
          assert r['spatial_null_permutations_reused'] == 999
          assert r['new_spatial_permutations_generated'] is False
          assert r['discovery_description']['n_species'] == 369
          assert r['reserve_description']['n_species'] == 363
          print(json.dumps({
              'decision': r['decision'],
              'reserve_genus': r['reserve_genus'],
              'reserve_primary': r['reserve_spatial_primary'],
              'reserve_background': r['reserve_spatial_matched_background_differential'],
          }, indent=2))
          PY

      - name: Commit Step 9 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/polymorphism_ambiguity_bounds_step9_20260910/
          if git diff --cached --quiet; then
            echo "No Step 9 result changes"
          else
            git commit -m "Record Step 9 ambiguity endpoint stress-test result"
            git push
          fi
