name: FCP 4475 climate-conditional nine-hue directions
on:
  pull_request:
    paths:
      - scripts/analysis/fcp4475_joint_conditional_climate_hue_20261024.py
      - .github/workflows/fcp-4475-joint-seven-climate-hue-20261024.yml
      - docs/FCP_4475_JOINT_CLIMATE_HUE_20261024.md
      - results/fcp4475_joint_climate_hue_source_verified_20261024.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  synthetic-climate-identifiability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Test confounded BIO5 and true BIO5 photo-colour signals
        run: |
          python -m py_compile scripts/analysis/fcp4475_joint_conditional_climate_hue_20261024.py
          OPENBLAS_NUM_THREADS=1 python scripts/analysis/fcp4475_joint_conditional_climate_hue_20261024.py --self-test
  original-source-447500:
    needs: synthetic-climate-identifiability
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: fcp-all4730-original-method-actual-colour-results-20261017
      SOURCE_FILE: fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz
      SOURCE_ARCHIVE_SHA: 99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25
      PHOTO_SHA: 8e7f10f0427927208485b2da6fa9c46bb681d6f3611e53b8dfdc606cfc8dabe6
      CLIMATE_TAG: fcp-worldclim-2.1-10m-20260925
      BIO_SHA: 00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf
      SRAD_SHA: c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.0.0 scipy==1.14.1
      - name: Authenticate source photo and two original WorldClim release archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcp-joint/{release,measured,climate,results}
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_FILE" \
            --dir /tmp/fcp-joint/release
          echo "$SOURCE_ARCHIVE_SHA  /tmp/fcp-joint/release/$SOURCE_FILE" | sha256sum -c -
          tar -xzf /tmp/fcp-joint/release/$SOURCE_FILE -C /tmp/fcp-joint \
            measured/fcp_all4730_original_method_measured_photos.csv.gz
          echo "$PHOTO_SHA  /tmp/fcp-joint/measured/fcp_all4730_original_method_measured_photos.csv.gz" | sha256sum -c -
          gh release download "$CLIMATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern wc2.1_10m_bio.zip --pattern wc2.1_10m_srad.zip --dir /tmp/fcp-joint/climate
          echo "$BIO_SHA  /tmp/fcp-joint/climate/wc2.1_10m_bio.zip" | sha256sum -c -
          echo "$SRAD_SHA  /tmp/fcp-joint/climate/wc2.1_10m_srad.zip" | sha256sum -c -
      - name: Run five taxon cohorts original versus observer-thinned 3-climate and 7-climate conditional hue models
        run: |
          set -euo pipefail
          python scripts/analysis/fcp4475_joint_conditional_climate_hue_20261024.py \
            --photos /tmp/fcp-joint/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --worldclim-bio /tmp/fcp-joint/climate/wc2.1_10m_bio.zip \
            --worldclim-srad /tmp/fcp-joint/climate/wc2.1_10m_srad.zip \
            --out /tmp/fcp-joint/results
          python - <<'PY'
          import json,pandas as pd,numpy as np
          from pathlib import Path
          root=Path('/tmp/fcp-joint/results')
          v=json.loads((root/'joint_climate_conditional_hue_summary.json').read_text())
          assert (v['original_photo_count'],v['original_taxon_count'],
                  v['original_photo_classified_count'])==(447500,4475,227107)
          assert len(v['results'])==4
          for name,z in v['results'].items():
              assert z['n_original_source_species_in_ledger']==4475
              assert len(z['per_source_cohort'])==5
              assert len(z['photographic_photo_category_components'])==3
              t=pd.read_csv(root/f'original4475_{name}_conditional_climate_support.csv')
              assert len(t)==4475 and t.inat_taxon_id.is_unique
              assert int(t.n_original_classifiable.sum())==227107
              x=np.load(root/f'original4475_{name}_nine_hue_conditional_source.npz')
              assert x['conditional_photo_palette_slope'].shape==(4475,7,3,9)
              assert x['conditional_source_photo_covariance'].shape==(4475,7,3,9)
              assert np.array_equal(x['inat_taxon_id'],t.inat_taxon_id.to_numpy())
              for m in ('BIO5','BIO12'):
                  cell=z['photographic_photo_category_components']['total']['per_climate'][m]
                  assert 0<=cell['n_species']<=4475
                  if cell['n_species']:
                      vec=cell['mean_conditional_nine_hue_vector']
                      assert abs(sum(d['mean_photo_palette_conditional_slope'] for d in vec.values()))<1e-8
          print('FCP4475_JOINT_CLIMATE_ORIGINAL_SOURCE_QA_PASS')
          print('FCP4475_JOINT_CLIMATE_AUDIT_FULL_JSON',json.dumps(v,sort_keys=True,separators=(',',':'),allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp4475-photo-climate-seven-joint-conditional-20261024
          path: /tmp/fcp-joint/results/
          retention-days: 90
