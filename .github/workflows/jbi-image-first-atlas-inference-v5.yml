name: JBI image-first atlas inference v5 freeze

on:
  pull_request:
    paths:
      - "fcp_pipeline/atlas_inference_cascade.py"
      - "scripts/data/validate_jbi_image_first_atlas_inference_v5.py"
      - "tests/test_atlas_inference_cascade.py"
      - "docs/supporting/jbi_image_first_atlas_inference_contract_v5.json"
      - "data/evaluation/jbi_ch1_stage_a_primary_null_v1.csv"
      - "data/evaluation/jbi_ch1_stage_b_primary_null_v1.csv"
      - "data/evaluation/jbi_ch1_stage_b_shared_transition_surface_v1.csv"
      - "data/frozen/freeze_manifest.json"
      - "data/frozen/frozen_34species_coexistence_segregation_v22.csv"
      - "data/frozen/frozen_34species_five_metric_dataset.csv"
      - "docs/supporting/jbi_inaturalist_automated_colour_spatial_v2/species_spatial_mark_results.csv"
      - "docs/supporting/jbi_image_first_atlas_contract_v1.json"
      - "docs/supporting/jbi_image_first_atlas_expansion_contract_v2.json"
      - "docs/supporting/jbi_image_first_atlas_inference_contract_v4.json"
      - "docs/supporting/jbi_atlas_roi_estimator_contract_v4.json"
      - "docs/supporting/jbi_atlas_scaleout_execution_contract_v1.json"
      - "docs/supporting/jbi_atlas_environmental_overlay_contract_v1.json"
      - "docs/supporting/jbi_atlas_bombus_source_gate_result_v1.json"
      - ".github/workflows/jbi-image-first-atlas-inference-v5.yml"
  push:
    branches:
      - analysis/jbi-global-colour-boundaries-scaleup
    paths:
      - "fcp_pipeline/atlas_inference_cascade.py"
      - "scripts/data/validate_jbi_image_first_atlas_inference_v5.py"
      - "tests/test_atlas_inference_cascade.py"
      - "docs/supporting/jbi_image_first_atlas_inference_contract_v5.json"
      - ".github/workflows/jbi-image-first-atlas-inference-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jbi-atlas-inference-v5-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  freeze-contract-and-state-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate v5 pre-pixel contract and immutable legacy anchors
        run: |
          python scripts/data/validate_jbi_image_first_atlas_inference_v5.py \
            --output-json /tmp/jbi_image_first_atlas_inference_v5_validation.json
      - name: Test strict cascade and not-evaluable firewall
        run: |
          python -m pytest -q tests/test_atlas_inference_cascade.py
      - name: Upload freeze validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbi-image-first-atlas-inference-v5-validation
          path: /tmp/jbi_image_first_atlas_inference_v5_validation.json
          if-no-files-found: warn
