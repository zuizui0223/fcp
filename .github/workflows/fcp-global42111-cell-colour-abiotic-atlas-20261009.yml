name: FCP 42111 geographic flower colour and abiotic 162-cell atlas

on:
  pull_request:
    branches:
      - analysis/fcp-global42111-abiotic-atlas-20261009
    paths:
      - scripts/analysis/build_fcp_global42111_cell_colour_abiotic_atlas_20261009.py
      - tests/test_fcp_global42111_cell_colour_abiotic_atlas_20261009.py
      - docs/FCP_GLOBAL42111_CELL_COLOUR_ABIOTIC_ATLAS_20261009.md
      - .github/workflows/fcp-global42111-cell-colour-abiotic-atlas-20261009.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fcp42111-world-162-cell-photo-environment-map-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ENV_RUN_ID: '37861582446'
  SOURCE_ENV_ARTIFACT: 'fcp-global42111-original-photo-real-site-climate-soil-20261009'

jobs:
  world-162-cell-image-colour-abiotic-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Pin source-colour geographic tabular runtime and synthetic guards
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m py_compile scripts/analysis/build_fcp_global42111_cell_colour_abiotic_atlas_20261009.py
          python -m pytest tests/test_fcp_global42111_cell_colour_abiotic_atlas_20261009.py -q
      - name: Reuse successful original-photo climate/soil features no new API/raster requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_ENV_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ENV_ARTIFACT" --dir /tmp/fcp_cell_source
          matches="$(find /tmp/fcp_cell_source -name taxon_cell_flower_colour_climate_soil.csv.gz | wc -l)"
          test "$matches" -eq 1
          filename="$(find /tmp/fcp_cell_source -name taxon_cell_flower_colour_climate_soil.csv.gz -print -quit)"
          test -s "$filename"
          cp "$filename" /tmp/fcp_world_taxon_cell_source.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          matches=[]
          for p in Path('/tmp/fcp_cell_source').rglob('result.json'):
              v=json.loads(p.read_text())
              if v.get('schema')=='fcp_global42111_original_photo_climate_soil_attachment_v1':
                  matches.append(v)
          assert len(matches)==1
          v=matches[0]
          assert v['original_species_count']==42111
          assert v['original_taxon_cell_count']==85337
          assert v['n_unique_original_photo_IDs']==100543
          assert v['new_colour_label_or_photo_pixel_opened'] is False
          assert v['geographic_cell_centroid_imputation'] is False
          PY
      - name: Aggregate original 85337 taxon-cell photos to source-defined 162-cell world colour/climate/soil atlas
        run: |
          python scripts/analysis/build_fcp_global42111_cell_colour_abiotic_atlas_20261009.py \
            --source-taxon-cell-abiotic /tmp/fcp_world_taxon_cell_source.csv.gz \
            --outdir /tmp/fcp_global_world_colour_cell_environment
      - name: Verify all 85337 source cells, 39075 classified flower photos and no soil-centroid conflation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p=Path('/tmp/fcp_global_world_colour_cell_environment')
          r=json.loads((p/'result.json').read_text())
          z=pd.read_csv(p/'all_162_cells_photo_colour_climate_soil.csv')
          geo=json.loads((p/'original_162_equal_area_photo_colour_map.geojson').read_text())
          assert r['schema']=='fcp_global42111_original_taxon_cell_colour_and_abiotic_atlas_v1'
          assert r['source_taxon_cell_denominator']==85337
          assert r['source_four_state_colour_classifiable']==39075
          assert r['n_original_source_occupied_cells']==128
          assert r['n_world_equal_area_cells']==162
          assert len(z)==162 and len(geo['features'])==162
          assert int(z.source_taxon_cell_rows.sum())==85337
          assert int(z.n_four_state_classified.sum())==39075
          assert r['site_rasters_sampled_at_true_photo_coordinates_only']
          assert r['original_equal_area_centroids_display_only']
          assert r['all_unclassifiable_photo_records_preserved']
          assert r['causal_adaptation_claim'] is False
          assert r['new_flower_pixels_or_colors_reclassified'] is False
          print('GLOBAL_162_ORIGINAL_FLOWER_COLOUR_ABIOTIC_CELLS_SOURCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-42111-global-photo-colour-soil-climate-162-cell-20261009
          retention-days: 90
          if-no-files-found: error
          path: /tmp/fcp_global_world_colour_cell_environment/
      - name: Seal checked world map and metadata under separate geographic atlas result
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = 'analysis/fcp-global42111-abiotic-join-execution-20261009'
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          d=results/fcp_global42111_cell_colour_climate_soil_atlas_20261009
          mkdir -p "$d"
          cp /tmp/fcp_global_world_colour_cell_environment/* "$d/"
          git add "$d"
          if git diff --cached --quiet; then
            echo 'Identical source-verified map exists'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Seal worldwide 162-cell source flower-colour/soil/climate geographic atlas, preserve all 85337 observations'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
