name: FCP external NHM botanical colour GBIF preserved specimen source acquisition

on:
  pull_request:
    branches:
      - analysis/fcp-nhm-independent-flower-colour-20261013
    paths:
      - scripts/analysis/collect_nhm_gbif_preserved_20261013.py
      - tests/test_collect_nhm_gbif_preserved_20261013.py
      - results/fcp_nhm_gbif_preoutcome_20261013/**
      - .github/workflows/fcp-independent-gbif-preserved-source-20261013.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcp-preserved-independent-occurrences-${{ github.ref }}
  cancel-in-progress: true

env:
  FCP_MANIFEST_SHA256: "f859bd83deb8eda50cd6527fb399cecf821a38718775fd1bdd5883f7d2be6758"
  OPENBLAS_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"

jobs:
  original-gbif-preserved-specimen-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install source audit runtime and tests
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 pytest==8.4.2
      - name: Test GBIF preserved specimen filter and bounded original occurrence windows
        run: |
          python -m pytest -q tests/test_collect_nhm_gbif_preserved_20261013.py
          python -m pytest -q tests/test_nhm_gbif_manifest_20261013.py
      - name: Verify exact NHM-only original pre-GBIF candidate manifest
        run: |
          set -euo pipefail
          echo "$FCP_MANIFEST_SHA256  results/fcp_nhm_gbif_preoutcome_20261013/frozen_selected_taxa.csv" | sha256sum -c -
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          p=Path('results/fcp_nhm_gbif_preoutcome_20261013')
          d=pd.read_csv(p/'frozen_selected_taxa.csv')
          receipt=json.loads((p/'preflight.json').read_text())
          assert len(d)==receipt['selected_species']==705
          assert d.genus.nunique()==receipt['selected_genera']==92
          assert d.canonical_name.is_unique
          assert dict(d.botanical_colour.value_counts())==receipt['selected_botanical_colour_counts']
          assert receipt['selection_uses_gbif_occurrences'] is False
          print('PASS exact 705 independent botanical trait identities without iNaturalist or GBIF occurrence selection')
          PY
      - name: Collect only original GBIF PRESERVED_SPECIMEN records on frozen 705 taxa
        run: |
          python scripts/analysis/collect_nhm_gbif_preserved_20261013.py \
            --manifest results/fcp_nhm_gbif_preoutcome_20261013/frozen_selected_taxa.csv \
            --outdir /tmp/fcp_gbif_preserved_source \
            --workers 4
      - name: Enforce source identity and retain HOLDs without optimistic imputation
        run: |
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          p=Path('/tmp/fcp_gbif_preserved_source')
          d=json.loads((p/'qc.json').read_text())
          a=json.loads((p/'taxon_source_audit.json').read_text())
          assert d['schema']=='fcp_external_NHM_GBIF_preserved_specimen_source_v1'
          assert d['manifest_sha256']=='f859bd83deb8eda50cd6527fb399cecf821a38718775fd1bdd5883f7d2be6758'
          assert d['requested_n_species']==705
          assert len(a)==705
          assert d['specimen_csv_sha256']==hashlib.sha256((p/'specimen_sites.csv').read_bytes()).hexdigest()
          n=0;dataset_keys=set()
          with (p/'specimen_sites.csv').open(newline='') as h:
              for x in csv.DictReader(h):
                  assert x['basisOfRecord']=='PRESERVED_SPECIMEN'
                  assert x['datasetKey']!='50c9509d-22c7-4a22-a47d-8c48425ef4a7'
                  assert x['gbif_id'] and x['canonical_name']
                  n+=1;dataset_keys.add(x['datasetKey'])
          assert n==d['specimen_site_records']
          assert len(dataset_keys)==d['unique_specimen_dataset_keys']
          assert d['species_with_at_least_five_unique_specimen_cells']<=705
          print('PASS source record provenance; scientifically accepted source count',n,'and independent datasets',len(dataset_keys))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fcp-external-independent-gbif-preserved-705species-20261013
          path: /tmp/fcp_gbif_preserved_source/
          retention-days: 60
          if-no-files-found: error
