name: disttrait MNAR observation stress test

on:
  push:
    paths:
      - "packages/disttrait/benchmarks/mnar_observation_surface.py"
      - ".github/workflows/disttrait-mnar-observation.yml"
  pull_request:
    paths:
      - "packages/disttrait/benchmarks/mnar_observation_surface.py"
      - ".github/workflows/disttrait-mnar-observation.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install disttrait
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/disttrait

      - name: Run MNAR stress test
        run: |
          python packages/disttrait/benchmarks/mnar_observation_surface.py             > disttrait_mnar_observation_result.json

      - name: Upload exploratory benchmark
        uses: actions/upload-artifact@v4
        with:
          name: disttrait-mnar-observation-exploratory
          path: disttrait_mnar_observation_result.json
