name: Random photo-first H9 metadata feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/random-photo-first-h9-individual-distance-replication
    paths:
      - "docs/supporting/random_photo_first_h9_metadata_feasibility_contract_v1.json"
      - "scripts/analysis/audit_random_photo_first_h9_metadata_feasibility.py"
      - ".github/workflows/random-photo-first-h9-metadata-feasibility.yml"

permissions:
  contents: write

concurrency:
  group: random-photo-first-h9-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate H9 metadata-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/supporting/random_photo_first_h9_metadata_feasibility_contract_v1.json').read_text())
          h7 = json.loads(Path('docs/supporting/random_photo_first_h7_fresh_metadata_manifest_v1.json').read_text())
          h8 = json.loads(Path('docs/supporting/random_photo_first_h8_design_audit_result_v1.json').read_text())
          assert c['status'] == 'metadata_only_h9_feasibility_frozen_after_h8_before_any_h9_query_or_pixel'
          assert h7['candidate_image_pixels_opened'] is False
          assert h8['automatic_selection']['h8_metadata_design_feasible'] is False
          assert c['prospective_h9_if_feasible']['analysis_rows_per_species'] == 20
          assert c['prospective_h9_if_feasible']['postmeasurement_gate'].startswith('at least 25 species')
          print('h9_metadata_contract=pass')
          PY

      - name: Run H9 metadata-only feasibility audit
        run: python scripts/analysis/audit_random_photo_first_h9_metadata_feasibility.py

      - name: Validate H9 outcome firewall
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          r = json.loads(Path('docs/supporting/random_photo_first_h9_metadata_feasibility_result_v1.json').read_text())
          assert r['status'] == 'complete_h9_metadata_only_feasibility_audit'
          assert all(v is False for v in r['outcome_firewall'].values())
          if r['automatic_selection']['h9_metadata_feasible']:
              s = pd.read_csv('data/frozen/random_photo_first_h9_metadata_species_v1.csv')
              assert len(s) >= 35
              assert s['inat_taxon_id'].is_unique
          print(json.dumps(r, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: random-photo-first-h9-metadata-feasibility-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            docs/supporting/random_photo_first_h9_metadata_feasibility_result_v1.json
            data/frozen/random_photo_first_h9_metadata_species_v1.csv

      - name: Commit H9 audit outputs if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporting/random_photo_first_h9_metadata_feasibility_result_v1.json \
                  data/frozen/random_photo_first_h9_metadata_species_v1.csv
          if git diff --cached --quiet; then
            echo "h9_outputs_already_identical=true"
            exit 0
          fi
          git commit -m "Freeze H9 metadata-feasible species frame"
          git fetch origin analysis/random-photo-first-h9-individual-distance-replication
          git rebase origin/analysis/random-photo-first-h9-individual-distance-replication
          git push origin HEAD:analysis/random-photo-first-h9-individual-distance-replication
