[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disttrait"
version = "0.12.0"
description = "Validated species-level distributional trait inference from repeated opportunistic observations"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "ecology",
  "traits",
  "spatial statistics",
  "permutation tests",
  "comparative biology",
  "intraspecific variation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/zuizui0223/fcp"
Issues = "https://github.com/zuizui0223/fcp/issues"
